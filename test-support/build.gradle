plugins {
    id 'java-library'
}

dependencies {
    api project(':common')
    api project(':pattern-detector')

    api "org.testcontainers:testcontainers:${testcontainersVersion}"
    api "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    api "org.testcontainers:kafka:${testcontainersVersion}"
    api "org.testcontainers:postgresql:${testcontainersVersion}"
    api "org.testcontainers:minio:${testcontainersVersion}"
    api 'org.awaitility:awaitility:4.2.1'

    api "org.apache.kafka:kafka-clients:${kafkaVersion}"
    api "org.apache.kafka:kafka-streams:${kafkaVersion}"

    api 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    api 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    api 'org.slf4j:slf4j-api:2.0.13'
    api 'ch.qos.logback:logback-classic:1.5.6'

    implementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
