server.port=8080

spring.datasource.url=jdbc:h2:mem:travelbooking;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

booking.lock.emergency-timeout-seconds=5
booking.lock.normal-timeout-seconds=30

itinerary.reminder.long-trip-min-days=7
itinerary.reminder.long-trip-reminder-days=3
itinerary.reminder.short-trip-min-days=3
itinerary.reminder.short-trip-reminder-days=1

route.types[0].code=domestic
route.types[0].name=国内游
route.types[0].description=境内旅游线路
route.types[0].enabled=true
route.types[0].order=1
route.types[0].default-duration=5
route.types[0].price-factor=1.0

route.types[1].code=international
route.types[1].name=出境游
route.types[1].description=境外旅游线路
route.types[1].enabled=true
route.types[1].order=2
route.types[1].default-duration=7
route.types[1].price-factor=2.0

route.types[2].code=nearby
route.types[2].name=周边游
route.types[2].description=周边短途旅游
route.types[2].enabled=true
route.types[2].order=3
route.types[2].default-duration=2
route.types[2].price-factor=0.5

route.types[3].code=custom
route.types[3].name=定制游
route.types[3].description=私人定制旅游
route.types[3].enabled=true
route.types[3].order=4
route.types[3].default-duration=3
route.types[3].price-factor=1.5

settlement.redis-queue-name=travel:settlement:queue
settlement.max-retry-attempts=3
settlement.retry-delay-ms=1000
settlement.worker-pool-size=4
settlement.persistence-enabled=true
