spring:
  application:
    name: monitoring-platform-test
  profiles:
    active: test
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/monitoring_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: schema_version
    encoding: UTF-8
    clean-on-validation-error: false

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 1
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.monitoring.persistence.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080
  http2:
    enabled: true
  reactive:
    session:
      timeout: 30m
  netty:
    connection-timeout: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,heapdump,threaddump
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  metrics:
    export:
      prometheus:
        enabled: true
        step: 30s
    tags:
      application: ${spring.application.name}
      env: test

alert:
  evaluation:
    interval: 20000
  notification:
    channels:
      - console
      - email
    email:
      host: smtp.test.com
      port: 587
      username: ${ALERT_EMAIL_USER:}
      password: ${ALERT_EMAIL_PASSWORD:}
      from: alerts-test@monitoring.com
      to: dev-team@test.com

anomaly:
  detection:
    history-size: 500
    default-algorithm: zscore

trace:
  sampling:
    probabilistic:
      rate: 0.3
    error:
      enabled: true
    latency:
      threshold-ms: 1000
    tail:
      buffer-size: 1000
      retention-ms: 30000

profiler:
  cpu:
    enabled: false
    interval-ms: 200
  memory:
    enabled: false
    interval-ms: 10000

storage:
  retention:
    days: 30
  engine:
    primary: in_memory
    secondary: mysql

logging:
  level:
    root: INFO
    com.monitoring: INFO
    org.springframework: WARN
    org.mybatis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n"
