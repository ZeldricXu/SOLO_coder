spring:
  application:
    name: monitoring-platform-dev
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  datasource:
    url: jdbc:h2:mem:monitoring_dev;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: schema_version
    encoding: UTF-8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.monitoring.persistence.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080
  http2:
    enabled: false
  reactive:
    session:
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      env: dev

alert:
  evaluation:
    interval: 30000

anomaly:
  detection:
    history-size: 200

trace:
  sampling:
    probabilistic:
      rate: 1.0
    error:
      enabled: true
    latency:
      threshold-ms: 500

profiler:
  cpu:
    enabled: true
    interval-ms: 100
  memory:
    enabled: true
    interval-ms: 5000

storage:
  retention:
    days: 7

logging:
  level:
    root: DEBUG
    com.monitoring: TRACE
    org.springframework: DEBUG
    org.mybatis: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
