spring:
  application:
    name: monitoring-platform-prod
  profiles:
    active: prod
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/monitoring_prod?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: MonitoringProdPool

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    table: schema_version
    encoding: UTF-8
    clean-disabled: true
    out-of-order: false

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 5s
    lettuce:
      pool:
        max-active: 50
        max-idle: 20
        min-idle: 10
        max-wait: 3000ms
      shutdown-timeout: 100ms

  data:
    mongodb:
      uri: mongodb://${MONGO_USER:admin}:${MONGO_PASSWORD:password}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/monitoring?authSource=admin
      database: monitoring

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.monitoring.persistence.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    local-cache-scope: statement
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080
  http2:
    enabled: true
  reactive:
    session:
      timeout: 30m
  netty:
    connection-timeout: 30s
    idle-timeout: 60s
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      roles: ADMIN
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 15s
        descriptions: false
    tags:
      application: ${spring.application.name}
      env: prod
      region: ${REGION:cn-east}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.9, 0.95, 0.99

alert:
  evaluation:
    interval: 15000
    thread-pool-size: 10
    retry:
      max-attempts: 3
      delay-ms: 1000
  notification:
    channels:
      - console
      - email
      - webhook
    email:
      host: ${SMTP_HOST:smtp.monitoring.com}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USER:}
      password: ${SMTP_PASSWORD:}
      from: alerts@monitoring.com
      to: ${ALERT_RECIPIENTS:oncall@monitoring.com}
    webhook:
      url: ${WEBHOOK_URL:}
      timeout: 5000

anomaly:
  detection:
    history-size: 1000
    default-algorithm: zscore
    cache:
      enabled: true
      ttl-minutes: 60

trace:
  sampling:
    probabilistic:
      rate: 0.1
    error:
      enabled: true
    latency:
      threshold-ms: 2000
    tail:
      buffer-size: 5000
      retention-ms: 60000

profiler:
  cpu:
    enabled: false
    interval-ms: 500
  memory:
    enabled: false
    interval-ms: 30000

storage:
  retention:
    days: 90
  engine:
    primary: mysql
    secondary: mongodb
  rate-limit:
    max-requests: 10000
    window-seconds: 1

logging:
  level:
    root: WARN
    com.monitoring: INFO
    org.springframework: WARN
    org.mybatis: WARN
    org.flywaydb: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n"
  file:
    name: /var/log/monitoring/monitoring.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 10GB
