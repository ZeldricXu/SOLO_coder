spring:
  application:
    name: protein-viewer
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/protein_viewer}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: protein-files

logging:
  level:
    root: INFO
    com.proteinviewer: INFO

cors:
  allowed-origins:
    - https://staging-protein-viewer.example.com
    - http://10.0.0.0/8
    - http://172.16.0.0/12
    - http://192.168.0.0/16
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: "*"
  allow-credentials: true

server:
  port: 8080

batch:
  task:
    concurrency-limit: 3
  result:
    retention-days: 30
