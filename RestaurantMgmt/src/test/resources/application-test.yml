server:
  port: 8081

spring:
  application:
    name: RestaurantMgmt-Test
  datasource:
    url: jdbc:h2:mem:restaurant_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console-test
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.restaurant.mgmt: DEBUG
    org.hibernate.SQL: DEBUG
