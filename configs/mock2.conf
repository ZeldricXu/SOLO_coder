server {
    listen 80;
    server_name localhost;

    location / {
        add_header Content-Type 'application/json';
        return 200 '{"service": "mock-service-2", "version": "v2.0.0", "timestamp": "$time_iso8601", "request_id": "$request_id", "note": "This is the gray version"}';
    }

    location /api/users {
        add_header Content-Type 'application/json';
        return 200 '{"service": "mock-service-2", "endpoint": "/api/users", "version": "v2.0.0", "data": [{"id": 1, "name": "User 1 - v2"}, {"id": 2, "name": "User 2 - v2"}, {"id": 3, "name": "User 3 - v2"}]}';
    }

    location /api/orders {
        add_header Content-Type 'application/json';
        return 200 '{"service": "mock-service-2", "endpoint": "/api/orders", "version": "v2.0.0", "data": [{"id": "ORD001", "status": "pending", "gray": true}, {"id": "ORD002", "status": "shipped", "gray": true}]}';
    }

    location /health {
        add_header Content-Type 'application/json';
        return 200 '{"status": "healthy", "service": "mock-service-2", "version": "v2.0.0"}';
    }
}
