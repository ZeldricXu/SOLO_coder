server {
    listen 80;
    server_name localhost;

    location / {
        add_header Content-Type 'application/json';
        return 200 '{"service": "mock-service-1", "version": "v1.0.0", "timestamp": "$time_iso8601", "request_id": "$request_id"}';
    }

    location /api/users {
        add_header Content-Type 'application/json';
        return 200 '{"service": "mock-service-1", "endpoint": "/api/users", "data": [{"id": 1, "name": "User 1"}, {"id": 2, "name": "User 2"}]}';
    }

    location /api/orders {
        add_header Content-Type 'application/json';
        return 200 '{"service": "mock-service-1", "endpoint": "/api/orders", "data": [{"id": "ORD001", "status": "pending"}, {"id": "ORD002", "status": "shipped"}]}';
    }

    location /health {
        add_header Content-Type 'application/json';
        return 200 '{"status": "healthy", "service": "mock-service-1"}';
    }

    location /error {
        add_header Content-Type 'application/json';
        return 500 '{"status": "error", "message": "Internal Server Error from mock-service-1"}';
    }

    location /slow {
        add_header Content-Type 'application/json';
        return 200 '{"status": "success", "service": "mock-service-1", "delay": "2s"}';
    }
}
