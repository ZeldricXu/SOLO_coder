server:
  port: 8080
  mode: release

inference:
  workers: 4
  default_strategy: realtime

rules:
  default_strategy: default

protocol:
  workers: 4

cache:
  path: ./data/cache
  max_size_mb: 100
  max_entries: 10000

ota:
  workers: 2

aggregation:
  max_results: 1000

lifecycle:
  secret_key: edgevision-secret-key
  heartbeat_timeout_seconds: 180

logging:
  level: info
  format: json
