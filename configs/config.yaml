app:
  name: task-tracker
  environment: production
  port: 8080

logger:
  level: info
  encoding: json
  output_path: ""

scheduler:
  worker_count: 5
  queue_size: 100
  max_retries: 3
  task_timeout: 30s

quality_gate:
  max_critical: 0
  max_major: 5
  max_minor: 20
  min_score: 70.0

storage:
  base_dir: ./data
  encrypt_key: ""

environment:
  max_environments: 10
  default_ttl: 24h
  reclaim_interval: 1h

gateway:
  max_logs: 10000
