server:
  port: 8080
  mode: release
  read_timeout: 30s
  write_timeout: 30s

database:
  host: "${DB_HOST}"
  port: 5432
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
  dbname: llmgateway_staging
  sslmode: require
  max_open_conns: 100
  max_idle_conns: 20

redis:
  host: "${REDIS_HOST}"
  port: 6379
  password: "${REDIS_PASSWORD}"
  db: 0
  pool_size: 100

log:
  level: info
  format: json
  output: stdout

gateway:
  providers:
    - name: openai
      api_key: "${OPENAI_API_KEY}"
      base_url: https://api.openai.com/v1
      timeout: 30s
      max_retries: 3
    - name: anthropic
      api_key: "${ANTHROPIC_API_KEY}"
      base_url: https://api.anthropic.com/v1
      timeout: 30s
      max_retries: 3

scheduler:
  gpu_resources:
    - id: gpu-staging-001
      node: staging-node-1
      total_memory: 49152
      available_memory: 49152
      total_compute: 100
      available_compute: 100
    - id: gpu-staging-002
      node: staging-node-2
      total_memory: 49152
      available_memory: 49152
      total_compute: 100
      available_compute: 100
  preemption_enabled: true
  max_queue_size: 5000

security:
  secret_key: "${SECRET_KEY}"
  rate_limit: 5000
  rate_window: 1m
