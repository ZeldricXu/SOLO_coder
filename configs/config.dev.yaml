server:
  grpc_port: 50051
  http_port: 8080

scheduler:
  heartbeat_timeout: 30s
  sharding_strategy: by_hash
  max_retries: 3
  task_timeout: 10m
  chunk_size: 1000

worker:
  cache_size: 10000
  heartbeat_interval: 5s
  concurrent_tasks: 10
  worker_id: 0

database:
  host: postgres
  port: 5432
  user: experiment
  password: experiment
  dbname: experiment
  sslmode: disable
  timezone: UTC

log:
  level: debug
  format: text
  output_path: stdout
  max_size: 100
  max_backups: 3
  max_age: 28
  compress: true
