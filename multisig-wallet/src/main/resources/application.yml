spring:
  application:
    name: multisig-wallet

server:
  port: 8084

multisig:
  wallet:
    default-chain: ETH
    auto-execute: true
    default-gas-limit: 300000
    supported-chains:
      - ETH
      - BSC
      - POLYGON
    gnosis-safe:
      enabled: true
      singleton-address:
        ETH: "0xd9Db270c1B5E3Bd161E8c8503c55cEABeE709552"
        BSC: "0xd9Db270c1B5E3Bd161E8c8503c55cEABeE709552"
        POLYGON: "0xd9Db270c1B5E3Bd161E8c8503c55cEABeE709552"
