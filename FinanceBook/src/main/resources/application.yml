server:
  port: 8080

spring:
  application:
    name: finance-book

  datasource:
    url: jdbc:h2:mem:financebook;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  redis:
    host: localhost
    port: 6379
    password:
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC

finance:
  category-match:
    enabled: true
    worker-count: 3
    queue-key: finance:category_match:queue
    max-retries: 3
    retry-interval-minutes: 5

logging:
  level:
    com.finance: DEBUG
    org.hibernate.SQL: DEBUG
