global:
  resolve_timeout: 5m
  slack_api_url: ""  # set via SLACK_WEBHOOK_URL env var

route:
  receiver: "default-receiver"
  group_by: ["alertname", "cluster", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: "critical-receiver"
      group_wait: 10s
      repeat_interval: 1h
      continue: true
    - match:
        severity: warning
      receiver: "warning-receiver"
      repeat_interval: 2h
    - match:
        severity: info
      receiver: "info-receiver"
      repeat_interval: 8h

receivers:
  - name: "default-receiver"
    slack_configs:
      - channel: "#alerts-default"
        send_resolved: true
        title: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"

  - name: "critical-receiver"
    slack_configs:
      - channel: "#alerts-critical"
        send_resolved: true
        title: "🚨 CRITICAL: {{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
        text: |
          {{ range .Alerts }}
          *Severity:* {{ .Labels.severity | toUpper }}
          *Description:* {{ .Annotations.description }}
          *Labels:*
          {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
          {{ end }}
          {{ end }}
    pagerduty_configs:
      - service_key: "{{ .PD_SERVICE_KEY }}"
        description: "{{ range .Alerts }}{{ .Annotations.summary }} {{ end }}"

  - name: "warning-receiver"
    slack_configs:
      - channel: "#alerts-warning"
        send_resolved: true
        title: "⚠️ WARNING: {{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"

  - name: "info-receiver"
    slack_configs:
      - channel: "#alerts-info"
        send_resolved: true
        title: "ℹ️ INFO: {{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "cluster", "service"]
