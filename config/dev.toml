[agent]
hostname = "dev-localhost"
downstream_url = "http://localhost:8080/api/v1/logs"
batch_size = 100
flush_interval_ms = 1000
channel_buffer_size = 10000

[[agent.files]]
path = "./test.log"
path_pattern = "./test.log"
service_name = "dev-test"
multiline = false
encoding = "utf-8"
start_from_beginning = true
tags = ["env:dev", "service:test"]

[agent.metrics]
host = "127.0.0.1"
port = 9091
path = "/metrics"

[server]
host = "127.0.0.1"
port = 8080
channel_capacity = 1000
sqlite_path = "./data/pipeline.db"
compaction_enabled = true

[server.kafka]
brokers = ["localhost:9092"]
topic = "logs-dev"
group_id = "log-pipeline-dev"
partitions = 3

[server.elasticsearch]
urls = ["http://localhost:9200"]
index_prefix = "logs-dev"
batch_size = 500
flush_interval_ms = 5000

[server.alerting]
dedup_window_secs = 300

[server.alerting.llm_root_cause]
api_url = "https://api.openai.com/v1/chat/completions"
model = "gpt-3.5-turbo"
timeout_secs = 30

[server.metrics]
host = "127.0.0.1"
port = 9090
path = "/metrics"
