[server]
host = "0.0.0.0"
port = 8080

[database]
max_connections = 10

[redis]
max_connections = 10

[mongodb]
database = "auction_staging"

[auth]
jwt_expiry_hours = 24

[media]
storage_path = "/app/media"
max_file_size = 10485760
allowed_image_types = ["image/jpeg", "image/png", "image/webp"]
allowed_video_types = ["video/mp4", "video/webm"]
