log:
  level: info
  format: json

server:
  host: 0.0.0.0
  port: 8080
  mode: release

database:
  host: localhost
  port: 5432
  user: cloudci
  name: cloudci_prod
  sslmode: require
  max_open_conns: 100
  max_idle_conns: 20

redis:
  host: localhost
  port: 6379
  db: 0
  pool_size: 50

minio:
  endpoint: localhost:9000
  bucket: cloudci-artifacts-prod
  secure: true

vault:
  addr: http://localhost:8200
  secret_path: secret/cloudci/prod

scheduler:
  max_concurrent: 20
  default_timeout: 3600
  queue_size: 1000

plugin:
  dir: /opt/cloudci/plugins
  registry_file: /opt/cloudci/plugins/registry.json

notification:
  dingtalk:
    webhook: ""
  feishu:
    webhook: ""
  slack:
    webhook: ""
  smtp:
    host: ""
    port: 587
    user: ""
    from: ""

retention:
  artifact_days: 90
  log_days: 365

artifact:
  retention_days: 90
  keep_last: 500
  max_size_mb: 1024

logstore:
  enable_postgres: true
  enable_redis: true
  redis_channel: logs
  retention_days: 365
  batch_size: 100

webhook:
  secret: ""
