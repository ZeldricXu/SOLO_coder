[server]
host = "0.0.0.0"
port = 8080
shutdown_timeout = 30

[database]
url = "postgresql://localhost:5432/enterprise_middleware"
pool_size = 20
connect_timeout = 30
idle_timeout = 600
max_lifetime = 1800
acquire_timeout = 30

[redis]
url = "redis://localhost:6379/0"
pool_size = 20
connect_timeout = 5
idle_timeout = 300
max_lifetime = 1800

[logging]
dir = "/var/log/enterprise-middleware"
level = "info"
format = "json"
rotation = "daily"
retention_days = 30
compression = true
ansi_colors = false

[storage]
backend = "s3"
local_path = "./data/storage"
s3_bucket = "enterprise-middleware-production"
s3_region = "cn-east-1"
s3_access_key = ""
s3_secret_key = ""
s3_endpoint = ""

[cdc]
enabled = true
source_type = "postgres"
connection_string = "postgresql://localhost:5432/production_db"
server_id = 1
slot_name = "enterprise_middleware_slot"
include_tables = ["public.users", "public.orders", "public.products"]
exclude_tables = []
output_kafka_brokers = "kafka-1:9092,kafka-2:9092,kafka-3:9092"
output_topic = "cdc_events"
batch_size = 500
polling_interval_ms = 500

[data_quality]
enabled = true
schedule_pool_size = 8
alert_enabled = true
alert_channels = ["slack", "email"]
anomaly_storage_enabled = true

[metadata_crawler]
enabled = true
schedule_pool_size = 4
sample_data_count = 100
histogram_buckets = 20
statistics_enabled = true

[lineage]
enabled = true
sql_dialect = "postgres"
store_parsed_queries = true
build_dag = true

[notification]
enabled = true
default_channel = "email"
rate_limit_per_minute = 500
retry_count = 3
retry_interval_ms = 1000
smtp_host = "smtp.company.com"
smtp_port = 587
smtp_username = "noreply@company.com"
smtp_password = ""
slack_webhook = ""
dingtalk_webhook = ""
wechat_webhook = ""
webhook_timeout_ms = 5000
