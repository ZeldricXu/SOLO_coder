# ============================================================
# NWP 配置 - STAGING 环境
# 集群提交，少量分区smoke test
# 中等分辨率，功能验证
# ============================================================

nwp {
  # 网格配置 - 中等分辨率（T42/约2.8度）
  grid {
    projection = "latlon"
    nx = 256
    ny = 129
    nz = 20
    dx = 1.40625
    dy = 1.40625
    lat-min = -90.0
    lat-max = 90.0
    lon-min = 0.0
    lon-max = 360.0
    sigma-levels = [1.000, 0.995, 0.985, 0.970, 0.950, 0.925, 0.895, 0.860, 0.820, 0.775,
                    0.725, 0.670, 0.615, 0.560, 0.505, 0.450, 0.395, 0.345, 0.300, 0.260]
  }

  # 动力求解器
  dynamics {
    time-step = 90.0
    total-steps = 2880
    integration-scheme = "rk3"
    horizontal-scheme = "finite-volume"
    spectral-truncation = 128
    diffusion-coef = 1.0e5
    rayleigh-damping = 0.001
    use-spectral-transform = true
    time-split-fraction = 0.5
  }

  # 物理过程 - 全部启用
  physics {
    cumulus = "kain-fritsch"
    boundary-layer = "ysu"
    microphysics = "wsm6"
    radiation = "rrtmg"
    radiation-interval = 1800
    surface-layer = "monin-obukhov"
    fast-mode = false
    skip-radiation = false
    skip-cumulus = false
  }

  # 资料同化
  assimilation {
    method = "3d-var"
    window-length = 3600
    max-iterations = 100
    convergence-threshold = 1.0e-6
    background-error-file = ${?NWP_ASSIM_BEC_FILE}
    background-error-file = "/data/nwp/config/bec_t42.nc"
    observations {
      satellite = true
      radar = true
      surface = true
      radiosonde = true
    }
    synthetic-obs-count = 5000
  }

  # 并行计算 - Spark on YARN，少量分区
  parallel {
    spark-master = "yarn"
    use-spark = true
    # staging环境使用少量分区测试
    partitions-x = 4
    partitions-y = 4
    halo-width = 3
    checkpoint-interval = 360
    num-threads = 4
  }

  # IO 配置
  io {
    grib {
      jni-library-path = "/opt/nwp/lib/native"
      decode-num-threads = 8
    }
    netcdf {
      compression-level = 4
      chunk-size = 1048576
    }
    hdfs {
      namenode = ${?NWP_HDFS_NAMENODE}
      namenode = "hdfs://hadoop-staging:9000"
      base-path = "/nwp/staging/data"
      replication-factor = 2
      use-hdfs = true
    }
  }

  # 存储配置
  storage {
    postgres {
      url = ${?NWP_DB_URL}
      url = "jdbc:postgresql://pg-staging:5432/nwp_metadata"
      user = ${?NWP_DB_USER}
      user = "nwp_staging"
      password = ${?NWP_DB_PASSWORD}
      password = ""
      max-pool-size = 10
      use-postgres = true
    }
    kafka {
      bootstrap-servers = ${?NWP_KAFKA_BOOTSTRAP}
      bootstrap-servers = "kafka-staging-1:9093,kafka-staging-2:9093"
      task-topic = "nwp_tasks_staging"
      result-topic = "nwp_results_staging"
      status-topic = "nwp_status_staging"
      group-id = "nwp-solvers-staging"
      use-kafka = true
      security-protocol = "SASL_SSL"
      sasl-mechanism = "SCRAM-SHA-512"
      sasl-username = ${?NWP_KAFKA_USER}
      sasl-password = ${?NWP_KAFKA_PASSWORD}
    }
  }

  # 后处理
  postprocess {
    downscale-method = "bilinear"
    output-interval = 3600
    stations-file = "/data/nwp/config/stations_china_200.csv"
    render {
      image-width = 1600
      image-height = 1200
      colormap = "viridis"
      base-map = "/data/nwp/config/china_map.json"
      dpi = 150
    }
    enable-visualization = true
    enable-verification = true
  }

  # 输出配置
  output {
    directory = "/data/nwp/staging/output"
    hdfs-path = ${?NWP_OUTPUT_HDFS_PATH}
    hdfs-path = "/nwp/staging/output"
    variables = ["T", "U", "V", "QV", "QC", "QR", "QI", "PSFC", "SLP", "PRECIP", "RH2", "T2", "U10", "V10"]
    pressure-levels = [1000, 925, 850, 700, 500, 300, 200, 100, 50]
    output-interval-hours = 1
    format = "netcdf4"
  }

  # 运行配置
  run {
    mode = "forecast"
    domain = "china"
    forecast-hours = 48
    checkpoint = true
    checkpoint-interval-hours = 6
    init-time = ""
  }

  # 日志配置
  logging {
    level = "INFO"
    file = "logs/nwp-staging.log"
    verbose = false
    profile = true
  }
}
