server:
  host: 127.0.0.1
  port: 8080
  base_url: http://localhost:8080

database:
  url: postgres://username:password@localhost:5432/df1_69
  max_connections: 10
  min_connections: 2
  acquire_timeout_secs: 30
  idle_timeout_secs: 300

redis:
  url: redis://localhost:6379/0
  max_connections: 20
  min_connections: 5

minio:
  endpoint: localhost:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket_name: df1-69
  region: us-east-1
  use_ssl: false

oauth:
  github:
    client_id: your_github_client_id
    client_secret: your_github_client_secret
    auth_url: https://github.com/login/oauth/authorize
    token_url: https://github.com/login/oauth/access_token
    api_base_url: https://api.github.com
    redirect_url: http://localhost:8080/auth/github/callback
  gitlab:
    client_id: your_gitlab_client_id
    client_secret: your_gitlab_client_secret
    auth_url: https://gitlab.com/oauth/authorize
    token_url: https://gitlab.com/oauth/token
    api_base_url: https://gitlab.com/api/v4
    redirect_url: http://localhost:8080/auth/gitlab/callback
  gitee:
    client_id: your_gitee_client_id
    client_secret: your_gitee_client_secret
    auth_url: https://gitee.com/oauth/authorize
    token_url: https://gitee.com/oauth/token
    api_base_url: https://gitee.com/api/v5
    redirect_url: http://localhost:8080/auth/gitee/callback

llm:
  provider: openai
  api_key: your_llm_api_key
  api_base_url: https://api.openai.com/v1
  model: gpt-4
  max_tokens: 4096
  temperature: 0.7
  timeout_secs: 60

email:
  smtp_host: smtp.example.com
  smtp_port: 587
  smtp_username: your_email@example.com
  smtp_password: your_email_password
  from_address: noreply@example.com
  from_name: DF1-69
  use_tls: true

slack:
  webhook_url: https://hooks.slack.com/services/your/webhook/url

dingtalk:
  webhook_url: https://oapi.dingtalk.com/robot/send?access_token=your_token
  secret: your_dingtalk_secret

session:
  secret_key: your_session_secret_key_here_make_it_long_and_random
  ttl_secs: 86400
  cookie_name: df1_69_session
  cookie_secure: false
  cookie_http_only: true

app:
  name: DF1-69
  log_level: debug
  environment: development
  webhook_signature_header: X-Webhook-Signature
  daily_digest_cron: "0 0 9 * * *"
