# ============================================================
# NWP 配置 - PRODUCTION 环境
# 全分辨率，全部分区，业务化运行
# 高分辨率T170/约0.6度或T213/约0.5度
# ============================================================

nwp {
  # 网格配置 - 业务化高分辨率
  grid {
    projection = "latlon"
    nx = ${?NWP_GRID_NX}
    nx = 720
    ny = ${?NWP_GRID_NY}
    ny = 361
    nz = ${?NWP_GRID_NZ}
    nz = 60
    dx = ${?NWP_GRID_DX}
    dx = 0.5
    dy = ${?NWP_GRID_DY}
    dy = 0.5
    lat-min = ${?NWP_GRID_LAT_MIN}
    lat-min = -90.0
    lat-max = ${?NWP_GRID_LAT_MAX}
    lat-max = 90.0
    lon-min = ${?NWP_GRID_LON_MIN}
    lon-min = 0.0
    lon-max = ${?NWP_GRID_LON_MAX}
    lon-max = 360.0
    sigma-levels = [1.000, 0.998, 0.995, 0.990, 0.985, 0.978, 0.970, 0.960, 0.950, 0.936,
                    0.920, 0.900, 0.876, 0.850, 0.820, 0.788, 0.752, 0.715, 0.675, 0.634,
                    0.592, 0.548, 0.505, 0.462, 0.420, 0.379, 0.340, 0.303, 0.269, 0.237,
                    0.209, 0.183, 0.160, 0.140, 0.122, 0.107, 0.094, 0.083, 0.073, 0.065,
                    0.058, 0.052, 0.047, 0.043, 0.039, 0.036, 0.033, 0.031, 0.029, 0.027,
                    0.026, 0.025, 0.024, 0.024, 0.023, 0.023, 0.022, 0.022, 0.021, 0.021]
  }

  # 动力求解器 - 全模式
  dynamics {
    time-step = ${?NWP_DYN_DT}
    time-step = 30.0
    total-steps = ${?NWP_DYN_TOTAL_STEPS}
    total-steps = 8640
    integration-scheme = "rk3"
    horizontal-scheme = "finite-volume"
    spectral-truncation = ${?NWP_DYN_TRUNCATION}
    spectral-truncation = 213
    diffusion-coef = 1.0e5
    rayleigh-damping = 0.001
    use-spectral-transform = true
    time-split-fraction = 0.5
    # 正规模初始化
    use-nmi = true
  }

  # 物理过程 - 全部
  physics {
    cumulus = "kain-fritsch"
    boundary-layer = "ysu"
    microphysics = "wsm6"
    radiation = "rrtmg"
    radiation-interval = 3600
    surface-layer = "monin-obukhov"
    fast-mode = false
    skip-radiation = false
    skip-cumulus = false
  }

  # 资料同化 - 3DVar完整
  assimilation {
    method = "3d-var"
    window-length = 3600
    max-iterations = 150
    convergence-threshold = 1.0e-6
    background-error-file = ${?NWP_ASSIM_BEC_FILE}
    background-error-file = "/data/nwp/config/bec_t213.nc"
    observations {
      satellite = true
      radar = true
      surface = true
      radiosonde = true
      aircraft = true
      gps = true
      scatterometer = true
    }
    synthetic-obs-count = 20000
  }

  # 并行计算 - 全部分区
  parallel {
    spark-master = "yarn"
    use-spark = true
    # 生产环境使用全部分区
    partitions-x = ${?NWP_PAR_PART_X}
    partitions-x = 12
    partitions-y = ${?NWP_PAR_PART_Y}
    partitions-y = 12
    halo-width = 3
    checkpoint-interval = 360
    num-threads = 8
  }

  # IO 配置
  io {
    grib {
      jni-library-path = "/opt/nwp/lib/native"
      decode-num-threads = 16
    }
    netcdf {
      compression-level = 4
      chunk-size = 1048576
    }
    hdfs {
      namenode = ${?NWP_HDFS_NAMENODE}
      namenode = "hdfs://hadoop-prod:8020"
      base-path = "/nwp/prod/data"
      replication-factor = 3
      use-hdfs = true
    }
  }

  # 存储配置 - 全部从环境变量读取敏感信息
  storage {
    postgres {
      url = ${?NWP_DB_URL}
      url = "jdbc:postgresql://pg-prod:5432/nwp_metadata"
      user = ${?NWP_DB_USER}
      user = "nwp_prod"
      password = ${?NWP_DB_PASSWORD}
      password = ""
      max-pool-size = 20
      use-postgres = true
    }
    kafka {
      bootstrap-servers = ${?NWP_KAFKA_BOOTSTRAP}
      bootstrap-servers = "kafka-prod-1:9093,kafka-prod-2:9093,kafka-prod-3:9093"
      task-topic = "nwp_tasks_prod"
      result-topic = "nwp_results_prod"
      status-topic = "nwp_status_prod"
      group-id = "nwp-solvers-prod"
      use-kafka = true
      security-protocol = "SASL_SSL"
      sasl-mechanism = "SCRAM-SHA-512"
      sasl-username = ${?NWP_KAFKA_USER}
      sasl-password = ${?NWP_KAFKA_PASSWORD}
    }
  }

  # 后处理 - 业务化全量
  postprocess {
    downscale-method = "bilinear"
    output-interval = 3600
    stations-file = "/data/nwp/config/stations_china_2000.csv"
    render {
      image-width = 2400
      image-height = 1800
      colormap = "viridis"
      base-map = "/data/nwp/config/china_map_highres.json"
      dpi = 200
    }
    enable-visualization = true
    enable-verification = true
  }

  # 输出配置
  output {
    directory = "/data/nwp/prod/output"
    hdfs-path = ${?NWP_OUTPUT_HDFS_PATH}
    hdfs-path = "/nwp/prod/output"
    # 完整变量列表
    variables = ["T", "U", "V", "QV", "QC", "QR", "QI", "QS", "QG",
                 "PSFC", "SLP", "PRECIP", "RH", "RH2", "T2", "U10", "V10",
                 "WS10", "WD10", "CAPE", "CIN", "LI", "SI", "KI"]
    # 完整等压面层
    pressure-levels = [1000, 950, 925, 900, 850, 800, 750, 700, 600, 500,
                       400, 300, 250, 200, 150, 100, 70, 50, 30, 10]
    output-interval-hours = 3
    format = "netcdf4"
  }

  # 运行配置
  run {
    mode = ${?NWP_RUN_MODE}
    mode = "forecast"
    domain = ${?NWP_RUN_DOMAIN}
    domain = "china"
    forecast-hours = ${?NWP_FORECAST_HOURS}
    forecast-hours = 168
    checkpoint = true
    checkpoint-interval-hours = 6
    # 起报时间ISO格式，不设置则从命令行参数获取
    init-time = ${?NWP_INIT_TIME}
    init-time = ""
  }

  # 日志配置
  logging {
    level = ${?NWP_LOG_LEVEL}
    level = "INFO"
    file = ${?NWP_LOG_FILE}
    file = "logs/nwp-prod.log"
    verbose = false
    profile = true
  }
}
