# ============================================================
# NWP 配置 - DEV 环境
# 本地单机开发模式，不启动Spark，单线程运行
# 低分辨率，快速验证
# ============================================================

nwp {
  # 网格配置 - 低分辨率测试
  grid {
    projection = "latlon"
    nx = 180
    ny = 91
    nz = 10
    dx = 2.0
    dy = 2.0
    lat-min = -90.0
    lat-max = 90.0
    lon-min = 0.0
    lon-max = 360.0
    sigma-levels = [1.000, 0.950, 0.850, 0.700, 0.500, 0.300, 0.150, 0.070, 0.030, 0.010]
  }

  # 动力求解器 - 稳定保守配置
  dynamics {
    time-step = 120.0
    total-steps = 720
    integration-scheme = "rk3"
    horizontal-scheme = "finite-volume"
    spectral-truncation = 85
    diffusion-coef = 1.0e5
    rayleigh-damping = 0.0
    # 是否启用谱变换
    use-spectral-transform = true
    # 数值稳定因子
    time-split-fraction = 0.5
  }

  # 物理过程 - 部分启用快速验证
  physics {
    cumulus = "kain-fritsch"
    boundary-layer = "ysu"
    microphysics = "wsm6"
    radiation = "rrtmg"
    radiation-interval = 3600
    surface-layer = "monin-obukhov"
    # 调试模式：跳过计算量大的方案
    fast-mode = true
    # 跳过部分参数化方案加速
    skip-radiation = false
    skip-cumulus = false
  }

  # 资料同化
  assimilation {
    method = "3d-var"
    window-length = 3600
    max-iterations = 50
    convergence-threshold = 1.0e-5
    background-error-file = ${?NWP_ASSIM_BEC_FILE}
    observations {
      satellite = false
      radar = false
      surface = true
      radiosonde = false
    }
    # 观测数（开发用）
    synthetic-obs-count = 1000
  }

  # 并行计算 - 本地单线程模式
  parallel {
    spark-master = "local"
    use-spark = false
    partitions-x = 1
    partitions-y = 1
    halo-width = 3
    checkpoint-interval = 0
    # 线程数
    num-threads = 1
  }

  # IO 配置
  io {
    grib {
      jni-library-path = "lib/native"
      decode-num-threads = 2
    }
    netcdf {
      compression-level = 4
      chunk-size = 1048576
    }
    hdfs {
      namenode = ${?NWP_HDFS_NAMENODE}
      namenode = "file:///tmp/nwp-dev-hdfs"
      base-path = "/tmp/nwp/data"
      replication-factor = 1
      # 开发环境禁用HDFS
      use-hdfs = false
    }
  }

  # 存储配置
  storage {
    postgres {
      url = ${?NWP_DB_URL}
      url = "jdbc:postgresql://localhost:5432/nwp_metadata"
      user = ${?NWP_DB_USER}
      user = "nwp"
      password = ${?NWP_DB_PASSWORD}
      password = "nwp_password"
      max-pool-size = 5
      # 开发环境禁用元数据库
      use-postgres = false
    }
    kafka {
      bootstrap-servers = ${?NWP_KAFKA_BOOTSTRAP}
      bootstrap-servers = "localhost:9092"
      task-topic = "nwp_tasks"
      result-topic = "nwp_results"
      status-topic = "nwp_status"
      group-id = "nwp-solvers"
      # 开发环境禁用Kafka
      use-kafka = false
    }
  }

  # 后处理
  postprocess {
    downscale-method = "bilinear"
    output-interval = 3600
    stations-file = "config/stations_demo.csv"
    render {
      image-width = 800
      image-height = 600
      colormap = "viridis"
      base-map = "config/world_map_simple.json"
      # 开发模式低分辨率绘图
      dpi = 100
    }
    # 开发环境启用快速可视化
    enable-visualization = true
    enable-verification = true
  }

  # 输出配置
  output {
    directory = "./output/dev"
    # 输出变量（减少测试用）
    variables = ["T", "U", "V", "PSFC", "PRECIP"]
    pressure-levels = [1000, 850, 500]
    # 每小时输出一次
    output-interval-hours = 1
    # 文件格式
    format = "netcdf4"
  }

  # 运行配置
  run {
    mode = "forecast"
    domain = "global"
    # 模拟小时数
    forecast-hours = 24
    # 是否输出中间检查点
    checkpoint = false
    # 起报时间（不设置则用当前时间）
    init-time = ""
  }

  # 日志配置
  logging {
    level = "DEBUG"
    file = "logs/nwp-dev.log"
    # 详细日志
    verbose = true
    # 性能计时
    profile = true
  }
}
