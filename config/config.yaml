server:
  http_port: 8080
  grpc_port: 9090
  metrics_port: 9091
  log_level: info

pipeline:
  hot_reload: true
  reload_path: config/rules
  worker_count: 4
  buffer_size: 10000
  error_handler: log
  rules: []

detection:
  algorithm: zscore
  window_size: 5m
  slide_step: 1m
  rules: []

correlation:
  trace_id_fields:
    - trace_id
    - traceId
    - X-Trace-ID
    - request_id
  timeout: 5m
  max_event_chain_size: 100
  buffer_ttl: 10m

aggregation:
  enabled: true
  group_by_fields:
    - service_name
    - error_code
    - severity
  time_window: 5m
  suppress_lower_priority: true
  max_incident_size: 50
  dedup_key_template: "{{.AlertType}}-{{.ServiceName}}-{{.ErrorCode}}"

notification:
  enabled: true
  retry:
    max_retries: 3
    backoff: 1s
    multiplier: 2.0
  channels: []

api:
  enabled: true
  http_port: 8080
  base_path: /api
  read_timeout: 30
  write_timeout: 30
  cors:
    enabled: true
    allowed_origins:
      - "*"
    allowed_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed_headers:
      - "*"
    allow_credentials: false
