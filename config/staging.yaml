server:
  host: 0.0.0.0
  port: 8080
  base_url: https://staging-review.example.com

database:
  max_connections: 20
  min_connections: 5
  acquire_timeout_secs: 30
  idle_timeout_secs: 300

redis:
  max_connections: 50
  min_connections: 10

minio:
  use_ssl: true
  region: us-east-1

session:
  ttl_secs: 259200
  cookie_secure: true
  cookie_http_only: true

app:
  log_level: info
  environment: staging
  daily_digest_cron: "0 0 9 * * 1-5"
