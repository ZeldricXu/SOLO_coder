spring.application.name=MemberScore
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/memberscore?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=5000ms

points.expire.days=365

benefit.async.enabled=true
benefit.worker.enabled=true
benefit.worker.thread-count=2

logging.level.com.memberscore=INFO
logging.level.org.hibernate.SQL=DEBUG
