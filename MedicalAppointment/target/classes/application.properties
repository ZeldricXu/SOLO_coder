server.port=8080
spring.application.name=MedicalAppointment

spring.datasource.url=jdbc:mysql://localhost:3306/medical_appointment?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.root=INFO
logging.level.com.medical.appointment=DEBUG

appointment.department.types.internal.code=internal
appointment.department.types.internal.name=内科
appointment.department.types.internal.description=内科学科，诊治内脏疾病
appointment.department.types.internal.enabled=true
appointment.department.types.internal.priority=10

appointment.department.types.surgical.code=surgical
appointment.department.types.surgical.name=外科
appointment.department.types.surgical.description=外科学科，手术治疗疾病
appointment.department.types.surgical.enabled=true
appointment.department.types.surgical.priority=20

appointment.department.types.pediatric.code=pediatric
appointment.department.types.pediatric.name=儿科
appointment.department.types.pediatric.description=儿科学科，诊治儿童疾病
appointment.department.types.pediatric.enabled=true
appointment.department.types.pediatric.priority=30

appointment.department.types.gynecology.code=gynecology
appointment.department.types.gynecology.name=妇产科
