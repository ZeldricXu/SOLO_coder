global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files: []

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["gateway:9090"]
        labels:
          service: "api-gateway"
          environment: "local"

  - job_name: "api-gateway-dev"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["gateway-dev:8080"]
        labels:
          service: "api-gateway"
          environment: "local-dev"
