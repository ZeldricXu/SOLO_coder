global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:

rule_files:

scrape_configs:
  - job_name: "inference-platform"
    static_configs:
      - targets: ["inference-platform:8080"]
    metrics_path: "/api/v1/metrics"

  - job_name: "triton-server"
    static_configs:
      - targets: ["triton:8002"]
    metrics_path: "/metrics"

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
