apiVersion: 1

providers:
  - name: 'Middleware Dashboards'
    orgId: 1
    folder: 'Middleware'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: true
