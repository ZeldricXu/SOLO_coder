---
kind: pipeline
type: docker
name: gameroom-ci

workspace:
  path: /go/src/github.com/studio/gameroom

platform:
  os: linux
  arch: amd64

# ============================================================
# Secrets (configured in Drone UI / CLI):
#   harbor_username  - Harbor robot account
#   harbor_password  - Harbor robot token
#   slack_webhook    - Slack notification URL (optional)
# ============================================================

environment: &global_env
  GOPROXY: https://goproxy.cn,direct
  GOSUMDB: off
  CGO_ENABLED: 0
  GOOS: linux
  GOARCH: amd64
  TZ: Asia/Shanghai

# --------- Volumes for sharing binaries between stages ---------
volumes:
  - name: dist
    temp: {}

# ============================================================
# Stage 1: Lint (golangci-lint + go vet + mod tidy check)
# ============================================================
steps:
  - name: lint
    image: golangci/golangci-lint:v1.57-alpine
    pull: if-not-exists
    environment:
      <<: *global_env
    commands:
      - echo ">>> [1/3] go mod tidy check"
      - go mod tidy
      - test -z "$$(git status --porcelain go.mod go.sum)" || (echo "go.mod/go.sum dirty after tidy - commit changes" && exit 1)

      - echo ">>> [2/3] go vet ./..."
      - go vet ./...

      - echo ">>> [3/3] golangci-lint run"
      - golangci-lint run --timeout 8m ./...
    when:
      event: [push, pull_request, tag]

# ============================================================
# Stage 2: Test (unit + integration with docker-compose)
# ============================================================
  - name: unit-test
    image: golang:1.22-alpine
    pull: if-not-exists
    environment:
      <<: *global_env
    commands:
      - apk add --no-cache git make
      - echo ">>> Running unit tests with race detector..."
      - go test -count=1 -race -timeout 180s -coverprofile=coverage.out ./pkg/...
      - echo ">>> Coverage summary:"
      - go tool cover -func=coverage.out | tail -n 1
    when:
      event: [push, pull_request, tag]

  - name: integration-test
    image: docker/compose:1.29.2
    pull: if-not-exists
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - echo ">>> Starting MongoDB + Redis via docker-compose..."
      - docker-compose -f test/docker-compose.yml up -d
      - sleep 15

      - echo ">>> Running integration tests..."
      - docker run --rm -i \
          --network gameroom_default \
          -v $(pwd):/workspace \
          -w /workspace \
          -e GOPROXY=https://goproxy.cn,direct \
          -e GOSUMDB=off \
          -e CGO_ENABLED=0 \
          -e MONGO_URI=mongodb://mongo:27017 \
          -e REDIS_ADDR=redis:6379 \
          golang:1.22-alpine sh -c "
            apk add --no-cache git &&
            go test -count=1 -tags=integration -timeout 300s ./test/...
          " ; EXIT_CODE=$$?

      - echo ">>> Cleaning up docker-compose..."
      - docker-compose -f test/docker-compose.yml down --remove-orphans

      - exit $$EXIT_CODE
    when:
      event: [push, pull_request, tag]

# ============================================================
# Stage 3: Build binary + Docker image + push to Harbor
# ============================================================
  - name: build-binary
    image: golang:1.22-alpine
    pull: if-not-exists
    environment:
      <<: *global_env
    volumes:
      - name: dist
        path: /dist
    commands:
      - apk add --no-cache git make tzdata
      - VERSION=$${DRONE_TAG:-$${DRONE_COMMIT_BRANCH}-$${DRONE_COMMIT_SHA:0:8}}
      - BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
      - COMMIT=$${DRONE_COMMIT_SHA:0:8}

      - echo ">>> Building binary ver=$VERSION commit=$COMMIT built=$BUILD_TIME"
      - mkdir -p /dist
      - go build -trimpath \
          -ldflags="-s -w \
            -X 'github.com/studio/gameroom/pkg/config.Info.Version='$${VERSION} \
            -X 'github.com/studio/gameroom/pkg/config.Info.BuildTime='$${BUILD_TIME} \
            -X 'github.com/studio/gameroom/pkg/config.Info.Commit='$${COMMIT} \
            -X 'github.com/studio/gameroom/pkg/config.Info.GoVersion=go1.22'" \
          -o /dist/gameroom-server \
          ./cmd/server
      - /dist/gameroom-server --version
    when:
      event: [push, tag]
      branch: [main, master, develop, release/*]

  - name: build-image-push
    image: plugins/docker:24
    pull: if-not-exists
    volumes:
      - name: dist
        path: /dist
    settings:
      dockerfile: Dockerfile
      context: .
      registry:
        from_secret: harbor_registry
      repo:
        from_secret: harbor_repo
      tags:
        - ${DRONE_COMMIT_SHA:0:8}
        - ${DRONE_TAG:-latest}
        - latest
      build_args_from_env:
        - DRONE_COMMIT_SHA
        - DRONE_TAG
      username:
        from_secret: harbor_username
      password:
        from_secret: harbor_password
      auto_tag: true
      compress: true
    when:
      event: [push, tag]
      branch: [main, master, release/*]

# ============================================================
# Notifications (optional)
# ============================================================
  - name: notify
    image: plugins/slack
    pull: if-not-exists
    settings:
      webhook:
        from_secret: slack_webhook
      channel: gaming-ci
      template: |
        {{#success build.status}}
          ✅ Build {{build.number}} succeeded on `{{build.branch}}` ({{build.trigger}})
          Commit: `{{build.commit}}` - {{build.author}}
          Link: {{build.link}}
        {{else}}
          ❌ Build {{build.number}} failed on `{{build.branch}}`
          Commit: `{{build.commit}}` - {{build.author}}
          Link: {{build.link}}
        {{/success}}
    when:
      event: [push, pull_request, tag]
      status: [success, failure]

trigger:
  branch:
    - main
    - master
    - develop
    - release/*
  event:
    - push
    - pull_request
    - tag
