spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:meshcontrol}?useSSL=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useInformationSchema=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 50

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.meshcontrol: INFO
    root: WARN

meshcontrol:
  dns:
    cache-ttl-seconds: 600
  mtls:
    default-validity-days: 90
