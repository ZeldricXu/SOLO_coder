[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -v
    --strict-markers
    --asyncio-mode=auto
    --tb=short
markers =
    unit: Unit tests
    integration: Integration tests requiring external services
    concurrent: Concurrency tests
    slow: Slow running tests
