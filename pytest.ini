[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests
    integration: Integration tests with real containers
    concurrency: Concurrency and race condition tests
    preprocessing: Document preprocessing tests
    layout: Layout analysis tests
    extraction: Information extraction tests
    validation: Field validation tests
    slow: Slow running tests
asyncio_mode = auto
