[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --cov=config
    --cov=db
    --cov=pipeline
    --cov=steps
    --cov=storage
    --cov-report=term-missing
    --cov-report=html
    --tb=short

markers =
    slow: marks tests that are slow and need more time (deselect with '-m "not slow"')
    integration: marks integration tests that require external services (deselect with '-m "not integration"')
    unit: marks unit tests
    dag: marks DAG related tests
    qc: marks QC related tests
    variant: marks variant data model tests
    error: marks error handling tests
    concurrency: marks concurrency tests
    file_validation: marks file validation tests
    executor: marks executor engine tests
