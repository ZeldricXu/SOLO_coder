[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    -p no:warnings
qt_api = pyqt6
markers =
    slow: marks tests that are slow to run
    integration: marks integration tests
    gui: marks tests that require a GUI
    document: tests for document model
    parser: tests for markdown parser
    renderer: tests for html renderer
    editor: tests for rich text editor
    graph: tests for knowledge graph
    search: tests for search engine
    attachment: tests for attachment handling
    io: tests for import/export
