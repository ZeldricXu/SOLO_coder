[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests
    integration: Integration tests
    concurrent: Concurrent tests
    zkp: Zero-knowledge proof related tests
    hdwallet: HD wallet related tests
    indexer: Block indexer related tests
    normal: Normal flow tests
    exception: Exception flow tests
    resource: Resource management tests
asyncio_mode = auto
log_cli = true
log_cli_level = INFO
