spring.application.name=healthtrack
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/healthtrack?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=5000ms

spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=5

healthtrack.queue.health-data-key=healthtrack:health:data:queue
healthtrack.queue.analysis-key=healthtrack:analysis:task:queue
healthtrack.queue.max-retry=3
healthtrack.queue.retry-delay-ms=1000
healthtrack.queue.worker-poll-interval-ms=500

healthtrack.deduplication.window.high-priority-minutes=30
healthtrack.deduplication.window.medium-priority-minutes=120
healthtrack.deduplication.window.low-priority-minutes=240
healthtrack.deduplication.window.default-minutes=60

healthtrack.advice.rule.enabled=true
healthtrack.advice.rule.use-custom-rules=false

healthtrack.queue.use-redis=true
healthtrack.analysis.use-redis-queue=true
