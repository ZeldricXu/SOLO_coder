server:
  port: 8080

spring:
  application:
    name: dns-management-platform
  r2dbc:
    url: r2dbc:mysql://localhost:3306/dns_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
  datasource:
    url: jdbc:mysql://localhost:3306/dns_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.solocoder.dns.persistence.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

dns:
  platform:
    dns:
      port: 53
      timeout-ms: 5000
      max-retries: 3
      upstream-servers:
        - 8.8.8.8
        - 114.114.114.114
    cache:
      max-size: 10000
      expire-after-write-minutes: 5
      expire-after-access-minutes: 2
    thread-pool:
      core-size: 10
      max-size: 50
      queue-capacity: 1000
    security:
      mtls-enabled: false
      cert-path: certs/
    monitoring:
      metrics-enabled: true
      tracing-enabled: true
      metrics-export-interval-seconds: 30

logging:
  level:
    com.solocoder.dns: DEBUG
    org.springframework.web: INFO
