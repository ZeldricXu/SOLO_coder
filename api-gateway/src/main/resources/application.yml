server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
  profiles:
    active: local

jwt:
  secret: dGhpcy1pcy1hLXRlc3Qtc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24=
  expiration: 86400000

rate-limit:
  enabled: true
  default-limit:
    per-minute: 100
    per-hour: 1000
  header-based:
    enabled: true
  ip-based:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,beans,env,mappings
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.parking.platform: DEBUG
    org.springframework.web: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
