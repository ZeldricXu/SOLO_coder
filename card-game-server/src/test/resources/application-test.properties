# =============================================
# Card Game Server Test Configuration
# =============================================

# Server
server.port=0

# Netty
netty.port=0
netty.boss-threads=1
netty.worker-threads=4

# Game Configuration
game.max-players=4
game.hand-limit=10
game.default-draw-per-turn=5
game.default-max-energy=3
game.reconnect-timeout-seconds=60
game.base-player-hp=80
game.base-player-speed=10

# Room
room.max-idle-timeout-seconds=600
room.match-timeout-seconds=30
room.invite-code-length=6
room.max-match-queue-size=100

# Battle
battle.turn-time-limit-seconds=30
battle.auto-save-interval-seconds=30

# Rank
rank.daily-challenge-reset-hour=0
rank.season-duration-days=30

# Replay
replay.keep-days=90
replay.analysis-sample-size=1000
