spring:
  application:
    name: card-game-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    encoding: UTF-8
    out-of-order: false
    clean-disabled: true

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    max-threads: 200
    min-spare-threads: 25
    accept-count: 100
    connection-timeout: 30000
    keep-alive-timeout: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,heapdump
  endpoint:
    health:
      show-details: when_authorized
      roles: ADMIN
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

netty:
  port: ${NETTY_PORT:9000}
  boss-threads: ${NETTY_BOSS_THREADS:1}
  worker-threads: ${NETTY_WORKER_THREADS:8}
  tcp-no-delay: true
  keep-alive: true
  so-backlog: 1024
  receive-buffer-size: 65536
  send-buffer-size: 65536

game:
  max-players: ${GAME_MAX_PLAYERS:4}
  hand-limit: ${GAME_HAND_LIMIT:10}
  default-draw-per-turn: ${GAME_DEFAULT_DRAW_PER_TURN:5}
  default-max-energy: ${GAME_DEFAULT_MAX_ENERGY:3}
  reconnect-timeout-seconds: ${GAME_RECONNECT_TIMEOUT:300}

mysql:
  url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/cardgame?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
  username: ${SPRING_DATASOURCE_USERNAME:root}
  password: ${SPRING_DATASOURCE_PASSWORD:}
  driver-class-name: ${MYSQL_DRIVER:com.mysql.cj.jdbc.Driver}
  maximum-pool-size: ${MYSQL_MAX_POOL_SIZE:20}
  minimum-idle: ${MYSQL_MIN_IDLE:5}
  connection-timeout: ${MYSQL_CONNECTION_TIMEOUT:30000}
  idle-timeout: ${MYSQL_IDLE_TIMEOUT:600000}
  max-lifetime: ${MYSQL_MAX_LIFETIME:1800000}
  leak-detection-threshold: 60000

redis:
  host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
  port: ${SPRING_DATA_REDIS_PORT:6379}
  password: ${SPRING_DATA_REDIS_PASSWORD:}
  database: ${REDIS_DATABASE:0}
  timeout: ${REDIS_TIMEOUT:3000}
  max-idle: ${REDIS_MAX_IDLE:8}
  min-idle: ${REDIS_MIN_IDLE:0}
  max-total: ${REDIS_MAX_TOTAL:8}
  max-wait-millis: ${REDIS_MAX_WAIT:3000}
  test-on-borrow: true
  test-on-return: false
  test-while-idle: true
  time-between-eviction-runs-millis: 60000
  min-evictable-idle-time-millis: 1800000

kafka:
  bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
  battle-log-topic: ${KAFKA_BATTLE_LOG_TOPIC:cardgame_battle_log}
  producer:
    acks: ${KAFKA_PRODUCER_ACKS:1}
    retries: ${KAFKA_PRODUCER_RETRIES:3}
    batch-size: ${KAFKA_PRODUCER_BATCH_SIZE:16384}
    linger-ms: ${KAFKA_PRODUCER_LINGER_MS:5}
    compression-type: snappy
    buffer-memory: 33554432
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.StringSerializer
  consumer:
    group-id: ${KAFKA_GROUP_ID:cardgame_replay_group}
    enable-auto-commit: false
    auto-commit-interval-ms: 5000
    auto-offset-reset: earliest
    max-poll-records: 500
    fetch-min-bytes: 10240
    fetch-max-wait-ms: 500
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

room:
  max-idle-timeout-seconds: ${ROOM_MAX_IDLE_TIMEOUT:600}
  match-timeout-seconds: ${ROOM_MATCH_TIMEOUT:30}
  invite-code-length: ${ROOM_INVITE_CODE_LENGTH:6}

battle:
  turn-time-limit-seconds: ${BATTLE_TURN_TIME_LIMIT:60}
  auto-save-interval-seconds: ${BATTLE_AUTO_SAVE_INTERVAL:30}

rank:
  daily-challenge-reset-hour: ${RANK_DAILY_RESET_HOUR:0}
  season-duration-days: ${RANK_SEASON_DURATION:30}

replay:
  keep-days: ${REPLAY_KEEP_DAYS:90}
  analysis-sample-size: ${REPLAY_ANALYSIS_SAMPLE:1000}

logging:
  level:
    root: INFO
    com.cardgame: ${LOG_LEVEL:INFO}
    org.springframework: WARN
    io.netty: WARN
    org.apache.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:/var/log/cardgame/cardgame.log}
    max-size: 100MB
    max-history: 30
    total-size-cap: 5GB
