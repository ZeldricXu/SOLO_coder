# =============================================
# Card Game Server Configuration
# =============================================

# Server
server.port=8080

# Netty
netty.port=9000
netty.boss-threads=1
netty.worker-threads=8

# Game Configuration
game.max-players=4
game.hand-limit=10
game.default-draw-per-turn=5
game.default-max-energy=3
game.reconnect-timeout-seconds=300

# MySQL
mysql.url=jdbc:mysql://127.0.0.1:3306/cardgame?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
mysql.username=root
mysql.password=root
mysql.driver-class-name=com.mysql.cj.jdbc.Driver
mysql.maximum-pool-size=20
mysql.minimum-idle=5
mysql.connection-timeout=30000
mysql.idle-timeout=600000
mysql.max-lifetime=1800000

# Redis
redis.host=127.0.0.1
redis.port=6379
redis.password=
redis.database=0
redis.timeout=3000
redis.max-idle=8
redis.min-idle=0
redis.max-total=8

# Kafka
kafka.bootstrap-servers=127.0.0.1:9092
kafka.battle-log-topic=cardgame_battle_log
kafka.producer-acks=1
kafka.producer-retries=3
kafka.producer-batch-size=16384
kafka.producer-linger-ms=5
kafka.group-id=cardgame_replay_group

# Room
room.max-idle-timeout-seconds=600
room.match-timeout-seconds=30
room.invite-code-length=6

# Battle
battle.turn-time-limit-seconds=60
battle.auto-save-interval-seconds=30

# Rank
rank.daily-challenge-reset-hour=0
rank.season-duration-days=30

# Replay
replay.keep-days=90
replay.analysis-sample-size=1000
