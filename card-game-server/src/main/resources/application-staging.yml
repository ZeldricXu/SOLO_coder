spring:
  config:
    activate:
      on-profile: staging
  flyway:
    clean-disabled: true

logging:
  level:
    com.cardgame: INFO
    org.springframework: WARN
  file:
    name: /var/log/cardgame/cardgame-staging.log

management:
  endpoint:
    health:
      show-details: when-authorized

mysql:
  maximum-pool-size: 30
  minimum-idle: 10
  connection-timeout: 20000
  leak-detection-threshold: 30000

redis:
  max-total: 16
  max-idle: 16
  min-idle: 8

kafka:
  producer:
    acks: all
    retries: 5
  consumer:
    max-poll-records: 200

netty:
  port: 9000
  worker-threads: 16

game:
  reconnect-timeout-seconds: 300

battle:
  turn-time-limit-seconds: 90
  auto-save-interval-seconds: 15

logging:
  level:
    com.cardgame: INFO
