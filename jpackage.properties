# DBStudio - jpackage Configuration

# This file contains common jpackage configurations for all platforms.
# Platform-specific settings are handled via Maven profiles.

# Common settings
app.name=DBStudio
app.version=${project.version}
app.vendor=Company DBA Team
app.description=Lightweight Database Management Desktop Client
app.copyright=Copyright © 2024 Company DBA Team
app.main.class=com.company.dbstudio.DBStudioApplication
app.icon=src/main/resources/icons/app-icon

# JVM Options
jvm.options=-Xms256m
jvm.options=-Xmx1024m
jvm.options=--add-opens=javafx.graphics/javafx.scene=ALL-UNNAMED
jvm.options=--add-opens=javafx.graphics/javafx.stage=ALL-UNNAMED
jvm.options=--add-opens=javafx.controls/javafx.scene.control=ALL-UNNAMED
jvm.options=-Dfile.encoding=UTF-8
jvm.options=-Dapple.laf.useScreenMenuBar=true
jvm.options=-Dapple.awt.graphics.UseQuartz=true

# Runtime Image (generated by jlink)
runtime.image=${project.build.directory}/jre/DBStudio-jre

# Input
input.directory=${project.build.directory}
main.jar=${project.build.finalName}-shaded.jar
main.class=${app.main.class}

# Output
output.directory=${project.build.directory}/dist

# File Associations
file.association.sql.extension=sql
file.association.sql.mimeType=text/plain
file.association.sql.description=SQL Query File
file.association.sql.icon=src/main/resources/icons/file-sql

# Windows specific (MSI)
win.type=MSI
win.icon=${app.icon}.ico
win.dirChooser=true
win.shortcut=true
win.menu=true
win.menuGroup=${app.name}
win.perUserInstall=true
win.registryCompany=${app.vendor}
win.upgradeUuid=DBSTUDIO-0000-0000-0000-000000000001

# macOS specific (DMG)
mac.type=DMG
mac.icon=${app.icon}.icns
mac.sign=false
mac.bundle.name=${app.name}
mac.package.identifier=com.company.dbstudio
mac.package.name=${app.name}
mac.app.category=public.app-category.developer-tools

# Linux DEB specific
linux.deb.type=DEB
linux.deb.icon=${app.icon}.png
linux.deb.package.name=dbstudio
linux.deb.shortcut=true
linux.deb.category=Development
linux.deb.maintainer=${app.vendor}
linux.deb.architecture=amd64
linux.deb.depends=default-jre | java21-runtime

# Linux RPM specific
linux.rpm.type=RPM
linux.rpm.icon=${app.icon}.png
linux.rpm.package.name=dbstudio
linux.rpm.shortcut=true
linux.rpm.category=Development
linux.rpm.license=MIT
linux.rpm.vendor=${app.vendor}
linux.rpm.architecture=x86_64
linux.rpm.requires=java-21-openjdk

# jlink module list
jlink.modules=\
    java.base,\
    java.sql,\
    java.naming,\
    java.net.http,\
    java.xml,\
    java.logging,\
    java.desktop,\
    java.management,\
    java.security.jgss,\
    java.instrument,\
    java.compiler,\
    java.rmi,\
    javafx.controls,\
    javafx.fxml,\
    javafx.swing,\
    javafx.web,\
    javafx.graphics,\
    javafx.base,\
    javafx.media

# jlink options
jlink.compress=2
jlink.strip.debug=true
jlink.strip.native.commands=true
jlink.no.header.files=true
jlink.no.man.pages=true
jlink.include.path.explicit=false
