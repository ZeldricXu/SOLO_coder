<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}运维监控大盘{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/sql.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body hx-headers='{"X-Requested-With": "XMLHttpRequest"}'>
    <div class="app-layout">
        <header class="app-header">
            <div class="app-logo">
                <div class="app-logo-icon">
                    <i data-lucide="activity" width="18" height="18" style="color: white;"></i>
                </div>
                <span>运维监控大盘</span>
            </div>
            <div class="header-right">
                <div class="status-indicator">
                    <span class="status-dot healthy"></span>
                    <span id="last-update">数据加载中...</span>
                </div>
                <div class="status-indicator">
                    <i data-lucide="bell" width="16" height="16" style="color: var(--text-secondary);"></i>
                </div>
                <div class="status-indicator">
                    <i data-lucide="user" width="16" height="16" style="color: var(--text-secondary);"></i>
                    <span>管理员</span>
                </div>
            </div>
        </header>

        <div class="main-container">
            {% include "components/sidebar.html" %}

            <main class="content-area">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="/static/js/chart-init.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();

            function updateTime() {
                const now = new Date();
                const timeStr = now.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                document.getElementById('last-update').textContent = '最后更新: ' + timeStr;
            }
            updateTime();
            setInterval(updateTime, 1000);
        });

        document.addEventListener('htmx:afterSwap', function(evt) {
            lucide.createIcons();
        });

        document.body.addEventListener('htmx:configRequest', function(evt) {
            evt.detail.headers['X-Requested-With'] = 'XMLHttpRequest';
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
