{% extends "base.html" %}

{% block title %}注册 - DataFlow{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="bi bi-person-plus"></i>
                </div>
                <h2>创建账户</h2>
                <p class="text-muted">开始使用DataFlow搭建您的第一个看板</p>
            </div>
            <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">姓名</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="name" class="form-control" required placeholder="您的姓名">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">邮箱地址</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control" required placeholder="your@email.com">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" required placeholder="至少6位字符">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">确认密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                        <input type="password" name="confirm_password" class="form-control" required placeholder="再次输入密码">
                    </div>
                </div>
                <div class="mb-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="agree" required>
                        <label class="form-check-label" for="agree">
                            我已阅读并同意 <a href="#" class="text-primary">服务条款</a> 和 <a href="#" class="text-primary">隐私政策</a>
                        </label>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">
                    注册
                </button>
            </form>
            <div class="auth-divider">
                <span>或</span>
            </div>
            <p class="text-center mb-0">
                已有账户？
                <a href="{{ url_for('auth.login_page') }}" class="text-primary text-decoration-none">立即登录</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
