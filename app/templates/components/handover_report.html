<div class="card handover-report">
    <div class="card-header">
        <h3 class="card-title">
            <i data-lucide="file-text" width="16" height="16"></i>
            交接班报告 #{{ report.id }}
        </h3>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('handover-modal').style.display='none'">
            <i data-lucide="x" width="14" height="14"></i>
            关闭
        </button>
    </div>

    <div style="padding: 0 8px;">
        {{ report.content | safe }}
    </div>

    <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-color); display: flex; gap: 12px; justify-content: flex-end;">
        <button class="btn btn-secondary">
            <i data-lucide="download" width="14" height="14"></i>
            导出PDF
        </button>
        <button class="btn btn-primary">
            <i data-lucide="send" width="14" height="14"></i>
            发送给接班人
        </button>
    </div>
</div>
