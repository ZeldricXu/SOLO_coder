<div class="card">
    <div class="card-header">
        <h3 class="card-title">
            <i data-lucide="trending-up" width="16" height="16"></i>
            {{ metric_info.display_name }} - 趋势图
        </h3>
        <span style="font-size: 12px; color: var(--text-muted);">
            最近{{ hours }}小时 · {{ metric_info.unit }}</span>
    </div>

    <div class="chart-container">
        <canvas id="chart-{{ metric_name }}" class="chart-canvas"
                data-chart-data='{{ chart_data | tojson }}'></canvas>
    </div>
</div>
