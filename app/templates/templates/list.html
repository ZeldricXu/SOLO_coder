{% extends "base.html" %}

{% block title %}模板市场 - DataFlow{% endblock %}

{% block content %}
<div class="page-header">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h1 class="page-title">模板市场</h1>
            <p class="text-muted">浏览精选看板模板，一键应用快速搭建</p>
        </div>
        <div class="d-flex gap-2">
            <input type="text" class="form-control" placeholder="搜索模板..." style="width: 200px;"
                   hx-get="{{ url_for('template_bp.list_templates') }}"
                   hx-trigger="keyup changed delay:300ms"
                   hx-target="#templates-list"
                   hx-include="[name='category']"
                   name="search">
        </div>
    </div>
</div>

<ul class="nav nav-tabs mb-4">
    <li class="nav-item">
        <a class="nav-link active" 
           hx-get="{{ url_for('template_bp.list_templates') }}" 
           hx-target="#templates-list"
           hx-include="[name='search']">全部模板</a>
    </li>
    {% for category in categories %}
    <li class="nav-item">
        <a class="nav-link" 
           hx-get="{{ url_for('template_bp.list_templates', category=category) }}" 
           hx-target="#templates-list"
           hx-include="[name='search']"
           name="category" value="{{ category }}">{{ category }}</a>
    </li>
    {% endfor %}
</ul>

<div id="templates-list" hx-get="{{ url_for('template_bp.list_templates') }}" hx-trigger="load">
    <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">加载中...</span>
        </div>
    </div>
</div>
{% endblock %}
