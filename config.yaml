server:
  port: 8080
  mode: production

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: blockchain_middleware
  sslmode: disable

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

chains:
  ethereum:
    rpc_url: https://eth-mainnet.alchemyapi.io/v2/your-api-key
    chain_id: 1
  polygon:
    rpc_url: https://polygon-mainnet.g.alchemy.com/v2/your-api-key
    chain_id: 137
  arbitrum:
    rpc_url: https://arb-mainnet.g.alchemy.com/v2/your-api-key
    chain_id: 42161

ipfs:
  api_url: http://localhost:5001
  gateway_url: http://localhost:8080

hdwallet:
  mnemonic: "your mnemonic phrase here keep it secure"
  password: ""
  default_derivation_path: "m/44'/60'/0'/0/0"

gas_estimator:
  history_blocks: 100
  percentile: 60
  cache_ttl: 30

event_listener:
  sync_interval: 15
  max_blocks_per_sync: 100
  retry_count: 3

indexer:
  start_block: 0
  batch_size: 50
  concurrent_workers: 5

zkp:
  verification_key_path: "./keys/verification.key"
  circuit_path: "./circuits/"

metrics:
  enabled: true
  port: 9090
  path: "/metrics"
