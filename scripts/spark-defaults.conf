# ============================================================
# Spark 默认配置 - 气象局 HPC 集群
# Spark on YARN 配置
# ============================================================

# 基础配置
spark.master                            yarn
spark.submit.deployMode                cluster
spark.app.name                          NWP-Solver

# 动态资源分配
spark.dynamicAllocation.enabled         true
spark.dynamicAllocation.minExecutors    4
spark.dynamicAllocation.maxExecutors    128
spark.dynamicAllocation.initialExecutors 8
spark.dynamicAllocation.executorIdleTimeout 300s
spark.dynamicAllocation.cachedExecutorIdleTimeout 600s

# 调度
spark.scheduler.mode                    FAIR
spark.scheduler.allocation.file         /config/spark/fairscheduler.xml

# 序列化
spark.serializer                        org.apache.spark.serializer.KryoSerializer
spark.kryo.unsafe                       true
spark.kryo.registrationRequired         false
spark.kryoserializer.buffer.max        512m
spark.kryoserializer.buffer             64k

# 内存配置
spark.driver.memory                     8g
spark.driver.cores                      4
spark.driver.memoryOverhead             2048
spark.executor.memory                   16g
spark.executor.cores                    8
spark.executor.memoryOverhead           4096
spark.memory.fraction                   0.75
spark.memory.storageFraction            0.25
spark.memory.offHeap.enabled            true
spark.memory.offHeap.size               8g

# 网络
spark.network.timeout                   600s
spark.executor.heartbeatInterval        30s
spark.rpc.message.maxSize               256
spark.rpc.askTimeout                    300s
spark.rpc.lookupTimeout                 300s
spark.blockManager.slaveTimeoutMs       600000

# Shuffle
spark.shuffle.compress                  true
spark.shuffle.spill.compress            true
spark.shuffle.file.buffer               128k
spark.reducer.maxSizeInFlight           96m
spark.reducer.maxReqsInFlight           5
spark.shuffle.io.maxRetries             6
spark.shuffle.io.retryWait              10s
spark.shuffle.sort.bypassMergeThreshold 400

# 推测执行
spark.speculation                       true
spark.speculation.interval              300s
spark.speculation.multiplier            2.0
spark.speculation.quantile              0.95

# 容错
spark.task.maxFailures                  8
spark.stage.maxConsecutiveAttempts      4
spark.yarn.maxAppAttempts               2
spark.yarn.am.attemptFailuresValidityInterval 1h
spark.yarn.max.executor.failures        16
spark.yarn.executor.failuresValidityInterval 1h

# YARN 配置
spark.yarn.queue                        nwp
spark.yarn.priority                     0
spark.yarn.am.memory                    4g
spark.yarn.am.cores                     2
spark.yarn.am.memoryOverhead            1024
spark.yarn.archive                      hdfs:///spark/spark-archive.zip
spark.yarn.jars                         hdfs:///spark/jars/*
spark.yarn.dist.files                   /etc/hadoop/conf/core-site.xml,/etc/hadoop/conf/hdfs-site.xml,/etc/hadoop/conf/yarn-site.xml
spark.yarn.appMasterEnv.JAVA_HOME       /opt/jdk
spark.yarn.appMasterEnv.SPARK_HOME      /opt/spark
spark.yarn.appMasterEnv.HADOOP_CONF_DIR /etc/hadoop/conf
spark.executorEnv.JAVA_HOME             /opt/jdk
spark.executorEnv.SPARK_HOME            /opt/spark
spark.executorEnv.HADOOP_CONF_DIR       /etc/hadoop/conf
spark.executorEnv.LD_LIBRARY_PATH       /opt/conda/envs/nwp/lib

# 事件日志
spark.eventLog.enabled                  true
spark.eventLog.dir                      hdfs:///spark/event-logs
spark.eventLog.compress                 true

# UI
spark.ui.enabled                        true
spark.ui.port                           4040
spark.ui.reverseProxy                   true
spark.ui.reverseProxyUrl                https://hpc-cluster/spark

# 日志
spark.logConf                           true
spark.driver.log.dfsDir                 hdfs:///spark/driver-logs
spark.driver.log.persistDfsLogs         true

# Java 选项
spark.driver.extraJavaOptions           -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+PrintGCDetails -XX:+PrintGCTimeStamps
spark.executor.extraJavaOptions         -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxGCPauseMillis=200
spark.yarn.am.extraJavaOptions          -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxGCPauseMillis=200

# 检查点
spark.streaming.checkpoint.directory    hdfs:///nwp/checkpoints
spark.streaming.checkpointInterval     1000

# 用户Agent
spark.yarn.tags                         nwp,operational
spark.yarn.applicationType              NWP-SOLVER
