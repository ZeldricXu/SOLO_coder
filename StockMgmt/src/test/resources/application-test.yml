spring:
  application:
    name: stock-mgmt-test
  datasource:
    url: jdbc:h2:mem:stockmgmt_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

logging:
  level:
    com.stockmgmt: DEBUG
    org.hibernate.SQL: WARN

stock:
  warning:
    scan-interval: 60000

task:
  execution:
    pool:
      core-size: 2
      max-size: 10
      queue-capacity: 100
    thread-name-prefix: async-test-
