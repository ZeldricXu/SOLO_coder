server:
  port: 8080

spring:
  application:
    name: pay-center
  datasource:
    url: jdbc:h2:mem:paycenter;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: simple

payment:
  async:
    enabled: true
    worker-count: 4
    retry-interval: 60000
    max-retry: 3

settlement:
  precomputation:
    base-time-minutes: 30
    min-merchants: 10
    max-merchants: 1000
    min-minutes: 10
    max-minutes: 120
    start-time: 00:00

logging:
  level:
    com.paycenter: DEBUG
    org.hibernate.SQL: DEBUG
