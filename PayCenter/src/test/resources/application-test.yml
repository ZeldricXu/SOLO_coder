server:
  port: 8081

spring:
  application:
    name: pay-center-test
  datasource:
    url: jdbc:h2:mem:paycenter_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console-test
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: simple

logging:
  level:
    com.paycenter: DEBUG
    org.hibernate.SQL: DEBUG
