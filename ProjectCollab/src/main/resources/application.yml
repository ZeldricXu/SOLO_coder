server:
  port: 8080

spring:
  application:
    name: ProjectCollab

  datasource:
    url: jdbc:h2:mem:projectcollab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

task:
  lock:
    priority-timeout:
      critical: 300
      high: 600
      normal: 1200
      low: 1800

progress:
  reminder:
    design:
      warning-threshold: 70
      critical-threshold: 50
      enabled: true
    development:
      warning-threshold: 60
      critical-threshold: 40
      enabled: true
    testing:
      warning-threshold: 75
      critical-threshold: 50
      enabled: true
    deployment:
      warning-threshold: 50
      critical-threshold: 30
      enabled: false

project:
  types:
    configs:
      development:
        display-name: 软件开发
        description: Software Development Project
        stages:
          - design
          - development
          - testing
          - deployment
        require-sprint-planning: true
        allowed-priorities:
          - high
          - medium
          - low
      marketing:
        display-name: 市场营销
        description: Marketing Campaign Project
        stages:
          - planning
          - execution
          - review
          - launch
        require-sprint-planning: false
        allowed-priorities:
          - high
          - normal
          - low
      research:
        display-name: 研究项目
        description: Research Project
        stages:
          - literature
          - experiment
          - analysis
          - report
        require-sprint-planning: true
        allowed-priorities:
          - critical
          - high
          - normal

document:
  share:
    queue-name: document_share_queue
    worker-pool-size: 5
    batch-size: 10
    poll-timeout-ms: 1000
    max-retries: 3
    retry-delay-ms: 5000
    use-redis-queue: false

logging:
  level:
    com.projectcollab: DEBUG
    org.springframework.web: INFO
