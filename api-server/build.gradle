plugins {
    id 'application'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
}

application {
    mainClass = 'com.loganalytics.api.ApiServerApplication'
}

dependencies {
    implementation project(':common')
    implementation project(':storage-index')
    implementation project(':query-parser')
    implementation project(':alert-engine')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.webflow:spring-webflow:3.0.0'
    implementation "org.apache.kafka:kafka-clients:${kafkaVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation project(':test-support')
}
