spring:
  application:
    name: homeservice-test
  datasource:
    url: jdbc:h2:mem:homeservice_test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 0

logging:
  level:
    root: WARN
    com.homeservice: INFO
