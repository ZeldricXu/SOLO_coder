[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-storage-lifecycle"
version = "1.0.0"
description = "File Storage and Lifecycle Management System"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.12.1",
    "redis>=5.0.1",
    "kafka-python>=2.0.2",
    "lz4>=4.3.2",
    "zstandard>=0.22.0",
    "numpy>=1.26.0",
    "pandas>=2.1.3",
    "pyarrow>=14.0.1",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.2",
    "apscheduler>=3.10.4",
    "python-json-logger>=2.0.7",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
    "lark>=1.1.9",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
