[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recommendation-engine"
version = "1.0.0"
description = "Production-grade recommendation engine API service"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "redis==5.0.8",
    "asyncpg==0.30.0",
    "sqlalchemy==2.0.35",
    "aiokafka==0.12.0",
    "confluent-kafka==2.5.3",
    "faiss-cpu==1.8.0.post1",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "scikit-learn==1.5.2",
    "lightgbm==4.5.0",
    "implicit==0.7.2",
    "onnxruntime==1.19.2",
    "tritonclient[http]==2.50.0",
    "pyiceberg==0.7.1",
    "python-dotenv==1.0.1",
    "aiohttp==3.10.8",
    "httpx==0.27.2",
    "prometheus-client==0.21.0",
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",
    "python-multipart==0.0.12",
    "tenacity==9.0.0",
    "cachetools==5.5.0",
    "mmh3==5.0.1",
    "loguru==0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "testcontainers==4.8.1",
    "factory-boy==3.3.1",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "asynctest==0.13.0",
    "faker==30.8.1",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "types-redis==4.6.0.20240425",
    "types-httpx==0.27.0.20240609",
]

[project.scripts]
reco-train = "recommendation_engine.scripts.train:main"
reco-api = "recommendation_engine.scripts.run_api:main"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM", "ARG", "UP"]
ignore = ["E501", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["recommendation_engine", "config", "tests"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_untyped_defs = false
warn_return_any = false
warn_unused_configs = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (requires Docker)",
    "concurrent: Concurrency tests",
    "slow: Slow running tests",
]
addopts = "-v --tb=short"
