[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nftindexer"
version = "0.1.0"
description = "NFTIndexer - NFT元数据索引与查询服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "aiohttp>=3.10.0",
    "httpx>=0.27.0",
    "web3>=6.19.0",
    "eth-account>=0.13.0",
    "hdwallet>=2.2.1",
    "mnemonic>=0.20",
    "bip32>=3.4",
    "bip39>=0.0.6",
    "cryptography>=43.0.0",
    "pycryptodome>=3.20.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "loguru>=0.7.2",
    "tenacity>=9.0.0",
    "backoff>=2.2.1",
    "orjson>=3.10.0",
    "msgpack>=1.1.0",
    "lz4>=4.3.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[project.scripts]
nftindexer = "nftindexer.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
