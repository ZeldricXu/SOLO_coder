[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-infrastructure"
version = "1.0.0"
description = "Enterprise Data Infrastructure Platform"
requires-python = ">=3.9"
dependencies = [
    "sqlglot>=23.0.0",
    "pyparsing>=3.1.0",
    "networkx>=3.2.0",
    "numpy>=1.26.0",
    "faiss-cpu>=1.7.4",
    "annoy>=1.17.3",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "SQLAlchemy>=2.0.0",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.9",
    "python-dateutil>=2.8.2",
    "croniter>=2.0.0",
    "pydantic>=2.5.0",
    "msgpack>=1.0.7",
    "lz4>=4.3.2",
    "zstandard>=0.22.0",
    "python-snappy>=0.6.1",
    "graphviz>=0.20.1",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
