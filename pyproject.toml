[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-platform"
version = "1.0.0"
description = "轻量高效的边缘计算平台 - 事件驱动架构"
readme = "edge_platform/README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Edge Platform Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyYAML>=6.0.1,<7.0.0",
    "requests>=2.31.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-mock>=3.11.0,<4.0.0",
    "ruff>=0.1.0,<1.0.0",
    "mypy>=1.5.0,<2.0.0",
    "black>=23.7.0,<24.0.0",
    "isort>=5.12.0,<6.0.0",
    "pre-commit>=3.3.0,<4.0.0",
    "bandit>=1.7.0,<2.0.0",
]
test = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-mock>=3.11.0,<4.0.0",
]
prod = [
    "uvicorn[standard]>=0.23.0,<1.0.0",
    "gunicorn>=21.0.0,<22.0.0",
    "sentry-sdk>=1.29.0,<2.0.0",
    "prometheus-client>=0.17.0,<1.0.0",
]
s3 = [
    "boto3>=1.28.0,<2.0.0",
]
full = [
    "edge-platform[dev,test,prod,s3]",
]

[project.scripts]
edge-platform = "edge_platform.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["edge_platform*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.pytest.ini_options]
addopts = """
    -v
    --strict-markers
    --strict-config
    --showlocals
"""
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["edge_platform"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "edge_platform/*/__init__.py",
    "edge_platform/main.py",
]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = false
precision = 2

[tool.coverage.html]
directory = "htmlcov"
title = "Edge Platform Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "ARG",
    "PTH",
    "ERA",
    "PL",
    "RUF",
]
ignore = [
    "E501",
    "W503",
    "PLR0913",
    "PLR0915",
    "PLR2004",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["ARG", "S101", "PLR2004"]
"*/test_*.py" = ["ARG", "S101", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["edge_platform"]
case-sensitive = true
force-single-line = false
force-sort-within-sections = true
lines-after-imports = 2

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["edge_platform"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true
show_error_context = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "requests.*",
]
ignore_missing_imports = true

[tool.bandit]
targets = ["edge_platform"]
exclude_dirs = [
    "tests",
    "docs",
    "build",
    "dist",
    ".venv",
    "venv",
]
skips = [
    "B101",
    "B104",
    "B303",
    "B404",
    "B603",
    "B606",
    "B607",
]

[tool.pre-commit]
autoupdate_branch = "main"

[profile]
[profile.dev]
system = false
env = { EDGE_ENV = "development" }

[profile.test]
system = false
env = { EDGE_ENV = "testing" }

[profile.prod]
system = true
env = { EDGE_ENV = "production" }
