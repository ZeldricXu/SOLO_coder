[build-system]
requires = ["setuptools>=68.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "streamsql"
version = "0.1.0"
description = "StreamSQL - 流式SQL计算执行引擎"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "StreamSQL Team", email = "team@streamsql.io"}
]
maintainers = [
    {name = "StreamSQL Team", email = "team@streamsql.io"}
]
keywords = ["streaming", "sql", "database", "data-pipeline", "real-time"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "fastapi>=0.104.0,<0.109.0",
    "uvicorn[standard]>=0.24.0,<0.28.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "SQLAlchemy>=2.0.23,<2.1.0",
    "alembic>=1.12.0,<1.14.0",
    "celery>=5.3.4,<6.0.0",
    "redis>=5.0.1,<6.0.0",
    "sqlglot>=18.7.0,<21.0.0",
    "networkx>=3.2.1,<4.0.0",
    "numpy>=1.26.0,<2.1.0",
    "pandas>=2.1.0,<2.3.0",
    "pyarrow>=14.0.0,<17.0.0",
    "lz4>=4.3.2,<5.0.0",
    "zstandard>=0.22.0,<0.23.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    "aiofiles>=23.2.1,<24.0.0",
    "httpx>=0.25.0,<0.28.0",
    "pyyaml>=6.0.1,<7.0.0",
    "eval_type_backport>=0.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.5.0",
    "pytest-asyncio>=0.21.0,<0.24.0",
    "pytest-cov>=4.1.0,<5.1.0",
    "ruff>=0.1.7,<0.5.0",
    "black>=23.10.0,<24.4.0",
    "isort>=5.12.0,<5.14.0",
    "mypy>=1.7.0,<1.11.0",
    "flake8>=6.1.0,<7.1.0",
    "pre-commit>=3.6.0,<3.8.0",
    "build>=1.0.3,<1.2.0",
    "twine>=5.0.0,<5.2.0",
    "bandit>=1.7.6,<1.8.0",
    "safety>=3.0.1,<3.3.0",
]

[project.urls]
Homepage = "https://github.com/streamsql/streamsql"
Documentation = "https://docs.streamsql.io"
Repository = "https://github.com/streamsql/streamsql.git"
Issues = "https://github.com/streamsql/streamsql/issues"

[project.scripts]
streamsql = "streamsql.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["streamsql*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Test"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["streamsql"]
omit = [
    "*/tests/*",
    "*/site-packages/*",
    "streamsql/__init__.py",
    "streamsql/*/__init__.py",
    "streamsql/workers/*",
]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "pass",
]
show_missing = true
skip_covered = false
sort = "Cover"

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.paths]
source = ["streamsql/"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
preview = false
include = '\.pyi?$'
extend-exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["streamsql"]
known_third_party = [
    "fastapi", "uvicorn", "pydantic", "sqlalchemy", "alembic",
    "celery", "redis", "sqlglot", "networkx", "numpy", "pandas",
    "pyarrow", "pytest", "httpx", "yaml",
]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.ruff]
target-version = "py39"
line-length = 100
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "EM",  # flake8-errmsg
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "T10", # flake8-debugger
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
]
lint.ignore = [
    "E501",  # Line too long (handled by black)
    "B905",  # zip() without strict= (Python 3.10+)
    "S308",  # Consider possible security implications
    "S101",  # Use of assert detected
    "UP006",  # Use `list` instead of `List` (ok for type hints)
    "UP007",  # Use `dict` instead of `Dict`
]
lint.per-file-ignores = {
    "tests/*" = ["S101", "PT011", "PT012", "PT018"],
    "streamsql/workers/*" = ["S308"],
    "streamsql/modules/*/capture.py" = ["S308"],
}

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
force-single-line = false
force-wrap-aliases = true
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.9"
strict = false
show_error_codes = true
show_error_context = true
show_column_numbers = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "streamsql.core.*",
    "streamsql.api.*",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "streamsql.workers.*",
]
ignore_errors = true

[tool.bandit]
targets = ["streamsql"]
recursive = true
exclude_dirs = ["tests", "build", "dist", ".venv"]
skips = ["B101", "B303", "B324"]

[tool.safety]
full-report = true
ignore = []
output = "text"
