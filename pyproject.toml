[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchain-infra-platform"
version = "1.0.0"
description = "区块链基础设施平台 - 合约事件监听、Gas预估、ZKP验证等"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Blockchain Infra Team", email = "team@blockchain-infra.com"}
]
keywords = ["blockchain", "ethereum", "web3", "gas-estimation", "smart-contracts"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "web3==6.15.1",
    "eth-utils==4.0.0",
    "eth-typing==3.5.2",
    "eth-account==0.11.0",
    "sqlalchemy==2.0.25",
    "alembic==1.13.1",
    "redis==5.0.1",
    "celery==5.3.6",
    "httpx==0.26.0",
    "aiohttp==3.9.1",
    "python-dotenv==1.0.0",
    "pyyaml==6.0.1",
    "python-multipart==0.0.6",
    "cryptography==41.0.7",
    "ecdsa==0.18.0",
    "hdwallet==2.2.1",
    "bip-utils==2.8.0",
]

[project.optional-dependencies]
dev = [
    "black==23.12.1",
    "isort==5.13.2",
    "ruff==0.1.14",
    "flake8==6.1.0",
    "flake8-bugbear==23.12.2",
    "flake8-comprehensions==3.14.0",
    "flake8-docstrings==1.7.0",
    "flake8-import-order==0.18.2",
    "flake8-type-checking==2.14.0",
    "pylint==3.0.3",
    "mypy==1.8.0",
    "types-redis==4.6.0.20240106",
    "types-PyYAML==6.0.12.12",
    "types-requests==2.31.0.20240106",
    "types-aiofiles==23.1.0.6",
]
test = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "pytest-httpx==0.30.0",
    "pytest-xdist==3.5.0",
    "pytest-order==1.1.0",
    "pytest-rerunfailures==13.0",
    "faker==22.0.0",
    "factory-boy==3.3.0",
    "freezegun==1.4.0",
    "respx==0.21.1",
    "aioresponses==0.7.6",
    "bandit==1.7.6",
    "safety==3.0.1",
]
prod = [
    "uvloop==0.19.0",
    "httptools==0.6.1",
    "watchfiles==0.21.0",
    "python-json-logger==2.0.7",
    "prometheus-client==0.19.0",
    "opentelemetry-api==1.22.0",
    "opentelemetry-sdk==1.22.0",
    "opentelemetry-instrumentation-fastapi==0.43b0",
    "opentelemetry-instrumentation-httpx==0.43b0",
    "opentelemetry-exporter-otlp-proto-http==1.22.0",
    "psycopg2-binary==2.9.9",
    "asyncpg==0.29.0",
    "aiomysql==0.2.0",
    "healthcheck==1.3.3",
]

[project.scripts]
bci-api = "src.main:main"
bci-worker = "src.infrastructure.celery_app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-config",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
    "--junitxml=pytest-report.xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/migrations/*",
    "*/alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["src"]
known_third_party = ["fastapi", "uvicorn", "web3", "pydantic"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.ruff]
line-length = 100
target-version = "py310"
fix = false
show-fixes = true
output-format = "grouped"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit
    "A",   # flake8-builtins
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "ERA", # eradicate
    "PTH", # flake8-use-pathlib
    "ASYNC", # flake8-async
]
ignore = [
    "E501",   # line-too-long (handled by black)
    "I001",   # unsorted-imports (handled by isort)
    "S101",   # use of assert
    "BLE001", # except Exception
    "C901",   # too-complex
    "RUF001", # ambiguous-variable-name
    "UP037",  # quote-annotation
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T201", "PT011", "PT012", "PT019"]
"src/*/__init__.py" = ["F401"]
"src/shared/errors.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
case-sensitive = true
force-single-line = false
force-wrap-aliases = true
combine-as-imports = true

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
strict = false
show_error_codes = true
show_error_context = true
show_column_numbers = true
ignore_missing_imports = false
follow_imports = "normal"
follow_imports_for_stubs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
explicit_package_bases = true
plugins = [
    "pydantic.mypy",
]
exclude = [
    '^build/',
    '^dist/',
    '^.eggs/',
    '^.venv/',
    '^venv/',
    '^env/',
    '^tests/',
    '^migrations/',
    '^alembic/',
    '.*_pb2\.py$',
]

[tool.mypy.overrides]
module = "src.*"
disallow_untyped_defs = true

module = "tests.*"
ignore_errors = true

[tool.bandit]
targets = ["src"]
recursive = true
exclude_dirs = [
    "tests",
    "migrations",
    "alembic",
    ".venv",
    "venv",
]
severity = ["low", "medium", "high"]
confidence = ["low", "medium", "high"]
skips = [
    "B101",  # assert_used
    "B303",  # md5
    "B324",  # weak_cryptographic_hash
]

[tool.safety]
ignore = []
continue-on-error = false
full-report = true
output = "text"
