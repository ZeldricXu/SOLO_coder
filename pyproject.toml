[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "task-orchestration-platform"
version = "0.1.0"
description = "Vertical technical domain dependency task orchestration system"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.12.1",
    "asyncpg>=0.29.0",
    "celery>=5.3.4",
    "redis>=5.0.1",
    "cryptography>=41.0.7",
    "python-jose[cryptography]>=3.3.0",
    "pyjwt>=2.8.0",
    "aiohttp>=3.9.1",
    "httpx>=0.25.2",
    "pyyaml>=6.0.1",
    "tenacity>=8.2.3",
    "aiosqlite>=0.19.0",
    "prometheus-client>=0.19.0",
    "cryptography>=41.0.7",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["top*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
