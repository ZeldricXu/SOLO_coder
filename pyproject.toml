[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etl_engine"
version = "0.1.0"
description = "ETL orchestration engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "celery[redis]",
    "redis",
    "pandas",
    "dask[dataframe]",
    "great-expectations",
    "pymysql",
    "psycopg2-binary",
    "pymongo",
    "boto3",
    "confluent-kafka",
    "httpx",
    "clickhouse-driver",
    "google-cloud-bigquery",
    "redshift-connector",
    "jinja2",
    "prometheus-client",
    "python-multipart",
    "aiosmtplib",
    "pydantic-settings",
    "python-dateutil",
    "psutil",
    "scipy",
    "croniter",
    "duckdb",
    "pyyaml",
    "dbutils",
    "faust-streaming",
    "redis",
    "robinhood-aiokafka",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "pytest-mock",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-celery",
    "httpx",
    "aiosqlite",
    "testcontainers[mysql,postgres,redis,minio]",
    "pyyaml",
    "duckdb",
]

[tool.setuptools.packages.find]
include = ["etl_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring docker/testcontainers",
    "concurrency: Concurrency tests",
    "slow: Tests that are slow to run",
    "streaming: Streaming engine related tests",
    "backward_compat: Backward compatibility tests",
    "nosql: NoSQL document source related tests",
    "online_quality: Online quality checker related tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
