[tool.poetry]
name = "profilerhub"
version = "0.1.0"
description = "ProfilerHub - 持续性能剖析分析平台"
authors = ["ProfilerHub Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.6"}
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
sqlalchemy = "^2.0.35"
alembic = "^1.13.2"
celery = "^5.4.0"
redis = "^5.0.8"
numpy = "^1.26.4"
pandas = "^2.2.2"
scipy = "^1.14.1"
pyyaml = "^6.0.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
