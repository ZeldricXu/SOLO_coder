[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-management-platform"
version = "1.0.0"
description = "Unified E-commerce Inventory Management Platform"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.12",
    "celery==5.4.0",
    "redis==5.2.0",
    "redis-py-cluster==2.1.3",
    "grpcio==1.68.0",
    "grpcio-tools==1.68.0",
    "protobuf==5.28.2",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "scikit-learn==1.5.2",
    "statsmodels==0.14.3",
    "APScheduler==3.10.4",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
    "email-validator==2.2.0",
    "slowapi==0.1.9",
    "limits==3.13.0",
    "structlog==24.4.0",
    "opentelemetry-api==1.28.0",
    "opentelemetry-sdk==1.28.0",
    "opentelemetry-instrumentation-fastapi==0.49b0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "testcontainers==3.7.1",
    "docker==7.1.0",
    "black==24.10.0",
    "ruff==0.7.0",
    "mypy==1.13.0",
    "faker==30.6.0",
    "factory-boy==3.3.1",
]

[tool.setuptools.packages.find]
where = ["app"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
ignore = ["F821"]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]
"app/grpc_api/*_pb2*.py" = ["ALL"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring Docker",
    "sku: SKU management tests",
    "sync: Inventory sync tests",
    "purchase: Purchase order tests",
    "alert: Alert and replenishment tests",
    "slow: Slow running tests",
]
