apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-exam-app
  namespace: exam-platform
  labels:
    app: online-exam
    component: app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: online-exam
      component: app
  template:
    metadata:
      labels:
        app: online-exam
        component: app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: exam-app-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - online-exam
                topologyKey: kubernetes.io/hostname
      containers:
        - name: online-exam
          image: harbor.company.com/exam-platform/exam-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          envFrom:
            - secretRef:
                name: exam-secrets
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-server.exam-platform.svc.cluster.local:8888"
            - name: DB_HOST
              value: "postgres-primary.db.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "exam_db"
            - name: REDIS_HOST
              value: "redis-master.cache.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: MQ_HOST
              value: "rabbitmq.mq.svc.cluster.local"
            - name: MQ_PORT
              value: "5672"
            - name: MINIO_ENDPOINT
              value: "http://minio.storage.svc.cluster.local:9000"
            - name: JAVA_OPTS
              value: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport -XX:+PrintGCDetails -Xlog:gc*:file=/var/log/exam/gc.log"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: logs
              mountPath: /var/log/exam
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 60
