[changelog]
header = """
# Changelog
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
"""

body = """
{% if version %}
## [{{ version | replace(from="v", to="") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | first }}
{% if commit.issue %}{% for issue in commit.issue %} (#{{ issue }}){% endfor %}
{% endif %}
{% endfor %}
{% endfor %}

{% if version and previous %}
[{{ version }}]: {{ previous }}..{{ version }}
{% endif %}
"""

footer = """
---
This changelog was automatically generated by [git-cliff](https://github.com/orhun/git-cliff).
"""

[changelog.after_merge_commit = false

[changelog.footer]
content = ""
[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Tests" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "CI/CD" },
  { message = "^chore", group = "Chore" },
  { message = "^revert", group = "Reverts" },
]
filter_commits = true
tag_pattern = "v[0-9]*"
skip_tags = "v0.1.0-rc1"
sort_commits = "oldest"
tagger_tag = true
