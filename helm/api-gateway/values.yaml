replicaCount: 2

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/your-org/api-gateway
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  metricsPort: 9090
  annotations: {}
  labels: {}

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: api-gateway.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: "2"
    memory: "2Gi"
  requests:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
          topologyKey: kubernetes.io/hostname

livenessProbe:
  httpGet:
    path: /live
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 25%

gateway:
  logLevel: "info"
  workers: 4
  requestTimeout: 30

  rateLimit:
    enabled: true
    multiDimensionEnabled: false
    defaultUserLimit: 1000
    defaultApiLimit: 10000
    burstMultiplier: 2.0
    windowSeconds: 60

  securityFilter:
    enabled: false
    mode: "block"

  auth:
    enabled: true

  analytics:
    enabled: true

  otel:
    enabled: false
    serviceName: "api-gateway"
    endpoint: "http://otel-collector:4317"

externalConfig:
  existingSecret: ""
  existingConfigMap: ""

database:
  host: "postgresql"
  port: 5432
  name: "api_gateway"
  user: "postgres"
  existingSecret: ""
  passwordKey: "password"

redis:
  host: "redis"
  port: 6379
  db: 0
  existingSecret: ""
  passwordKey: "password"

clickhouse:
  enabled: false
  host: "clickhouse"
  port: 8123
  user: "default"
  database: "api_gateway"

tests:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.5.0"
    pullPolicy: IfNotPresent
