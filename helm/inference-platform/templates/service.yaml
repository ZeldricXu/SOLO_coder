apiVersion: v1
kind: Service
metadata:
  name: {{ include "inference-platform.fullname" . }}
  labels:
    {{- include "inference-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: {{ .Values.config.monitoring.prometheusPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "inference-platform.selectorLabels" . | nindent 4 }}
