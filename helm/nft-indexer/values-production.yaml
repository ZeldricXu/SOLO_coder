replicaCount: 5

image:
  tag: "1.0.0"
  pullPolicy: Always

ingress:
  hosts:
    - host: nftindexer.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: nftindexer-tls
      hosts:
        - nftindexer.example.com

resources:
  limits:
    cpu: "4"
    memory: "4Gi"
  requests:
    cpu: "1"
    memory: "2Gi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300

javaOpts:
  xms: "1024m"
  xmx: "2048m"
  maxMetaspaceSize: "512m"
  gc:
    collector: "G1"
    maxGCPauseMillis: "20"
  extraOpts: >
    -Djava.security.egd=file:/dev/./urandom
    -Djava.net.preferIPv4Stack=true
    -Dfile.encoding=UTF-8
    -XX:+UseStringDeduplication
    -XX:+OptimizeStringConcat
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=/tmp/heapdump.hprof
    -XX:MaxMetaspaceSize=512m

mysql:
  architecture: replication
  auth:
    rootPassword: ${MYSQL_ROOT_PASSWORD}
    database: "nft_indexer"
    username: "nftindexer"
    password: ${MYSQL_PASSWORD}
  primary:
    persistence:
      enabled: true
      size: "100Gi"
      storageClass: "ssd-gp3"
    resources:
      limits:
        cpu: "8"
        memory: "16Gi"
      requests:
        cpu: "4"
        memory: "8Gi"
  secondary:
    replicaCount: 2
    persistence:
      size: "100Gi"
      storageClass: "ssd-gp3"
    resources:
      limits:
        cpu: "4"
        memory: "8Gi"
      requests:
        cpu: "2"
        memory: "4Gi"

redis:
  architecture: replication
  auth:
    enabled: true
    password: ${REDIS_PASSWORD}
  master:
    persistence:
      enabled: true
      size: "50Gi"
      storageClass: "ssd-gp3"
    resources:
      limits:
        cpu: "4"
        memory: "8Gi"
      requests:
        cpu: "2"
        memory: "4Gi"
  replica:
    replicaCount: 2
    resources:
      limits:
        cpu: "2"
        memory: "4Gi"
      requests:
        cpu: "1"
        memory: "2Gi"

persistence:
  enabled: true
  storageClass: "ssd-gp3"
  size: "20Gi"

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: nft-indexer
        topologyKey: topology.kubernetes.io/zone
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nft-indexer
          topologyKey: kubernetes.io/hostname

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 90
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 60
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 180
  timeoutSeconds: 10
  periodSeconds: 20
  failureThreshold: 30

serviceMonitor:
  enabled: true
  interval: "10s"
  scrapeTimeout: "5s"

prometheusRule:
  enabled: true
  rules:
    - alert: NFTIndexerDown
      expr: up{job="nft-indexer"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "NFTIndexer instance is down (Production)"
        description: "NFTIndexer instance {{ $labels.instance }} has been down for more than 1 minute."
        runbook_url: "https://runbooks.nftindexer.io/nftindexer-down"
    - alert: HighCPUUsage
      expr: 100 - (avg by(instance) (irate(process_cpu_seconds_total{job="nft-indexer"}[5m])) * 100) > 70
      for: 3m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage detected (Production)"
        description: "CPU usage is above 70% for more than 3 minutes."
    - alert: HighMemoryUsage
      expr: (jvm_memory_used_bytes{job="nft-indexer",area="heap"} / jvm_memory_max_bytes{job="nft-indexer",area="heap"}) * 100 > 80
      for: 3m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage detected (Production)"
        description: "Heap memory usage is above 80% for more than 3 minutes."
    - alert: HighErrorRate
      expr: rate(http_server_requests_seconds_count{job="nft-indexer",status=~"5.."}[5m]) / rate(http_server_requests_seconds_count{job="nft-indexer"}[5m]) > 0.03
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "High error rate detected (Production)"
        description: "Error rate is above 3% for more than 1 minute."
    - alert: HighP99Latency
      expr: http_server_requests_seconds{quantile="0.99",job="nft-indexer"} > 2
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High P99 latency detected (Production)"
        description: "P99 latency is above 2 seconds for more than 2 minutes."

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 50%
    maxUnavailable: 0

minReadySeconds: 60
revisionHistoryLimit: 20

terminationGracePeriodSeconds: 120

podDisruptionBudget:
  enabled: true
  minAvailable: 2
  maxUnavailable: ""
