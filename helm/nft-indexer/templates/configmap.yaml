apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nft-indexer.fullname" . }}
  labels:
    {{- include "nft-indexer.labels" . | nindent 4 }}
data:
  application-kubernetes.yml: |
    spring:
      r2dbc:
        url: ${SPRING_R2DBC_URL}
        username: ${SPRING_R2DBC_USERNAME}
        password: ${SPRING_R2DBC_PASSWORD}
        pool:
          max-size: 20
          initial-size: 5
          max-idle-time: 30s
          max-create-connection-time: 30s
      data:
        redis:
          host: ${SPRING_DATA_REDIS_HOST}
          port: ${SPRING_DATA_REDIS_PORT:6379}
          password: ${SPRING_DATA_REDIS_PASSWORD:}
          lettuce:
            pool:
              max-active: 20
              max-idle: 10
              min-idle: 5
              max-wait: 30s
      flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true
        baseline-version: 0
        out-of-order: false
        fail-on-missing-locations: true
        validate-on-migrate: true
        encoding: UTF-8
        placeholder-replacement: false
      servlet:
        multipart:
          max-file-size: 10MB
          max-request-size: 10MB
      codec:
        max-in-memory-size: 10MB
      jackson:
        date-format: yyyy-MM-dd HH:mm:ss
        time-zone: Asia/Shanghai
        default-property-inclusion: non_null
        serialization:
          write-dates-as-timestamps: false
        deserialization:
          fail-on-unknown-properties: false
      task:
        execution:
          pool:
            core-size: 8
            max-size: 16
            queue-capacity: 1000
            thread-name-prefix: async-exec-
          await-termination: true
          await-termination-period: 60s
        scheduling:
          pool:
            size: 4
            thread-name-prefix: scheduled-exec-
      profiles:
        group:
          kubernetes:
            - kubernetes
            - prod
    server:
      port: 8080
      shutdown: graceful
      netty:
        idle-timeout: 60s
        connection-timeout: 30s
      compression:
        enabled: true
        mime-types: application/json,application/xml,text/plain,text/css,text/javascript,application/javascript
        min-response-size: 1024
      http2:
        enabled: true
      forward-headers-strategy: native
    management:
      endpoints:
        web:
          exposure:
            include: "*"
          base-path: /actuator
      endpoint:
        health:
          show-details: always
          show-components: always
          probes:
            enabled: true
          livenessstate:
            enabled: true
          readinessstate:
            enabled: true
        metrics:
          enabled: true
          export:
            prometheus:
              enabled: true
              descriptions: true
              step: 10s
        info:
          enabled: true
          build:
            enabled: true
          env:
            enabled: true
        prometheus:
          enabled: true
      metrics:
        enable:
          jvm: true
          system: true
          process: true
          tomcat: true
          spring: true
          http: true
          rpc: true
        export:
          prometheus:
            enabled: true
        tags:
          application: nft-indexer
          environment: kubernetes
      info:
        build:
          enabled: true
        env:
          enabled: true
        git:
          enabled: true
          mode: full
      health:
        db:
          enabled: true
        redis:
          enabled: true
        livenessstate:
          enabled: true
        readinessstate:
          enabled: true
        diskspace:
          enabled: true
          threshold: 10MB
    logging:
      level:
        root: INFO
        com.nftindexer: DEBUG
        org.springframework.web: INFO
        org.springframework.data: INFO
        io.r2dbc: INFO
        io.lettuce: INFO
      pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
        file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
      file:
        name: /app/logs/nft-indexer.log
        max-size: 100MB
        max-history: 30
        total-size-cap: 3GB
      logback:
        rollingpolicy:
          file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
          clean-history-on-start: false
          max-file-size: 100MB
      group:
        web:
          - org.springframework.web
          - org.springframework.http
        sql:
          - io.r2dbc
          - org.springframework.data.r2dbc
        cache:
          - io.lettuce
          - org.springframework.data.redis
    springdoc:
      api-docs:
        enabled: true
        path: /v3/api-docs
      swagger-ui:
        enabled: true
        path: /swagger-ui.html
        operations-sorter: method
        tags-sorter: alpha
      show-actuator: true
      default-consumes-media-type: application/json
      default-produces-media-type: application/json
    nftindexer:
      app:
        name: nft-indexer
        version: @project.version@
        build-time: @maven.build.timestamp@
        environment: kubernetes
      async:
        core-pool-size: 8
        max-pool-size: 16
        queue-capacity: 1000
        keep-alive-seconds: 60
      scheduler:
        thread-pool-size: 4
      cache:
        caffeine:
          maximum-size: 10000
          expire-after-write: 1h
          expire-after-access: 30m
          initial-capacity: 1000
        redis:
          default-expire: 1h
          key-prefix: nftindexer:
      security:
        rate-limit:
          enabled: true
          default-limit: 100
          default-window-seconds: 60
          header-key: X-RateLimit-Limit
          header-remaining: X-RateLimit-Remaining
          header-reset: X-RateLimit-Reset
        auth:
          enabled: false
          jwt:
            secret: ${JWT_SECRET:}
            expiration: 86400
            header: Authorization
            prefix: "Bearer "
      monitoring:
        metrics:
          enabled: true
          export-interval: 10s
        tracing:
          enabled: true
          sampling-probability: 0.1
      chain:
        confirmations: 12
        rpc-timeout: 30s
        max-retry: 3
        retry-delay: 1s
      bridge:
        lock-timeout: 3600
        mint-timeout: 3600
        confirmation-blocks: 12
      multisig:
        required-signatures: 2
        proposal-timeout: 86400
      gas:
        cache-duration: 10m
        priority-level: medium
      event:
        batch-size: 100
        poll-interval: 5s
        retry-interval: 30s
        max-retry: 5
      indexer:
        block-batch-size: 10
        confirmation-depth: 12
        start-block: 0
        max-concurrent: 4
