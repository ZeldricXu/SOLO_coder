{{/* Database secret name helper */}}
{{- define "nft-indexer.databaseSecretName" -}}
{{- if .Values.externalDatabase.existingSecret }}
{{ .Values.externalDatabase.existingSecret }}
{{- else if .Values.mysql.enabled }}
{{ .Release.Name }}-mysql
{{- else }}
{{ include "nft-indexer.fullname" . }}-database
{{- end }}
{{- end }}

{{/* Redis secret name helper */}}
{{- define "nft-indexer.redisSecretName" -}}
{{- if .Values.externalRedis.existingSecret }}
{{ .Values.externalRedis.existingSecret }}
{{- else if .Values.redis.enabled }}
{{ .Release.Name }}-redis
{{- else }}
{{ include "nft-indexer.fullname" . }}-redis
{{- end }}
{{- end }}

{{- if and (not .Values.externalDatabase.existingSecret) (not .Values.mysql.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nft-indexer.fullname" . }}-database
  labels:
    {{- include "nft-indexer.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.externalDatabase.username | b64enc | quote }}
  password: {{ .Values.externalDatabase.password | b64enc | quote }}
{{- end }}

{{- if and (not .Values.externalRedis.existingSecret) (not .Values.redis.enabled) .Values.externalRedis.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nft-indexer.fullname" . }}-redis
  labels:
    {{- include "nft-indexer.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.externalRedis.password | b64enc | quote }}
{{- end }}
