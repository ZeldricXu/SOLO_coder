replicaCount: 2

image:
  tag: "staging"

ingress:
  hosts:
    - host: staging.nftindexer.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: staging-nftindexer-tls
      hosts:
        - staging.nftindexer.example.com

resources:
  limits:
    cpu: "1"
    memory: "1Gi"
  requests:
    cpu: "250m"
    memory: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 85

javaOpts:
  xms: "256m"
  xmx: "512m"
  maxMetaspaceSize: "128m"

mysql:
  primary:
    persistence:
      size: "10Gi"
    resources:
      limits:
        cpu: "1"
        memory: "1Gi"
      requests:
        cpu: "250m"
        memory: "512Mi"

redis:
  master:
    persistence:
      size: "5Gi"
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "125m"
        memory: "256Mi"

persistence:
  size: "5Gi"

serviceMonitor:
  enabled: true

prometheusRule:
  enabled: false
