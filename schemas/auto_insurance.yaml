schema_name: auto_insurance_claim
schema_version: "1.0"
description: 车险理赔文档抽取Schema
document_types:
  - accident_report
  - insurance_claim
  - repair_invoice
business_line: auto_insurance
created_by: admin
created_at: 2026-06-01T00:00:00Z
is_active: true
fields:
  - field_name: policy_number
    field_type: string
    description: 保单号
    required: true
    examples:
      - "PA20260012345"
      - "AUTO-2026-00123"
    validation_rules:
      pattern: "^[A-Z]{2,4}-?\\d{4,}-?\\d{3,}$"
      min_length: 8
      max_length: 20

  - field_name: license_plate
    field_type: string
    description: 车牌号
    required: true
    examples:
      - "京A12345"
      - "沪B·88888"
      - "粤CD1234"
    validation_rules:
      pattern: "^[京津沪渝冀豫云辽黑湘皖鲁新苏浙赣鄂桂甘晋蒙陕吉闽贵粤青藏川宁琼使领][A-Z][·]?[A-Z0-9]{4,5}[A-Z0-9挂学警港澳]$"
      min_length: 6
      max_length: 8

  - field_name: accident_location
    field_type: string
    description: 事故地点
    required: true
    examples:
      - "北京市朝阳区建国路88号"
      - "上海市浦东新区世纪大道100号"
    validation_rules:
      min_length: 5
      max_length: 200

  - field_name: accident_date
    field_type: date
    description: 事故日期
    required: true
    examples:
      - "2026-05-15"
      - "2026/05/15"
    validation_rules:
      date_format: "%Y-%m-%d"
      max_date: "today"

  - field_name: accident_time
    field_type: string
    description: 事故时间
    required: false
    examples:
      - "14:30"
      - "下午2点30分"
    validation_rules:
      pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"

  - field_name: accident_type
    field_type: string
    description: 事故类型
    required: true
    examples:
      - "追尾"
      - "刮擦"
      - "碰撞"
      - "单方事故"
    validation_rules:
      allowed_values:
        - 追尾
        - 刮擦
        - 碰撞
        - 单方事故
        - 多车事故
        - 其他

  - field_name: driver_name
    field_type: string
    description: 驾驶员姓名
    required: true
    examples:
      - "张三"
      - "John Smith"
    validation_rules:
      min_length: 2
      max_length: 50

  - field_name: driver_license
    field_type: string
    description: 驾驶证号
    required: true
    examples:
      - "110101199001011234"
    validation_rules:
      pattern: "^\\d{17}[\\dXx]$"

  - field_name: vehicle_type
    field_type: string
    description: 车辆类型
    required: false
    examples:
      - "小型轿车"
      - "SUV"
      - "货车"

  - field_name: vehicle_brand
    field_type: string
    description: 车辆品牌
    required: false
    examples:
      - "大众"
      - "丰田"
      - "BMW"

  - field_name: vehicle_model
    field_type: string
    description: 车辆型号
    required: false
    examples:
      - "帕萨特"
      - "凯美瑞"
      - "X5"

  - field_name: damage_description
    field_type: string
    description: 损伤描述
    required: true
    examples:
      - "前保险杠凹陷，右前大灯破损"
      - "左侧车门刮擦，后视镜损坏"
    validation_rules:
      min_length: 5
      max_length: 500

  - field_name: estimated_repair_cost
    field_type: number
    description: 预估维修费用
    required: true
    examples:
      - 5000.00
      - 12500.50
    validation_rules:
      min: 0
      max: 1000000

  - field_name: third_party_name
    field_type: string
    description: 第三方责任人姓名
    required: false
    examples:
      - "李四"

  - field_name: third_party_license
    field_type: string
    description: 第三方车牌号
    required: false
    examples:
      - "冀B67890"

  - field_name: third_party_insurance
    field_type: string
    description: 第三方保险公司
    required: false
    examples:
      - "中国平安"
      - "中国人保"

  - field_name: police_report_number
    field_type: string
    description: 交警报案号
    required: false
    examples:
      - "JT2026051500123"

  - field_name: injury_description
    field_type: string
    description: 人员伤亡情况
    required: false
    examples:
      - "无人员伤亡"
      - "轻微擦伤"

  - field_name: total_claim_amount
    field_type: number
    description: 总理赔金额
    required: true
    examples:
      - 8500.00
      - 25000.00
    validation_rules:
      min: 0
      max: 5000000
