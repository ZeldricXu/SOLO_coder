schema_name: insurance_claim
schema_version: "1.0"
description: 通用保险理赔文档抽取Schema（默认）
document_types:
  - medical_report
  - invoice
  - accident_report
business_line: general_insurance
created_by: system
created_at: 2026-01-01T00:00:00Z
is_active: true
is_default: true
fields:
  - field_name: patient_name
    field_type: string
    description: 患者姓名
    required: true
    examples:
      - "张三"
      - "李四"
    validation_rules:
      min_length: 2
      max_length: 50

  - field_name: id_card
    field_type: string
    description: 身份证号
    required: true
    examples:
      - "110101199001011234"
    validation_rules:
      pattern: "^\\d{17}[\\dXx]$"

  - field_name: diagnosis_code
    field_type: string
    description: ICD-10诊断编码
    required: true
    examples:
      - "I25.1"
      - "I10"
    validation_rules:
      pattern: "^[A-Z]\\d{2}(?:\\.\\d{1,2})?$"

  - field_name: diagnosis
    field_type: string
    description: 诊断结果
    required: false
    examples:
      - "冠心病"
      - "高血压"

  - field_name: total_amount
    field_type: number
    description: 总费用金额
    required: true
    examples:
      - 5000.00
      - 12500.50
    validation_rules:
      min: 0
      max: 10000000

  - field_name: treatment_date
    field_type: date
    description: 就诊日期
    required: true
    examples:
      - "2026-05-15"
    validation_rules:
      date_format: "%Y-%m-%d"
      max_date: "today"

  - field_name: discharge_date
    field_type: date
    description: 出院日期
    required: false
    examples:
      - "2026-05-20"
    validation_rules:
      date_format: "%Y-%m-%d"
      max_date: "today"

  - field_name: hospital
    field_type: string
    description: 就诊医院
    required: false
    examples:
      - "北京协和医院"

  - field_name: department
    field_type: string
    description: 就诊科室
    required: false
    examples:
      - "心内科"

  - field_name: doctor_name
    field_type: string
    description: 主治医生
    required: false
    examples:
      - "王医生"
