apiVersion: v1
kind: Secret
metadata:
  name: battle-platform-secret
  namespace: battle-platform
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-prod:3306/battle_platform?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
  SPRING_DATASOURCE_USERNAME: "battle_platform"
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME_PROD_DB_PASSWORD"
  SPRING_REDIS_HOST: "redis-prod"
  SPRING_REDIS_PASSWORD: "CHANGE_ME_PROD_REDIS_PASSWORD"
  INFLUXDB_URL: "http://influxdb-prod:8086"
  INFLUXDB_TOKEN: "CHANGE_ME_INFLUXDB_TOKEN"
  INFLUXDB_ORG: "battle-platform"
  INFLUXDB_BUCKET: "battle-events"
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_KEY"
