# ========================================
# Kubernetes Secret 配置
# 存储敏感配置数据（密码、密钥等）
# 注意：实际使用时请通过 Sealed Secrets 或 Vault 管理
# ========================================

apiVersion: v1
kind: Secret
metadata:
  name: data-transformer-secret
  labels:
    app: data-transformer
type: Opaque
stringData:
  # 数据库连接 - 请替换为实际值
  DATABASE_URL: "postgresql://user:password@postgres:5432/data_transformer"
  DATABASE_PASSWORD: "your-database-password"
  
  # Redis 连接 - 请替换为实际值
  REDIS_URL: "redis://:redis-password@redis:6379/0"
  REDIS_PASSWORD: "your-redis-password"
  
  # JWT 密钥 - 请替换为强随机字符串
  JWT_SECRET: "please-change-this-to-a-very-long-random-secret-key-at-least-32-characters"
  
  # API 密钥（可选）
  API_MASTER_KEY: "your-api-master-key"
  
  # 监控凭证（可选）
  METRICS_BASIC_AUTH: "user:password"
