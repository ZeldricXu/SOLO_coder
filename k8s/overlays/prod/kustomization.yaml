apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: battle-platform-prod

patches:
- target:
    kind: Deployment
    name: battle-platform
  patch: |
    - op: replace
      path: /spec/replicas
      value: 3
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: "prod"
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: "harbor.example.com/battle-platform/battle-platform:latest"
