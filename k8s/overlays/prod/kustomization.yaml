apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: log-analytics-prod
namePrefix: prod-

resources:
  - ../../base

patches:
  - path: replicas-patch.yaml
  - path: resources-patch.yaml
  - path: env-patch.yaml

images:
  - name: ghcr.io/log-analytics-platform/agent
    newTag: "1.0.0"
  - name: ghcr.io/log-analytics-platform/stream-pipeline
    newTag: "1.0.0"
  - name: ghcr.io/log-analytics-platform/pattern-detector
    newTag: "1.0.0"
  - name: ghcr.io/log-analytics-platform/metrics-aggregator
    newTag: "1.0.0"
  - name: ghcr.io/log-analytics-platform/storage-index
    newTag: "1.0.0"
  - name: ghcr.io/log-analytics-platform/api-server
    newTag: "1.0.0"

replicas:
  - name: stream-pipeline
    count: 4
  - name: pattern-detector
    count: 4
  - name: metrics-aggregator
    count: 3
  - name: api-server
    count: 3
  - name: storage-index
    count: 2
