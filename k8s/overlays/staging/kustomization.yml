apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: orchestration-staging

commonLabels:
  environment: staging

bases:
  - ../../base

patches:
  - path: deployment-patch.yml
  - path: ingress-patch.yml

replicas:
  - name: orchestration-app
    count: 2

images:
  - name: registry.cn-hangzhou.aliyuncs.com/orchestration/web
    newTag: develop
