---
# ============================================================
# SealedSecret / ExternalSecret (example of Secret keys needed).
#   Replace with Bitnami SealedSecret, Hashicorp Vault, or
#   your own secrets management solution.
#   kubectl create secret generic ... (for manual injection)
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: gameroom-secrets
  namespace: gaming
  labels:
    app: gameroom
type: Opaque
# Base64-encoded values (do NOT commit real secrets to Git!)
# Use:
#   echo -n "mongodb://user:pass@host:27017" | base64
stringData:
  MONGO_URI: "mongodb://gameroom:CHANGE_ME@mongo-0.mongo.gaming.svc.cluster.local:27017,mongo-1.mongo.gaming.svc.cluster.local:27017,mongo-2.mongo.gaming.svc.cluster.local:27017/gameroom?replicaSet=rs0&authSource=admin"
  REDIS_ADDR: "redis-master.gaming.svc.cluster.local:6379"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
