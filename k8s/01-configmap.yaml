---
# ============================================================
# ConfigMap: non-sensitive 12-factor env vars
#   Use `envsubst` or Kustomize to fill in placeholders
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: gameroom-config
  namespace: gaming
  labels:
    app: gameroom
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  TZ: "Asia/Shanghai"

  SERVER_PORT: "8080"
  SERVER_HTTP_ADDR: ":8080"
  SERVER_WS_ADDR: ":8081"
  SERVER_READ_TIMEOUT: "60"
  SERVER_WRITE_TIMEOUT: "60"

  MONGO_DATABASE: "gameroom"
  MONGO_POOL_SIZE: "200"

  REDIS_DB: "0"
  REDIS_POOL_SIZE: "200"

  # Game
  GAME_TURN_TIMEOUT: "15"
  GAME_READY_TIMEOUT: "60"
  GAME_AUTOPLAY_DELAY: "500"
  GAME_TRUSTEE_DELAY: "30"

  # Match
  MATCH_ELO_START: "50"
  MATCH_ELO_MAX: "500"
  MATCH_ELO_STEP: "50"
  MATCH_WAIT_STEP: "3000"
  MATCH_MAX_WAIT: "60000"
  MATCH_ROBOT_THRESHOLD: "20000"

  # Observer
  OBSERVER_DELAY: "5"
  OBSERVER_MAX: "200"
  OBSERVER_GIFT_ENABLED: "true"
  OBSERVER_DANMAKU_ENABLED: "true"
