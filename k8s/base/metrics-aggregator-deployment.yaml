apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-aggregator
  labels:
    app: metrics-aggregator
    app.kubernetes.io/component: metrics-aggregator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metrics-aggregator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: metrics-aggregator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: log-analytics-sa
      containers:
        - name: metrics-aggregator
          image: ghcr.io/log-analytics-platform/metrics-aggregator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9400
              protocol: TCP
          env:
            - name: LOGANALYTICS_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-bootstrap.kafka:9092"
            - name: LOGANALYTICS_TIMESCALE_URL
              value: "jdbc:postgresql://pg-cluster-rw.cnpg:5432/loganalytics"
            - name: LOGANALYTICS_TIMESCALE_USER
              value: "postgres"
            - name: LOGANALYTICS_TIMESCALE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: postgres-password
            - name: LOGANALYTICS_TIMESCALE_POOL_SIZE
              value: "4"
            - name: LOGANALYTICS_METRICS_CHUNK_TIME_INTERVAL
              value: "1 hour"
            - name: LOGANALYTICS_METRICS_BATCH_SIZE
              value: "1000"
            - name: LOGANALYTICS_METRICS_BATCH_FLUSH_INTERVAL_SECONDS
              value: "5"
            - name: LOGANALYTICS_METRICS_MAX_RETRY_ATTEMPTS
              value: "3"
            - name: LOGANALYTICS_METRICS_RAW_DATA_RETENTION_DAYS
              value: "7"
            - name: LOGANALYTICS_METRICS_ENABLE_CONTINUOUS_AGGREGATION
              value: "true"
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /app/config
          livenessProbe:
            httpGet:
              path: /health
              port: 9400
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9400
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: platform-config
