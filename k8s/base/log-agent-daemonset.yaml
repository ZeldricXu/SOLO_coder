apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
  labels:
    app: log-agent
    app.kubernetes.io/component: log-agent
spec:
  selector:
    matchLabels:
      app: log-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: log-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: log-analytics-sa
      hostPID: true
      hostNetwork: false
      containers:
        - name: log-agent
          image: ghcr.io/log-analytics-platform/agent:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true
          args:
            - "-s"
            - "default"
            - "-p"
            - "/var/log/containers/*.log,/var/log/pods/*.log"
            - "-k"
            - "kafka-bootstrap.kafka:9092"
          ports:
            - name: metrics
              containerPort: 9400
              protocol: TCP
          env:
            - name: LOGANALYTICS_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-bootstrap.kafka:9092"
            - name: LOGANALYTICS_AGENT_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LOGANALYTICS_AGENT_LOG_PATHS
              value: "/var/log/containers/*.log,/var/log/pods/*.log"
            - name: LOGANALYTICS_AGENT_OFFSET_STORE_PATH
              value: "/data/offsets"
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: agent-data
              mountPath: /data
            - name: config
              mountPath: /app/config
          livenessProbe:
            httpGet:
              path: /health
              port: 9400
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9400
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: agent-data
          hostPath:
            path: /var/lib/log-agent
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: platform-config
      tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
