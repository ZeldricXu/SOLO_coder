apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-analytics-sa
  labels:
    app: log-analytics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-analytics-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-analytics-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: log-analytics-role
subjects:
  - kind: ServiceAccount
    name: log-analytics-sa
    namespace: log-analytics
