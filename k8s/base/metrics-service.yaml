apiVersion: v1
kind: Service
metadata:
  name: stream-pipeline-metrics
  labels:
    app: stream-pipeline
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: stream-pipeline
  ports:
    - name: metrics
      port: 9400
      targetPort: 9400
      protocol: TCP
