metadata:
  name: error-logs
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 12
  replicas: 2
  config:
    retention.ms: 604800000
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: anomalies
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 12
  replicas: 2
  config:
    retention.ms: 604800000
---
apiVersion: kafka.strimzi.io/v1beta2
