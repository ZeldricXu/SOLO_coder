apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka
  namespace: kafka
  labels:
    app: log-analytics
spec:
  kafka:
    version: 3.7.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        configuration:
          useServiceDnsDomain: true
      - name: external
        port: 9094
        type: nodeport
        tls: false
    config:
      auto.create.topics.enable: false
      delete.topic.enable: true
      default.replication.factor: 2
      min.insync.replicas: 2
      num.partitions: 12
      log.retention.hours: 168
      log.retention.bytes: 536870912000
      log.segment.bytes: 1073741824
      message.max.bytes: 10485760
      offsets.topic.replication.factor: 2
      transaction.state.log.replication.factor: 2
      transaction.state.log.min.isr: 2
      group.initial.rebalance.delay.ms: 0
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 100Gi
          deleteClaim: false
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 8Gi
    template:
      pod:
        securityContext:
          fsGroup: 1000
          runAsUser: 1000
          runAsNonRoot: true
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: strimzi.io/name
                      operator: In
                      values:
                        - kafka-kafka
                topologyKey: kubernetes.io/hostname
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 20Gi
      deleteClaim: false
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    template:
      pod:
        securityContext:
          fsGroup: 1000
          runAsUser: 1000
          runAsNonRoot: true
  entityOperator:
    topicOperator: {}
    userOperator: {}
  cruiseControl: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: raw-logs
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 12
  replicas: 2
  config:
    retention.ms: 172800000
    segment.bytes: 1073741824
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: parsed-logs
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 12
  replicas: 2
  config:
    retention.ms: 86400000
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: enriched-logs
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 12
  replicas: 2
  config:
    retention.ms: 86400000
---
