apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flow-platform-uploads
  namespace: flow-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-platform
  namespace: flow-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: flow-platform
  template:
    metadata:
      labels:
        app: flow-platform
    spec:
      containers:
        - name: flow-platform
          image: ghcr.io/flowplatform/app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: flow-platform-config
            - secretRef:
                name: flow-platform-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: uploads
              mountPath: /data/flow-platform/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: flow-platform-uploads
