apiVersion: v1
kind: Secret
metadata:
  name: traffic-viz-secrets
  namespace: traffic-viz
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME_POSTGRES_PASSWORD"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
  INFLUXDB_TOKEN: "CHANGE_ME_INFLUXDB_TOKEN"
  KAFKA_SASL_USERNAME: "CHANGE_ME_KAFKA_SASL_USERNAME"
  KAFKA_SASL_PASSWORD: "CHANGE_ME_KAFKA_SASL_PASSWORD"
  SECRET_KEY: "CHANGE_ME_SECRET_KEY_AT_LEAST_32_CHARS"
  TILES_S3_ENDPOINT: "CHANGE_ME_S3_ENDPOINT"
  TILES_S3_ACCESS_KEY: "CHANGE_ME_S3_ACCESS_KEY"
  TILES_S3_SECRET_KEY: "CHANGE_ME_S3_SECRET_KEY"
  VAULT_TOKEN: "CHANGE_ME_VAULT_TOKEN"
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: traffic-viz
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: CHANGE_ME_DOCKER_CONFIG_BASE64
