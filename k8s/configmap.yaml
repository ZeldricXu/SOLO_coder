apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-viz-config
  namespace: traffic-viz
data:
  ENVIRONMENT: "prod"
  POSTGRES_HOST: "postgres-service.traffic-viz.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "traffic_viz"
  POSTGRES_POOL_SIZE: "20"
  POSTGRES_MAX_OVERFLOW: "40"
  POSTGRES_SSL_MODE: "require"
  REDIS_HOST: "redis-service.traffic-viz.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_SSL: "true"
  INFLUXDB_URL: "http://influxdb-service.traffic-viz.svc.cluster.local:8086"
  INFLUXDB_ORG: "traffic-org"
  INFLUXDB_BUCKET: "traffic-data"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service.traffic-viz.svc.cluster.local:9092"
  KAFKA_TRAFFIC_TOPIC: "traffic-stream"
  KAFKA_GROUP_ID: "traffic-viz-group"
  KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
  KAFKA_SASL_MECHANISM: "PLAIN"
  KAFKA_AUTO_OFFSET_RESET: "earliest"
  HDFS_HOST: "hdfs-namenode.traffic-viz.svc.cluster.local"
  HDFS_PORT: "9870"
  HDFS_USER: "hdfs"
  HDFS_BASE_PATH: "/traffic/data"
  CELERY_WORKER_CONCURRENCY: "8"
  CELERY_TASK_TIME_LIMIT: "7200"
  TILE_CACHE_DIR: "/app/data/tiles"
  HEATMAP_CACHE_DIR: "/app/data/cache"
  SAMPLE_DATA_DIR: "/app/data/sample"
  PREDICTION_MODEL_DIR: "/app/models"
  MAP_CENTER_LAT: "39.9042"
  MAP_CENTER_LON: "116.4074"
  MAP_DEFAULT_ZOOM: "14"
  TILE_ORIGIN_LON: "116.0"
  TILE_ORIGIN_LAT: "39.5"
  TILES_S3_BUCKET: "traffic-tiles"
  TILES_S3_REGION: "cn-north-1"
  TILES_S3_USE_PATH_STYLE: "true"
  VAULT_ENABLED: "true"
  VAULT_ADDR: "http://vault.traffic-viz.svc.cluster.local:8200"
  VAULT_SECRET_PATH: "secret/data/traffic-viz"
  LOG_LEVEL: "INFO"
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  PREDICTION_DEVICE: "cpu"
  CORS_ORIGINS: "https://traffic-viz.internal"
