apiVersion: v1
kind: ConfigMap
metadata:
  name: chaoslab-config
  namespace: chaoslab
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "warn"
  LOG_PRETTY: "false"
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
  HEALTH_CHECK_PATH: "/health"
  TRACING_ENABLED: "true"
  FEATURE_CHAOS_INJECTION: "true"
  FEATURE_AUDIT_LOG: "true"
  FEATURE_TRAFFIC_CONTROL: "true"
  FEATURE_DNS_PROXY: "true"
  FEATURE_MTLS_CERT: "true"
  FEATURE_EVENT_STORE: "true"
  FEATURE_IMAGE_DISTRIBUTION: "true"
  FEATURE_SIDECAR: "true"
  COMPRESSION_ENABLED: "true"
  COMPRESSION_THRESHOLD: "1024"
  BODY_PARSER_LIMIT: "10mb"
  TRUST_PROXY: "true"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "200"
  RATE_LIMIT_STANDARD_HEADERS: "true"
  RATE_LIMIT_LEGACY_HEADERS: "false"
  CORS_ORIGIN: "https://chaoslab.io,https://*.chaoslab.io"
  CORS_CREDENTIALS: "true"
  CORS_MAX_AGE: "86400"
  DB_POOL_MIN: "10"
  DB_POOL_MAX: "50"
  DB_TIMEOUT: "30000"
  DB_SSL: "true"
  REDIS_POOL_MIN: "10"
  REDIS_POOL_MAX: "50"
  REDIS_CLUSTER: "false"
  JWT_EXPIRES_IN: "15m"
  BCRYPT_ROUNDS: "14"
