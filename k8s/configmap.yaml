apiVersion: v1
kind: ConfigMap
metadata:
  name: battle-platform-config
  namespace: battle-platform
data:
  application-prod.yml: |
    server:
      port: 8080
    spring:
      profiles:
        active: prod
      datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
        hikari:
          maximum-pool-size: 50
          minimum-idle: 20
          connection-timeout: 30000
      jpa:
        hibernate:
          ddl-auto: validate
      data:
        redis:
          host: ${SPRING_REDIS_HOST}
          port: 6379
          password: ${SPRING_REDIS_PASSWORD}
    netty:
      server:
        port: 9090
        boss-threads: 4
        worker-threads: 16
    battle:
      matching:
        tick-interval-ms: 200
        max-wait-time-ms: 120000
        rating-bracket-size: 200
      battlefield:
        max-players: 200
        aoi-grid-size: 50
        aoi-optimization-enabled: true
      leaderboard:
        snapshot-interval-cron: "0 */30 * * * *"
      anticheat:
        enabled: true
    influxdb:
      url: ${INFLUXDB_URL}
      token: ${INFLUXDB_TOKEN}
      org: ${INFLUXDB_ORG}
      bucket: ${INFLUXDB_BUCKET}
    logging:
      level:
        root: INFO
        com.battle.platform: INFO
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
