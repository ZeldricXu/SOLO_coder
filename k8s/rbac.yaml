apiVersion: v1
kind: ServiceAccount
metadata:
  name: battle-platform
  namespace: battle-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: battle-platform
  namespace: battle-platform
rules:
- apiGroups: [""]
  resources: ["endpoints", "pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: battle-platform
  namespace: battle-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: battle-platform
subjects:
- kind: ServiceAccount
  name: battle-platform
