apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaoslab
  namespace: chaoslab
  annotations:
    iam.gke.io/gcp-service-account: chaoslab@your-project.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaoslab
  namespace: chaoslab
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaoslab
  namespace: chaoslab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaoslab
subjects:
  - kind: ServiceAccount
    name: chaoslab
    namespace: chaoslab
