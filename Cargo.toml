[workspace]
resolver = "2"
members = [
    "crates/physics-math",
    "crates/physics-core",
    "crates/physics-spatial",
    "crates/physics-collision",
    "crates/physics-dynamics",
    "crates/physics-constraints",
    "crates/physics-particles",
    "crates/physics-events",
    "crates/physics-serialization",
    "crates/physics-debug-render",
    "crates/physics-engine",
    "crates/physics-benches",
]

[workspace.dependencies]
nalgebra = { version = "0.32", features = ["serde"] }
approx = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
slotmap = "1.0"
rand = "0.8"
egui = "0.24"
eframe = { version = "0.24", features = ["persistence"] }
epaint = "0.24"
emath = "0.24"
ecolor = "0.24"
criterion = "0.5"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
