[workspace]
members = [
    "crates/git-diff-core",
    "crates/review-diff",
    "crates/review-data-access",
    ".",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
regex = "1.10"

[package]
name = "code_review_platform"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-session = "0.9"
actix-redis = "0.12"
actix-cors = "0.7"
actix-web-lab = "0.20"
maud = "0.25"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
redis = { version = "0.24", features = ["tokio-comp", "tokio-native-tls-comp", "streams"] }
rust-s3 = { version = "0.34", features = ["tokio-native-tls"] }
reqwest = { version = "0.11", features = ["json", "stream", "multipart", "gzip"] }
async-trait = "0.1"
oauth2 = { version = "4.4", features = ["reqwest"] }
config = { version = "0.14", features = ["yaml"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
serde_qs = "0.12"
chrono = { workspace = true }
argon2 = "0.5"
jsonwebtoken = "8.0"
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio-cron-scheduler = { version = "0.9", features = ["signal"] }
tokio = { version = "1.0", features = ["full"] }
uuid = { workspace = true }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "serde"] }
urlencoding = "2.1"
regex = { workspace = true }
lazy_static = "1.4"
futures = "0.3"
bytes = "1.5"
mime = "0.3"
mime_guess = "2.0"
percent-encoding = "2.3"
ring = "0.17"
base64 = "0.21"
dotenvy = "0.15"
git-diff-core = { path = "crates/git-diff-core" }
review-diff = { path = "crates/review-diff" }
review-data-access = { path = "crates/review-data-access" }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
