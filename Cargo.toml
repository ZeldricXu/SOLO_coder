[package]
name = "realtime-collab-engine"
version = "0.1.0"
edition = "2021"
authors = ["Collab Engine Team"]
description = "Real-time collaborative editing engine with CRDT (YATA algorithm)"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.21"
tungstenite = "0.21"
axum = { version = "0.7", features = ["ws", "query", "json", "matched-path", "original-uri", "tower-log", "tracing"] }
axum-extra = { version = "0.9", features = ["typed-header", "cookie"] }
tower-http = { version = "0.5", features = ["cors", "trace", "set-header", "request-id", "limit"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = "0.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.4"
bytes = "1.5"

sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "macros"] }
redis = { version = "0.25", features = ["tokio-comp", "aio", "streams"] }
bb8 = "0.8"
bb8-redis = "0.15"

jsonwebtoken = { version = "9.2", features = ["use_pem"] }
rand = "0.8"
uuid = { version = "1.6", features = ["v4", "serde", "v7"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
hmac = "0.12"
sha2 = "0.10"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.23"

futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"

parking_lot = "0.12"
dashmap = "6.0"
crossbeam = "0.8"

metrics = "0.22"
metrics-exporter-prometheus = "0.14"
metrics-util = { version = "0.17", features = ["layers", "registry"] }

rust-s3 = { version = "0.34", default-features = false, features = ["tokio-rustls-tls"] }
tokio-util = { version = "0.7", features = ["codec", "io", "rt"] }
base64 = "0.22"
bincode = "1.3"
sysinfo = "0.30"
flate2 = "1.0"
num_cpus = "1.16"

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"
proptest = "1.4"
tempfile = "3.9"

[[bin]]
name = "collab-engine"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
overflow-checks = false

[profile.dev]
opt-level = 1
