[package]
name = "edge-scheduler"
version = "0.1.0"
edition = "2021"
description = "EdgeScheduler - 边缘计算调度平台"
authors = ["EdgeScheduler Team"]
license = "MIT"
repository = "https://github.com/edgescheduler/edge-scheduler"
readme = "README.md"
keywords = ["edge-computing", "scheduler", "iot"]
categories = ["network-programming", "web-programming::http-server"]

[features]
default = ["std", "full"]
std = []
full = [
    "device-shadow",
    "rule-engine",
    "inference-scheduler",
    "device-lifecycle",
    "data-aggregation",
    "offline-cache",
    "ota-upgrade",
    "protocol-adapter",
    "telemetry",
    "redis",
    "postgres",
]
device-shadow = []
rule-engine = []
inference-scheduler = []
device-lifecycle = []
data-aggregation = []
offline-cache = []
ota-upgrade = []
protocol-adapter = []
telemetry = ["opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk"]
redis = ["dep:redis", "bb8-redis"]
postgres = ["sqlx"]
jemalloc = ["tikv-jemallocator"]
mimalloc = ["mimalloc"]
tls = ["reqwest/default-tls"]
rustls = ["reqwest/rustls-tls"]

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid"], optional = true }
redis = { version = "0.24", features = ["aio", "tokio-comp", "connection-manager"], optional = true }
bb8 = "0.8"
bb8-redis = { version = "0.14", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.22", optional = true }
opentelemetry-otlp = { version = "0.15", optional = true }
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"], optional = true }
chrono = { version = "0.4", features = ["serde", "utc"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"], default-features = false }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
dashmap = "6.0"
once_cell = "1.19"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
regex = "1.10"
lazy_static = "1.4"
bytes = "1.5"
http = "1.0"
http-body-util = "0.1"
mime = "0.3"
multimap = "0.10"
lru = "0.12"
figment = { version = "0.10", features = ["env", "toml", "yaml"] }
dotenvy = "0.15"
tikv-jemallocator = { version = "0.5", optional = true }
mimalloc = { version = "0.1", optional = true }
tower-http = { version = "0.5", features = ["compression", "cors", "trace", "timeout", "rate-limit"] }
utoipa = { version = "4.0", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "4.0", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"
proptest = "1.4"
criterion = "0.5"

[build-dependencies]
vergen = { version = "0.3", features = ["build", "git", "cargo"] }

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = true
codegen-units = 256

[profile.test]
opt-level = 1
debug = 2
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = true
codegen-units = 128

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1
strip = "symbols"

[profile.production]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[[bin]]
name = "edge-scheduler"
path = "src/main.rs"

[[bench]]
name = "scheduler_bench"
path = "benches/scheduler.rs"
harness = false
