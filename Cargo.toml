[package]
name = "apishield"
version = "0.1.0"
edition = "2021"
description = "APIShield - API安全网关与攻击检测系统"
authors = ["APIShield Team"]
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["http1", "http2"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.23"
opentelemetry = "0.23"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.4", features = ["derive"] }
tower = { version = "0.4", features = ["util", "timeout"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression"] }
futures = "0.3"
rand = "0.8"
rand_chacha = "0.3"
regex = "1.10"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.21"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
once_cell = "1.19"
dashmap = "5.5"
parking_lot = "0.12"
arc-swap = "1.6"
hashbrown = "0.14"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
