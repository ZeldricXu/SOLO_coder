[package]
name = "gitflow-cli"
version = "0.1.0"
edition = "2021"
description = "Git工作流自动化CLI工具"
license = "MIT"

[[bin]]
name = "gitflow"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive", "cargo", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
git2 = { version = "0.18", default-features = false, features = ["vendored-libgit2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
dialoguer = "0.11"
colored = "2.0"
indicatif = "0.17"
url = "2.5"
semver = "1.0"
walkdir = "2.4"
humansize = "2.1"
webbrowser = "0.8"
async-trait = "0.1"
paste = "1.0"

[dev-dependencies]
tempfile = "3.9"
assert_cmd = "2.0"
predicates = "3.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
