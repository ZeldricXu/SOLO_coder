[workspace]
resolver = "2"
members = [
    "backend/common",
    "backend/models",
    "backend/auction-engine",
    "backend/bid-arbitrator",
    "backend/account-service",
    "backend/notification-service",
    "backend/risk-control",
    "backend/fulfillment",
    "backend/api",
    "shared",
    "frontend",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
actix-web = "4.4"
actix-cors = "0.7"
actix-files = "0.6"
tokio = { version = "1.35", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["serde", "v4"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = { version = "0.13", features = ["toml"] }
dotenvy = "0.15"

sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "rust_decimal",
    "migrate",
] }
rust_decimal = { version = "1.34", features = ["serde", "db-postgres"] }
rust_decimal_macros = "1.34"

redis = { version = "0.24", features = ["tokio-comp", "r2d2"] }
redlock = "2.0"
mongodb = { version = "2.8", features = ["bson-uuid-1"] }
bson = { version = "2.10", features = ["chrono-0_4", "uuid-1"] }

argon2 = "0.5"
rand = "0.8"
jsonwebtoken = "9.2"

reqwest = { version = "0.11", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
futures-util = "0.3"
base64 = "0.21"
image = "0.24"
multer = { version = "3.0", features = ["tokio-io"] }
tempfile = "3.9"

parking_lot = "0.12"
dashmap = "5.5"
async-stream = "0.3"
async-trait = "0.1"

shared = { path = "./shared" }
common = { path = "./backend/common" }
models = { path = "./backend/models" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.frontend-release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
inherits = "release"
