[package]
name = "tech_efficiency_platform"
version = "0.1.0"
edition = "2021"
authors = ["Platform Engineering Team"]
description = "Enterprise-grade technical efficiency platform with configuration versioning, scaffolding, monitoring, and more."
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["http1", "http2"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.23"
opentelemetry = "0.23"
opentelemetry-otlp = "0.16"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
redis = { version = "0.24", features = ["tokio-comp", "r2d2"] }
bb8 = "0.8"
bb8-redis = "0.14"
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.4", features = ["derive"] }
dialoguer = "0.11"
tera = "1.19"
walkdir = "2.4"
semver = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tower = { version = "0.4", features = ["util", "timeout"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression"] }
futures = "0.3"
itertools = "0.12"
indexmap = { version = "2.2", features = ["serde"] }
rand = "0.8"
regex = "1.10"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
