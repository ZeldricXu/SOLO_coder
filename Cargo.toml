[workspace]
members = [
    "mesh-generator",
    "navier-stokes-solver",
    "boundary-condition",
    "turbulence-model",
    "linear-system-solver",
    "result-vtk-export",
    "timestep-controller",
    "field-interpolator",
    "cfd-solver",
    "cfd-config",
]
resolver = "2"

[workspace.dependencies]
nalgebra = "0.32"
rayon = "1.8"
num-traits = "0.2"
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
criterion = "0.5"
