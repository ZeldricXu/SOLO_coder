[package]
name = "marknote"
version = "0.1.0"
edition = "2021"
description = "A lightweight cross-platform Markdown note-taking app built with Rust and egui"
authors = ["MarkNote"]

[dependencies]
eframe = "0.28"
egui = "0.28"
egui_extras = "0.28"
pulldown-cmark = "0.11"
tantivy = "0.22"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
similar = "2"
docx-rs = "0.4"
arboard = "3"
walkdir = "2"
notify = "6"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
image = "0.25"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
regex = "1"
rand = "0.8"
anyhow = "1"
webbrowser = "1"
rfd = "0.14"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
reqwest = { version = "0.12", features = ["json", "blocking"] }
dirs = "5"
tempfile = "3"

[profile.release]
opt-level = 2
lto = true
strip = true
