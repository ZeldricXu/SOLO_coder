[package]
name = "llm-gateway"
version = "0.1.0"
edition = "2021"
description = "Enterprise-grade LLM Gateway with document parsing, inference routing, feature store, and GPU scheduling"

[lib]
name = "llm_gateway"
path = "src/lib.rs"

[[bin]]
name = "llm-gateway"
path = "src/main.rs"

[dependencies]
actix-web = "4.4"
actix-rt = "2.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
redis = { version = "0.24", features = ["tokio-comp", "aio"] }
bb8 = "0.8"
bb8-redis = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.22"
opentelemetry = { version = "0.22", features = ["rt-tokio"] }
opentelemetry-otlp = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream", "gzip"] }
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
dashmap = "5.5"
rand = "0.8"
rand_distr = "0.4"
indicatif = "0.17"
clap = { version = "4.4", features = ["derive"] }
regex = "1.10"
base64 = "0.21"
sha2 = "0.10"
percent-encoding = "2.3"
tokio-util = { version = "0.7", features = ["codec", "io"] }
bytes = "1.5"
once_cell = "1.19"
derive_more = "0.99"
itertools = "0.12"
rayon = "1.8"
statrs = "0.16"
num_cpus = "1.16"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.9"
assert-json-diff = "2.0"
proptest = "1.4"
