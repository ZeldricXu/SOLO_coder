[package]
name = "logforge"
version = "0.1.0"
edition = "2021"
description = "High-performance log aggregation engine"

[[bin]]
name = "logforge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
urlencoding = "2"
hmac = "0.12"
sha2 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
config = { version = "0.14", features = ["toml"] }

# File watching & tailing
notify = "6"
notify-debouncer-mini = "0.4"
glob = "0.3"
num_cpus = "1.16"

# Parsing
nom = "7"
regex = "1"
regex-syntax = "0.8"
lazy-regex = "3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Ring buffer / Channels
crossbeam = "0.8"
parking_lot = "0.12"

# t-digest for quantiles
ordered-float = "4"

# HTTP
axum = "0.7"
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }

# Kafka
rdkafka = { version = "0.36", features = ["cmake-build", "ssl"] }

# ClickHouse
clickhouse-rs = "1"

# MinIO / S3
aws-sdk-s3 = "1"
aws-config = "1"
aws-sdk-sns = "1"

# Parquet
parquet = { version = "51", features = ["async"] }
arrow = "51"
arrow-schema = "51"
arrow-array = "51"

# TUI Dashboard
crossterm = "0.27"
tui = { version = "0.19", default-features = false, features = ["crossterm"] }

# Metrics
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Signal handling
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }

# Random
rand = "0.8"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
