[workspace]
members = [
    "common",
    "log-agent",
    "stream-processing",
    "anomaly-detection",
    "timeseries-store",
    "query-api",
    "alert-manager",
    "log-pattern-mining",
    "service-topology",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
common = { path = "common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "=0.4.34", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
regex = "1.0"
glob = "0.3"
memmap2 = "0.9"
datafusion = "36.0"
arrow = "50.0"
parquet = "50.0"
reqwest = { version = "0.11", features = ["json"] }
warp = "0.3"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "chrono"] }
rand = "0.8"
ordered-float = "4.0"
