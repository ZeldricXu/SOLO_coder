[workspace]
resolver = "2"
members = [
    "crates/collab-crdt",
    "crates/collab-auth",
    "crates/collab-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Collab Engine Team"]

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde", "v7"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "1.0"
tracing = "0.1"
futures = "0.3"
parking_lot = "0.12"
dashmap = "6.0"

redis = { version = "0.25", features = ["tokio-comp", "aio", "streams"] }
bb8 = "0.8"
bb8-redis = "0.15"

sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "macros"] }
jsonwebtoken = { version = "9.2", features = ["use_pem"] }
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
