syntax = "proto3";

package com.enterprise.risk.common.event;

option java_package = "com.enterprise.risk.common.event";
option java_multiple_files = true;

message RiskEventProto {
  string event_id = 1;
  string event_type = 2;
  string business_line = 3;
  int64 timestamp = 4;
  string entity_id = 5;
  string entity_type = 6;
  string source = 7;
  string session_id = 8;
  string ip = 9;
  string user_id = 10;
  map<string, string> attributes_str = 11;
  map<string, int64> attributes_long = 12;
  map<string, double> attributes_double = 13;
  map<string, bool> attributes_bool = 14;
}

message EventBatch {
  repeated RiskEventProto events = 1;
  string batch_id = 2;
  int64 received_at = 3;
}

message DeadLetterEvent {
  RiskEventProto event = 1;
  string reason = 2;
  string error_code = 3;
  int64 failed_at = 4;
  int32 retry_count = 5;
}
