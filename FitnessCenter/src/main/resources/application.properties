server.port=8080
spring.application.name=FitnessCenter

spring.datasource.url=jdbc:h2:mem:fitnessdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0
spring.redis.timeout=5000ms

fitness.lock.timeout.vip=10000
fitness.lock.timeout.regular=30000
fitness.lock.timeout.platinum=5000

fitness.reminder.active.threshold=3
fitness.reminder.active.frequency-days=7
fitness.reminder.inactive.frequency-days=2
fitness.reminder.super-active.threshold=10
fitness.reminder.super-active.frequency-days=14

fitness.course.types.yoga.enabled=true
fitness.course.types.yoga.description=瑜伽课程 - 柔韧性练习
fitness.course.types.hiit.enabled=true
fitness.course.types.hiit.description=高强度间歇训练
fitness.course.types.strength.enabled=true
fitness.course.types.strength.description=力量训练课程
fitness.course.types.cardio.enabled=true
fitness.course.types.cardio.description=有氧训练课程
fitness.course.types.pilates.enabled=true
fitness.course.types.pilates.description=普拉提课程
fitness.course.types.zumba.enabled=true
fitness.course.types.zumba.description=尊巴舞蹈课程
fitness.course.types.spinning.enabled=true
fitness.course.types.spinning.description=动感单车课程
fitness.course.types.swimming.enabled=true
fitness.course.types.swimming.description=游泳课程

fitness.plan.queue.name=fitness:plan:queue
fitness.plan.processing.queue.name=fitness:plan:processing
fitness.plan.max-retry=3
fitness.plan.retry-delay=100
fitness.plan.worker-interval=1000
