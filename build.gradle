plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.0.18' apply false
}

allprojects {
    group = 'com.loganalytics'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencies {
        implementation 'org.slf4j:slf4j-api:2.0.13'
        implementation 'ch.qos.logback:logback-classic:1.5.6'
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.1'

        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
        testImplementation 'org.mockito:mockito-core:5.12.0'
        testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
        testImplementation 'org.assertj:assertj-core:3.26.0'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'PASSED', 'SKIPPED', 'FAILED'
        }
    }

    apply plugin: 'checkstyle'
    apply plugin: 'com.github.spotbugs'

    checkstyle {
        toolVersion = '10.17.0'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        maxWarnings = 0
    }

    spotbugs {
        toolVersion = '4.8.6.4'
        excludeFilter = rootProject.file('config/spotbugs/spotbugs-exclude.xml')
    }

    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        reports {
            xml.required = true
            html.required = true
        }
    }

    afterEvaluate { proj ->
        if (proj.plugins.hasPlugin('application') && proj.name != 'api-server') {
            proj.jar {
                manifest {
                    attributes 'Main-Class': proj.extensions.application.mainClass.get()
                }
                duplicatesStrategy = DuplicatesStrategy.EXCLUDE
                from {
                    proj.configurations.runtimeClasspath.collect { dep -> dep.isDirectory() ? dep : zipTree(dep) }
                }
            }
        }
    }
}
