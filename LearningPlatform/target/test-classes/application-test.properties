spring.datasource.url=jdbc:h2:mem:learning_platform_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.cache.type=simple

learning.certificate.secret=TEST_SECRET_KEY_FOR_UNIT_TESTING_2024

learning.backup.activity.high.threshold=10
learning.backup.activity.medium.threshold=5
learning.backup.activity.low.threshold=1
learning.backup.frequency.high.interval-minutes=1
learning.backup.frequency.medium.interval-minutes=5
learning.backup.frequency.low.interval-minutes=30
learning.backup.activity.window-minutes=60
learning.backup.cleanup.days-to-keep=30

learning.certificate.algorithm.completion=HMAC-SHA256
learning.certificate.algorithm.achievement=HMAC-SHA256
learning.certificate.algorithm.excellence=HMAC-SHA512
learning.certificate.algorithm.professional=HMAC-SHA512
learning.certificate.validity-years.completion=3
learning.certificate.validity-years.achievement=3
learning.certificate.validity-years.excellence=5
learning.certificate.validity-years.professional=10

learning.review.queue.name=review_task_queue
learning.review.worker.enabled=false
learning.review.worker.poll-interval-ms=1000
learning.review.max-retry-attempts=3
learning.review.retry-delay-ms=1000

learning.course.types.default.enabled=true
learning.course.types.default.code=default
learning.course.types.default.name=通用课程
learning.course.types.default.description=通用学习课程类型
learning.course.types.default.priority=0
learning.course.types.default.requires-certificate=false

learning.course.types.technical.enabled=true
learning.course.types.technical.code=technical
learning.course.types.technical.name=技术课程
learning.course.types.technical.description=技术学习课程类型
learning.course.types.technical.priority=1
learning.course.types.technical.requires-certificate=true

learning.course.types.certification.enabled=true
learning.course.types.certification.code=certification
learning.course.types.certification.name=认证课程
learning.course.types.certification.description=职业认证课程类型
learning.course.types.certification.priority=2
learning.course.types.certification.requires-certificate=true
