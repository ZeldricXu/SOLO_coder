spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cicd_platform
    username: cicd
    password: cicd123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

grpc:
  server:
    port: 50051

influxdb:
  url: http://localhost:8086
  token: dev-token
  org: cicd
  bucket: cicd_metrics

security:
  jwt:
    secret: dev-secret-key-for-jwt-token-not-for-production
    expiration: 86400000

logging:
  level:
    com.cicd: DEBUG
    org.springframework.security: DEBUG

flyway:
  enabled: false

artifact:
  retention:
    days-retain-all: 7
    days-retain-latest: 30
    latest-count: 5
