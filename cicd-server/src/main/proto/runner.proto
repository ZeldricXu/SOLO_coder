syntax = "proto3";

package com.cicd.grpc;

option java_multiple_files = true;
option java_package = "com.cicd.grpc";
option java_outer_classname = "RunnerProto";

message RegisterRunnerRequest {
    string name = 1;
    string token = 2;
    string hostname = 3;
    string ip_address = 4;
    string os = 5;
    string architecture = 6;
    int32 cpu_cores = 7;
    int32 memory_mb = 8;
    repeated string tags = 9;
    string version = 10;
}

message RegisterRunnerResponse {
    bool success = 1;
    int64 runner_id = 2;
    string error_message = 3;
}

message HeartbeatRequest {
    int64 runner_id = 1;
}

message HeartbeatResponse {
    bool success = 1;
    int64 timestamp = 2;
}

message DockerConfig {
    string image = 1;
    repeated string commands = 2;
    map<string, string> environment = 3;
    repeated string volumes = 4;
    string working_dir = 5;
    bool privileged = 6;
}

message KubectlConfig {
    string kubeconfig = 1;
    string namespace = 2;
    repeated string commands = 3;
}

message DeployConfig {
    string environment = 1;
    string strategy = 2;
    string service_name = 3;
    string image = 4;
    string namespace = 5;
    int32 replicas = 6;
    int32 canary_traffic_percent = 7;
}

message PushConfig {
    string registry = 1;
    string image = 2;
    string tag = 3;
    string username = 4;
    string password = 5;
}

message WebhookConfig {
    string url = 1;
    string method = 2;
    map<string, string> headers = 3;
    string body = 4;
}

message PipelineStep {
    int64 id = 1;
    string name = 2;
    string type = 3;
    string run = 4;
    string script = 5;
    DockerConfig docker = 6;
    PushConfig push = 7;
    DeployConfig deploy = 8;
    KubectlConfig kubectl = 9;
    WebhookConfig webhook = 10;
    int32 timeout_seconds = 11;
    bool continue_on_error = 12;
}

message PipelineJob {
    int64 id = 1;
    string name = 2;
    int64 stage_id = 3;
    int64 execution_id = 4;
    int64 pipeline_id = 5;
    int64 project_id = 6;
    repeated PipelineStep steps = 7;
    map<string, string> environment = 8;
    int32 timeout_seconds = 9;
    string git_url = 10;
    string branch = 11;
    string commit_sha = 12;
    string working_dir = 13;
    string job_token = 14;
}

message JobAssignment {
    int64 runner_id = 1;
    PipelineJob job = 2;
    int64 timestamp = 3;
    string job_token = 4;
}

message StepStatus {
    int64 runner_id = 1;
    int64 job_id = 2;
    int64 step_id = 3;
    string status = 4;
    string log_line = 5;
    int32 exit_code = 6;
    bool is_job_complete = 7;
    bool success = 8;
    string output = 9;
    int64 timestamp = 10;
    string job_token = 11;
    int32 step_index = 12;
    int32 log_offset = 13;
}

message ReportProgressRequest {
    string job_token = 1;
    int64 job_id = 2;
    int32 step_index = 3;
    string step_name = 4;
    string step_status = 5;
    string log_increment = 6;
    int64 timestamp = 7;
    int32 exit_code = 8;
    string error_message = 9;
}

message ReportProgressResponse {
    bool accepted = 1;
    string error_message = 2;
    bool server_recovered = 3;
    string last_known_status = 4;
    int64 last_known_step_index = 5;
}

message QueryJobStateRequest {
    string job_token = 1;
    int64 job_id = 2;
}

message QueryJobStateResponse {
    bool found = 1;
    string job_status = 2;
    int32 last_completed_step = 3;
    string last_step_status = 4;
    int64 last_event_timestamp = 5;
    bool needs_resend = 6;
}

service RunnerService {
    rpc RegisterRunner(RegisterRunnerRequest) returns (RegisterRunnerResponse);
    rpc SendHeartbeat(HeartbeatRequest) returns (HeartbeatResponse);
    rpc StreamJobUpdates(stream StepStatus) returns (stream JobAssignment);
    rpc ReportProgress(ReportProgressRequest) returns (ReportProgressResponse);
    rpc QueryJobState(QueryJobStateRequest) returns (QueryJobStateResponse);
}
