spring:
  application:
    name: library-mgmt-test
  datasource:
    url: jdbc:h2:mem:librarydb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

library:
  borrow:
    default-days: 15
  reader:
    default-borrow-limit: 5

logging:
  level:
    root: ERROR
    com.library: DEBUG
