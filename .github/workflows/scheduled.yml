name: Scheduled Jobs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  dependency-scan:
    name: Daily Dependency Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run OWASP Dependency Check
        run: |
          mvn dependency-check:check -B
        timeout-minutes: 30
        continue-on-error: true

      - name: Generate dependency graph
        run: |
          mvn dependency:tree -DoutputType=dot -DoutputFile=dependency-graph.txt

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-results
          path: |
            **/target/dependency-check-report.html
            dependency-graph.txt

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          timeout: '15m'

  performance-test:
    name: Nightly Performance Test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.repository == 'monitoring/monitoring-platform'
    environment:
      name: staging

    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: monitoring
          MYSQL_USER: monitoring
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u root -ppassword"
          --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7.2.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build application
        run: |
          mvn clean package -DskipTests -B

      - name: Start application
        run: |
          java -jar bootstrap/target/*.jar --spring.profiles.active=test &
          APP_PID=$!
          echo $APP_PID > app.pid
          sleep 60
          curl -f http://localhost:8080/actuator/health || (cat logs/monitoring.log && exit 1)

      - name: Run load tests
        run: |
          echo "Running load tests..."
          for i in {1..100}; do
            curl -s -w "%{http_code}" -X POST http://localhost:8080/api/v1/resources \
              -H "Content-Type: application/json" \
              -d '{"type":"test","config":{"value":'$i'}'
            echo ""
          done

      - name: Collect performance metrics
        run: |
          curl -s http://localhost:8080/actuator/metrics | jq '.names[]' | head -20

      - name: Stop application
        if: always()
        run: |
          kill $(cat app.pid) 2>/dev/null || true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-logs
          path: logs/
