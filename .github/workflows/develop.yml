name: Develop Branch CI

on:
  push:
    branches: [ develop ]

concurrency:
  group: develop-${{ github.sha }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build-and-test:
    name: Build & Test (Develop)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Run build with tests
        run: ./mvnw clean test -B -Pdev
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: develop-test-results
          path: target/surefire-reports/
          retention-days: 7

  nightly-build:
    name: Nightly Build & Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'schedule'
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Build package
        run: ./mvnw clean package -DskipTests -B -Pskip-quality

      - name: Build Docker image for staging
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Staging
        uses: WyriHaximus/github-action-helm3@v3
        with:
          exec: |
            helm upgrade nft-indexer ./helm/nft-indexer \
              --install \
              --namespace staging \
              --set image.tag=staging \
              --values ./helm/nft-indexer/values-staging.yaml
          kubeconfig: '${{ secrets.STAGING_KUBECONFIG }}'
