name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      
      - name: Run cargo test
        run: cargo test --all --verbose
      
      - name: Run cargo fmt check
        run: cargo fmt --all -- --check
      
      - name: Run cargo clippy
        run: cargo clippy --all -- -D warnings

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: marknote-linux
            binary_name: marknote
          - os: windows-latest
            artifact_name: marknote-windows
            binary_name: marknote.exe
          - os: macos-latest
            artifact_name: marknote-macos
            binary_name: marknote
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      
      - name: Build release
        run: cargo build --release --verbose
      
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/release/${{ matrix.binary_name }}

  package:
    name: Package (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            package_type: appimage
          - os: windows-latest
            package_type: zip
          - os: macos-latest
            package_type: dmg
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: marknote-${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'windows-latest' && 'windows' || 'macos' }}
          path: ./dist
      
      - name: Make binary executable (Unix)
        if: matrix.os != 'windows-latest'
        run: chmod +x ./dist/marknote
      
      - name: Package for Linux (AppImage)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          
          # Create AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          cp ./dist/marknote AppDir/usr/bin/
          
          # Create .desktop file
          cat > AppDir/usr/share/applications/marknote.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=MarkNote
          Comment=A lightweight cross-platform Markdown note-taking app
          Exec=marknote
          Icon=marknote
          Categories=Office;Utility;
          EOF
          
          # Create icon placeholder
          convert -size 256x256 xc:#6366f1 AppDir/usr/share/icons/hicolor/256x256/apps/marknote.png || true
          
          # Download linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          
          # Create AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          
          mkdir -p release
          mv MarkNote*.AppImage release/MarkNote-x86_64.AppImage
      
      - name: Package for Windows (Portable ZIP)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p release
          
          # Create install script for context menu
          @'
          @echo off
          echo Adding MarkNote to context menu...
          reg add "HKCR\*\shell\Open with MarkNote" /ve /d "Open with MarkNote" /f
          reg add "HKCR\*\shell\Open with MarkNote\command" /ve /d "\"%~dp0marknote.exe\" \"%%1\"" /f
          echo Done!
          '@ | Out-File -FilePath install-context-menu.bat -Encoding ASCII
          
          # Create uninstall script
          @'
          @echo off
          echo Removing MarkNote from context menu...
          reg delete "HKCR\*\shell\Open with MarkNote" /f
          echo Done!
          '@ | Out-File -FilePath uninstall-context-menu.bat -Encoding ASCII
          
          Compress-Archive -Path ./dist/marknote.exe, install-context-menu.bat, uninstall-context-menu.bat -DestinationPath release/MarkNote-windows-x64.zip
      
      - name: Package for macOS (DMG)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p release
          
          # Create .app bundle
          mkdir -p MarkNote.app/Contents/MacOS
          mkdir -p MarkNote.app/Contents/Resources
          
          cp ./dist/marknote MarkNote.app/Contents/MacOS/
          
          # Create Info.plist
          cat > MarkNote.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>marknote</string>
              <key>CFBundleIdentifier</key>
              <string>com.marknote.app</string>
              <key>CFBundleName</key>
              <string>MarkNote</string>
              <key>CFBundleDisplayName</key>
              <string>MarkNote</string>
              <key>CFBundleVersion</key>
              <string>0.1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>0.1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSRequiresAquaSystemAppearance</key>
              <false/>
          </dict>
          </plist>
          EOF
          
          # Create DMG using hdiutil
          mkdir -p dmg-root
          mv MarkNote.app dmg-root/
          ln -s /Applications dmg-root/Applications
          
          hdiutil create -volname "MarkNote" -srcfolder dmg-root -ov -format UDZO release/MarkNote-macOS-universal.dmg
      
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: release/
