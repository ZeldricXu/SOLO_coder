name: CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn checkstyle:check spotbugs:check -B

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: cicd
          POSTGRES_PASSWORD: cicd123
          POSTGRES_DB: cicd_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn verify -B -Dspring.profiles.active=test

  build:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn package -DskipTests -B
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.server
          push: true
          tags: ghcr.io/${{ github.repository }}/cicd-server:${{ github.sha }},ghcr.io/${{ github.repository }}/cicd-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.runner
          push: true
          tags: ghcr.io/${{ github.repository }}/cicd-runner:${{ github.sha }},ghcr.io/${{ github.repository }}/cicd-runner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v3
        with:
          version: "latest"
      - uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
      - run: |
          kubectl set image deployment/cicd-server cicd-server=ghcr.io/${{ github.repository }}/cicd-server:${{ github.sha }} -n cicd
          kubectl set image daemonset/cicd-runner cicd-runner=ghcr.io/${{ github.repository }}/cicd-runner:${{ github.sha }} -n cicd
      - run: |
          kubectl rollout status deployment/cicd-server -n cicd --timeout=300s
          kubectl rollout status daemonset/cicd-runner -n cicd --timeout=300s
