name: CDN System CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Dependency check
        run: cargo deny check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cdn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cdn_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features postgres
      - name: Run migrations
        run: |
          sqlx migrate run --source migrations
      - name: Run unit tests
        run: cargo test --workspace
      - name: Run integration test - mini cluster
        run: |
          # Start center service in background
          RUST_LOG=info DATABASE_URL=$DATABASE_URL REDIS_URL=$REDIS_URL \
            ./target/debug/cdn-center &
          CENTER_PID=$!
          sleep 3
          # Register mock edge nodes and verify
          curl -s -X POST http://localhost:8080/api/v1/nodes \
            -H "Content-Type: application/json" \
            -d '{"ip":"10.0.0.1","region":"us-east","datacenter":"dc1","bandwidth_capacity":10000,"storage_capacity":1000000,"latitude":40.7,"longitude":-74.0,"role":"edge"}' || true
          curl -s -X POST http://localhost:8080/api/v1/nodes \
            -H "Content-Type: application/json" \
            -d '{"ip":"10.0.0.2","region":"eu-west","datacenter":"dc2","bandwidth_capacity":8000,"storage_capacity":800000,"latitude":51.5,"longitude":-0.1,"role":"edge"}' || true
          # Verify nodes are registered
          NODES=$(curl -s http://localhost:8080/api/v1/nodes || echo '{}')
          echo "Registered nodes: $NODES"
          # Verify scheduling
          curl -s -X POST http://localhost:8080/api/v1/schedule \
            -H "Content-Type: application/json" \
            -d '{"client_ip":"1.2.3.4","domain":"example.com","path":"/video.mp4","strategy":"GeoPriority"}' || true
          # Verify health check
          curl -s http://localhost:8080/health || true
          kill $CENTER_PID 2>/dev/null || true

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate image tag
        id: meta
        run: |
          TAG=$(git describe --tags --always --dirty 2>/dev/null || echo "latest")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
