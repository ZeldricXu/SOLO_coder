name: CI Pipeline

on:
  push:
    branches: [ main, develop, release/*, feature/* ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.gitignore'
      - 'docker/**'
      - 'docs/**'
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: >-
    -Xmx1024m
    -XX:MaxMetaspaceSize=256m
    -Dmaven.wagon.http.retryHandler.count=3
    -Dmaven.wagon.httpconnectionManager.ttlSeconds=25
    -Dfile.encoding=UTF-8

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: iot_platform_test
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/mysql

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          check-latest: true

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/**/*.lastUpdated
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Validate Maven POM
        run: mvn validate -B -q

      - name: Initialize Database Schema
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "
            CREATE USER IF NOT EXISTS 'iot_test'@'%' IDENTIFIED BY 'iot_test123';
            GRANT ALL PRIVILEGES ON iot_platform_test.* TO 'iot_test'@'%';
            FLUSH PRIVILEGES;
          "

      - name: Build & Run Tests
        run: |
          mvn clean verify \
            -Pci \
            -B \
            -Dtest.db.host=127.0.0.1 \
            -Dtest.db.port=3306 \
            -Dtest.db.name=iot_platform_test \
            -Dtest.db.username=iot_test \
            -Dtest.db.password=iot_test123 \
            -Dtest.redis.host=127.0.0.1 \
            -Dtest.redis.port=6379

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/jacoco-*.exec
          retention-days: 7

      - name: Upload Coverage Report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: target/site/jacoco/
          retention-days: 14

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Static Code Analysis
        run: |
          mvn \
            checkstyle:check \
            pmd:check \
            spotbugs:check \
            -Pci \
            -B \
            -Dcheckstyle.consoleOutput=true \
            -Dpmd.consoleOutput=true

      - name: Upload Checkstyle Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report-${{ github.run_id }}
          path: target/checkstyle-result.xml
          retention-days: 7

      - name: Upload PMD Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report-${{ github.run_id }}
          path: target/pmd.xml
          retention-days: 7

      - name: Upload SpotBugs Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report-${{ github.run_id }}
          path: target/spotbugsXml.xml
          retention-days: 7

  sonar-scan:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarQube Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn sonar:sonar \
            -Pci \
            -B \
            -Dsonar.projectKey=iot-platform \
            -Dsonar.projectName=IoT Platform \
            -Dsonar.projectVersion=1.0.0 \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  package:
    name: Package & Build Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ build-and-test, code-quality ]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          BRANCH_NAME=${GITHUB_REF#refs/heads/release/}
          BUILD_DATE=$(date -u +"%Y%m%d%H%M%S")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}-${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/iot-platform/iot-platform:${{ steps.version.outputs.tag }}
            ${{ secrets.REGISTRY_URL }}/iot-platform/iot-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ build-and-test, code-quality ]
    if: always()

    steps:
      - name: Notify on Failure
        if: needs.build-and-test.result == 'failure' || needs.code-quality.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            
            console.log(`CI Pipeline failed! Check: ${runUrl}`);
            
            if (context.payload.pull_request) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.payload.pull_request.number,
                body: `⚠️ CI Pipeline failed! Please check the [build logs](${runUrl})`
              });
            }
