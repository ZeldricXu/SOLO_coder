name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright

      - name: Run Ruff lint
        run: |
          ruff check . --output-format=github --exit-zero

      - name: Run Ruff format check
        run: |
          ruff format --check --diff

      - name: Pyright type check
        run: |
          pyright --outputjson > pyright-report.json || true
          echo "Pyright type checking completed"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        test-type: ["unit", "integration"]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dataflow_test
          POSTGRES_USER: dataflow
          POSTGRES_PASSWORD: dataflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataflow -d dataflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: dataflow_test
          MYSQL_USER: dataflow
          MYSQL_PASSWORD: dataflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u dataflow -pdataflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libpq-dev \
            libmariadb-dev \
            libssl-dev \
            libffi-dev \
            libjpeg-dev \
            zlib1g-dev \
            libfreetype6-dev \
            liblcms2-dev \
            libopenjp2-7-dev \
            libtiff-dev \
            libxml2-dev \
            libxslt-dev \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libcairo2 \
            libgdk-pixbuf-2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium --with-deps

      - name: Run unit tests
        if: matrix.test-type == 'unit'
        env:
          FLASK_ENV: testing
          TESTING: "true"
          DATABASE_URL: postgresql://dataflow:dataflow@localhost:5432/dataflow_test
          REDIS_URL: redis://localhost:6379/15
          CELERY_BROKER_URL: redis://localhost:6379/14
          CELERY_RESULT_BACKEND: redis://localhost:6379/13
          SECRET_KEY: test-secret-key-for-ci-only
          ENCRYPTION_KEY: test-encryption-key-32chars-minimum!!!
        run: |
          mkdir -p instance data data/uploads data/exports data/snapshots
          pytest tests/unit/ -v --tb=short --cov=app --cov-report=xml --cov-report=html

      - name: Run integration tests
        if: matrix.test-type == 'integration'
        env:
          FLASK_ENV: testing
          TESTING: "true"
          DATABASE_URL: postgresql://dataflow:dataflow@localhost:5432/dataflow_test
          REDIS_URL: redis://localhost:6379/15
          CELERY_BROKER_URL: redis://localhost:6379/14
          CELERY_RESULT_BACKEND: redis://localhost:6379/13
          SECRET_KEY: test-secret-key-for-ci-only
          ENCRYPTION_KEY: test-encryption-key-32chars-minimum!!!
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_USER: dataflow
          MYSQL_PASSWORD: dataflow
          MYSQL_DATABASE: dataflow_test
        run: |
          mkdir -p instance data data/uploads data/exports data/snapshots
          pytest tests/integration/ -v --tb=short

      - name: Upload test coverage
        if: matrix.test-type == 'unit' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
