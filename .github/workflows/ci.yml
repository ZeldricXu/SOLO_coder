name: CI

on:
  push:
    branches: [main, develop, release/*]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.21"
  COVERAGE_MIN: 60
  GOLANGCI_LINT_VERSION: "v1.55"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod/go.sum
        run: |
          go mod tidy
          go mod verify
          git diff --exit-code go.mod go.sum

      - name: Check gofmt
        run: |
          DIFF=$(gofmt -s -d .)
          if [ -n "$DIFF" ]; then
            echo "$DIFF"
            echo "FAIL: gofmt found issues"
            exit 1
          fi

      - name: Check goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          DIFF=$(goimports -l .)
          if [ -n "$DIFF" ]; then
            echo "$DIFF"
            echo "FAIL: goimports found issues"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  test:
    name: Test (coverage >= ${{ env.COVERAGE_MIN }}%)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests with coverage
        run: |
          mkdir -p .coverage
          go test -count=1 -timeout 120s -race \
            -coverprofile=.coverage/coverage.out \
            -covermode=atomic \
            ./...

      - name: Check coverage threshold
        run: |
          TOTAL=$(go tool cover -func=.coverage/coverage.out | grep "^total:" | awk '{print $NF}' | sed 's/%//')
          echo "Total coverage: ${TOTAL}%"
          INT_TOTAL=$(echo "${TOTAL}" | cut -d. -f1)
          if [ "$INT_TOTAL" -lt "${{ env.COVERAGE_MIN }}" ]; then
            echo "FAIL: coverage ${TOTAL}% < ${{ env.COVERAGE_MIN }}%"
            exit 1
          fi
          echo "PASS: coverage ${TOTAL}% >= ${{ env.COVERAGE_MIN }}%"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        profile: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "0.0.1-dev")
          GIT_COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          LDFLAGS="-X main.version=${VERSION} -X main.gitCommit=${GIT_COMMIT} -X main.buildTime=${BUILD_TIME} -X main.buildProfile=${PROFILE}"

          if [ "$PROFILE" = "dev" ]; then
            go build -race -ldflags "$LDFLAGS" -o bin/session287 .
          else
            go build -trimpath -ldflags "$LDFLAGS -s -w" -o bin/session287 .
          fi

          echo "Built: profile=${PROFILE} version=${VERSION} commit=${GIT_COMMIT}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.profile }}
          path: bin/session287

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/session287
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
