name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  DATABASE_URL: postgres://df169:df169secret@localhost:5432/df1_69
  REDIS_URL: redis://localhost:6379/0
  MINIO_ENDPOINT: localhost:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadminsecret
  APP_ENV: testing
  SQLX_OFFLINE: "true"

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-lint-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-lint-${{ runner.os }}-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
          components: rustfmt, clippy

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets -- \
            -D warnings \
            -A clippy::new-without-default \
            -A clippy::too-many-arguments \
            -A clippy::large-enum-variant \
            -A clippy::struct_excessive_bools \
            -A clippy::module_name_repetitions \
            -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc \
            -A clippy::missing_panics_doc

  test:
    name: Test (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.pull_request.draft == false
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: df169
          POSTGRES_PASSWORD: df169secret
          POSTGRES_DB: df1_69
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

      minio:
        image: minio/minio:RELEASE.2024-06-11T03-13-30Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadminsecret
        command: server /data
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-test-${{ runner.os }}-
            cargo-lint-${{ runner.os }}-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Install sqlx-cli
        run: |
          cargo install sqlx-cli --version 0.7.4 \
            --no-default-features --features postgres,rustls --locked

      - name: Init MinIO bucket
        run: |
          curl -o /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x /usr/local/bin/mc
          mc alias set local http://localhost:9000 minioadmin minioadminsecret
          mc mb --ignore-existing local/df1-69

      - name: Run migrations
        run: sqlx migrate run --database-url "$DATABASE_URL"

      - name: Generate sqlx data (optional)
        run: |
          if command -v sqlx &> /dev/null; then
            cargo sqlx prepare --workspace --check -- \
              --database-url "$DATABASE_URL" || true
          fi

      - name: Run unit + integration tests (sub-crates)
        run: |
          cargo test -p git-diff-core -p review-diff -p review-data-access \
            --release --locked -- --test-threads=4 2>&1 | tail -50

      - name: Run all tests (workspace)
        env:
          SQLX_OFFLINE: "false"
        run: |
          cargo test --workspace --release --locked --all-targets \
            -- --test-threads=4 2>&1 | tail -100

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/**/*.json
            target/debug/deps/*.rlib
          retention-days: 7

  build-and-push:
    name: Build Docker image + push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=DF1-69 Code Review Platform
            org.opencontainers.image.description=Collaborative Code Review Platform
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push app image
        id: push-app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Build and push migrate-init image
        id: push-migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate-init
          push: true
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max
          tags: |
            ghcr.io/${{ github.repository }}-migrate:latest
            ghcr.io/${{ github.repository }}-migrate:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      - name: Generate artifact attestation (app)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push-app.outputs.digest }}
          push-to-registry: true
