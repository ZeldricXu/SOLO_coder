name: CI/CD

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.78"
  CRATE_NAME: genome_pipeline

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            cross: false
          - name: Linux musl (static)
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install musl-tools (musl only)
        if: matrix.cross && matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libz-dev libbz2-dev liblzma-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install zlib bzip2 xz

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Download test fixtures
        run: |
          mkdir -p test/fixtures
          cd test/fixtures
          curl -sL -o small_ref.fasta "https://raw.githubusercontent.com/your-org/genome_pipeline-fixtures/main/small_ref.fasta"
          curl -sL -o sample_R1.fastq.gz "https://raw.githubusercontent.com/your-org/genome_pipeline-fixtures/main/sample_R1.fastq.gz"
          curl -sL -o sample_R2.fastq.gz "https://raw.githubusercontent.com/your-org/genome_pipeline-fixtures/main/sample_R2.fastq.gz"
          curl -sL -o annotation.gff3 "https://raw.githubusercontent.com/your-org/genome_pipeline-fixtures/main/annotation.gff3"

      - name: Run tests
        if: ${{ !matrix.cross }}
        run: cargo test --all-features -- --test-threads=2

      - name: Run tests (cross)
        if: matrix.cross
        run: |
          cargo install cross --locked
          cross test --target ${{ matrix.target }} --all-features -- --test-threads=2

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write

    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build binary
        run: |
          cargo install cross --locked
          cross build --target ${{ matrix.target }} --release --all-features

      - name: Package artifacts
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/${{ env.CRATE_NAME }} release/${{ env.CRATE_NAME }}
          cd release
          tar -czf ${{ env.CRATE_NAME }}-${{ steps.version.outputs.VERSION }}-${{ matrix.target }}.tar.gz ${{ env.CRATE_NAME }}
          rm ${{ env.CRATE_NAME }}
          sha256sum ${{ env.CRATE_NAME }}-${{ steps.version.outputs.VERSION }}-${{ matrix.target }}.tar.gz >> checksums.txt

      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release/${{ env.CRATE_NAME }}-${{ steps.version.outputs.VERSION }}-${{ matrix.target }}.tar.gz
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

      - name: Upload checksums
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release/checksums.txt
          tag: ${{ github.ref }}
          overwrite: true

      - name: Build and push Docker image
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }} .
          docker tag ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }} ghcr.io/${{ github.repository }}:latest
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          docker push ghcr.io/${{ github.repository }}:latest

      - name: Publish to crates.io
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          cargo publish --no-verify --all-features

      - name: Submit to Bioconda
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          BIOCONDA_TOKEN: ${{ secrets.BIOCONDA_TOKEN }}
        run: |
          git clone --depth 1 https://github.com/bioconda/bioconda-recipes.git
          cd bioconda-recipes
          git checkout -b ${CRATE_NAME}-${{ steps.version.outputs.VERSION }}
          mkdir -p recipes/${{ env.CRATE_NAME }}
          cp ../conda/meta.yaml recipes/${{ env.CRATE_NAME }}/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes/${{ env.CRATE_NAME }}/
          git commit -m "Add ${{ env.CRATE_NAME }} ${{ steps.version.outputs.VERSION }}"
          git push https://${{ secrets.BIOCONDA_TOKEN }}@github.com/your-org/bioconda-recipes.git ${CRATE_NAME}-${{ steps.version.outputs.VERSION }}
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/bioconda/bioconda-recipes/pulls \
            -d '{"title":"Add ${{ env.CRATE_NAME }} ${{ steps.version.outputs.VERSION }}","head":"your-org:${CRATE_NAME}-${{ steps.version.outputs.VERSION }}","base":"master","body":"Automated PR from CI/CD pipeline"}'
