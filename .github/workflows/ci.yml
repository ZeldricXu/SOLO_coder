name: CI

on:
  push:
    branches: [ main, develop, release/* ]
  pull_request:
    branches: [ main, develop, release/* ]
  workflow_dispatch:

env:
  GO_VERSION: '1.21'
  GOLANGCI_LINT_VERSION: 'v1.55.2'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Go Vet
        run: go vet ./...

      - name: Static Analysis
        uses: golangci/golangci-lint-action@v3
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --config .golangci.yml ./...
          skip-pkg-cache: true

      - name: Run Tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

      - name: Build (Dev)
        env:
          BUILD_TIME: ${{ github.event.repository.pushed_at }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags dev \
            -ldflags "-X main.version=dev-${GITHUB_SHA::7} -X main.buildTime=$(date -u +"%Y-%m-%dT%H:%M:%SZ") -X main.gitCommit=${GITHUB_SHA::7}" \
            -o bin/config-platform-dev \
            ./cmd/server/

      - name: Build (Staging)
        if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')
        env:
          BUILD_TIME: ${{ github.event.repository.pushed_at }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags staging \
            -ldflags "-X main.version=staging-${GITHUB_SHA::7} -X main.buildTime=$(date -u +"%Y-%m-%dT%H:%M:%SZ") -X main.gitCommit=${GITHUB_SHA::7}" \
            -o bin/config-platform-staging \
            ./cmd/server/

      - name: Build (Production)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        env:
          BUILD_TIME: ${{ github.event.repository.pushed_at }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags prod -ldflags "-s -w \
            -X main.version=${{ github.event.release.tag_name }}-${GITHUB_SHA::7} \
            -X main.buildTime=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            -X main.gitCommit=${GITHUB_SHA::7}" \
            -o bin/config-platform \
            ./cmd/server/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: bin/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Gosec Security Scanner
        uses: securecodewarrior/golang-github-action@master
        with:
          args: -exclude-dir=vendor -fmt=json -out=gosec-report.json ./...

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: gosec-report.json

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, docker-build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: bin/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bin/config-platform
            bin/config-platform-staging
            bin/config-platform-dev
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
