name: PR Checks

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened, ready_for_review, labeled ]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pr-lint:
    name: PR Title Lint
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  label-check:
    name: Label Check
    runs-on: ubuntu-latest
    steps:
      - name: Check for required labels
        uses: mheap/github-action-required-labels@v5
        with:
          mode: minimum
          count: 1
          labels: |
            enhancement
            bug
            documentation
            dependencies
            refactor
            feature

  size-label:
    name: Size Label
    runs-on: ubuntu-latest
    steps:
      - name: Calculate PR size and label
        uses: pascalgn/size-label-action@v0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          sizes: |
            {
              "XS": 10,
              "S": 100,
              "M": 500,
              "L": 1000,
              "XL": 3000
            }
          labeled: true

  conflict-check:
    name: Merge Conflict Check
    runs-on: ubuntu-latest
    steps:
      - name: Check for merge conflicts
        uses: eps1lon/actions-label-merge-conflict@v3
        with:
          dirtyLabel: "merge-conflict"
          commentOnDirty: "This PR has merge conflicts. Please resolve them."
          commentOnClean: "Merge conflicts resolved."
          removeOnDirtyLabel: "ready-for-review"
          repoToken: ${{ secrets.GITHUB_TOKEN }}

  review-reminder:
    name: Review Reminder
    runs-on: ubuntu-latest
    if: github.event.action == 'ready_for_review'
    steps:
      - name: Request reviews
        uses: actions/github-script@v7
        with:
          script: |
            const reviewers = ['reviewer1', 'reviewer2'];
            await github.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers: reviewers
            });
