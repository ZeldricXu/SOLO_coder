name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.6.0
        ports:
          - 2181:2181
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        options: >-
          --health-cmd "echo ruok | nc localhost 2181"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka:
        image: confluentinc/cp-kafka:7.6.0
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

      postgres:
        image: timescale/timescaledb:2.14.2-pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loganalytics
          TS_TUNE_MEMORY: 256MB
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      minio:
        image: minio/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-test-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties') }}
          restore-keys: gradle-test-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Wait for Kafka
        run: |
          echo "Waiting for Kafka to be ready..."
          timeout 60 bash -c 'until docker exec $(docker ps -q -f name=kafka) kafka-topics --bootstrap-server localhost:9092 --list 2>/dev/null; do sleep 2; done' || true
          echo "Kafka is ready"

      - name: Create Kafka topics
        run: |
          docker exec $(docker ps -q -f name=kafka) kafka-topics --bootstrap-server localhost:9092 --create --if-not-exists --topic raw-logs --partitions 12 --replication-factor 1 || true
          docker exec $(docker ps -q -f name=kafka) kafka-topics --bootstrap-server localhost:9092 --create --if-not-exists --topic parsed-logs --partitions 12 --replication-factor 1 || true
          docker exec $(docker ps -q -f name=kafka) kafka-topics --bootstrap-server localhost:9092 --create --if-not-exists --topic enriched-logs --partitions 12 --replication-factor 1 || true
          docker exec $(docker ps -q -f name=kafka) kafka-topics --bootstrap-server localhost:9092 --create --if-not-exists --topic error-logs --partitions 12 --replication-factor 1 || true
          docker exec $(docker ps -q -f name=kafka) kafka-topics --bootstrap-server localhost:9092 --create --if-not-exists --topic anomalies --partitions 12 --replication-factor 1 || true
          docker exec $(docker ps -q -f name=kafka) kafka-topics --bootstrap-server localhost:9092 --create --if-not-exists --topic metrics --partitions 12 --replication-factor 1 || true
          docker exec $(docker ps -q -f name=kafka) kafka-topics --bootstrap-server localhost:9092 --create --if-not-exists --topic alerts --partitions 12 --replication-factor 1 || true
          docker exec $(docker ps -q -f name=kafka) kafka-topics --bootstrap-server localhost:9092 --create --if-not-exists --topic archive-logs --partitions 12 --replication-factor 1 || true

      - name: Run tests
        env:
          LOGANALYTICS_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          LOGANALYTICS_TIMESCALE_URL: jdbc:postgresql://localhost:5432/loganalytics
          LOGANALYTICS_TIMESCALE_USER: postgres
          LOGANALYTICS_TIMESCALE_PASSWORD: postgres
          LOGANALYTICS_MINIO_ENDPOINT: http://localhost:9000
          LOGANALYTICS_MINIO_ACCESS_KEY: minioadmin
          LOGANALYTICS_MINIO_SECRET_KEY: minioadmin
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: ./gradlew test --no-daemon --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
