name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  JAVA_VERSION: '17'
  GRAALVM_VERSION: '22.3.2'
  DISTRIBUTION: 'graalvm'
  APP_NAME: 'log-analyzer'
  MAIN_CLASS: 'com.datateam.loganalyzer.cli.LogAnalyzerCli'

jobs:
  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GraalVM ${{ env.GRAALVM_VERSION }} (Java ${{ env.JAVA_VERSION }})
        uses: graalvm/setup-graalvm@v1
        with:
          version: ${{ env.GRAALVM_VERSION }}
          java-version: ${{ env.JAVA_VERSION }}
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Download dependencies
        run: mvn dependency:go-offline -q

      - name: Run tests
        run: mvn test -Dnet.bytebuddy.experimental=true
        env:
          MAVEN_OPTS: '-Xmx2g'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: target/test-reports

  build-jvm:
    name: Build JVM - ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GraalVM ${{ env.GRAALVM_VERSION }} (Java ${{ env.JAVA_VERSION }})
        uses: graalvm/setup-graalvm@v1
        with:
          version: ${{ env.GRAALVM_VERSION }}
          java-version: ${{ env.JAVA_VERSION }}
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build fat JAR with Assembly Plugin
        run: mvn package -DskipTests
        env:
          MAVEN_OPTS: '-Xmx2g'

      - name: Verify JAR exists
        if: runner.os != 'Windows'
        run: ls -lh target/${{ env.APP_NAME }}-*-all.jar

      - name: Verify JAR exists (Windows)
        if: runner.os == 'Windows'
        run: dir target\${{ env.APP_NAME }}-*-all.jar

      - name: Set artifact name
        id: set-artifact-name
        shell: bash
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          OS_NAME=$(echo ${{ matrix.os }} | cut -d'-' -f1)
          echo "artifact_name=${{ env.APP_NAME }}-${VERSION}-jvm-${OS_NAME}" >> $GITHUB_OUTPUT

      - name: Upload JVM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact-name.outputs.artifact_name }}
          path: target/${{ env.APP_NAME }}-*-all.jar

  build-native:
    name: Build Native - ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GraalVM ${{ env.GRAALVM_VERSION }} (Java ${{ env.JAVA_VERSION }})
        uses: graalvm/setup-graalvm@v1
        with:
          version: ${{ env.GRAALVM_VERSION }}
          java-version: ${{ env.JAVA_VERSION }}
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache GraalVM artifacts
        uses: actions/cache@v4
        with:
          path: ~/.graalvm
          key: ${{ runner.os }}-graalvm-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-graalvm

      - name: Generate native config with agent
        continue-on-error: true
        run: |
          mvn test-compile -DskipTests
          mvn test -Pgenerate-native-config -Dnet.bytebuddy.experimental=true -DskipTests=false
        env:
          MAVEN_OPTS: '-Xmx3g'

      - name: Build native image
        run: mvn package -Pnative -DskipTests
        env:
          MAVEN_OPTS: '-Xmx4g'

      - name: Verify native binary exists
        if: runner.os != 'Windows'
        run: |
          ls -lh target/${{ env.APP_NAME }}
          file target/${{ env.APP_NAME }}

      - name: Verify native binary exists (Windows)
        if: runner.os == 'Windows'
        run: |
          dir target\${{ env.APP_NAME }}.exe

      - name: Set artifact name
        id: set-artifact-name
        shell: bash
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          OS_NAME=$(echo ${{ matrix.os }} | cut -d'-' -f1)
          EXT=""
          if [ "${{ runner.os }}" == "Windows" ]; then
            EXT=".exe"
          fi
          echo "artifact_name=${{ env.APP_NAME }}-${VERSION}-native-${OS_NAME}" >> $GITHUB_OUTPUT
          echo "binary_ext=${EXT}" >> $GITHUB_OUTPUT

      - name: Create distribution directory
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/bin dist/config dist/docs
          cp target/${{ env.APP_NAME }} dist/bin/
          cp config/*.yaml dist/config/ 2>/dev/null || true
          cp README.md dist/docs/ 2>/dev/null || true
          tar -czf ${{ steps.set-artifact-name.outputs.artifact_name }}.tar.gz -C dist .

      - name: Create distribution directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/bin, dist/config, dist/docs
          Copy-Item target/${{ env.APP_NAME }}.exe dist/bin/
          Copy-Item config/*.yaml dist/config/ -ErrorAction SilentlyContinue
          Copy-Item README.md dist/docs/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath ${{ steps.set-artifact-name.outputs.artifact_name }}.zip

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact-name.outputs.artifact_name }}
          path: |
            ${{ steps.set-artifact-name.outputs.artifact_name }}.tar.gz
            ${{ steps.set-artifact-name.outputs.artifact_name }}.zip

  docker:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.APP_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release to GitHub
    needs: [build-jvm, build-native]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded artifacts
        run: ls -R artifacts/

      - name: Create checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.jar" -o -name "*.tar.gz" -o -name "*.zip" \) -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

      - name: Create Release Notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cat > RELEASE_NOTES.md << 'EOF'
          # Log Analyzer $VERSION
          
          ## Features
          - Production log analysis and anomaly detection
          - Multiple log format support (log4j, syslog, JSON lines)
          - Z-score and moving average anomaly detection
          - Email, WeChat Work, and Slack notifications
          
          ## Download
          
          ### JVM Version (requires Java 17+)
          | Platform | Download |
          |----------|----------|
          | All Platforms | [log-analyzer-$VERSION-jvm-ubuntu.jar] |
          
          ### Native Version (no Java required)
          | Platform | Download |
          |----------|----------|
          | Linux | [log-analyzer-$VERSION-native-ubuntu.tar.gz] |
          | macOS | [log-analyzer-$VERSION-native-macos.tar.gz] |
          | Windows | [log-analyzer-$VERSION-native-windows.zip] |
          
          ## Docker
          ```bash
          docker pull ghcr.io/${{ github.repository }}:$VERSION
          ```
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*.jar
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/checksums.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
