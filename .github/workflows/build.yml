name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/log-analytics-platform

jobs:
  build-jars:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-build-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties') }}
          restore-keys: gradle-build-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "version=latest" >> $GITHUB_OUTPUT
          else
            echo "version=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Build all modules
        run: ./gradlew assemble --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            log-agent/build/libs/log-agent-1.0.0.jar
            stream-pipeline/build/libs/stream-pipeline-1.0.0.jar
            pattern-detector/build/libs/pattern-detector-1.0.0.jar
            metrics-aggregator/build/libs/metrics-aggregator-1.0.0.jar
            storage-index/build/libs/storage-index-1.0.0.jar
            api-server/build/libs/api-server-1.0.0.jar
          if-no-files-found: warn

  docker-images:
    needs: build-jars
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: log-agent
            dockerfile: docker/Dockerfile.agent
            image_suffix: agent
          - module: stream-pipeline
            dockerfile: docker/Dockerfile.main
            image_suffix: stream-pipeline
          - module: pattern-detector
            dockerfile: docker/Dockerfile.main
            image_suffix: pattern-detector
          - module: metrics-aggregator
            dockerfile: docker/Dockerfile.main
            image_suffix: metrics-aggregator
          - module: storage-index
            dockerfile: docker/Dockerfile.main
            image_suffix: storage-index
          - module: api-server
            dockerfile: docker/Dockerfile.main
            image_suffix: api-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            MODULE=${{ matrix.module }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
