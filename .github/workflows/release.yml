name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.76.0
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      release_date: ${{ steps.get_date.outputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Get release date
        id: get_date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config musl-tools

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-linux-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-linux-

      - name: Build
        run: cargo build --release --all-features --bin edge-scheduler --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          mkdir -p release
          cp target/x86_64-unknown-linux-gnu/release/edge-scheduler release/
          cp -r config release/
          cp README.md release/
          cp LICENSE release/
          tar -czf edge-scheduler-${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz -C release .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-scheduler-${{ needs.prepare.outputs.version }}-linux-x86_64
          path: edge-scheduler-${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz
          retention-days: 30

  build-arm:
    name: Build ARM64
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: aarch64-unknown-linux-gnu

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-arm-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-arm-

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: cargo build --release --all-features --bin edge-scheduler --target aarch64-unknown-linux-gnu

      - name: Package
        run: |
          mkdir -p release
          cp target/aarch64-unknown-linux-gnu/release/edge-scheduler release/
          cp -r config release/
          cp README.md release/
          cp LICENSE release/
          tar -czf edge-scheduler-${{ needs.prepare.outputs.version }}-linux-aarch64.tar.gz -C release .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-scheduler-${{ needs.prepare.outputs.version }}-linux-aarch64
          path: edge-scheduler-${{ needs.prepare.outputs.version }}-linux-aarch64.tar.gz
          retention-days: 30

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: aarch64-apple-darwin

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-macos-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-macos-

      - name: Build
        run: cargo build --release --all-features --bin edge-scheduler --target aarch64-apple-darwin

      - name: Package
        run: |
          mkdir -p release
          cp target/aarch64-apple-darwin/release/edge-scheduler release/
          cp -r config release/
          cp README.md release/
          cp LICENSE release/
          tar -czf edge-scheduler-${{ needs.prepare.outputs.version }}-macos-aarch64.tar.gz -C release .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-scheduler-${{ needs.prepare.outputs.version }}-macos-aarch64
          path: edge-scheduler-${{ needs.prepare.outputs.version }}-macos-aarch64.tar.gz
          retention-days: 30

  docker-build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [prepare, build-linux]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-linux, build-arm, build-macos, docker-build-and-push]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: edge-scheduler-${{ needs.prepare.outputs.version }}-linux-x86_64

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: edge-scheduler-${{ needs.prepare.outputs.version }}-linux-aarch64

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: edge-scheduler-${{ needs.prepare.outputs.version }}-macos-aarch64

      - name: Generate checksums
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Generate changelog
        run: |
          echo "## Changes in ${{ needs.prepare.outputs.version }}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Release Date: ${{ needs.prepare.outputs.release_date }}" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          if [ -f CHANGELOG.md.template ]; then
            cat CHANGELOG.md.template >> CHANGELOG.md
          else
            git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 2>/dev/null || echo HEAD~1)..HEAD >> CHANGELOG.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Release ${{ needs.prepare.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-rc') || contains(needs.prepare.outputs.version, '-beta') || contains(needs.prepare.outputs.version, '-alpha') }}
          files: |
            edge-scheduler-${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz
            edge-scheduler-${{ needs.prepare.outputs.version }}-linux-aarch64.tar.gz
            edge-scheduler-${{ needs.prepare.outputs.version }}-macos-aarch64.tar.gz
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
