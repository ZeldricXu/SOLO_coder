name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            package_type: appimage
            asset_name: MarkNote-x86_64.AppImage
          - os: windows-latest
            package_type: zip
            asset_name: MarkNote-windows-x64.zip
          - os: macos-latest
            package_type: dmg
            asset_name: MarkNote-macOS-universal.dmg
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      
      - name: Build release
        run: cargo build --release --verbose
      
      - name: Package for Linux (AppImage + DEB + RPM)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 rpm
          
          mkdir -p release
          
          # Create AppImage
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          cp target/release/marknote AppDir/usr/bin/
          
          cat > AppDir/usr/share/applications/marknote.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=MarkNote
          Comment=A lightweight cross-platform Markdown note-taking app
          Exec=marknote
          Icon=marknote
          Categories=Office;Utility;
          EOF
          
          convert -size 256x256 xc:#6366f1 AppDir/usr/share/icons/hicolor/256x256/apps/marknote.png || true
          
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          mv MarkNote*.AppImage release/MarkNote-x86_64.AppImage
          
          # Create DEB package
          mkdir -p deb-package/DEBIAN
          mkdir -p deb-package/usr/bin
          mkdir -p deb-package/usr/share/applications
          mkdir -p deb-package/usr/share/icons/hicolor/256x256/apps
          
          cp target/release/marknote deb-package/usr/bin/
          cp AppDir/usr/share/applications/marknote.desktop deb-package/usr/share/applications/
          cp AppDir/usr/share/icons/hicolor/256x256/apps/marknote.png deb-package/usr/share/icons/hicolor/256x256/apps/ 2>/dev/null || true
          
          cat > deb-package/DEBIAN/control << 'EOF'
          Package: marknote
          Version: 0.1.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: MarkNote Team <team@marknote.app>
          Description: A lightweight cross-platform Markdown note-taking app
           MarkNote is a modern, fast, and beautiful Markdown note-taking application.
          EOF
          
          dpkg-deb --build deb-package release/MarkNote-amd64.deb
          
          # Convert DEB to RPM using alien
          sudo alien -r release/MarkNote-amd64.deb --output-dir release/
          mv release/*.rpm release/MarkNote-x86_64.rpm
      
      - name: Package for Windows (ZIP)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p release
          
          @'
          @echo off
          echo Adding MarkNote to context menu...
          reg add "HKCR\*\shell\Open with MarkNote" /ve /d "Open with MarkNote" /f
          reg add "HKCR\*\shell\Open with MarkNote\command" /ve /d "\"%~dp0marknote.exe\" \"%%1\"" /f
          echo Done!
          '@ | Out-File -FilePath install-context-menu.bat -Encoding ASCII
          
          @'
          @echo off
          echo Removing MarkNote from context menu...
          reg delete "HKCR\*\shell\Open with MarkNote" /f
          echo Done!
          '@ | Out-File -FilePath uninstall-context-menu.bat -Encoding ASCII
          
          Compress-Archive -Path target/release/marknote.exe, install-context-menu.bat, uninstall-context-menu.bat -DestinationPath release/MarkNote-windows-x64.zip
      
      - name: Package for macOS (DMG)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p release
          
          # Create universal binary (x86_64 + aarch64)
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          lipo -create -output marknote-universal target/x86_64-apple-darwin/release/marknote target/aarch64-apple-darwin/release/marknote
          
          # Create .app bundle
          mkdir -p MarkNote.app/Contents/MacOS
          mkdir -p MarkNote.app/Contents/Resources
          
          cp marknote-universal MarkNote.app/Contents/MacOS/marknote
          
          cat > MarkNote.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>marknote</string>
              <key>CFBundleIdentifier</key>
              <string>com.marknote.app</string>
              <key>CFBundleName</key>
              <string>MarkNote</string>
              <key>CFBundleDisplayName</key>
              <string>MarkNote</string>
              <key>CFBundleVersion</key>
              <string>0.1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>0.1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSRequiresAquaSystemAppearance</key>
              <false/>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.productivity</string>
          </dict>
          </plist>
          EOF
          
          mkdir -p dmg-root
          cp -R MarkNote.app dmg-root/
          ln -s /Applications dmg-root/Applications
          
          hdiutil create -volname "MarkNote" -srcfolder dmg-root -ov -format UDZO release/MarkNote-macOS-universal.dmg
      
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
