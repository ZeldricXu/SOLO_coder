name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (e.g. 1.0.0)'
        required: true
      developmentVersion:
        description: 'Next development version (e.g. 1.1.0-SNAPSHOT)'
        required: true

env:
  MAVEN_OPTS: >-
    -Xmx1024m
    -XX:MaxMetaspaceSize=256m
    -Dfile.encoding=UTF-8

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          server-id: ossrh
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Configure Git User
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Prepare Release
        run: |
          mvn release:prepare \
            -B \
            -DreleaseVersion=${{ github.event.inputs.releaseVersion }} \
            -DdevelopmentVersion=${{ github.event.inputs.developmentVersion }} \
            -Dtag=v${{ github.event.inputs.releaseVersion }} \
            -Darguments="-DskipTests"

      - name: Perform Release
        run: |
          mvn release:perform \
            -B \
            -Darguments="-DskipTests -Dmaven.javadoc.skip=true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push Release Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/iot-platform/iot-platform:${{ github.event.inputs.releaseVersion }}
            ${{ secrets.REGISTRY_URL }}/iot-platform/iot-platform:stable
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.releaseVersion }}
          name: Release v${{ github.event.inputs.releaseVersion }}
          generate_release_notes: true
          files: |
            target/*.jar
            target/*.jar.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
