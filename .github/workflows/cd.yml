name: CD Pipeline - Build & Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: false

env:
  GO_VERSION: '1.21'
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}
  DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY || 'streamsql/streamsql' }}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================
  # Stage 1: Build and Push Docker Image
  # ============================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build_and_push.outputs.digest }}
      image_tag: ${{ steps.get_tag.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version tag
        id: get_tag
        run: |
          if [ "${{ github.event.inputs.version }}" ]; then
            TAG=${{ github.event.inputs.version }}
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Version: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME || github.actor }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build_and_push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}:${{ steps.get_tag.outputs.tag }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}:latest
          labels: |
            org.opencontainers.image.title=StreamSQL
            org.opencontainers.image.description=Stream SQL Computing Engine
            org.opencontainers.image.version=${{ steps.get_tag.outputs.tag }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}:cache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}:cache,mode=max
          build-args: |
            VERSION=${{ steps.get_tag.outputs.tag }}

  # ============================================
  # Stage 2: Deploy to Staging
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event.inputs.environment == 'staging' || startsWith(github.ref, 'refs/tags/v') }}
    environment:
      name: staging
      url: https://staging.streamsql.io
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes (Staging)
        uses: steebchen/kubectl@v2
        with:
          config: ${{ secrets.KUBE_CONFIG_STAGING }}
          version: v1.28.0
          command: set image deployment/streamsql streamsql=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}:${{ needs.build-and-push.outputs.image_tag }} -n streamsql

      - name: Wait for rollout
        uses: steebchen/kubectl@v2
        with:
          config: ${{ secrets.KUBE_CONFIG_STAGING }}
          command: rollout status deployment/streamsql -n streamsql --timeout=300s

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging..."
          curl -f https://staging.streamsql.io/api/v1/health || exit 1

  # ============================================
  # Stage 3: Deploy to Production
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: ${{ github.event.inputs.environment == 'production' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc')) }}
    environment:
      name: production
      url: https://api.streamsql.io
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build-and-push.outputs.image_tag }}
          name: Release ${{ needs.build-and-push.outputs.image_tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Kubernetes (Production)
        uses: steebchen/kubectl@v2
        with:
          config: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
          version: v1.28.0
          command: set image deployment/streamsql streamsql=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}:${{ needs.build-and-push.outputs.image_tag }} -n streamsql

      - name: Wait for rollout
        uses: steebchen/kubectl@v2
        with:
          config: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
          command: rollout status deployment/streamsql -n streamsql --timeout=600s

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against production..."
          curl -f https://api.streamsql.io/api/v1/health || exit 1

  # ============================================
  # Stage 4: Notify
  # ============================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        if: ${{ needs.build-and-push.result == 'success' }}
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL }}
          slack-message: |
            ✅ *StreamSQL Deployment Successful*
            
            *Version:* ${{ needs.build-and-push.outputs.image_tag }}
            *Environment:* ${{ github.event.inputs.environment || 'auto' }}
            *Commit:* ${{ github.sha }}
            
            Docker Image: `${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}:${{ needs.build-and-push.outputs.image_tag }}`
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Notify on failure
        uses: slackapi/slack-github-action@v1
        if: ${{ failure() }}
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL }}
          slack-message: |
            ❌ *StreamSQL Deployment Failed*
            
            *Version:* ${{ needs.build-and-push.outputs.image_tag }}
            *Commit:* ${{ github.sha }}
            *Author:* ${{ github.actor }}
            
            Check the logs for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
