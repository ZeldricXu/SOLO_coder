name: CD - Deploy to Environments

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - prod
      version:
        description: 'Version tag'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  JAVA_VERSION: '17'

jobs:
  determine-env:
    name: Determine Deployment Environment
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set-env.outputs.env }}
    steps:
      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event.inputs.environment }}" ]; then
            echo "env=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "env=staging" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
          fi

  build-and-push-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: determine-env
    environment: ${{ needs.determine-env.outputs.env }}
    strategy:
      matrix:
        module:
          - api-gateway
          - core-processor
          - notification-service
          - storage-service
          - logging-service
          - environment-service
          - document-service
          - contract-test-service
          - feature-flags-service
          - monitoring-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.module }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest-${{ needs.determine-env.outputs.env }},enable=true

      - name: Build package with Maven
        run: |
          mvn -B -pl ${{ matrix.module }} -am package -DskipTests

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.module }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SPRING_PROFILES_ACTIVE=${{ needs.determine-env.outputs.env }}

  deploy:
    name: Deploy to ${{ needs.determine-env.outputs.env }}
    runs-on: ubuntu-latest
    needs: [determine-env, build-and-push-images]
    environment: ${{ needs.determine-env.outputs.env }}
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to environment
        run: |
          echo "Deploying to ${{ needs.determine-env.outputs.env }} environment"
          echo "Image registry: ${{ env.REGISTRY }}"
          echo "Deploy complete - this would trigger actual deployment in production setup"

      - name: Send deployment notification
        run: |
          echo "::notice::Deployment to ${{ needs.determine-env.outputs.env }} completed successfully"
