name: CD Pipeline

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: "3.11"

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.example.com
    if: ${{ github.event.inputs.environment == 'staging' || github.event_name == 'release' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: infra-platform
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:staging
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:staging

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster staging-cluster --service infra-platform --force-new-deployment

      - name: Run migration
        run: |
          aws ecs run-task --cluster staging-cluster --task-definition infra-platform-migration --launch-type FARGATE

      - name: Notify deployment
        uses: slackapi/slack-github-action@v1
        with:
          slack-message: "🚀 Deployed to staging environment successfully!"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.example.com
    needs: deploy-staging
    if: ${{ github.event.inputs.environment == 'production' || github.event_name == 'release' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push production image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: infra-platform
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:staging
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:staging $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:staging $ECR_REGISTRY/$ECR_REPOSITORY:production
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:production

      - name: Deploy to ECS (blue-green)
        run: |
          aws ecs update-service --cluster production-cluster --service infra-platform --force-new-deployment

      - name: Run smoke tests
        run: |
          for i in {1..30}; do
            if curl -f https://api.example.com/health; then
              echo "Smoke test passed!"
              break
            fi
            echo "Waiting for service to be healthy..."
            sleep 10
          done

      - name: Notify deployment
        uses: slackapi/slack-github-action@v1
        with:
          slack-message: "🎉 Deployed to production environment successfully!"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
