name: CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

env:
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.orchestration.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to Staging
        run: |
          cd k8s/overlays/staging
          kubectl apply -k .

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/orchestration-app -n orchestration --timeout=300s

      - name: Run Smoke Tests
        run: |
          kubectl run smoke-test --rm -i --restart=Never --image=alpine/curl -- \
            curl -f http://orchestration-app.orchestration.svc.cluster.local:8080/actuator/health

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://orchestration.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create Pre-deployment Backup
        run: |
          kubectl annotate deployment/orchestration-app -n orchestration \
            backupTimestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Deploy to Production
        run: |
          cd k8s/overlays/production
          kubectl apply -k .

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/orchestration-app -n orchestration --timeout=600s

      - name: Run Post-deployment Verification
        run: |
          for i in {1..10}; do
            if kubectl run verification-test --rm -i --restart=Never --image=alpine/curl -- \
              curl -f http://orchestration-app.orchestration.svc.cluster.local:8080/actuator/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 10 attempts"
          exit 1

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure()

    steps:
      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Rollback Deployment
        run: |
          kubectl rollout undo deployment/orchestration-app -n orchestration
