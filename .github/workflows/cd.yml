name: CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  JAVA_VERSION: '17'
  AWS_REGION: 'us-east-1'
  ECR_REPOSITORY: 'monitoring-platform'

jobs:
  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/main' || (github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image-tag
        run: echo "tag=$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7" >> $GITHUB_OUTPUT

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          kubectl set image deployment/monitoring-platform \
            monitoring-platform=${{ steps.build-image.outputs.image }} \
            -n monitoring
          kubectl rollout status deployment/monitoring-platform -n monitoring --timeout=10m
          kubectl get pods -n monitoring -l app=monitoring-platform

      - name: Run health checks
        run: |
          kubectl get services -n monitoring
          kubectl get ingress -n monitoring
          sleep 30

      - name: Send notification to Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          slack-message: "Deployment to Staging ${{ job.status }}: ${{ github.repository }}@${{ github.sha }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-production:
    name: Deploy to Production
    if: startsWith(github.ref, 'refs/tags/v') || (github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://monitoring.example.com
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get release version
        id: get-version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build, tag, and push production image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.get-version.outputs.version }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.get-version.outputs.version }}
          tag_name: ${{ steps.get-version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            **/target/*.jar
            CHANGELOG.md

      - name: Update kubeconfig for production
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME_PROD }} --region ${{ env.AWS_REGION }}

      - name: Deploy to Production EKS with canary
        run: |
          echo "Deploying canary release..."
          kubectl set image deployment/monitoring-platform-canary \
            monitoring-platform=${{ steps.build-image.outputs.image }} \
            -n monitoring
          kubectl rollout status deployment/monitoring-platform-canary -n monitoring --timeout=10m

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          for i in {1..10}; do
            curl -f http://monitoring.example.com/actuator/health || exit 1
            sleep 2
          done

      - name: Promote canary to production
        run: |
          echo "Promoting canary to production..."
          kubectl set image deployment/monitoring-platform \
            monitoring-platform=${{ steps.build-image.outputs.image }} \
            -n monitoring
          kubectl rollout status deployment/monitoring-platform -n monitoring --timeout=10m

      - name: Scale down canary
        run: |
          kubectl scale deployment/monitoring-platform-canary --replicas=0 -n monitoring

      - name: Send notification to Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          slack-message: "Deployment to Production ${{ job.status }}: ${{ github.repository }}@${{ steps.get-version.outputs.version }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  rollback:
    name: Rollback Production
    if: failure() && needs.deploy-production.result == 'failure'
    runs-on: ubuntu-latest
    needs: deploy-production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME_PROD }} --region ${{ env.AWS_REGION }}

      - name: Rollback deployment
        run: |
          kubectl rollout undo deployment/monitoring-platform -n monitoring
          kubectl rollout status deployment/monitoring-platform -n monitoring --timeout=10m

      - name: Send rollback notification
        uses: slackapi/slack-github-action@v1
        with:
          slack-message: "Rollback triggered for ${{ github.repository }}. Please investigate the failure."
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
