name: CD - 持续部署

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送 Docker 镜像
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  deploy-staging:
    name: 部署到预发布环境
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.chaoslab.io
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Kubernetes 上下文
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.STAGING_KUBE_CONFIG }}

      - name: 部署到 Staging
        run: |
          IMAGE_TAG="${{ needs.build-and-push-image.outputs.image_tag }}"
          sed "s|{{IMAGE_TAG}}|$IMAGE_TAG|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/chaoslab -n chaoslab
          kubectl get pods -n chaoslab

  deploy-production:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://chaoslab.io
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Kubernetes 上下文
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.PRODUCTION_KUBE_CONFIG }}

      - name: 部署到 Production
        run: |
          IMAGE_TAG="${{ needs.build-and-push-image.outputs.image_tag }}"
          sed "s|{{IMAGE_TAG}}|$IMAGE_TAG|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/chaoslab -n chaoslab
          kubectl get pods -n chaoslab

  notify:
    name: 发送通知
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: 发送 Slack 通知
        uses: slackapi/slack-github-action@v1.24.0
        if: success()
        with:
          channel-id: ${{ secrets.SLACK_DEPLOY_CHANNEL }}
          slack-message: |
            ✅ *ChaosLab 部署成功*
            环境: ${{ github.event.inputs.environment || 'staging' }}
            版本: ${{ github.sha }}
            触发者: ${{ github.actor }}
            ${{ needs.build-and-push-image.outputs.image_tag }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 发送失败通知
        uses: slackapi/slack-github-action@v1.24.0
        if: failure()
        with:
          channel-id: ${{ secrets.SLACK_DEPLOY_CHANNEL }}
          slack-message: |
            ❌ *ChaosLab 部署失败*
            环境: ${{ github.event.inputs.environment || 'staging' }}
            版本: ${{ github.sha }}
            触发者: ${{ github.actor }}
            请查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
