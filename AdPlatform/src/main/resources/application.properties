server.port=8080
spring.application.name=ad-platform

spring.datasource.url=jdbc:mysql://localhost:3306/ad_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

logging.level.com.adplatform=DEBUG

# 锁超时配置
adplatform.lock.default-wait-time=5
adplatform.lock.default-lease-time=30
adplatform.lock.levels.critical.wait-time=1
adplatform.lock.levels.critical.lease-time=5
adplatform.lock.levels.high.wait-time=2
adplatform.lock.levels.high.lease-time=10
adplatform.lock.levels.normal.wait-time=5
adplatform.lock.levels.normal.lease-time=30
adplatform.lock.levels.low.wait-time=10
adplatform.lock.levels.low.lease-time=60

# 投放任务队列配置
adplatform.placement.queue-name=ad:placement:tasks
adplatform.placement.delayed-queue-name=ad:placement:delayed
adplatform.placement.worker-threads=3
adplatform.placement.max-retries=3
adplatform.placement.retry-interval=5

# 效果数据队列配置
adplatform.effect.queue-name=ad:effect:events
adplatform.effect.worker-threads=2
adplatform.effect.batch-size=100
adplatform.effect.batch-interval=1

# 定向类型配置
adplatform.targeting.types.demographic.required-fields[0]=age
adplatform.targeting.types.demographic.optional-fields[0]=gender
adplatform.targeting.types.demographic.optional-fields[1]=income
adplatform.targeting.types.demographic.optional-fields[2]=education

adplatform.targeting.types.geographic.required-fields[0]=location
adplatform.targeting.types.geographic.optional-fields[0]=cities
adplatform.targeting.types.geographic.optional-fields[1]=provinces

adplatform.targeting.types.behavior.required-fields[0]=behaviors
adplatform.targeting.types.behavior.optional-fields[0]=frequency
adplatform.targeting.types.behavior.optional-fields[1]=recency

adplatform.targeting.types.interest.required-fields[0]=interests
adplatform.targeting.types.interest.optional-fields[0]=categories
adplatform.targeting.types.interest.optional-fields[1]=tags

adplatform.targeting.types.device.required-fields[0]=deviceType
adplatform.targeting.types.device.optional-fields[0]=os
adplatform.targeting.types.device.optional-fields[1]=appVersion
adplatform.targeting.types.device.optional-fields[2]=screenSize
