version: '3.8'
services:
  mysql:
    image: mysql:8.3.0
    environment:
      MYSQL_ROOT_PASSWORD: etltest
      MYSQL_DATABASE: etl_test
      MYSQL_USER: etl
      MYSQL_PASSWORD: etltest
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "etl", "-petltest"]
      interval: 5s
      timeout: 10s
      retries: 10
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etltest
      POSTGRES_DB: etl_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d etl_test"]
      interval: 5s
      timeout: 10s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: etladmin
      MINIO_ROOT_PASSWORD: etladmin123
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 10
