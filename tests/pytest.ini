[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -v
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    --timeout=30
    -p no:warnings
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    chaos: Chaos injection module tests
    audit: Command audit module tests
    boundary: Boundary value tests
    concurrent: Concurrent safety tests
    timeout: Timeout and degradation tests
    slow: Slow running tests
[coverage:run]
source = 
    ../src
omit =
    */node_modules/*
    */dist/*
    */__tests__/*
    */test_*.py
[coverage:report]
show_missing = true
skip_covered = false
fail_under = 70
