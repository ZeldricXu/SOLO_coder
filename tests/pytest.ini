[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --cov=src --cov-report=term-missing --cov-report=html
markers =
    unit: 单元测试
    integration: 集成测试
    boundary: 边界条件测试
    transaction: 事务测试
    validation: 参数校验测试
    slow: 慢测试
asyncio_mode = auto
