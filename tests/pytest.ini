[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --cov=. --cov-report=term-missing
markers =
    unit: Unit tests that don't require external services
    integration: Integration tests that require running services
    tracing: Tests for distributed tracing module
    notification: Tests for notification module
    profiling: Tests for profiling module
    slow: Tests that are slow to execute
