[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v --tb=short --strict-markers
markers =
    feature_store: 特征存储服务模块测试
    document_pipeline: 文档解析管道模块测试
    model_registry: 模型注册与版本模块测试
    consistency: 数据一致性测试
    concurrency: 并发隔离测试
    timeout: 超时降级测试
    smoke: 冒烟测试
    regression: 回归测试

asyncio_mode = auto
testpaths = .
