project_name: htest

before:
  hooks:
    - go mod tidy

builds:
  - id: htest
    main: ./cmd/htest
    binary: htest
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/htest/htest/internal/version.Version={{.Version}}
      - -X github.com/htest/htest/internal/version.Commit={{.Commit}}
      - -X github.com/htest/htest/internal/version.BuildTime={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: htest
    repository:
      owner: htest
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/htest/htest
    description: Multi-protocol API testing CLI (REST, gRPC, GraphQL, WebSocket)
    license: MIT
    install: |
      bin.install "htest"
    test: |
      system "#{bin}/htest --version"

release:
  github:
    owner: htest
    name: htest
  prerelease: auto
