[package]
name = "smart-preheat"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
cache-engine = { path = "../cache-engine" }
node-manager = { path = "../node-manager" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
