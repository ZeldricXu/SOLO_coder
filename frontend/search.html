<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - SnippetHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body x-data="{
    user: null,
    query: '',
    snippets: [],
    loading: false,
    error: null,
    sortBy: 'relevance',
    sortOrder: 'desc',
    language: '',
    tag: '',
    author: '',
    page: 1,
    pageSize: 20,
    total: 0,
    popularTags: [],
    languages: [],
    searchTimeout: null,
    init() {
        this.checkAuth();
        const urlParams = new URLSearchParams(window.location.search);
        this.query = urlParams.get('q') || '';
        this.tag = urlParams.get('tag') || '';
        this.language = urlParams.get('lang') || '';
        this.loadLanguages();
        this.loadPopularTags();
        if (this.query || this.tag || this.language) {
            this.doSearch();
        }
    },
    checkAuth() {
        if (isLoggedIn()) {
            this.user = { username: getCurrentUsername() };
        }
    },
    async loadLanguages() {
        try {
            this.languages = await apiGet('/search/languages');
        } catch (e) {}
    },
    async loadPopularTags() {
        try {
            this.popularTags = await apiGet('/search/tags?limit=30');
        } catch (e) {}
    },
    onSearchInput() {
        clearTimeout(this.searchTimeout);
        this.searchTimeout = setTimeout(() => {
            this.page = 1;
            this.doSearch();
        }, 300);
    },
    async doSearch() {
        this.loading = true;
        this.error = null;
        try {
            let url = `/search?q=${encodeURIComponent(this.query)}&page=${this.page}&page_size=${this.pageSize}&sort_by=${this.sortBy}&sort_order=${this.sortOrder}`;
            if (this.language) url += `&language=${this.language}`;
            if (this.tag) url += `&tag=${this.tag}`;
            if (this.author) url += `&author=${this.author}`;

            const data = await apiGet(url);
            this.snippets = data.items;
            this.total = data.total;
        } catch (e) {
            this.error = e.message;
        } finally {
            this.loading = false;
        }
    },
    changeSort(field) {
        if (this.sortBy === field) {
            this.sortOrder = this.sortOrder === 'desc' ? 'asc' : 'desc';
        } else {
            this.sortBy = field;
            this.sortOrder = 'desc';
        }
        this.page = 1;
        this.doSearch();
    },
    prevPage() {
        if (this.page > 1) {
            this.page--;
            this.doSearch();
        }
    },
    nextPage() {
        const totalPages = Math.ceil(this.total / this.pageSize);
        if (this.page < totalPages) {
            this.page++;
            this.doSearch();
        }
    },
    totalPages() {
        return Math.ceil(this.total / this.pageSize);
    },
    clearFilters() {
        this.query = '';
        this.language = '';
        this.tag = '';
        this.author = '';
        this.page = 1;
        this.snippets = [];
        this.total = 0;
    },
    logout() {
        removeToken();
        clearCurrentUser();
        this.user = null;
        window.location.href = '/';
    }
}">
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-brand">📝 SnippetHub</a>
            <div class="nav-links">
                <a href="/">Explore</a>
                <a href="/teams">Teams</a>
                <a href="/search">Search</a>
                <template x-if="user">
                    <>
                        <a :href="'/users/' + user.username">My Snippets</a>
                        <a href="/new" class="btn btn-primary btn-sm">+ New Snippet</a>
                        <div class="nav-user">
                            <div class="avatar" x-text="user.username.charAt(0).toUpperCase()" :style="'background: ' + getAvatarColor(user.username)"></div>
                            <button @click="logout" class="btn btn-secondary btn-sm">Logout</button>
                        </div>
                    </>
                </template>
                <template x-if="!user">
                    <>
                        <a href="/login">Login</a>
                        <a href="/register" class="btn btn-primary btn-sm">Sign Up</a>
                    </>
                </template>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <h1 class="page-title" style="margin-bottom: 20px;">Search Snippets</h1>

        <div class="search-bar">
            <input
                type="text"
                class="search-input"
                x-model="query"
                @input="onSearchInput()"
                placeholder="Search by title, description, or code..."
            >
            <button @click="page = 1; doSearch()" class="btn btn-primary">Search</button>
        </div>

        <div class="filters">
            <div class="filter-item">
                <span>Language:</span>
                <select class="filter-select" x-model="language" @change="page = 1; doSearch()">
                    <option value="">All languages</option>
                    <template x-for="lang in languages" :key="lang.language">
                        <option :value="lang.language" x-text="lang.language + ' (' + lang.count + ')'"></option>
                    </template>
                </select>
            </div>
            <div class="filter-item">
                <span>Sort by:</span>
                <select class="filter-select" x-model="sortBy" @change="page = 1; doSearch()">
                    <option value="relevance">Relevance</option>
                    <option value="updated_at">Recently Updated</option>
                    <option value="created_at">Recently Created</option>
                    <option value="stars_count">Most Stars</option>
                    <option value="forks_count">Most Forks</option>
                    <option value="views_count">Most Views</option>
                </select>
            </div>
            <div class="filter-item">
                <select class="filter-select" x-model="sortOrder" @change="doSearch()">
                    <option value="desc">Descending</option>
                    <option value="asc">Ascending</option>
                </select>
            </div>
            <template x-if="tag">
                <span class="tag" style="cursor: pointer;" @click="tag = ''; page = 1; doSearch()">
                    #<span x-text="tag"></span> ✕
                </span>
            </template>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 250px; gap: 24px;">
            <div>
                <div x-show="loading" class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 12px;">Searching...</p>
                </div>

                <div x-show="error && !loading" class="alert alert-error" x-text="error"></div>

                <div x-show="!loading && snippets.length === 0 && (query || tag || language)" class="card">
                    <div class="card-body" style="text-align: center; color: var(--text-muted);">
                        <p style="font-size: 3rem; margin-bottom: 12px;">🔍</p>
                        <p>No snippets found matching your search.</p>
                        <button @click="clearFilters()" class="btn btn-secondary" style="margin-top: 12px;">Clear filters</button>
                    </div>
                </div>

                <div x-show="!loading && !query && !tag && !language" class="card">
                    <div class="card-body" style="text-align: center; color: var(--text-muted);">
                        <p style="font-size: 3rem; margin-bottom: 12px;">🔍</p>
                        <p>Enter a search query to find code snippets.</p>
                    </div>
                </div>

                <div x-show="!loading && snippets.length > 0">
                    <p style="margin-bottom: 12px; color: var(--text-muted); font-size: 0.9rem;">
                        Found <strong x-text="total"></strong> snippets
                    </p>

                    <div class="snippets-grid">
                        <template x-for="snippet in snippets" :key="snippet.id">
                            <div class="snippet-card">
                                <div class="snippet-card-header">
                                    <a :href="'/snippets/' + snippet.id" class="snippet-title" x-text="snippet.title"></a>
                                    <span class="snippet-lang" x-text="snippet.language"></span>
                                </div>
                                <div class="snippet-desc" x-show="snippet.description" x-text="snippet.description"></div>
                                <div class="snippet-tags">
                                    <template x-for="tagName in snippet.tags" :key="tagName">
                                        <span class="tag" x-text="'#' + tagName"></span>
                                    </template>
                                </div>
                                <div class="snippet-footer">
                                    <div class="snippet-meta">
                                        <a :href="'/users/' + snippet.author_username" class="snippet-stat">
                                            <span>👤</span>
                                            <span x-text="snippet.author_username"></span>
                                        </a>
                                        <span class="snippet-stat" x-text="'🕒 ' + formatDate(snippet.updated_at)"></span>
                                    </div>
                                    <div class="snippet-stats">
                                        <span class="snippet-stat" x-text="'⭐ ' + snippet.stars_count"></span>
                                        <span class="snippet-stat" x-text="'🍴 ' + snippet.forks_count"></span>
                                        <span class="snippet-stat" x-text="'👁 ' + snippet.views_count"></span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <div x-show="totalPages() > 1" class="pagination">
                        <button @click="prevPage()" :disabled="page === 1">Previous</button>
                        <span style="display: flex; align-items: center; gap: 4px;">
                            Page <span x-text="page"></span> of <span x-text="totalPages()"></span>
                        </span>
                        <button @click="nextPage()" :disabled="page >= totalPages()">Next</button>
                    </div>
                </div>
            </div>

            <div>
                <div class="card" style="margin-bottom: 16px;">
                    <div class="card-header">
                        <h3 style="font-size: 0.95rem;">Popular Tags</h3>
                    </div>
                    <div class="card-body">
                        <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                            <template x-for="t in popularTags" :key="t.name">
                                <span
                                    class="tag"
                                    style="cursor: pointer;"
                                    :class="{ 'bg-primary text-white': t.name === tag }"
                                    @click="tag = t.name; page = 1; doSearch()"
                                    x-text="'#' + t.name"
                                ></span>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
