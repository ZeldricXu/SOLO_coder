<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能API聚合网关与知识库问答系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 20px;
            height: calc(100vh - 40px);
        }

        .sidebar {
            background: white;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow-y: auto;
        }

        .logo {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .logo h1 {
            font-size: 18px;
            color: #333;
            margin-bottom: 4px;
        }

        .logo p {
            font-size: 12px;
            color: #999;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .upload-area input {
            display: none;
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
            background: #f0f2ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .upload-text {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 12px;
            color: #aaa;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .task-status {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
        }

        .task-status.hidden {
            display: none;
        }

        .task-status .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .status.processing {
            background: #cce5ff;
            color: #004085;
        }

        .status.completed {
            background: #d4edda;
            color: #155724;
        }

        .status.failed {
            background: #f8d7da;
            color: #721c24;
        }

        .task-info {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }

        .main-content {
            background: white;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }

        .chat-options {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-options label {
            font-size: 13px;
            color: #666;
        }

        .chat-options input[type="checkbox"] {
            margin-left: 4px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 16px 20px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 14px;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background: #f5f7fb;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message.assistant .context-info {
            background: #e8f0fe;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #555;
        }

        .message.assistant .context-info strong {
            color: #667eea;
        }

        .message.assistant .context-item {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(102, 126, 234, 0.2);
        }

        .message.assistant .context-item:first-child {
            margin-top: 0;
            padding-top: 0;
            border-top: none;
        }

        .message.assistant .context-score {
            font-size: 11px;
            color: #999;
            margin-bottom: 4px;
        }

        .chat-input-area {
            padding: 20px 24px;
            border-top: 1px solid #eee;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            resize: none;
            max-height: 120px;
            min-height: 50px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
            text-align: center;
        }

        .empty-state-icon {
            width: 80px;
            height: 80px;
            background: #f0f2ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 18px;
            color: #666;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            color: #aaa;
        }

        .config-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 16px;
        }

        .config-section .section-title {
            margin-bottom: 16px;
        }

        .divider {
            height: 1px;
            background: #eee;
            margin: 20px 0;
        }

        .selected-file {
            margin-top: 12px;
            padding: 10px 14px;
            background: #f0f2ff;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #667eea;
        }

        .selected-file .remove-file {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
        }

        .selected-file .remove-file:hover {
            color: #e74c3c;
        }

        .selected-file.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <h1>智能API聚合网关</h1>
                <p>知识库问答系统 v1.0</p>
            </div>

            <div class="config-section">
                <div class="section-title">系统配置</div>
                <div class="form-group">
                    <label for="modelSelect">选择模型</label>
                    <select id="modelSelect">
                        <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                        <option value="gpt-4">GPT-4</option>
                        <option value="gpt-4-turbo">GPT-4 Turbo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="collectionSelect">目标集合</label>
                    <input type="text" id="collectionSelect" placeholder="输入集合名称" value="default">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="useRag" checked>
                        启用RAG检索增强
                    </label>
                </div>
            </div>

            <div class="divider"></div>

            <div>
                <div class="section-title">文档上传</div>
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="fileInput" accept=".txt,.pdf,.md">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">点击或拖拽文件到此处</div>
                    <div class="upload-hint">支持 .txt, .pdf, .md 格式</div>
                </div>
                <div class="selected-file hidden" id="selectedFile">
                    <span id="fileName"></span>
                    <button class="remove-file" id="removeFile">×</button>
                </div>
                <div class="form-group" style="margin-top: 16px;">
                    <label for="uploadCollection">上传到集合</label>
                    <input type="text" id="uploadCollection" placeholder="输入集合名称" value="default">
                </div>
                <button class="btn btn-primary" id="uploadBtn" disabled>上传并向量化</button>

                <div class="task-status hidden" id="taskStatus">
                    <div>
                        状态: <span class="status" id="statusBadge">pending</span>
                    </div>
                    <div class="task-info" id="taskInfo"></div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="chat-header">
                <h2>智能对话</h2>
                <div class="chat-options">
                    <label>
                        流式输出
                        <input type="checkbox" id="streamOutput" checked>
                    </label>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="empty-state" id="emptyState">
                    <div class="empty-state-icon">💬</div>
                    <h3>开始对话</h3>
                    <p>上传文档后，即可开始基于知识库的智能问答</p>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="chat-input-wrapper">
                    <textarea 
                        class="chat-input" 
                        id="messageInput" 
                        placeholder="输入您的问题..."
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="sendBtn">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        class RAGClient {
            constructor(baseUrl = '') {
                this.baseUrl = baseUrl;
            }

            async uploadFile(file, collectionName) {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('collection_name', collectionName);

                const response = await fetch(`${this.baseUrl}/api/v1/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || '上传失败');
                }

                return response.json();
            }

            async getTaskStatus(taskId) {
                const response = await fetch(`${this.baseUrl}/api/v1/task/${taskId}`);
                
                if (!response.ok) {
                    throw new Error('获取任务状态失败');
                }

                return response.json();
            }

            async chat(messages, options = {}) {
                const {
                    model = 'gpt-3.5-turbo',
                    collectionName = null,
                    stream = true,
                    useRag = true
                } = options;

                const response = await fetch(`${this.baseUrl}/api/v1/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: messages,
                        collection_name: useRag ? collectionName : null,
                        stream: stream
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || '对话请求失败');
                }

                return response;
            }

            async healthCheck() {
                const response = await fetch(`${this.baseUrl}/api/v1/health`);
                return response.json();
            }
        }

        const client = new RAGClient();
        let selectedFile = null;
        let chatHistory = [];

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const selectedFileDiv = document.getElementById('selectedFile');
        const fileNameSpan = document.getElementById('fileName');
        const removeFileBtn = document.getElementById('removeFile');
        const uploadBtn = document.getElementById('uploadBtn');
        const taskStatusDiv = document.getElementById('taskStatus');
        const statusBadge = document.getElementById('statusBadge');
        const taskInfo = document.getElementById('taskInfo');

        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');
        const emptyState = document.getElementById('emptyState');

        const modelSelect = document.getElementById('modelSelect');
        const collectionSelect = document.getElementById('collectionSelect');
        const uploadCollection = document.getElementById('uploadCollection');
        const useRagCheckbox = document.getElementById('useRag');
        const streamCheckbox = document.getElementById('streamOutput');

        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            const allowedTypes = ['.txt', '.pdf', '.md'];
            const ext = '.' + file.name.split('.').pop().toLowerCase();
            
            if (!allowedTypes.includes(ext)) {
                alert('不支持的文件类型。请上传 .txt, .pdf, 或 .md 文件。');
                return;
            }

            selectedFile = file;
            fileNameSpan.textContent = `${file.name} (${formatFileSize(file.size)})`;
            selectedFileDiv.classList.remove('hidden');
            uploadBtn.disabled = false;
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        removeFileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            selectedFile = null;
            fileInput.value = '';
            selectedFileDiv.classList.add('hidden');
            uploadBtn.disabled = true;
        });

        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            uploadBtn.disabled = true;
            uploadBtn.textContent = '上传中...';
            taskStatusDiv.classList.remove('hidden');
            updateTaskStatus('pending', '正在上传文件...');

            try {
                const result = await client.uploadFile(
                    selectedFile,
                    uploadCollection.value || 'default'
                );

                updateTaskStatus('pending', `任务已提交，ID: ${result.task_id}`);
                
                pollTaskStatus(result.task_id);

            } catch (error) {
                updateTaskStatus('failed', error.message);
                uploadBtn.disabled = false;
                uploadBtn.textContent = '上传并向量化';
            }
        });

        async function pollTaskStatus(taskId) {
            const maxAttempts = 60;
            let attempts = 0;

            while (attempts < maxAttempts) {
                try {
                    const status = await client.getTaskStatus(taskId);
                    
                    updateTaskStatus(
                        status.status,
                        `处理进度: ${status.processed_chunks}/${status.total_chunks || '?'} 块`
                    );

                    if (status.status === 'completed') {
                        uploadBtn.disabled = false;
                        uploadBtn.textContent = '上传并向量化';
                        selectedFile = null;
                        fileInput.value = '';
                        selectedFileDiv.classList.add('hidden');
                        return;
                    }

                    if (status.status === 'failed') {
                        uploadBtn.disabled = false;
                        uploadBtn.textContent = '上传并向量化';
                        return;
                    }

                } catch (error) {
                    console.error('轮询状态失败:', error);
                }

                attempts++;
                await new Promise(resolve => setTimeout(resolve, 2000));
            }
        }

        function updateTaskStatus(status, info) {
            statusBadge.className = `status ${status}`;
            statusBadge.textContent = getStatusText(status);
            taskInfo.textContent = info;
        }

        function getStatusText(status) {
            const map = {
                'pending': '等待中',
                'processing': '处理中',
                'completed': '已完成',
                'failed': '失败'
            };
            return map[status] || status;
        }

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            emptyState.style.display = 'none';
            messageInput.value = '';
            messageInput.style.height = 'auto';

            chatHistory.push({
                role: 'user',
                content: message
            });
            addMessage('user', message);

            sendBtn.disabled = true;

            try {
                const response = await client.chat(
                    chatHistory,
                    {
                        model: modelSelect.value,
                        collectionName: collectionSelect.value,
                        stream: streamCheckbox.checked,
                        useRag: useRagCheckbox.checked
                    }
                );

                if (streamCheckbox.checked) {
                    await handleStreamResponse(response);
                } else {
                    await handleNonStreamResponse(response);
                }

            } catch (error) {
                addMessage('assistant', `错误: ${error.message}`);
            } finally {
                sendBtn.disabled = false;
            }
        }

        async function handleStreamResponse(response) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let assistantMessage = '';
            let currentMessageEl = null;
            let contextShown = false;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.slice(6));
                            
                            if (data.type === 'ping') {
                                console.log('收到心跳:', data.data);
                                continue;
                            }
                            
                            if (data.type === 'context' && !contextShown) {
                                const contextHtml = buildContextHtml(data.data);
                                if (!currentMessageEl) {
                                    currentMessageEl = addMessage('assistant', '', true);
                                }
                                const contextDiv = document.createElement('div');
                                contextDiv.className = 'context-info';
                                contextDiv.innerHTML = contextHtml;
                                currentMessageEl.insertBefore(contextDiv, currentMessageEl.firstChild);
                                contextShown = true;
                            }
                            
                            if (data.type === 'content') {
                                if (!currentMessageEl) {
                                    currentMessageEl = addMessage('assistant', '', true);
                                }
                                assistantMessage += data.data;
                                updateMessageContent(currentMessageEl, assistantMessage, contextShown);
                            }
                            
                            if (data.type === 'error') {
                                if (!currentMessageEl) {
                                    currentMessageEl = addMessage('assistant', '', true);
                                }
                                const errorContent = `错误: ${data.data}`;
                                updateMessageContent(currentMessageEl, errorContent, contextShown);
                                chatHistory.push({
                                    role: 'assistant',
                                    content: errorContent
                                });
                            }
                            
                            if (data.type === 'done') {
                                if (assistantMessage) {
                                    chatHistory.push({
                                        role: 'assistant',
                                        content: assistantMessage
                                    });
                                }
                            }

                        } catch (e) {
                            console.error('解析SSE数据失败:', e, '原始数据:', line);
                        }
                    }
                }
            }
        }

        async function handleNonStreamResponse(response) {
            const data = await response.json();
            addMessage('assistant', data.content);
            chatHistory.push({
                role: 'assistant',
                content: data.content
            });
        }

        function buildContextHtml(contexts) {
            if (!contexts || contexts.length === 0) return '';
            
            let html = '<strong>📚 检索到的相关文档:</strong>';
            contexts.forEach((ctx, idx) => {
                const score = (ctx.score * 100).toFixed(1);
                const preview = ctx.content.substring(0, 150) + (ctx.content.length > 150 ? '...' : '');
                html += `
                    <div class="context-item">
                        <div class="context-score">相似度: ${score}%</div>
                        <div>${escapeHtml(preview)}</div>
                    </div>
                `;
            });
            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addMessage(role, content, isStreaming = false) {
            const messageEl = document.createElement('div');
            messageEl.className = `message ${role}`;
            
            if (role === 'assistant' && isStreaming) {
                messageEl.innerHTML = `
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                `;
            } else {
                messageEl.textContent = content;
            }

            chatMessages.appendChild(messageEl);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            return messageEl;
        }

        function updateMessageContent(element, content, hasContext) {
            const typingIndicator = element.querySelector('.typing-indicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }

            let contentEl = element.querySelector('.message-content');
            if (!contentEl) {
                contentEl = document.createElement('div');
                contentEl.className = 'message-content';
                element.appendChild(contentEl);
            }
            
            contentEl.textContent = content;
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        window.addEventListener('load', async () => {
            try {
                await client.healthCheck();
                console.log('服务连接正常');
            } catch (error) {
                console.warn('无法连接到后端服务:', error);
            }
        });
    </script>
</body>
</html>
