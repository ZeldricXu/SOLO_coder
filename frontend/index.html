<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荷兰式拍卖平台</title>
    <script>
        window.API_BASE_URL = 'http://localhost:8080/api/v1';
        window.SSE_BASE_URL = 'http://localhost:8080/api/v1/sse';
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            color: #1a1a2e;
            min-height: 100vh;
        }
        
        #app {
            min-height: 100vh;
        }
        
        .price-animated {
            transition: all 0.3s ease;
        }
        
        .price-animated.price-down {
            animation: priceFlashDown 0.5s ease;
        }
        
        @keyframes priceFlashDown {
            0% { background-color: rgba(34, 197, 94, 0.3); transform: scale(1.05); }
            100% { background-color: transparent; transform: scale(1); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .loading {
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module">
        import init from './pkg/frontend.js';
        init();
    </script>
</body>
</html>
