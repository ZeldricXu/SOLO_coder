run:
  timeout: 5m
  tests: true
  build-tags:
    - integration
  skip-dirs:
    - vendor/
    - .git/
    - node_modules/
  skip-files:
    - ".*_mock\\.go$"
    - ".*_generated\\.go$"

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
  sort-by-severity: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - decorder
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - execinquery
    - exhaustive
    - exportloopref
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - godot
    - gofmt
    - gofumpt
    - goheader
    - goimports
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - grouper
    - importas
    - interfacebloat
    - makezero
    - misspell
    - mnd
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nonamedreturns
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - tenv
    - testableexamples
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl
  fast: false

linters-settings:
  govet:
    enable:
      - shadow
      - asmdecl
      - assign
      - atomic
      - bools
      - buildtag
      - cgocall
      - composites
      - copylocks
      - deepequalerrors
      - errorsas
      - fieldalignment
      - findcall
      - framepointer
      - httpresponse
      - ifaceassert
      - loopclosure
      - lostcancel
      - nilfunc
      - nilness
      - printf
      - reflectvaluecompare
      - shadow
      - shift
      - sigchanyzer
      - sortslice
      - stdmethods
      - stringintconv
      - structtag
      - testinggoroutine
      - tests
      - unmarshal
      - unreachable
      - unsafeptr
      - unusedresult
  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104
  revive:
    severity: warning
    rules:
      - name: exported
        severity: warning
      - name: errorf
        severity: warning
      - name: if-return
        severity: warning
      - name: range
        severity: warning
      - name: receiver-naming
        severity: warning
      - name: time-naming
        severity: warning
      - name: unexported-return
        severity: warning
      - name: error-strings
        severity: warning
      - name: error-naming
        severity: warning
      - name: increment-decrement
        severity: warning
      - name: var-declaration
        severity: warning
      - name: dot-imports
        severity: error
      - name: blank-imports
        severity: error
  misspell:
    locale: US
    ignore-words:
      - logrotate
  gofumpt:
    extra-rules: true
  wrapcheck:
    ignoreSigs:
      - "fmt.Errorf("
      - "errors.New("
      - "errors.Unwrap("
      - "errors.Join("
      - "errors.Is("
      - "errors.As("
  mnd:
    checks:
      - argument
      - case
      - condition
      - operation
      - return
      - assign
    ignored-functions:
      - "os.OpenFile"
      - "os.Chmod"
      - "syscall.Open"
      - "strconv.FormatInt"
      - "strconv.ParseInt"
      - "time.Sleep"
    ignored-numbers:
      - "0"
      - "1"
      - "2"
      - "100"
  errorlint:
    errorf: true
    asserts: true
    comparison: true
  gocritic:
    enabled-tags:
      - performance
      - style
      - experimental
      - diagnostic
      - opinionated
    disabled-tags:
      - deprecated
    settings:
      hugeParam:
        sizeThreshold: 80
      rangeValCopy:
        sizeThreshold: 128
      nestingReduce:
        bodyWidth: 5
  gocyclo:
    min-complexity: 15
  goconst:
    min-len: 3
    min-occurrences: 3
  prealloc:
    simple: true
    range-loops: true
    for-loops: true
  goheader:
    values:
      const:
        - company: "SoloCoder"
    template: |-
      Copyright (c) {{ YEAR }} SoloCoder
      SPDX-License-Identifier: MIT
  godot:
    scope: all
    top: true
    exclude:
      - ^.*\\.$
  nlreturn:
    block-size: 3
  wsl:
    strict-append: true
    allow-assign-and-anything: false
    allow-trailing-comment: false
    force-case-trailing-whitespace: 0
    force-err-cuddling: false

severity:
  default-severity: error
  case-sensitive: true
  rules:
    - linters:
        - errcheck
      severity: warning
    - linters:
        - gosimple
      severity: warning
    - linters:
        - staticcheck
      severity: error
    - linters:
        - gosec
      severity: error

issues:
  exclude-dirs:
    - vendor
    - testdata
    - examples
  exclude-files:
    - ".*_test\\.go$"
    - ".*_mock\\.go$"
  exclude-rules:
    - path: "cmd/"
      linters:
        - gochecknoglobals
    - path: "_test\\.go"
      linters:
        - noctx
        - wrapcheck
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
  fix: false
