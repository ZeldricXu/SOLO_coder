run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor/
    - .git/
    - node_modules/
    - testdata/
  skip-files:
    - ".*_mock\\.go$"
    - ".*_gen\\.go$"
    - ".*\\.pb\\.go$"

linters:
  disable-all: false
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - asciicheck
    - bodyclose
    - contextcheck
    - cyclop
    - decorder
    - dogsled
    - dupl
    - durationcheck
    - errname
    - errorlint
    - exportloopref
    - forbidigo
    - funlen
    - gci
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - goerr113
    - gofmt
    - gofumpt
    - goheader
    - goimports
    - gomnd
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - grouper
    - importas
    - interfacebloat
    - lll
    - loggercheck
    - maintidx
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nonamedreturns
    - nosprintfhostport
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - stylecheck
    - tagalign
    - tagliatelle
    - tenv
    - testableexamples
    - testpackage
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl
  disable:
    - exhaustivestruct
    - exhaustruct
    - forbidigo
    - gochecknoglobals
    - godox
    - gomnd
    - noctx
    - nonamedreturns
    - testpackage
    - wrapcheck
    - wsl
  fast: false

linters-settings:
  cyclop:
    max-complexity: 15
    package-average: 10.0
    skip-tests: true
  funlen:
    lines: 100
    statements: 50
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/streamsql)
    custom-order: true
  gocognit:
    min-complexity: 15
  gocyclo:
    min-complexity: 15
  godot:
    scope: declarations
    capital: true
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/streamsql/streamsql
  gosec:
    excludes:
      - G104
      - G204
      - G304
      - G307
  govet:
    enable-all: true
    disable:
      - shadow
  lll:
    line-length: 120
    tab-width: 4
  misspell:
    locale: US
    ignore-words: []
  nakedret:
    max-func-lines: 30
  nestif:
    min-complexity: 4
  nolintlint:
    allow-unused: false
    require-explanation: true
    require-specific: true
  prealloc:
    simple: true
    range-loops: true
    for-loops: true
  revive:
    rules:
      - name: exported
        severity: warning
      - name: blank-imports
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: increment-decrement
      - name: var-declaration
      - name: unused-parameter
      - name: unreachable-code
  stylecheck:
    checks: ["all", "-ST1000", "-ST1003"]
  tagliatelle:
    case:
      rules:
        json: snake
        yaml: snake
        toml: snake
  varnamelen:
    min-name-length: 2
    max-distance: 50
    check-receiver: true
    check-return: true
    check-type-param: true
    ignore-names:
      - err
      - id
      - c
      - w
      - r
      - t
      - ok

issues:
  exclude-dirs:
    - vendor/
    - .git/
    - node_modules/
    - testdata/
  exclude-files:
    - ".*_mock\\.go$"
    - ".*_gen\\.go$"
    - ".*\\.pb\\.go$"
  exclude-rules:
    - path: "_test\\.go$"
      linters:
        - funlen
        - gocognit
        - gocyclo
        - err113
        - noctx
    - path: "cmd/"
      linters:
        - gochecknoinits
    - text: "ST1000:"
      linters:
        - stylecheck
  fix: false
  max-issues-per-linter: 100
  max-same-issues: 10
  new: false
