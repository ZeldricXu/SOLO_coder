run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
    - bin
    - data
    - coverage

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - prealloc
    - gosec
    - nakedret
    - nilerr
    - errorlint
    - noctx
    - dogsled
    - durationcheck
    - exportloopref
    - forcetypeassert
    - gochecknoinits
    - gocritic
    - godot
    - godox
    - goheader
    - gomnd
    - gomoddirectives
    - goprintffuncname
    - gosec
    - makezero
    - nilnil
    - promlinter
    - reassign
    - tenv
    - usestdlibvars
    - wastedassign
    - whitespace

  disable:
    - exhaustivestruct
    - exhaustruct
    - wrapcheck
    - nlreturn
    - wsl
    - testpackage
    - goerr113
    - tagliatelle
    - varnamelen

  fast: false

linters-settings:
  govet:
    check-shadowing: true
    settings:
      printf:
        funcs:
          - (github.com/edgevision/edgevision/internal/common/logger.Logger).Infof
          - (github.com/edgevision/edgevision/internal/common/logger.Logger).Errorf
          - (github.com/edgevision/edgevision/internal/common/logger.Logger).Warnf
          - (github.com/edgevision/edgevision/internal/common/logger.Logger).Debugf

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/edgevision/edgevision

  gocyclo:
    min-complexity: 15

  gocognit:
    min-complexity: 20

  gosec:
    excludes:
      - G404
      - G501
      - G505

  misspell:
    locale: US
    ignore-words:
      - edgevision
      - ota
      - opcua

  gomnd:
    settings:
      mnd:
        checks:
          - argument
          - case
          - condition
          - operation
          - return
          - assign
        ignored-numbers:
          - '0'
          - '1'
          - '2'
          - '3'
          - '10'
          - '100'
          - '1000'
          - '60'
          - '30'
          - '180'
          - '0.75'
          - '0.95'

  godox:
    keywords:
      - TODO
      - FIXME
      - HACK
      - OPTIMIZE
      - BUG

  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
      - experimental
      - opinionated
    disabled-checks:
      - hugeParam
      - rangeValCopy

  nakedret:
    max-func-lines: 30

  errorlint:
    errorf: true
    asserts: true
    comparison: true

  nolintlint:
    allow-leading-space: true
    allow-unused: false
    require-explanation: true
    require-specific: true

issues:
  exclude-dirs:
    - vendor
    - bin
    - data
    - coverage

  exclude-files:
    - ".*_test\\.go$"

  exclude-rules:
    - path: "_test\\.go"
      linters:
        - funlen
        - goconst
        - errcheck
        - gosec

    - linters:
        - lll
      source: "^//go:generate "

    - linters:
        - gochecknoinits
      path: "cmd/"

    - linters:
        - gomnd
      text: "time\\."

  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

severity:
  default-severity: error
  case-sensitive: true
  rules:
    - linters:
        - gosec
        - errcheck
      severity: critical
    - linters:
        - unused
        - typecheck
      severity: critical
    - linters:
        - gofmt
        - misspell
      severity: minor
