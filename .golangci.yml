run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  skip-dirs:
    - bin
    - .coverage
    - scripts

output:
  formats:
    - format: colored-line-number
  sort-results: true

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - gocritic
    - gofmt
    - goimports
    - misspell
    - nakedret
    - prealloc
    - unconvert
    - unparam
    - whitespace
    - gocognit
    - goconst
    - goprintffuncname
    - nestif
    - noctx
    - revive
    - exportloopref
  disable:
    - depguard
    - exhaustruct
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - lll
    - wsl

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
    exclude-functions:
      - fmt.Println
      - fmt.Printf
      - fmt.Sprintf
      - fmt.Print
      - fmt.Fprintln
      - fmt.Fprintf
      - fmt.Fprint

  govet:
    enable-all: true
    disable:
      - fieldalignment

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam
      - rangeValCopy

  gocognit:
    min-complexity: 20

  nestif:
    min-complexity: 6

  goconst:
    min-len: 3
    min-occurrences: 4
    ignore-tests: true

  misspell:
    locale: US

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: increment-decrement
      - name: indent-error-flow
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: var-declaration
      - name: var-naming

  goimports:
    local-prefixes: session287

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gocognit
        - goconst
        - errcheck
        - nestif
    - path: main\.go
      linters:
        - gocognit
        - nestif
  max-issues-per-linter: 50
  max-same-issues: 5
  fix: false

severity:
  default-severity: warning
  rules:
    - linters:
        - errcheck
        - govet
        - staticcheck
      severity: error
