run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
    - .git
    - node_modules

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - gosec
    - unconvert
    - prealloc
    - nolintlint
    - asciicheck
    - bidichk
  disable:
    - typecheck

linters-settings:
  goimports:
    local-prefixes: model-inference-platform
  misspell:
    locale: US
  gosec:
    severity: medium
    confidence: medium
  govet:
    settings:
      printf:
        funcs:
          - (github.com/go-kit/kit/log.Logger).Log
          - (go.uber.org/zap.Logger).Debug
          - (go.uber.org/zap.Logger).Info
          - (go.uber.org/zap.Logger).Warn
          - (go.uber.org/zap.Logger).Error

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
  exclude-dirs:
    - testdata
  max-issues-per-linter: 0
  max-same-issues: 0
