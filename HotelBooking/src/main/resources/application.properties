spring.application.name=HotelBooking
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/hotel_booking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=60000

hotelbooking.lock.default-level=NORMAL
hotelbooking.lock.timeouts.VIP.timeout=3
hotelbooking.lock.timeouts.VIP.unit=SECONDS
hotelbooking.lock.timeouts.VIP.description=VIP客户短超时快速响应
hotelbooking.lock.timeouts.NORMAL.timeout=10
hotelbooking.lock.timeouts.NORMAL.unit=SECONDS
hotelbooking.lock.timeouts.NORMAL.description=普通客户长超时等待
hotelbooking.lock.timeouts.GOLD.timeout=5
hotelbooking.lock.timeouts.GOLD.unit=SECONDS
hotelbooking.lock.timeouts.GOLD.description=金卡客户中等超时
hotelbooking.lock.timeouts.PLATINUM.timeout=2
hotelbooking.lock.timeouts.PLATINUM.unit=SECONDS
hotelbooking.lock.timeouts.PLATINUM.description=铂金客户最短超时

hotelbooking.fee.validation.tolerance=0.01
hotelbooking.fee.validation.types.ROOM.name=住宿费用
hotelbooking.fee.validation.types.ROOM.description=房间住宿费用校验
hotelbooking.fee.validation.types.ROOM.enabled=true
hotelbooking.fee.validation.types.ROOM.validation-type=DAYS_BASED
hotelbooking.fee.validation.types.ROOM.rules[0]=POSITIVE_DAYS
hotelbooking.fee.validation.types.ROOM.rules[1]=DAYS_MULTIPLIER
hotelbooking.fee.validation.types.ROOM.rules[2]=MINIMUM_CHARGE
hotelbooking.fee.validation.types.ROOM.parameters.min-days=1
hotelbooking.fee.validation.types.SERVICE.name=服务费用
hotelbooking.fee.validation.types.SERVICE.description=客房服务费用校验
hotelbooking.fee.validation.types.SERVICE.enabled=true
hotelbooking.fee.validation.types.SERVICE.validation-type=ITEMS_BASED
hotelbooking.fee.validation.types.SERVICE.rules[0]=COMPLETED_ONLY
hotelbooking.fee.validation.types.SERVICE.rules[1]=ITEM_SUM
hotelbooking.fee.validation.types.SERVICE.rules[2]=CHARGE_VALIDATION
hotelbooking.fee.validation.types.TOTAL.name=总费用
hotelbooking.fee.validation.types.TOTAL.description=总费用校验
hotelbooking.fee.validation.types.TOTAL.enabled=true
hotelbooking.fee.validation.types.TOTAL.validation-type=SUM_BASED
hotelbooking.fee.validation.types.TOTAL.rules[0]=NON_NEGATIVE
hotelbooking.fee.validation.types.TOTAL.rules[1]=SUM_EQUALITY
hotelbooking.fee.validation.types.TOLERANCE=0.01

