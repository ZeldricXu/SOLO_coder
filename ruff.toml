line-length = 120
target-version = "py312"

[lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
]
ignore = [
    "E501",
    "W503",
    "B008",
    "SIM108",
]

[lint.per-file-ignores]
"tests/*" = ["S101", "S311", "E501"]
"app/models/*" = ["B008"]
"app/tasks/*" = ["E402"]

[format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
