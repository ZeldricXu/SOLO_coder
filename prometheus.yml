global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: production
    cluster: blockchain-infra
    region: cn-east

# 告警规则文件
rule_files:
  - "alert_rules.yml"

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# 抓取配置
scrape_configs:
  # Prometheus自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # API服务监控
  - job_name: 'bci-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'bci-api'
          component: 'api'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Celery Worker监控
  - job_name: 'bci-worker'
    static_configs:
      - targets: ['worker:9540']
        labels:
          service: 'bci-worker'
          component: 'worker'
    scrape_interval: 15s

  # PostgreSQL监控
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']
        labels:
          service: 'postgres'
          component: 'database'
    scrape_interval: 30s

  # Redis监控
  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'
    scrape_interval: 15s

  # Nginx监控
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx_exporter:9113']
        labels:
          service: 'nginx'
          component: 'load-balancer'
    scrape_interval: 15s

  # Docker主机监控
  - job_name: 'docker-host'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'docker'
          component: 'host'
    scrape_interval: 30s

  # 节点监控
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node'
          component: 'system'
    scrape_interval: 30s
