spring.application.name=FoodDelivery
server.port=8080

spring.datasource.url=jdbc:h2:mem:fooddelivery
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0
spring.redis.timeout=3000

fooddelivery.redis.queue=fooddelivery:notification:queue
fooddelivery.redis.offline-prefix=fooddelivery:offline:
fooddelivery.redis.worker-interval=5000

fooddelivery.lock.default-urgency=normal
fooddelivery.lock.timeouts.urgency.timeout=3
fooddelivery.lock.timeouts.urgency.unit=SECONDS
fooddelivery.lock.timeouts.urgency.description=紧急订单
fooddelivery.lock.timeouts.normal.timeout=10
fooddelivery.lock.timeouts.normal.unit=SECONDS
fooddelivery.lock.timeouts.normal.description=普通订单
fooddelivery.lock.timeouts.slow.timeout=30
fooddelivery.lock.timeouts.slow.unit=SECONDS
fooddelivery.lock.timeouts.slow.description=慢单

fooddelivery.push.default-strategy=batch
fooddelivery.push.batch-threshold=10
fooddelivery.push.strategies.pending_confirm.strategy=batch
fooddelivery.push.strategies.pending_confirm.description=等待餐厅确认
fooddelivery.push.strategies.pending_confirm.important=false
fooddelivery.push.strategies.confirmed.strategy=realtime
fooddelivery.push.strategies.confirmed.description=餐厅已确认
fooddelivery.push.strategies.confirmed.important=true
fooddelivery.push.strategies.pending_pickup.strategy=realtime
fooddelivery.push.strategies.pending_pickup.description=骑手待取餐
fooddelivery.push.strategies.pending_pickup.important=true
fooddelivery.push.strategies.picked_up.strategy=realtime
fooddelivery.push.strategies.picked_up.description=骑手已取餐
fooddelivery.push.strategies.picked_up.important=true
fooddelivery.push.strategies.delivering.strategy=batch
fooddelivery.push.strategies.delivering.description=配送中
fooddelivery.push.strategies.delivering.important=false
fooddelivery.push.strategies.delivered.strategy=realtime
fooddelivery.push.strategies.delivered.description=已送达
fooddelivery.push.strategies.delivered.important=true
fooddelivery.push.strategies.cancelled.strategy=realtime
fooddelivery.push.strategies.cancelled.description=已取消
fooddelivery.push.strategies.cancelled.important=true
fooddelivery.push.strategies.reviewed.strategy=batch
fooddelivery.push.strategies.reviewed.description=已评价
fooddelivery.push.strategies.reviewed.important=false

fooddelivery.restaurant.default-type=other
fooddelivery.restaurant.types.chinese_food.code=chinese_food
fooddelivery.restaurant.types.chinese_food.name=中餐
fooddelivery.restaurant.types.chinese_food.description=中餐、家常菜
fooddelivery.restaurant.types.chinese_food.icon=🍜
fooddelivery.restaurant.types.chinese_food.tags[0]=家常菜
fooddelivery.restaurant.types.chinese_food.tags[1]=川菜
fooddelivery.restaurant.types.chinese_food.tags[2]=粤菜
fooddelivery.restaurant.types.chinese_food.enabled=true
fooddelivery.restaurant.types.western_food.code=western_food
fooddelivery.restaurant.types.western_food.name=西餐
fooddelivery.restaurant.types.western_food.description=西餐、牛排、意面
fooddelivery.restaurant.types.western_food.icon=🍝
fooddelivery.restaurant.types.western_food.tags[0]=牛排
fooddelivery.restaurant.types.western_food.tags[1]=意面
fooddelivery.restaurant.types.western_food.tags[2]=披萨
fooddelivery.restaurant.types.western_food.enabled=true
fooddelivery.restaurant.types.japanese_food.code=japanese_food
fooddelivery.restaurant.types.japanese_food.name=日料
fooddelivery.restaurant.types.japanese_food.description=日式料理、寿司、拉面
fooddelivery.restaurant.types.japanese_food.icon=🍣
fooddelivery.restaurant.types.japanese_food.tags[0]=寿司
fooddelivery.restaurant.types.japanese_food.tags[1]=拉面
fooddelivery.restaurant.types.japanese_food.tags[2]=刺身
