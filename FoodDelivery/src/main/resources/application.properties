fooddelivery.restaurant.types.other.code=other
fooddelivery.restaurant.types.other.name=其他
fooddelivery.restaurant.types.other.description=其他类型
fooddelivery.restaurant.types.other.icon=🍽️
fooddelivery.restaurant.types.other.enabled=true
