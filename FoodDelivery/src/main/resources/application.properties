fooddelivery.restaurant.types.korean_food.code=korean_food
fooddelivery.restaurant.types.korean_food.name=韩餐
fooddelivery.restaurant.types.korean_food.description=韩式料理、烤肉
fooddelivery.restaurant.types.korean_food.icon=🍲
fooddelivery.restaurant.types.korean_food.tags[0]=烤肉
fooddelivery.restaurant.types.korean_food.tags[1]=拌饭
fooddelivery.restaurant.types.korean_food.tags[2]=泡菜
fooddelivery.restaurant.types.korean_food.enabled=true
fooddelivery.restaurant.types.fast_food.code=fast_food
fooddelivery.restaurant.types.fast_food.name=快餐
fooddelivery.restaurant.types.fast_food.description=汉堡、炸鸡、快餐
fooddelivery.restaurant.types.fast_food.icon=🍔
fooddelivery.restaurant.types.fast_food.tags[0]=汉堡
fooddelivery.restaurant.types.fast_food.tags[1]=炸鸡
fooddelivery.restaurant.types.fast_food.tags[2]=薯条
fooddelivery.restaurant.types.fast_food.enabled=true
fooddelivery.restaurant.types.dessert.code=dessert
fooddelivery.restaurant.types.dessert.name=甜品
fooddelivery.restaurant.types.dessert.description=蛋糕、奶茶、甜品
fooddelivery.restaurant.types.dessert.icon=🍰
fooddelivery.restaurant.types.dessert.tags[0]=蛋糕
