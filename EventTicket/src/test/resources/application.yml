server:
  port: 8081

spring:
  application:
    name: EventTicketTest
  
  datasource:
    url: jdbc:h2:mem:eventticket_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: false
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.eventticket: INFO
    org.hibernate.SQL: WARN
