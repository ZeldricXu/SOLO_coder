server:
  port: 8080

spring:
  application:
    name: EventTicket
  
  datasource:
    url: jdbc:mysql://localhost:3306/eventticket?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: password
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0

logging:
  level:
    com.eventticket: DEBUG
    org.hibernate.SQL: DEBUG
