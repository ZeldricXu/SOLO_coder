version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dataflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dataflow}
      POSTGRES_USER: ${POSTGRES_USER:-dataflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dataflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dataflow} -d ${POSTGRES_DB:-dataflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataflow-network

  redis:
    image: redis:7-alpine
    container_name: dataflow-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --appendonly yes --appendfsync everysec
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataflow-network

  mysql:
    image: mysql:8.0
    container_name: dataflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dataflow}
      MYSQL_USER: ${MYSQL_USER:-dataflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dataflow}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-dataflow}", "-p${MYSQL_PASSWORD:-dataflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataflow-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ghcr.io/${IMAGE_REPO:-dataflow-dashboard}:${IMAGE_TAG:-latest}
    container_name: dataflow-web
    restart: unless-stopped
    command: >
      gunicorn
      --bind 0.0.0.0:5000
      --workers ${GUNICORN_WORKERS:-4}
      --threads ${GUNICORN_THREADS:-2}
      --timeout 120
      --keep-alive 5
      --access-logfile -
      --error-logfile -
      --log-level info
      "app:create_app('${FLASK_ENV:-production}')"
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL:-postgresql://dataflow:dataflow@postgres:5432/dataflow}
      - REDIS_URL=${REDIS_URL:-redis://:redis_password@redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://:redis_password@redis:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://:redis_password@redis:6379/2}
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-true}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - ./instance:/app/instance
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - dataflow-network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ghcr.io/${IMAGE_REPO:-dataflow-dashboard}:${IMAGE_TAG:-latest}
    container_name: dataflow-celery-worker
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-2}
      --pool=prefork
      --queues=default,report,snapshot,maintenance
      --max-tasks-per-child=1000
      --time-limit=3600
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL:-postgresql://dataflow:dataflow@postgres:5432/dataflow}
      - REDIS_URL=${REDIS_URL:-redis://:redis_password@redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://:redis_password@redis:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://:redis_password@redis:6379/2}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - ./instance:/app/instance
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - dataflow-network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ghcr.io/${IMAGE_REPO:-dataflow-dashboard}:${IMAGE_TAG:-latest}
    container_name: dataflow-celery-beat
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_app beat
      --loglevel=info
      --schedule=/app/data/celerybeat-schedule
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL:-postgresql://dataflow:dataflow@postgres:5432/dataflow}
      - REDIS_URL=${REDIS_URL:-redis://:redis_password@redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://:redis_password@redis:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://:redis_password@redis:6379/2}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - ./instance:/app/instance
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dataflow-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mysql_data:
    driver: local

networks:
  dataflow-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
