version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

x-environment: &default-environment
  TZ: Asia/Shanghai

services:
  logrotate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: logrotate:${APP_VERSION:-dev}
    container_name: logrotate
    ports:
      - "8080:8080"
    environment:
      <<: *default-environment
      ENV: ${ENV:-dev}
      CONFIG_FILE: /app/configs/config.${ENV:-dev}.yaml
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-logrotate}
      DB_PASSWORD: ${DB_PASSWORD:-logrotate}
      DB_NAME: ${DB_NAME:-logrotate}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    volumes:
      - ./configs:/app/configs:ro
      - logrotate-logs:/var/log/logrotate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks:
      - logrotate-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: logrotate-postgres
    environment:
      <<: *default-environment
      POSTGRES_USER: ${DB_USER:-logrotate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-logrotate}
      POSTGRES_DB: ${DB_NAME:-logrotate}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-logrotate} -d ${DB_NAME:-logrotate}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - logrotate-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: logrotate-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - logrotate-network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: logrotate-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "14250:14250"
      - "14268:14268"
      - "9411:9411"
    environment:
      <<: *default-environment
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - logrotate-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: logrotate-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - logrotate-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: logrotate-grafana
    ports:
      - "3000:3000"
    environment:
      <<: *default-environment
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - logrotate-network
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: logrotate-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - logrotate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - logrotate-network
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  logrotate-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  logrotate-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
