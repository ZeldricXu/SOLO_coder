version: '3.8'

services:
  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    container_name: protein-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - protein-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: protein-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/protein_viewer
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      JAVA_OPTS: -Xms1g -Xmx8g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - protein-network
    deploy:
      resources:
        limits:
          memory: 9g
        reservations:
          memory: 2g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: protein-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - protein-network

  postgres:
    image: postgres:16-alpine
    container_name: protein-postgres
    environment:
      POSTGRES_DB: protein_viewer
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - protein-network

volumes:
  minio-data:
  postgres-data:

networks:
  protein-network:
    driver: bridge
