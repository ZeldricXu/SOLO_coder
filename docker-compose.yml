version: '3.8'

services:
  # ============================================
  # StreamSQL Application
  # ============================================
  streamsql:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-dev}
    container_name: streamsql
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - GIN_MODE=${GIN_MODE:-debug}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=streamsql
      - DB_PASSWORD=${DB_PASSWORD:-streamsql}
      - DB_NAME=streamsql
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - streamsql-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: streamsql-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamsql
      - POSTGRES_PASSWORD=${DB_PASSWORD:-streamsql}
      - POSTGRES_DB=streamsql
      - PGDATA=/var/lib/postgresql/data/pgdata
      - TZ=Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - streamsql-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamsql"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: streamsql-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --save 60 1
      --save 300 10
      --save 900 100
    volumes:
      - redis-data:/data
    networks:
      - streamsql-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================
  # pgAdmin (Optional)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: streamsql-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@streamsql.io
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    depends_on:
      - postgres
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - streamsql-network
    profiles:
      - devtools

  # ============================================
  # Prometheus (Optional)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: streamsql-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - streamsql-network
    profiles:
      - monitoring

  # ============================================
  # Grafana (Optional)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: streamsql-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - streamsql-network
    profiles:
      - monitoring

# ============================================
# Volumes
# ============================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  pgadmin-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  streamsql-network:
    driver: bridge
