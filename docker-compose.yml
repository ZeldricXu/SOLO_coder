# 协作引擎本地开发与 E2E 测试环境
version: "3.9"

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: collab-postgres
    environment:
      POSTGRES_DB: collab
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - collab-net

  # Redis 缓存与消息队列
  redis:
    image: redis:7-alpine
    container_name: collab-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - redis-data:/data
    networks:
      - collab-net

  # 数据库迁移 init container（占位，应用会自动初始化 Schema）
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collab-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://collab:collab-dev@postgres:5432/collab
    entrypoint: ["/bin/sh", "-c"]
    command:
      - echo "Migration init container placeholder - app will auto-init schema" && exit 0
    networks:
      - collab-net

  # 协作引擎实例 A
  collab-engine-a:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collab-engine-a
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "3001:3000"
      - "9091:9090"
    environment:
      DATABASE_URL: postgres://collab:collab-dev@postgres:5432/collab
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me
      RUST_LOG: info
      COLLAB_MODE: server
      NODE_ID: node-a
      PORT: "3000"
      METRICS_PORT: "9090"
    networks:
      - collab-net
    restart: on-failure

  # 协作引擎实例 B
  collab-engine-b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collab-engine-b
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "3002:3000"
      - "9092:9090"
    environment:
      DATABASE_URL: postgres://collab:collab-dev@postgres:5432/collab
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me
      RUST_LOG: info
      COLLAB_MODE: server
      NODE_ID: node-b
      PORT: "3000"
      METRICS_PORT: "9090"
    networks:
      - collab-net
    restart: on-failure

  # Prometheus 监控采集
  prometheus:
    image: prom/prometheus:v2.52-alpine
    container_name: collab-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - collab-net

  # Grafana 可视化监控面板
  grafana:
    image: grafana/grafana:10.4-ubuntu
    container_name: collab-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - collab-engine-a
      - prometheus
    networks:
      - collab-net
    restart: on-failure

volumes:
  postgres-data:
    name: collab-postgres-data
  redis-data:
    name: collab-redis-data
  prometheus-data:
    name: collab-prometheus-data
  grafana-data:
    name: collab-grafana-data

networks:
  collab-net:
    driver: bridge
    name: collab-net
