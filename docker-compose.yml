version: '3.8'

x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  restart: unless-stopped
  env_file: .env
  environment:
    - TZ=UTC
    - PYTHONPATH=/app
    - BCI_DATABASE__URL=postgresql+asyncpg://postgres:postgres@postgres:5432/blockchain_infra
    - BCI_REDIS__HOST=redis
    - BCI_CELERY__BROKER_URL=redis://redis:6379/0
    - BCI_CELERY__RESULT_BACKEND=redis://redis:6379/0
  volumes:
    - ./configs:/app/configs:ro
    - app-data:/app/data
    - app-logs:/app/logs
  networks:
    - blockchain-network
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # API服务
  api:
    <<: *common-config
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: bci-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Celery Worker - 处理异步任务
  worker:
    <<: *common-config
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: bci-worker
    command: >
      celery -A src.infrastructure.celery_app worker
      --loglevel=info
      --concurrency=4
      --pool=prefork
      --max-tasks-per-child=1000
      --time-limit=3600
    healthcheck:
      test: ["CMD", "celery", "-A", "src.infrastructure.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G

  # Celery Beat - 定时任务调度
  beat:
    <<: *common-config
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: bci-beat
    command: >
      celery -A src.infrastructure.celery_app beat
      --loglevel=info
      --schedule=/app/data/celerybeat-schedule
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/data/celerybeat-schedule"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # PostgreSQL数据库
  postgres:
    image: postgres:16-alpine
    container_name: bci-postgres
    environment:
      POSTGRES_DB: blockchain_infra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - blockchain-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blockchain_infra"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

  # Redis缓存和消息队列
  redis:
    image: redis:7-alpine
    container_name: bci-redis
    command: >
      redis-server
      --appendonly yes
      --appendfilename "appendonly.aof"
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --requirepass redis_password
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
      --daemonize no
      --supervised no
      --loglevel notice
      --logfile ""
      --databases 16
      --always-show-logo no
      --set-proc-title yes
    environment:
      TZ: UTC
    volumes:
      - redis-data:/data
    networks:
      - blockchain-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Nginx反向代理
  nginx:
    image: nginx:1.25-alpine
    container_name: bci-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - blockchain-network
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Prometheus监控
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: bci-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - blockchain-network
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Grafana可视化
  grafana:
    image: grafana/grafana:10.2.3
    container_name: bci-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: false
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      TZ: UTC
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - blockchain-network
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": \"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  blockchain-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  app-data:
    driver: local
  app-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
