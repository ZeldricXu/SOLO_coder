version: "3.9"

services:
  edge-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edge-scheduler
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=edge_scheduler
      - DB_USER=${DB_USER:-edge_scheduler}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge-net
    volumes:
      - app-data:/app/data
      - app-logs:/var/log/edge-scheduler
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"

  mysql:
    image: mysql:8.0
    container_name: edge-scheduler-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpass}
      - MYSQL_DATABASE=edge_scheduler
      - MYSQL_USER=${DB_USER:-edge_scheduler}
      - MYSQL_PASSWORD=${DB_PASSWORD:-changeme}
    ports:
      - "3306:3306"
    networks:
      - edge-net
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edge-scheduler-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - edge-net
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: edge-scheduler-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - edge-net
    volumes:
      - ./etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:10.4.1
    container_name: edge-scheduler-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    networks:
      - edge-net
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

networks:
  edge-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:
  app-data:
  app-logs:
