version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:
  edgevision:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: edgevision:${VERSION:-dev}
    container_name: edgevision
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - EDGEVISION_CONFIG=/app/configs/config.yaml
      - EDGEVISION_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
    networks:
      - edgevision-net
    <<: *default-logging
    <<: *default-restart
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:15-alpine
    container_name: edgevision-postgres
    environment:
      - POSTGRES_DB=edgevision
      - POSTGRES_USER=edgevision
      - POSTGRES_PASSWORD=edgevision_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - edgevision-net
    <<: *default-logging
    <<: *default-restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgevision -d edgevision"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edgevision-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - edgevision-net
    <<: *default-logging
    <<: *default-restart
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: edgevision-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - edgevision-net
    <<: *default-logging
    <<: *default-restart

  grafana:
    image: grafana/grafana:10.1.0
    container_name: edgevision-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - edgevision-net
    <<: *default-logging
    <<: *default-restart
    depends_on:
      - prometheus

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  edgevision-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
