version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-inventory_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-inventory_password}
      POSTGRES_DB: ${DATABASE_NAME:-inventory_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-inventory_user} -d ${DATABASE_NAME:-inventory_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - inventory-network

  redis:
    image: redis:7-alpine
    container_name: inventory-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - inventory-network

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-db-migrate
    command: alembic upgrade head
    environment:
      - DEPLOY_ENV=${DEPLOY_ENV:-development}
      - DATABASE_URL=postgresql+psycopg2://${DATABASE_USER:-inventory_user}:${DATABASE_PASSWORD:-inventory_password}@postgres:5432/${DATABASE_NAME:-inventory_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inventory-network
    profiles:
      - migrate
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-api
    environment:
      - DEPLOY_ENV=${DEPLOY_ENV:-development}
      - DATABASE_URL=postgresql+psycopg2://${DATABASE_USER:-inventory_user}:${DATABASE_PASSWORD:-inventory_password}@postgres:5432/${DATABASE_NAME:-inventory_db}
      - REDIS_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - REDIS_BACKEND_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - WORKERS=${WORKERS:-2}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./app:/app/app:ro
    restart: unless-stopped
    networks:
      - inventory-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-celery-worker
    command: celery -A app.tasks worker --loglevel=INFO --concurrency=${CELERY_CONCURRENCY:-4}
    environment:
      - DEPLOY_ENV=${DEPLOY_ENV:-development}
      - DATABASE_URL=postgresql+psycopg2://${DATABASE_USER:-inventory_user}:${DATABASE_PASSWORD:-inventory_password}@postgres:5432/${DATABASE_NAME:-inventory_db}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./app:/app/app:ro
    restart: unless-stopped
    networks:
      - inventory-network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-celery-beat
    command: celery -A app.tasks beat --loglevel=INFO
    environment:
      - DEPLOY_ENV=${DEPLOY_ENV:-development}
      - DATABASE_URL=postgresql+psycopg2://${DATABASE_USER:-inventory_user}:${DATABASE_PASSWORD:-inventory_password}@postgres:5432/${DATABASE_NAME:-inventory_db}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    volumes:
      - ./logs:/app/logs
      - ./app:/app/app:ro
    restart: unless-stopped
    networks:
      - inventory-network
    profiles:
      - beat

  grpc-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-grpc-server
    command: python -m app.grpc_api.server
    environment:
      - DEPLOY_ENV=${DEPLOY_ENV:-development}
      - DATABASE_URL=postgresql+psycopg2://${DATABASE_USER:-inventory_user}:${DATABASE_PASSWORD:-inventory_password}@postgres:5432/${DATABASE_NAME:-inventory_db}
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./app:/app/app:ro
    restart: unless-stopped
    networks:
      - inventory-network
    profiles:
      - grpc

volumes:
  postgres-data:
  redis-data:

networks:
  inventory-network:
    driver: bridge
