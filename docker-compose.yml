version: '3.9'

x-common-logging: &common-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

x-common-restart: &common-restart
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: chaoslab-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-chaoslab}
      POSTGRES_USER: ${DB_USER:-chaoslab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chaoslab_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-chaoslab} -d ${DB_NAME:-chaoslab}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chaoslab-network
    <<: *common-logging
    <<: *common-restart

  redis:
    image: redis:7-alpine
    container_name: chaoslab-redis
    command: >
      redis-server
      --appendonly yes
      --aof-use-rdb-preamble yes
      --maxmemory ${REDIS_MAXMEMORY:-1g}
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - chaoslab-network
    <<: *common-logging
    <<: *common-restart

  chaoslab:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    container_name: chaoslab-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-chaoslab}:${DB_PASSWORD:-chaoslab_password}@postgres:5432/${DB_NAME:-chaoslab}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      LOG_LEVEL: info
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-me}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - chaoslab-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    <<: *common-logging
    <<: *common-restart

  nginx:
    image: nginx:1.25-alpine
    container_name: chaoslab-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - chaoslab
    networks:
      - chaoslab-network
    <<: *common-logging
    <<: *common-restart

  prometheus:
    image: prom/prometheus:v2.49-alpine
    container_name: chaoslab-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROM_PORT:-9090}:9090"
    networks:
      - chaoslab-network
    <<: *common-logging
    <<: *common-restart

  grafana:
    image: grafana/grafana:10.2-alpine
    container_name: chaoslab-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - chaoslab-network
    <<: *common-logging
    <<: *common-restart

  certbot:
    image: certbot/certbot:latest
    container_name: chaoslab-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - chaoslab-network
    <<: *common-logging

networks:
  chaoslab-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
