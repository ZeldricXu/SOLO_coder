version: "3.9"

services:
  #-----------------------------------------------------------------------------
  # PostgreSQL - 主数据库
  #-----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: middleware-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-middleware}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-middleware}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_middleware}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-middleware}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - middleware-network
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=5
      -c max_wal_senders=5
      -c max_logical_replication_workers=4
      -c max_worker_processes=8

  #-----------------------------------------------------------------------------
  # Redis - 缓存与会话
  #-----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: middleware-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - middleware-network

  #-----------------------------------------------------------------------------
  # Kafka - CDC事件输出
  #-----------------------------------------------------------------------------
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: middleware-zookeeper
    restart: unless-stopped
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/bitnami/zookeeper
    networks:
      - middleware-network

  kafka:
    image: bitnami/kafka:3.6
    container_name: middleware-kafka
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_DELETE_TOPIC_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - middleware-network

  #-----------------------------------------------------------------------------
  # 应用服务 - 开发模式
  #-----------------------------------------------------------------------------
  middleware-dev:
    build:
      context: .
      target: development
      dockerfile: Dockerfile
    container_name: middleware-dev
    restart: unless-stopped
    environment:
      RUST_LOG: debug
      RUST_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-middleware}:${POSTGRES_PASSWORD:-middleware}@postgres:5432/${POSTGRES_DB:-enterprise_middleware}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - cargo-registry:/usr/local/cargo/registry
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - middleware-network
    command: cargo watch -x "run --features postgres,otel"

  #-----------------------------------------------------------------------------
  # 应用服务 - 生产模式
  #-----------------------------------------------------------------------------
  middleware:
    build:
      context: .
      target: runtime
      dockerfile: Dockerfile
    container_name: middleware-prod
    restart: unless-stopped
    environment:
      RUST_LOG: info
      RUST_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-middleware}:${POSTGRES_PASSWORD:-middleware}@postgres:5432/${POSTGRES_DB:-enterprise_middleware}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - middleware-network
    profiles:
      - production

  #-----------------------------------------------------------------------------
  # Prometheus - 指标收集
  #-----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: middleware-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    networks:
      - middleware-network

  #-----------------------------------------------------------------------------
  # Grafana - 可视化
  #-----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: middleware-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - middleware-network

  #-----------------------------------------------------------------------------
  # Adminer - 数据库管理
  #-----------------------------------------------------------------------------
  adminer:
    image: adminer:4.8.1
    container_name: middleware-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - middleware-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  zookeeper-data:
    driver: local
  kafka-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  cargo-registry:
    driver: local

networks:
  middleware-network:
    driver: bridge
    name: middleware-network
