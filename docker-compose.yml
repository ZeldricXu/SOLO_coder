version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gamestats-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: gamestats
      MYSQL_USER: gamestats
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gamestats123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/storage/schema/mysql_schema.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    container_name: gamestats-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-admin123456}
      DOCKER_INFLUXDB_INIT_ORG: gamestats
      DOCKER_INFLUXDB_INIT_BUCKET: events
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-gamestats-secret-token}
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gamestats-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.5
    container_name: gamestats-kafka
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_MESSAGE_MAX_BYTES: 10485760
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 10

  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: gamestats-zookeeper
    restart: unless-stopped
    environment:
      ALLOW_ANONYMOUS_LOGIN: 'yes'
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/bitnami/zookeeper

  event-access:
    build:
      context: ./backend/event-access
      dockerfile: Dockerfile
    container_name: gamestats-event-access
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GIN_MODE: release
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: gamestats
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gamestats123}
      MYSQL_DB: gamestats
      INFLUXDB_HOST: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-gamestats-secret-token}
      INFLUXDB_ORG: gamestats
      INFLUXDB_BUCKET: events
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: game_events
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    depends_on:
      mysql:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy

  profile-service:
    build:
      context: ./backend/profile-generation
      dockerfile: Dockerfile
    container_name: gamestats-profile-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: gamestats
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gamestats123}
      MYSQL_DB: gamestats
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ./backend/monitoring-dashboard
      dockerfile: Dockerfile
    container_name: gamestats-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - event-access
      - profile-service

  flink-jobmanager:
    image: flink:1.17-scala_2.12-java11
    container_name: gamestats-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    volumes:
      - flink_data:/opt/flink/data

  flink-taskmanager:
    image: flink:1.17-scala_2.12-java11
    container_name: gamestats-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    scale: 2
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - flink_data:/opt/flink/data

volumes:
  mysql_data:
  influxdb_data:
  influxdb_config:
  redis_data:
  kafka_data:
  zookeeper_data:
  flink_data:

networks:
  default:
    name: gamestats-network
