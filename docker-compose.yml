version: '3.8'

x-common-config: &common-config
  restart: unless-stopped
  networks:
    - chainetl-network
  logging:
    driver: json-file
    options:
      max-size: "100m"
      max-file: "5"

services:
  mysql:
    <<: *common-config
    image: mysql:8.0
    container_name: chainetl-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-chainetl123}
      MYSQL_DATABASE: ${DB_NAME:-chainetl}
      MYSQL_USER: ${DB_USERNAME:-chainetl}
      MYSQL_PASSWORD: ${DB_PASSWORD:-chainetl123}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=512M
      --log-bin=binlog
      --binlog-format=ROW
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME:-chainetl}", "-p${DB_PASSWORD:-chainetl123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    <<: *common-config
    image: redis:7-alpine
    container_name: chainetl-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-chainetl123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-chainetl123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    <<: *common-config
    image: prom/prometheus:v2.51.0
    container_name: chainetl-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - chainetl-app

  grafana:
    <<: *common-config
    image: grafana/grafana:10.4.0
    container_name: chainetl-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  chainetl-app:
    <<: *common-config
    build:
      context: .
      dockerfile: Dockerfile
    image: chainetl/chainetl-platform:${APP_VERSION:-latest}
    container_name: chainetl-app
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-chainetl}
      DB_USERNAME: ${DB_USERNAME:-chainetl}
      DB_PASSWORD: ${DB_PASSWORD:-chainetl123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-chainetl123}
      JVM_OPTS: >
        -Xms1g
        -Xmx2g
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
      TZ: Asia/Shanghai
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2500M
        reservations:
          cpus: '0.5'
          memory: 512M

  nginx:
    <<: *common-config
    image: nginx:1.25-alpine
    container_name: chainetl-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - chainetl-app

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  chainetl-network:
    driver: bridge
