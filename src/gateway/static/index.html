<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Gateway Developer Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [apiKeys, setApiKeys] = useState([]);
            const [routes, setRoutes] = useState([]);
            const [usageStats, setUsageStats] = useState(null);
            const [dailyUsage, setDailyUsage] = useState([]);
            const [quotas, setQuotas] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                loadData();
            }, [activeTab]);

            async function loadData() {
                setLoading(true);
                try {
                    if (activeTab === 'dashboard') {
                        await Promise.all([
                            loadUsageStats(),
                            loadDailyUsage(),
                            loadRoutes(),
                        ]);
                    } else if (activeTab === 'apis') {
                        await loadRoutes();
                    } else if (activeTab === 'apikeys') {
                        await loadApiKeys();
                        await loadQuotas();
                    }
                } catch (e) {
                    console.error('Failed to load data:', e);
                }
                setLoading(false);
            }

            async function loadApiKeys() {
                const res = await fetch('/api/portal/api-keys', {
                    headers: { 'Authorization': 'Bearer test-token' }
                });
                if (res.ok) {
                    const data = await res.json();
                    setApiKeys(data);
                }
            }

            async function loadRoutes() {
                const res = await fetch('/api/portal/routes');
                if (res.ok) {
                    const data = await res.json();
                    setRoutes(data);
                }
            }

            async function loadUsageStats() {
                const res = await fetch('/api/portal/usage/summary', {
                    headers: { 'Authorization': 'Bearer test-token' }
                });
                if (res.ok) {
                    const data = await res.json();
                    setUsageStats(data);
                }
            }

            async function loadDailyUsage() {
                const res = await fetch('/api/portal/usage/daily', {
                    headers: { 'Authorization': 'Bearer test-token' }
                });
                if (res.ok) {
                    const data = await res.json();
                    setDailyUsage(data);
                }
            }

            async function loadQuotas() {
                const res = await fetch('/api/portal/quotas', {
                    headers: { 'Authorization': 'Bearer test-token' }
                });
                if (res.ok) {
                    const data = await res.json();
                    setQuotas(data);
                }
            }

            async function createApiKey() {
                const name = prompt('Enter API Key name:');
                if (!name) return;

                const res = await fetch('/api/portal/api-keys', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer test-token'
                    },
                    body: JSON.stringify({ name, description: 'Created via portal' })
                });

                if (res.ok) {
                    const data = await res.json();
                    alert(`Your API Key: ${data.key}\nPlease save it, it won't be shown again!`);
                    loadApiKeys();
                }
            }

            return (
                <div className="min-h-screen">
                    <nav className="gradient-bg text-white shadow-lg">
                        <div className="max-w-7xl mx-auto px-4 py-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-3">
                                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
                                    </svg>
                                    <h1 className="text-xl font-bold">API Gateway Developer Portal</h1>
                                </div>
                                <div className="flex items-center space-x-2 text-sm">
                                    <span className="bg-white/20 px-3 py-1 rounded-full">user@example.com</span>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <div className="max-w-7xl mx-auto px-4 py-6">
                        <div className="flex space-x-1 mb-6 bg-gray-100 p-1 rounded-lg">
                            {[
                                { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                                { id: 'apis', label: 'API Docs', icon: '📚' },
                                { id: 'apikeys', label: 'API Keys', icon: '🔑' },
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`px-4 py-2 rounded-md font-medium transition-all ${
                                        activeTab === tab.id
                                            ? 'bg-white text-purple-600 shadow'
                                            : 'text-gray-600 hover:text-gray-900'
                                    }`}
                                >
                                    <span className="mr-2">{tab.icon}</span>
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        {loading ? (
                            <div className="text-center py-12">
                                <div className="animate-spin w-8 h-8 border-4 border-purple-200 border-t-purple-600 rounded-full mx-auto mb-4"></div>
                                <p className="text-gray-500">Loading...</p>
                            </div>
                        ) : (
                            <>
                                {activeTab === 'dashboard' && <Dashboard stats={usageStats} dailyUsage={dailyUsage} routes={routes} />}
                                {activeTab === 'apis' && <ApiDocs routes={routes} />}
                                {activeTab === 'apikeys' && <ApiKeys apiKeys={apiKeys} onCreate={createApiKey} quotas={quotas} />}
                            </>
                        )}
                    </div>
                </div>
            );
        }

        function Dashboard({ stats, dailyUsage, routes }) {
            const statCards = stats ? [
                { label: 'Total Requests', value: stats.total_requests?.toLocaleString() || '0', color: 'bg-blue-500' },
                { label: 'Success Rate', value: `${stats.success_rate?.toFixed(2)}%` || '0%', color: 'bg-green-500' },
                { label: 'Avg Latency', value: `${stats.avg_latency_ms?.toFixed(1)}ms` || '0ms', color: 'bg-yellow-500' },
                { label: 'P99 Latency', value: `${stats.p99_latency_ms?.toFixed(1)}ms` || '0ms', color: 'bg-red-500' },
            ] : [];

            return (
                <div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                        {statCards.map((card, i) => (
                            <div key={i} className="bg-white rounded-xl shadow-sm p-6 card-hover transition-all">
                                <div className="flex items-center justify-between mb-2">
                                    <span className="text-gray-500 text-sm">{card.label}</span>
                                    <div className={`w-3 h-3 rounded-full ${card.color}`}></div>
                                </div>
                                <p className="text-3xl font-bold text-gray-800">{card.value}</p>
                            </div>
                        ))}
                    </div>

                    {dailyUsage.length > 0 && (
                        <div className="bg-white rounded-xl shadow-sm p-6 mb-8">
                            <h3 className="text-lg font-semibold mb-4">Daily Usage</h3>
                            <div className="h-48 flex items-end space-x-2">
                                {dailyUsage.map((day, i) => (
                                    <div key={i} className="flex-1 flex flex-col items-center">
                                        <div
                                            className="w-full bg-purple-400 rounded-t transition-all hover:bg-purple-500"
                                            style={{ height: `${Math.max(4, (day.request_count / Math.max(...dailyUsage.map(d => d.request_count)) * 100)}px` }}
                                            title={`${day.request_count.toLocaleString()} requests`}
                                        ></div>
                                        <span className="text-xs text-gray-500 mt-2">{day.date.slice(5)}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="bg-white rounded-xl shadow-sm p-6">
                        <h3 className="text-lg font-semibold mb-4">Active APIs ({routes.length})</h3>
                        <div className="space-y-3">
                            {routes.slice(0, 5).map(route => (
                                <div key={route.id} className="flex items-center justify-between p-4 bg-gray-50 rounded-lg">
                                    <div className="flex items-center space-x-4">
                                        <span className="px-2 py-1 text-xs font-mono bg-purple-100 text-purple-700 rounded">
                                            {route.methods?.[0] || 'ANY'}
                                        </span>
                                        <div>
                                            <p className="font-medium text-gray-800">{route.name}</p>
                                            <p className="text-sm text-gray-500">{route.path}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        {route.auth_required && (
                                            <span className="text-xs px-2 py-1 bg-orange-100 text-orange-700 rounded">
                                                {route.auth_strategy || 'Auth'}
                                            </span>
                                        )}
                                        <span className={`text-xs px-2 py-1 rounded ${route.match_type === 'prefix' ? 'bg-blue-100 text-blue-700' : route.match_type === 'regex' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>
                                            {route.match_type}
                                        </span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function ApiDocs({ routes }) {
            return (
                <div>
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-gray-800">API Documentation</h2>
                        <a
                            href="/api/portal/openapi.json"
                            className="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors"
                        >
                            📥 Download OpenAPI Spec
                        </a>
                    </div>

                    <div className="space-y-4">
                        {routes.map(route => (
                            <div key={route.id} className="bg-white rounded-xl shadow-sm overflow-hidden">
                                <div className="p-6 border-b border-gray-100">
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center space-x-4">
                                            <span className="px-3 py-1 text-sm font-mono bg-purple-100 text-purple-700 rounded font-bold">
                                                {route.methods?.[0] || 'ANY'}
                                            </span>
                                            <code className="text-lg font-mono bg-gray-100 px-3 py-1 rounded">{route.path}</code>
                                        </div>
                                        <span className="text-sm text-gray-500">{route.name}</span>
                                    </div>
                                </div>
                                <div className="p-6 bg-gray-50">
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                                        <div>
                                            <span className="text-gray-500">Auth:</span>
                                            <span className="ml-2 font-medium">{route.auth_required ? (route.auth_strategy || 'Required') : 'None'}</span>
                                        </div>
                                        <div>
                                            <span className="text-gray-500">Match:</span>
                                            <span className="ml-2 font-medium">{route.match_type}</span>
                                        </div>
                                        <div>
                                            <span className="text-gray-500">Timeout:</span>
                                            <span className="ml-2 font-medium">{route.timeout}s</span>
                                        </div>
                                        <div>
                                            <span className="text-gray-500">Targets:</span>
                                            <span className="ml-2 font-medium">{route.targets?.length || 0}</span>
                                        </div>
                                    </div>
                                    {route.rate_limit_enabled && (
                                        <div className="mt-4 p-3 bg-yellow-50 border border-yellow-200 rounded-lg">
                                            <p className="text-sm text-yellow-800">
                                                ⚡ Rate Limited: {route.rate_limit_per_user || '1000'}/min per user, {route.rate_limit_per_api || '10000'}/min per API
                                            </p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function ApiKeys({ apiKeys, onCreate, quotas }) {
            return (
                <div>
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-gray-800">API Keys</h2>
                        <button
                            onClick={onCreate}
                            className="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors"
                        >
                            + Create API Key
                        </button>
                    </div>

                    {quotas.length > 0 && (
                        <div className="bg-white rounded-xl shadow-sm p-6 mb-6">
                            <h3 className="text-lg font-semibold mb-4">Quota Usage</h3>
                            <div className="space-y-4">
                                {quotas.map(quota => (
                                    <div key={quota.api_key_id}>
                                        <div className="flex justify-between text-sm mb-1">
                                            <span className="font-medium">{quota.api_key_name}</span>
                                            <span className="text-gray-500">
                                                {quota.used_today.toLocaleString()} / {quota.daily_quota.toLocaleString()}
                                            </span>
                                        </div>
                                        <div className="w-full bg-gray-200 rounded-full h-2">
                                            <div
                                                className={`h-2 rounded-full transition-all ${
                                                    quota.remaining / quota.daily_quota < 0.1 ? 'bg-red-500' :
                                                    quota.remaining / quota.daily_quota < 0.3 ? 'bg-yellow-500' : 'bg-green-500'
                                                }`}
                                                style={{ width: `${Math.min(100, (quota.used_today / quota.daily_quota) * 100)}%` }}
                                            ></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="bg-white rounded-xl shadow-sm overflow-hidden">
                        <table className="w-full">
                            <thead className="bg-gray-50">
                                <tr>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Scopes</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Created</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Last Used</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {apiKeys.length === 0 ? (
                                    <tr>
                                        <td colSpan="5" className="px-6 py-8 text-center text-gray-500">
                                            No API keys yet. Create one to get started!
                                        </td>
                                    </tr>
                                ) : (
                                    apiKeys.map(key => (
                                        <tr key={key.id} className="hover:bg-gray-50">
                                            <td className="px-6 py-4">
                                                <p className="font-medium text-gray-800">{key.name}</p>
                                                {key.description && <p className="text-sm text-gray-500">{key.description}</p>}
                                            </td>
                                            <td className="px-6 py-4">
                                                <span className={`px-2 py-1 text-xs rounded-full ${
                                                    key.status === 'approved' ? 'bg-green-100 text-green-700' :
                                                    key.status === 'pending' ? 'bg-yellow-100 text-yellow-700' :
                                                    key.status === 'rejected' ? 'bg-red-100 text-red-700' :
                                                    'bg-gray-100 text-gray-700'
                                                }`}>
                                                    {key.status}
                                                </span>
                                            </td>
                                            <td className="px-6 py-4">
                                                <div className="flex flex-wrap gap-1">
                                                    {key.scopes?.map((scope, i) => (
                                                        <span key={i} className="px-2 py-0.5 text-xs bg-gray-100 text-gray-600 rounded">
                                                            {scope}
                                                        </span>
                                                    ))}
                                                </div>
                                            </td>
                                            <td className="px-6 py-4 text-sm text-gray-500">
                                                {new Date(key.created_at).toLocaleDateString()}
                                            </td>
                                            <td className="px-6 py-4 text-sm text-gray-500">
                                                {key.last_used_at ? new Date(key.last_used_at).toLocaleDateString() : 'Never'}
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
