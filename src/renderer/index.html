<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>NoteFlow - 智能笔记管理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body, #root {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background-color: #ffffff;
      overflow: hidden;
    }

    .title-bar {
      height: 32px;
      background-color: #f5f5f5;
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #e0e0e0;
    }

    .title-bar-text {
      font-size: 12px;
      color: #666;
      font-weight: 500;
    }

    .title-bar-controls {
      position: absolute;
      left: 12px;
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .title-bar-button {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title-bar-button.close {
      background-color: #ff5f57;
    }

    .title-bar-button.minimize {
      background-color: #febc2e;
    }

    .title-bar-button.maximize {
      background-color: #28c840;
    }

    .title-bar-button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="title-bar">
    <div class="title-bar-controls">
      <button class="title-bar-button close" id="btn-close"></button>
      <button class="title-bar-button minimize" id="btn-minimize"></button>
      <button class="title-bar-button maximize" id="btn-maximize"></button>
    </div>
    <span class="title-bar-text">NoteFlow</span>
  </div>
  <div id="root"></div>
  <script>
    document.getElementById('btn-close')?.addEventListener('click', () => {
      window.electronAPI?.app.quit();
    });
    document.getElementById('btn-minimize')?.addEventListener('click', () => {
      window.electronAPI?.app.minimize();
    });
    document.getElementById('btn-maximize')?.addEventListener('click', () => {
      window.electronAPI?.app.maximize();
    });
  </script>
</body>
</html>
