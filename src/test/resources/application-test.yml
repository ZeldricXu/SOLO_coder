server:
  port: 0

spring:
  application:
    name: formflow-test

  datasource:
    url: jdbc:h2:mem:formflow_test
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

formflow:
  notification:
    email-enabled: false
    sms-enabled: false
  process:
    task-due-days: 1
  reminder:
    enabled: true
    interval-hours: 1
    max-reminders: 3
    check-interval-ms: 60000
    escalation:
      enabled: true
      after-hours: 2

logging:
  level:
    com.formflow: DEBUG
