spring:
  r2dbc:
    url: r2dbc:h2:mem:///iot_platform_ci;DB_CLOSE_DELAY=-1
    username: sa
    password:

  datasource:
    url: jdbc:h2:mem:iot_platform_ci;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 2

  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    root: WARN
    com.iotplatform: INFO

iot:
  offline:
    sync-interval: 10000
  notification:
    channels:
      sms:
        enabled: false
      email:
        enabled: false
      webhook:
        enabled: false
