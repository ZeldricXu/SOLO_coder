spring:
  application:
    name: contract-audit-platform-test

  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/contraudit_test?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${TEST_DB_USER:contraudit_test}
    password: ${TEST_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 60000

  data:
    redis:
      host: ${TEST_REDIS_HOST:localhost}
      port: ${TEST_REDIS_PORT:6379}
      password: ${TEST_REDIS_PASSWORD:}
      database: 1
      timeout: 2000
      lettuce:
        pool:
          max-active: 30
          max-idle: 15
          min-idle: 8
          max-wait: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  codec:
    max-in-memory-size: 10MB

server:
  port: 8080
  shutdown: graceful
  netty:
    connection-timeout: 20000
    idle-timeout: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,heapdump,threaddump
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    metrics:
      export:
        prometheus:
          enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 30s
    tags:
      application: ${spring.application.name}
      environment: test

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.contraudit.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: WARN
    com.contraudit: INFO
    org.springframework: WARN
    org.apache.ibatis: WARN
    org.web3j: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: /var/log/contraudit/contraudit-test.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 5GB
  logback:
    rollingpolicy:
      clean-history-on-start: false

wallet:
  hd:
    derivation-path: m/44'/60'/0'/0
    mnemonic-length: 12

storage:
  ipfs:
    gateway: ${STORAGE_IPFS_GATEWAY:https://ipfs.infura.io:5001/api/v0}
    api-key: ${STORAGE_IPFS_API_KEY:}
    api-secret: ${STORAGE_IPFS_API_SECRET:}
  arweave:
    gateway: ${STORAGE_ARWEAVE_GATEWAY:https://arweave.net}
    wallet: ${STORAGE_ARWEAVE_WALLET:}

zkp:
  circuit:
    base-path: /var/lib/contraudit/circuits
    cache-size: 200

listener:
  event:
    max-retries: 5
    retry-interval: 3000
    callback-timeout: 15000
