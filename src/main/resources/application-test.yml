spring:
  r2dbc:
    url: r2dbc:h2:mem:///iot_platform_test;DB_CLOSE_DELAY=-1
    username: sa
    password:

  datasource:
    url: jdbc:h2:mem:iot_platform_test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 1

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.iotplatform: DEBUG
    org.springframework.r2dbc: INFO
    com.baomidou.mybatisplus: INFO

iot:
  offline:
    sync-interval: 5000
  gateway:
    routes: []
