server.port=8080

spring.application.name=service-desk

spring.datasource.url=jdbc:h2:mem:servicedesk;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0
spring.redis.timeout=5000ms

logging.level.com.servicedesk=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.root=INFO

spring.jpa.open-in-view=false

servicedesk.load-warning.enabled=true
servicedesk.load-warning.small-team-threshold=10
servicedesk.load-warning.large-team-threshold=50
servicedesk.load-warning.small-team-warning-threshold=0.6
servicedesk.load-warning.medium-team-warning-threshold=0.75
servicedesk.load-warning.large-team-warning-threshold=0.85
servicedesk.load-warning.group-override-thresholds.technical_support=0.7
servicedesk.load-warning.group-override-thresholds.billing_support=0.75
servicedesk.load-warning.group-override-thresholds.business_support=0.65

servicedesk.response-timeout.enabled=true
servicedesk.response-timeout.default-timeout-seconds=600
servicedesk.response-timeout.warning-ratio=0.7
servicedesk.response-timeout.urgency-configs.high.urgency-level=high
servicedesk.response-timeout.urgency-configs.high.timeout-seconds=300
servicedesk.response-timeout.urgency-configs.high.alert-message=紧急工单响应超时，请立即处理！
servicedesk.response-timeout.urgency-configs.medium.urgency-level=medium
servicedesk.response-timeout.urgency-configs.medium.timeout-seconds=600
servicedesk.response-timeout.urgency-configs.medium.alert-message=普通工单响应超时，请及时处理
servicedesk.response-timeout.urgency-configs.low.urgency-level=low
servicedesk.response-timeout.urgency-configs.low.timeout-seconds=1800
servicedesk.response-timeout.urgency-configs.low.alert-message=低优先级工单响应超时

servicedesk.priority-async.redis-enabled=true
servicedesk.priority-async.redis-queue-key=servicedesk:priority:queue
servicedesk.priority-async.redis-processing-key=servicedesk:priority:processing
servicedesk.priority-async.redis-failed-key=servicedesk:priority:failed
servicedesk.priority-async.max-retries=3
servicedesk.priority-async.retry-interval-ms=1000
servicedesk.priority-async.thread-pool-size=4
servicedesk.priority-async.poll-interval-ms=500
servicedesk.priority-async.task-expiration-seconds=3600
servicedesk.priority-async.batch-size=10

servicedesk.assignment-strategy.default-strategy=load_balanced
servicedesk.assignment-strategy.group-strategy-mapping.technical_support=skill_match
servicedesk.assignment-strategy.group-strategy-mapping.billing_support=least_busy
servicedesk.assignment-strategy.group-strategy-mapping.business_support=round_robin
servicedesk.assignment-strategy.category-strategy-mapping.technical=skill_match
servicedesk.assignment-strategy.category-strategy-mapping.billing=fastest_response
servicedesk.assignment-strategy.strategies.load_balanced.name=load_balanced
servicedesk.assignment-strategy.strategies.load_balanced.display-name=负载均衡
servicedesk.assignment-strategy.strategies.load_balanced.description=选择剩余容量最大的客服
servicedesk.assignment-strategy.strategies.load_balanced.enabled=true
servicedesk.assignment-strategy.strategies.skill_match.name=skill_match
servicedesk.assignment-strategy.strategies.skill_match.display-name=技能匹配
servicedesk.assignment-strategy.strategies.skill_match.description=选择技能最匹配的客服
servicedesk.assignment-strategy.strategies.skill_match.enabled=true
servicedesk.assignment-strategy.strategies.round_robin.name=round_robin
servicedesk.assignment-strategy.strategies.round_robin.display-name=轮询分配
servicedesk.assignment-strategy.strategies.round_robin.description=按顺序轮流分配
servicedesk.assignment-strategy.strategies.round_robin.enabled=true
servicedesk.assignment-strategy.strategies.least_busy.name=least_busy
servicedesk.assignment-strategy.strategies.least_busy.display-name=最空闲优先
servicedesk.assignment-strategy.strategies.least_busy.description=选择当前工单最少的客服
servicedesk.assignment-strategy.strategies.least_busy.enabled=true
servicedesk.assignment-strategy.strategies.fastest_response.name=fastest_response
servicedesk.assignment-strategy.strategies.fastest_response.display-name=响应最快优先
servicedesk.assignment-strategy.strategies.fastest_response.description=选择平均响应时间最短的客服
servicedesk.assignment-strategy.strategies.fastest_response.enabled=true
