server.port=8080

spring.application.name=data-migrate-service

spring.datasource.url=jdbc:h2:mem:datamigrate;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.datamigrate=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.root=INFO

spring.jpa.open-in-view=false

datamigrate.redis.enabled=false
datamigrate.redis.host=localhost
datamigrate.redis.port=6379
datamigrate.redis.database=0
datamigrate.redis.queue-key-prefix=datamigrate:write_queue:
datamigrate.redis.progress-key-prefix=datamigrate:progress:
datamigrate.redis.checkpoint-key-prefix=datamigrate:checkpoint:

datamigrate.resume.enabled=true
datamigrate.resume.checkpoint-type=BY_BATCH
datamigrate.resume.checkpoint-interval=1000
datamigrate.resume.strategy=FROM_BREAKPOINT

datamigrate.verify.concurrent-threads=4
datamigrate.verify.batch-size=1000

datamigrate.write.async.enabled=true
datamigrate.write.async.worker-threads=4
datamigrate.write.async.batch-size=100
datamigrate.write.async.max-retries=3
