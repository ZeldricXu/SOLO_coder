server.port=8080
spring.application.name=ScheduleBook

spring.datasource.url=jdbc:h2:mem:schedulebook;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0
spring.redis.password=

logging.level.root=INFO
logging.level.com.schedulebook=DEBUG

schedulebook.lock.timeout-seconds.urgent=5
schedulebook.lock.timeout-seconds.normal=30
schedulebook.lock.timeout-seconds.low=15

schedulebook.dispatch.default-strategy=priority
schedulebook.dispatch.strategies.priority.type=priority
schedulebook.dispatch.strategies.priority.description=按资源优先级调度
schedulebook.dispatch.strategies.priority.enabled=true
schedulebook.dispatch.strategies.priority.sort-by=priority
schedulebook.dispatch.strategies.priority.sort-order=desc

schedulebook.dispatch.strategies.load_balance.type=load_balance
schedulebook.dispatch.strategies.load_balance.description=负载均衡调度
schedulebook.dispatch.strategies.load_balance.enabled=true
schedulebook.dispatch.strategies.load_balance.sort-by=currentOccupancy
schedulebook.dispatch.strategies.load_balance.sort-order=asc

schedulebook.dispatch.strategies.frequency.type=frequency
schedulebook.dispatch.strategies.frequency.description=使用频率均衡调度
schedulebook.dispatch.strategies.frequency.enabled=true
schedulebook.dispatch.strategies.frequency.sort-by=usageCount
schedulebook.dispatch.strategies.frequency.sort-order=asc

schedulebook.reminder.queue-key=schedulebook:adjustment:queue
schedulebook.reminder.worker-enabled=true
