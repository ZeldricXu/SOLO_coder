nwp {
  grid {
    projection = "latlon"
    nx = 360
    ny = 181
    nz = 30
    dx = 1.0
    dy = 1.0
    lat-min = -90.0
    lat-max = 90.0
    lon-min = 0.0
    lon-max = 360.0
    sigma-levels = [1.000, 0.995, 0.985, 0.970, 0.950, 0.925, 0.895, 0.860, 0.820, 0.775,
                    0.725, 0.670, 0.615, 0.560, 0.505, 0.450, 0.395, 0.345, 0.300, 0.260,
                    0.225, 0.195, 0.170, 0.150, 0.135, 0.125, 0.120, 0.120, 0.120, 0.120]
  }

  dynamics {
    time-step = 60.0
    total-steps = 4320
    integration-scheme = "rk3"
    horizontal-scheme = "finite-volume"
    spectral-truncation = 213
    diffusion-coef = 1.0e5
    rayleigh-damping = 0.0
  }

  physics {
    cumulus = "kain-fritsch"
    boundary-layer = "ysu"
    microphysics = "wsm6"
    radiation = "rrtmg"
    radiation-interval = 3600
    surface-layer = "monin-obukhov"
  }

  assimilation {
    method = "3d-var"
    window-length = 3600
    max-iterations = 100
    convergence-threshold = 1.0e-6
    background-error-file = "data/bec.nc"
    observations {
      satellite = true
      radar = true
      surface = true
      radiosonde = true
    }
  }

  parallel {
    spark-master = "local[*]"
    partitions-x = 4
    partitions-y = 4
    halo-width = 3
    checkpoint-interval = 360
  }

  io {
    grib {
      jni-library-path = "lib/native"
      decode-num-threads = 4
    }
    netcdf {
      compression-level = 4
      chunk-size = 1048576
    }
    hdfs {
      namenode = "hdfs://localhost:9000"
      base-path = "/nwp/data"
      replication-factor = 3
    }
  }

  storage {
    postgres {
      url = "jdbc:postgresql://localhost:5432/nwp_metadata"
      user = "nwp"
      password = "nwp_password"
      max-pool-size = 20
    }
    kafka {
      bootstrap-servers = "localhost:9092"
      task-topic = "nwp_tasks"
      result-topic = "nwp_results"
      status-topic = "nwp_status"
      group-id = "nwp-solvers"
    }
  }

  postprocess {
    downscale-method = "bilinear"
    output-interval = 3600
    stations-file = "config/stations.csv"
    render {
      image-width = 1200
      image-height = 800
      colormap = "viridis"
      base-map = "config/world_map.json"
    }
  }

  output {
    variables = ["T", "U", "V", "QV", "QC", "QR", "QI", "QS", "QG", "PSFC", "SLP", "PRECIP"]
    pressure-levels = [1000, 925, 850, 700, 500, 300, 200, 100, 50]
  }
}
