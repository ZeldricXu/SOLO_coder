server:
  port: 8080
  tomcat:
    max-threads: 400
    accept-count: 200
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:prod-mysql}:${DB_PORT:3306}/${DB_NAME:edge_scheduler}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000

  data:
    redis:
      host: ${REDIS_HOST:prod-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      lettuce:
        pool:
          max-active: 128
          max-idle: 64
          min-idle: 32
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:}
        max-redirects: 3

  flyway:
    enabled: true
    validate-on-migrate: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: never
  server:
    port: 8081
    address: 0.0.0.0

edge:
  scheduler:
    cache:
      caffeine:
        maximum-size: 100000
        expire-after-write: 600s
    rule:
      retry-max-attempts: 3
      retry-interval: 500
    ota:
      gray-scale-batches: 5
      rollback-enabled: true
    inference:
      task-timeout: 120s

logging:
  level:
    com.edgescheduler: WARN
    org.springframework: ERROR
  file:
    name: /var/log/edge-scheduler/application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
