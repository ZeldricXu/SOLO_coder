server:
  port: 8080

spring:
  application:
    name: cross-server-battle-platform
  profiles:
    active: staging

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-staging:3306/battle_platform_staging?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:battle_staging}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis-staging}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=300s

netty:
  server:
    port: 9090
    boss-threads: 2
    worker-threads: 0
    so-backlog: 1024
    so-keepalive: true
    tcp-nodelay: true

battle:
  matching:
    tick-interval-ms: 500
    max-wait-time-ms: 120000
    rating-bracket-size: 200
    wait-time-weight: 0.5
  battlefield:
    max-players: 200
    move-sync-fps: 20
    aoi-grid-size: 100
    idle-timeout-ms: 300000
    aoi-optimization-enabled: true
  score:
    kill-base: 100
    assist-base: 50
    capture-base: 200
    streak-bonus-threshold: 3
    streak-multiplier: 0.5
  leaderboard:
    snapshot-interval-cron: "0 0 * * * *"
  replay:
    storage-path: /data/replays-staging
    event-buffer-size: 65536
  reward:
    max-retry: 3
    retry-delay-ms: 5000
  anticheat:
    headshot-rate-threshold: 0.7
    speed-hack-threshold: 15.0
    same-ip-player-limit: 3
    enabled: true

influxdb:
  url: ${INFLUXDB_URL:http://influxdb-staging:8086}
  token: ${INFLUXDB_TOKEN:}
  org: ${INFLUXDB_ORG:battle-platform-staging}
  bucket: ${INFLUXDB_BUCKET:battle-events-staging}

logging:
  level:
    root: INFO
    com.battle.platform: INFO
    io.netty: WARN
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /data/logs/battle-platform-staging.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
