server:
  port: 8080
  tomcat:
    max-threads: 200
    accept-count: 100

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:staging-mysql}:${DB_PORT:3306}/${DB_NAME:edge_scheduler}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${DB_USER:edge_scheduler}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  data:
    redis:
      host: ${REDIS_HOST:staging-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 64
          max-idle: 32
          min-idle: 16

  flyway:
    enabled: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

edge:
  scheduler:
    cache:
      caffeine:
        maximum-size: 50000
        expire-after-write: 1800s

logging:
  level:
    com.edgescheduler: INFO
    org.springframework: WARN
