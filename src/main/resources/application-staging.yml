server:
  port: 8080
  address: 0.0.0.0

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
      password: ${SPRING_REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  thymeleaf:
    cache: true
  cache:
    type: redis
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    com.flowplatform: warn
    org.springframework: warn

flow-platform:
  wechat-webhook: ${FLOW_PLATFORM_WECHAT_WEBHOOK:}
  encryption-key: ${FLOW_PLATFORM_ENCRYPTION_KEY}
  upload-path: ${FLOW_PLATFORM_UPLOAD_PATH:/data/flow-platform/uploads}
