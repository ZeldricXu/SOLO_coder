spring:
  config:
    activate:
      on-profile: staging

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 1
      lettuce:
        pool:
          max-active: 30
          max-idle: 15
          min-idle: 8

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chainetl_staging}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:chainetl}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

server:
  port: 8080
  http2:
    enabled: true
  compression:
    enabled: true
  netty:
    connection-timeout: 30s
    idle-timeout: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
        step: 30s

logging:
  level:
    root: WARN
    com.chainetl: INFO
    org.springframework.web: WARN
    com.baomidou.mybatisplus: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/chainetl/chainetl-staging.log
    max-size: 100MB
    max-history: 30
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 30
        wait-duration-in-open-state: 60s

storage:
  ipfs:
    api-url: ${IPFS_API_URL:http://ipfs.staging:5001}
    gateway-url: ${IPFS_GATEWAY_URL:http://ipfs.staging:8080}
  arweave:
    gateway-url: ${ARWEAVE_GATEWAY_URL:https://arweave.net}

chain:
  default-chain-id: ${DEFAULT_CHAIN_ID:1}
  rpc-timeout: 30s
  health-check-interval: 30s
