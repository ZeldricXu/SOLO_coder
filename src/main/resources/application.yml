spring:
  application:
    name: data-standardization-platform

  profiles:
    active: development

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC

  r2dbc:
    url: r2dbc:mysql://localhost:3306/data_standard?serverTimezone=UTC&useSSL=false
    username: root
    password: root

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080
  netty:
    threads:
      worker: 16

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    com.datastandard: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
    loggers:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_UUID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

---
spring:
  config:
    activate:
      on-profile: development

  datasource:
    url: jdbc:mysql://localhost:3306/data_standard?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 30000

logging:
  level:
    com.datastandard.modules: DEBUG

---
spring:
  config:
    activate:
      on-profile: production

  datasource:
    url: jdbc:mysql://prod-db:3306/data_standard?serverTimezone=UTC&useSSL=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 20

logging:
  level:
    root: WARN
    com.datastandard: INFO

management:
  endpoint:
    loggers:
      enabled: true
