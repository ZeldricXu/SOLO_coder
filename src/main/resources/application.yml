server:
  port: 8080

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/maplocation
      database: maplocation
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100
        keep-alive: 60s
      thread-name-prefix: async-task-

map:
  route-types:
    config: '[{"typeCode":"driving","typeName":"驾车","typeDescription":"汽车行驶路径","distanceFactor":1.3,"averageSpeedKmh":50.0,"enabled":true,"priority":1},{"typeCode":"walking","typeName":"步行","typeDescription":"步行路径","distanceFactor":1.0,"averageSpeedKmh":5.0,"enabled":true,"priority":2},{"typeCode":"transit","typeName":"公交","typeDescription":"公共交通路径","distanceFactor":1.2,"averageSpeedKmh":30.0,"enabled":true,"priority":3},{"typeCode":"cycling","typeName":"骑行","typeDescription":"自行车骑行路径","distanceFactor":1.05,"averageSpeedKmh":15.0,"enabled":true,"priority":4},{"typeCode":"metro","typeName":"地铁","typeDescription":"地铁轨道交通路径","distanceFactor":1.1,"averageSpeedKmh":40.0,"enabled":true,"priority":5}]'

logging:
  level:
    com.maplocation: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.data.redis: DEBUG
