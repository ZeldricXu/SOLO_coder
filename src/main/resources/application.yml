server:
  port: 8080

spring:
  application:
    name: chaoslab-platform
  datasource:
    url: jdbc:mysql://localhost:3306/chaoslab?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    encoding: UTF-8

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.chaoslab.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always

logging:
  level:
    com.chaoslab: DEBUG
    org.springframework.web: INFO
    io.netty: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

chaoslab:
  cache:
    caffeine:
      maximumSize: 10000
      expireAfterWrite: 30m
      expireAfterAccess: 10m
  sidecar:
    default-resources:
      cpu: "500m"
      memory: "256Mi"
  mtls:
    default-validity-days: 365
    auto-rotation-days: 30
  dns:
    default-upstreams:
      - "8.8.8.8:53"
      - "1.1.1.1:53"
    cache-ttl: 300
  eventstore:
    snapshot-interval: 100
    max-events-per-query: 1000
