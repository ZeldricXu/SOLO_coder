server:
  port: 8080

spring:
  application:
    name: nft-indexer
  r2dbc:
    url: r2dbc:mysql://localhost:3306/nft_indexer?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    encoding: UTF-8

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.nftindexer.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always

logging:
  level:
    com.nftindexer: DEBUG
    org.springframework.web: INFO
    io.netty: INFO
    org.web3j: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

nftindexer:
  cache:
    caffeine:
      maximumSize: 10000
      expireAfterWrite: 30m
      expireAfterAccess: 10m
  bridge:
    confirmations: 15
    timeout-seconds: 300
    max-retries: 3
  multisig:
    default-threshold: 2
    default-signers: 3
    signature-timeout-minutes: 60
  hdwallet:
    root-path: "m/44'/60'/0'/0"
    default-chain-id: 1
  gas:
    history-window-hours: 24
    priority-fee-percentile: 70
    max-gas-price-gwei: 1000
  event:
    scan-interval-ms: 5000
    max-blocks-per-scan: 100
    retry-delay-ms: 30000
  indexer:
    batch-size: 100
    sync-concurrency: 5
    metadata-timeout-seconds: 30
  zkp:
    circuit-cache-size: 50
    verification-timeout-ms: 10000
