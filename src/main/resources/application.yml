server:
  port: 8080

spring:
  application:
    name: didauth-service
  r2dbc:
    url: r2dbc:mysql://localhost:3306/didauth?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: password
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.didauth.core.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

didauth:
  zkp:
    circuits-path: classpath:circuits/
    verify-timeout: 30000
  hd-wallet:
    root-path: m/44'/60'/0'/0/
    supported-chains: ETH, BTC, POLYGON
  chain:
    rpc:
      eth: https://eth.llamarpc.com
      polygon: https://polygon-rpc.com
      bsc: https://bsc-dataseed.binance.org
  storage:
    ipfs:
      gateway: https://ipfs.io/ipfs/
      api: http://localhost:5001
    arweave:
      gateway: https://arweave.net/
  multisig:
    default-threshold: 2
    default-signers: 3
  gas:
    history-window-hours: 24
    priority-levels: slow, standard, fast
  audit:
    enabled: true
    topic: didauth-audit-log

  cache:
    enabled: true
    l1-enabled: true
    l2-enabled: true
    warm-up-enabled: false
    configs:
      zkp-proofs:
        ttl: 10m
        max-size: 10000
        cache-nulls: false
        warm-up: false
      hd-wallets:
        ttl: 30m
        max-size: 5000
        cache-nulls: false
        warm-up: true
      block-index:
        ttl: 1h
        max-size: 2000
        cache-nulls: false
        warm-up: false
      multisig-wallets:
        ttl: 15m
        max-size: 3000
        cache-nulls: false
        warm-up: false

  batch:
    hd-wallet:
      max-derive-size: 1000
      max-addressbook-size: 500
      default-concurrency: 10
    indexer:
      max-block-batch-size: 100
      enable-parsing-timing: true
      enable-db-timing: true

logging:
  level:
    com.didauth: DEBUG
    org.springframework.web: INFO
