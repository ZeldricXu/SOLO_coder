server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: edge-scheduler
  profiles:
    active: dev

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.edgescheduler.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

edge:
  scheduler:
    rule:
      retry-max-attempts: 3
      retry-interval: 1000
    ota:
      gray-scale-batches: 3
      rollback-enabled: true
    offline:
      cache-path: ./data/offline
      sync-batch-size: 100
    protocol:
      driver-scan-package: com.edgescheduler.protocol.driver
    inference:
      model-path: ./models
      task-timeout: 300s
    cache:
      sync-interval-ms: 30000
      max-sync-attempts: 5
      expire-hours: 72
