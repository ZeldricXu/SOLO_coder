spring:
  application:
    name: log-level-manager

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/log_manager?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    encoding: UTF-8

  cache:
    type: caffeine

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080
  netty:
    idle-timeout: 60s
  reactive:
    session:
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,beans,env
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.logmanager.infrastructure.persistence.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: INFO
    com.logmanager: DEBUG
    org.springframework.web: INFO
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/${spring.application.name}.log
    max-size: 100MB
    max-history: 30

app:
  config:
    default-namespace: default
    cache-ttl-minutes: 10
  log:
    default-level: INFO
    max-history-days: 30
  slo:
    default-window-days: 30
    burn-rate-alert-threshold: 1.0
  notification:
    default-channel: email
    suppression-default-minutes: 5
  task:
    default-max-retries: 3
    default-timeout-minutes: 30
  storage:
    default-bucket: default
    presigned-url-expiration-seconds: 3600
  gateway:
    default-timeout-ms: 30000
    retry-attempts: 3

cache:
  log-entry:
    l1:
      max-size: 10000
      ttl: 5m
    l2:
      ttl: 30m

metrics:
  batch:
    enabled: true
    max-size: 100
    flush-interval: 1s
    max-latency: 5s

slo:
  monitoring:
    enabled: true
    histogram-enabled: true
    min-expected-value: 0
    max-expected-value: 100
