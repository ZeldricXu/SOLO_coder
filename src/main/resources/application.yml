spring:
  application:
    name: config-middleware

  r2dbc:
    url: r2dbc:mysql://localhost:3306/config_middleware?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/config_middleware?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    encoding: UTF-8

server:
  port: 8080
  netty:
    threads:
      worker: 16
      boss: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

config:
  multi-source:
    enabled: true
    sources:
      - type: mysql
        priority: 1
        enabled: true
        readOnly: false
        writeOnly: false
      - type: redis
        priority: 2
        enabled: true
        readOnly: false
        writeOnly: false
      - type: local
        priority: 3
        enabled: true
        readOnly: true
        writeOnly: false
    refresh-interval: 30000
  cache:
    caffeine:
      maximum-size: 10000
      expire-after-write: 300000
      expire-after-access: 180000

sidecar:
  injection:
    enabled: true
    strategy: sidecar
  resources:
    cpu: 500m
    memory: 256Mi
  hot-reload:
    enabled: true
    interval: 10000
  events:
    enabled: true
    notification:
      enabled: true
      channels: webhook,email

dns:
  proxy:
    enabled: true
    port: 5353
    upstreams:
      - host: 8.8.8.8
        port: 53
        priority: 1
      - host: 114.114.114.114
        port: 53
        priority: 2
    cache:
      ttl: 300
      max-size: 10000
      cleanup-interval-ms: 600000
      max-cleanup-interval-ms: 3600000
    plugin:
      resolve-timeout-ms: 5000

notification:
  providers:
    - type: email
      enabled: true
      priority: 1
    - type: sms
      enabled: true
      priority: 2
    - type: webhook
      enabled: true
      priority: 3
  suppression:
    window-size: 60000
    max-alerts-per-window: 10

flow:
  canary:
    enabled: true
    default-weight: 10
  blue-green:
    enabled: true
  mirroring:
    enabled: false
  circuit-breaker:
    failure-rate-threshold: 50
    wait-duration-in-open-state: 60000
    permitted-number-of-calls-in-half-open-state: 10

event:
  store:
    snapshot-interval: 100
    max-events-per-aggregate: 10000

audit:
  enabled: true
  retention-days: 365

logging:
  level:
    com.solo.config: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
