server:
  port: 8080

spring:
  application:
    name: pay-gateway
  
  datasource:
    url: jdbc:mysql://localhost:3306/pay_gateway?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0

logging:
  level:
    com.paygateway: DEBUG
    org.hibernate.SQL: DEBUG

pay:
  gateway:
    base-url: http://localhost:8080