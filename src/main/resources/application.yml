server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: formflow

  datasource:
    url: jdbc:h2:mem:formflow
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: always

  mail:
    host: smtp.example.com
    port: 587
    username: your-email@example.com
    password: your-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.formflow: DEBUG
    org.hibernate.SQL: DEBUG

formflow:
  notification:
    email-enabled: false
    sms-enabled: false
  process:
    task-due-days: 1
  reminder:
    enabled: true
    interval-hours: 24
    max-reminders: 3
    check-interval-ms: 3600000
    escalation:
      enabled: true
      after-hours: 48
