spring:
  application:
    name: file-lifecycle-manager
  profiles:
    active: dev
  r2dbc:
    url: r2dbc:mysql://localhost:3306/file_manager
    username: root
    password: password
  datasource:
    url: jdbc:mysql://localhost:3306/file_manager?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.solocoder.infrastructure.persistence.entity

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.solocoder: INFO
    org.springframework.web: DEBUG
  masking:
    enabled: true
  plugins:
    trace-id:
      enabled: true
    metrics:
      enabled: true
    error-alert:
      enabled: true
      threshold: 10
      window-ms: 60000

storage:
  master:
    base-path: /data/storage/master
  replica:
    base-path: /data/storage/replica
  lifecycle:
    cleanup-interval: 3600000
  read-write-routing:
    enabled: true

feature:
  store:
    online-url: redis://localhost:6379
    offline-url: jdbc:mysql://localhost:3306/feature_store

gpu:
  scheduler:
    node-count: 4
    gpus-per-node: 8
    preemption-enabled: true

document:
  pipeline:
    chunk-size: 1000
    chunk-overlap: 200
    embedding-dimension: 384
