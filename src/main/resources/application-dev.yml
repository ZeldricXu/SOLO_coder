server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/edge_scheduler?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 8

  flyway:
    enabled: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

edge:
  scheduler:
    cache:
      caffeine:
        maximum-size: 10000
        expire-after-write: 3600s

logging:
  level:
    com.edgescheduler: DEBUG
    org.springframework.r2dbc: DEBUG
