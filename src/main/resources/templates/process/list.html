<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>流程管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">流程管理</h1>
            <p class="text-gray-500 mt-1">管理和设计审批流程</p>
        </div>
        <a href="/process/create"
           class="inline-flex items-center px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow-sm transition-colors">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            新建流程
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 mb-6">
        <form method="get" action="/process" class="p-4 flex flex-wrap items-center gap-4">
            <div class="flex-1 min-w-[200px]">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="搜索流程名称或Key..."
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
            </div>
            <div class="w-48">
                <select name="category" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors bg-white">
                    <option value="">全部分类</option>
                    <option value="请假" th:selected="${category == '请假'}">请假</option>
                    <option value="报销" th:selected="${category == '报销'}">报销</option>
                    <option value="采购" th:selected="${category == '采购'}">采购</option>
                    <option value="入职" th:selected="${category == '入职'}">入职</option>
                    <option value="通用" th:selected="${category == '通用'}">通用</option>
                </select>
            </div>
            <button type="submit"
                    class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-lg transition-colors">
                搜索
            </button>
        </form>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                <tr class="bg-gray-50 border-b border-gray-200">
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">流程名称</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">流程Key</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">关联表单</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">分类</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">状态</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">创建人</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">更新时间</th>
                    <th class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">操作</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                <tr th:each="proc : ${page.records}" class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4">
                        <a th:href="@{/process/view/{id}(id=${proc.id})}" class="text-sm font-medium text-indigo-600 hover:text-indigo-800" th:text="${proc.processName}">流程名称</a>
                        <p class="text-xs text-gray-400 mt-0.5" th:if="${proc.processDesc}" th:text="${proc.processDesc}">描述</p>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-600 font-mono" th:text="${proc.processKey}">process_key</td>
                    <td class="px-6 py-4 text-sm text-gray-600" th:text="${proc.formName ?: '-'}">关联表单</td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800" th:text="${proc.category}">分类</span>
                    </td>
                    <td class="px-6 py-4">
                        <span th:if="${proc.status == 1}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                            已发布
                        </span>
                        <span th:if="${proc.status != 1}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600">
                            未发布
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-600" th:text="${proc.creatorName ?: '-'}">创建人</td>
                    <td class="px-6 py-4 text-sm text-gray-500"
                        th:text="${#temporals.format(proc.updateTime, 'yyyy-MM-dd HH:mm')}">2025-01-01</td>
                    <td class="px-6 py-4 text-right">
                        <div class="flex items-center justify-end space-x-2">
                            <a th:href="@{/process/edit/{id}(id=${proc.id})}"
                               class="text-gray-500 hover:text-indigo-600 transition-colors p-1" title="编辑">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                </svg>
                            </a>
                            <button th:if="${proc.status != 1}"
                                    hx:post="@{/process/publish/{id}(id=${proc.id})}"
                                    hx-target="closest tr" hx-swap="outerHTML"
                                    class="text-gray-500 hover:text-green-600 transition-colors p-1" title="发布">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                                </svg>
                            </button>
                            <button th:if="${proc.status == 1}"
                                    hx:post="@{/process/publish/{id}(id=${proc.id})}"
                                    hx-target="closest tr" hx-swap="outerHTML"
                                    class="text-gray-500 hover:text-amber-600 transition-colors p-1" title="取消发布">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
                                </svg>
                            </button>
                            <button hx:post="@{/process/delete/{id}(id=${proc.id})}"
                                    hx-target="closest tr" hx-swap="outerHTML swap:0.5s"
                                    hx-confirm="确定要删除此流程吗？"
                                    class="text-gray-500 hover:text-red-600 transition-colors p-1" title="删除">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
                <tr th:if="${page.records.isEmpty()}">
                    <td colspan="8" class="px-6 py-12 text-center">
                        <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm0 8a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zm10 0a1 1 0 011-1h4a1 1 0 011 1v6a1 1 0 01-1 1h-4a1 1 0 01-1-1v-6z"/>
                        </svg>
                        <p class="text-sm text-gray-400">暂无流程数据</p>
                        <a href="/process/create" class="mt-3 inline-flex items-center text-sm text-indigo-600 hover:text-indigo-500 font-medium">创建第一个流程 →</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${page.total > page.size}" class="px-6 py-4 border-t border-gray-200 flex items-center justify-between">
            <p class="text-sm text-gray-500">
                共 <span th:text="${page.total}">0</span> 条记录
            </p>
            <div class="flex items-center space-x-1">
                <a th:href="@{/process(pageNum=1, keyword=${keyword}, category=${category})}"
                   th:classappend="${page.current == 1} ? 'pointer-events-none opacity-50'"
                   class="px-3 py-1.5 text-sm text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">首页</a>
                <a th:href="@{/process(pageNum=${page.current - 1}, keyword=${keyword}, category=${category})}"
                   th:classappend="${page.current == 1} ? 'pointer-events-none opacity-50'"
                   class="px-3 py-1.5 text-sm text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">上一页</a>
                <span th:each="i : ${#numbers.sequence(T(Math).max(1, page.current - 2), T(Math).min(page.pages, page.current + 2))}">
                    <a th:href="@{/process(pageNum=${i}, keyword=${keyword}, category=${category})}"
                       th:text="${i}"
                       th:classappend="${i == page.current} ? 'bg-indigo-600 text-white'"
                       class="px-3 py-1.5 text-sm rounded-lg transition-colors"
                       th:class="${i == page.current} ? 'bg-indigo-600 text-white' : 'text-gray-600 hover:bg-gray-100'">1</a>
                </span>
                <a th:href="@{/process(pageNum=${page.current + 1}, keyword=${keyword}, category=${category})}"
                   th:classappend="${page.current == page.pages} ? 'pointer-events-none opacity-50'"
                   class="px-3 py-1.5 text-sm text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">下一页</a>
                <a th:href="@{/process(pageNum=${page.pages}, keyword=${keyword}, category=${category})}"
                   th:classappend="${page.current == page.pages} ? 'pointer-events-none opacity-50'"
                   class="px-3 py-1.5 text-sm text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">末页</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
