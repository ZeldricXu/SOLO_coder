<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('组件管理')"></head>
<body class="bg-gray-50">

<div th:replace="fragments/layout :: sidebar"></div>
<div th:replace="fragments/layout :: header('组件管理')"></div>

<main class="ml-64 pt-16 min-h-screen">
    <div class="p-6">

        <div x-data="componentManager()"
             x-init="init([(${componentsJson})], [[${totalJson}]], [[${currentPageJson}]], [[${totalPagesJson}]])"
             class="mb-6">

            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-4">
                <div class="flex flex-1 items-center gap-4">
                    <div class="relative flex-1 max-w-md">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" x-model="searchKeyword"
                               @input.debounce.300ms="loadComponents()"
                               :class="{'animate-pulse': loading}"
                               class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                               placeholder="搜索组件名称、描述...">
                    </div>
                    <button @click="showFilters = !showFilters"
                            class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 flex items-center">
                        <i class="fas fa-filter mr-2"></i>
                        筛选
                        <span x-show="(selectedCategory || selectedFramework)" class="ml-2 w-2 h-2 bg-indigo-500 rounded-full"></span>
                    </button>
                </div>
                <a href="/components/new"
                   class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 flex items-center">
                    <i class="fas fa-plus mr-2"></i>
                    新建组件
                </a>
            </div>

            <div x-show="showFilters" x-cloak x-transition
                 class="mt-4 mb-4 p-4 bg-white rounded-lg border border-gray-200 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">分类</label>
                    <select x-model="selectedCategory" @change="loadComponents()"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        <option value="">全部分类</option>
                        <option value="基础组件">基础组件</option>
                        <option value="表单组件">表单组件</option>
                        <option value="数据展示">数据展示</option>
                        <option value="反馈组件">反馈组件</option>
                        <option value="导航组件">导航组件</option>
                        <option value="布局组件">布局组件</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">技术栈</label>
                    <select x-model="selectedFramework" @change="loadComponents()"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        <option value="">全部</option>
                        <option value="react">React</option>
                        <option value="vue">Vue</option>
                    </select>
                </div>
                <div class="flex items-end space-x-2">
                    <button @click="clearFilters()"
                            class="px-3 py-2 text-sm text-gray-600 hover:text-gray-800">
                        清除筛选
                    </button>
                </div>
            </div>

            <div x-show="loading" x-cloak class="mb-4 p-4 bg-blue-50 rounded-lg flex items-center">
                <i class="fas fa-spinner fa-spin text-blue-600 mr-2"></i>
                <span class="text-blue-700">正在加载组件...</span>
            </div>

            <div x-show="errorMsg" x-cloak class="mb-4 p-4 bg-red-50 rounded-lg flex items-center">
                <i class="fas fa-exclamation-circle text-red-600 mr-2"></i>
                <span class="text-red-700" x-text="errorMsg"></span>
                <button @click="errorMsg = ''; loadComponents()" class="ml-auto text-red-600 hover:text-red-800 text-sm">
                    重试
                </button>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="px-6 py-3 border-b border-gray-200 flex items-center justify-between bg-gray-50">
                    <span class="text-sm text-gray-600">
                        共 <span class="font-medium text-gray-900" x-text="total">0</span> 个组件
                        <span x-show="(searchKeyword || selectedCategory || selectedFramework)" class="ml-2 text-indigo-600">
                            (已筛选)
                        </span>
                    </span>
                    <button @click="loadComponents()" class="text-sm text-gray-500 hover:text-gray-700 flex items-center">
                        <i class="fas fa-sync-alt mr-1"></i>刷新
                    </button>
                </div>

                <table class="w-full">
                    <thead class="bg-gray-50 border-b border-gray-200">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">组件</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">分类</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">技术栈</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">最新版本</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <template x-for="component in components" :key="component.id">
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-6 py-4">
                                    <div class="flex items-center">
                                        <div class="w-10 h-10 bg-indigo-100 rounded-lg flex items-center justify-center mr-3">
                                            <i class="fas fa-puzzle-piece text-indigo-600"></i>
                                        </div>
                                        <div>
                                            <p class="font-medium text-gray-900" x-text="component.displayName">Button</p>
                                            <p class="text-sm text-gray-500" x-text="component.name">button</p>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4">
                                    <span class="px-2 py-1 bg-gray-100 text-gray-700 text-xs rounded" x-text="component.category">基础组件</span>
                                </td>
                                <td class="px-6 py-4">
                                    <span x-show="component.framework === 'react' || component.framework?.code === 'react'"
                                          class="px-2 py-1 bg-blue-100 text-blue-700 text-xs rounded">
                                        <i class="fab fa-react mr-1"></i>React
                                    </span>
                                    <span x-show="component.framework === 'vue' || component.framework?.code === 'vue'"
                                          class="px-2 py-1 bg-green-100 text-green-700 text-xs rounded">
                                        <i class="fab fa-vuejs mr-1"></i>Vue
                                    </span>
                                </td>
                                <td class="px-6 py-4">
                                    <span x-show="component.latestVersion" class="text-sm text-gray-900 font-mono" x-text="component.latestVersion">v2.1.0</span>
                                    <span x-show="!component.latestVersion" class="text-sm text-gray-400">-</span>
                                </td>
                                <td class="px-6 py-4">
                                    <span x-show="component.published === 1" class="px-2 py-1 bg-green-100 text-green-700 text-xs rounded">已发布</span>
                                    <span x-show="component.published === 0" class="px-2 py-1 bg-gray-100 text-gray-700 text-xs rounded">草稿</span>
                                </td>
                                <td class="px-6 py-4 text-right">
                                    <div class="flex items-center justify-end space-x-2">
                                        <a :href="'/components/' + component.id"
                                           class="p-2 text-gray-400 hover:text-indigo-600" title="查看">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <a :href="'/components/' + component.id + '/edit'"
                                           class="p-2 text-gray-400 hover:text-indigo-600" title="编辑">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <button @click="deleteComponent(component.id, component.displayName)"
                                                class="p-2 text-gray-400 hover:text-red-600" title="删除">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </template>
                        <tr x-show="components.length === 0 && !loading">
                            <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                                <i class="fas fa-inbox text-4xl text-gray-300 mb-3"></i>
                                <p x-show="!searchKeyword && !selectedCategory && !selectedFramework">暂无组件数据</p>
                                <p x-show="searchKeyword || selectedCategory || selectedFramework">未找到匹配的组件</p>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div x-show="total > pageSize" class="px-6 py-4 border-t border-gray-200 flex items-center justify-between">
                    <p class="text-sm text-gray-500">
                        第 <span x-text="currentPage">1</span> / <span x-text="totalPages">1</span> 页
                    </p>
                    <div class="flex items-center space-x-1">
                        <button @click="prevPage()"
                                :disabled="currentPage === 1"
                                :class="currentPage === 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-50'"
                                class="px-3 py-1 border border-gray-300 rounded text-sm">
                            上一页
                        </button>
                        <template x-for="page in pagination" :key="page">
                            <button x-show="page !== '...'" @click="goToPage(page)"
                                    :class="currentPage === page ? 'bg-indigo-600 text-white' : 'hover:bg-gray-50'"
                                    class="px-3 py-1 border border-gray-300 rounded text-sm"
                                    x-text="page"></button>
                            <span x-show="page === '...'" class="px-2 text-gray-500">...</span>
                        </template>
                        <button @click="nextPage()"
                                :disabled="currentPage === totalPages"
                                :class="currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-50'"
                                class="px-3 py-1 border border-gray-300 rounded text-sm">
                            下一页
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

<script>
function componentManager() {
    return {
        components: [],
        total: 0,
        currentPage: 1,
        totalPages: 1,
        pageSize: 10,
        searchKeyword: '',
        selectedCategory: '',
        selectedFramework: '',
        showFilters: false,
        loading: false,
        errorMsg: '',
        pagination: [],

        init(initialData, total, page, pages) {
            try {
                this.components = typeof initialData === 'string' ? JSON.parse(initialData) : initialData;
            } catch(e) {
                this.components = initialData || [];
            }
            this.total = total || 0;
            this.currentPage = page || 1;
            this.totalPages = pages || 1;
            this.updatePagination();
        },

        async loadComponents() {
            this.loading = true;
            this.errorMsg = '';
            try {
                const params = new URLSearchParams({
                    pageNum: this.currentPage,
                    pageSize: this.pageSize,
                    keyword: this.searchKeyword,
                    category: this.selectedCategory,
                    framework: this.selectedFramework
                });
                const response = await fetch('/api/components?' + params.toString(), {
                    headers: { 'Accept': 'application/json' }
                });
                const result = await response.json();
                if (result.code === 200) {
                    this.components = result.data.records || [];
                    this.total = result.data.total || 0;
                    this.currentPage = result.data.current || 1;
                    this.totalPages = result.data.pages || 1;
                    this.updatePagination();
                } else {
                    this.errorMsg = result.message || '加载失败';
                }
            } catch (e) {
                console.error('Failed to load components:', e);
            } finally {
                this.loading = false;
            }
        },

        updatePagination() {
            const pages = [];
            const total = this.totalPages;
            const current = this.currentPage;

            if (total <= 7) {
                for (let i = 1; i <= total; i++) pages.push(i);
            } else {
                pages.push(1);
                if (current > 3) pages.push('...');
                for (let i = Math.max(2, current - 1); i <= Math.min(total - 1, current + 1); i++) {
                    pages.push(i);
                }
                if (current < total - 2) pages.push('...');
                pages.push(total);
            }
            this.pagination = pages;
        },

        prevPage() {
            if (this.currentPage > 1) {
                this.currentPage--;
                this.loadComponents();
            }
        },

        nextPage() {
            if (this.currentPage < this.totalPages) {
                this.currentPage++;
                this.loadComponents();
            }
        },

        goToPage(page) {
            this.currentPage = page;
            this.loadComponents();
        },

        clearFilters() {
            this.searchKeyword = '';
            this.selectedCategory = '';
            this.selectedFramework = '';
            this.currentPage = 1;
            this.loadComponents();
        },

        async deleteComponent(id, name) {
            if (!confirm(`确定要删除组件 "${name}" 吗？此操作不可恢复。`)) return;
            try {
                const response = await fetch('/api/components/' + id, {
                    method: 'DELETE',
                    headers: { 'Accept': 'application/json' }
                });
                const result = await response.json();
                if (result.code === 200) {
                    this.loadComponents();
                } else {
                    alert('删除失败: ' + (result.message || '未知错误'));
                }
            } catch (e) {
                console.error('Delete failed:', e);
                alert('删除失败，请稍后重试');
            }
        }
    };
}
</script>

</body>
</html>
