<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('组件管理')"></head>
<body class="bg-gray-50">

<div th:replace="fragments/layout :: sidebar"></div>
<div th:replace="fragments/layout :: header('组件管理')"></div>

<main class="ml-64 pt-16 min-h-screen">
    <div class="p-6">

        <div x-data="{ showFilters: false }" class="mb-6">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex flex-1 items-center gap-4">
                    <div class="relative flex-1 max-w-md">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" x-model="$wire.search"
                               @input.debounce.300ms="$dispatch('search', $event.target.value)"
                               class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                               placeholder="搜索组件名称、描述...">
                    </div>
                    <button @click="showFilters = !showFilters"
                            class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 flex items-center">
                        <i class="fas fa-filter mr-2"></i>
                        筛选
                    </button>
                </div>
                <a href="/components/new"
                   class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 flex items-center">
                    <i class="fas fa-plus mr-2"></i>
                    新建组件
                </a>
            </div>

            <div x-show="showFilters" x-cloak
                 class="mt-4 p-4 bg-white rounded-lg border border-gray-200 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">分类</label>
                    <select th:value="${category}"
                            @change="window.location.search = 'category=' + $event.target.value"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        <option value="">全部分类</option>
                        <option value="基础组件">基础组件</option>
                        <option value="表单组件">表单组件</option>
                        <option value="数据展示">数据展示</option>
                        <option value="反馈组件">反馈组件</option>
                        <option value="导航组件">导航组件</option>
                        <option value="布局组件">布局组件</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">技术栈</label>
                    <select th:value="${framework}"
                            @change="window.location.search = 'framework=' + $event.target.value"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        <option value="">全部</option>
                        <option value="react">React</option>
                        <option value="vue">Vue</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">组件</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">分类</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">技术栈</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">最新版本</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">维护人</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr th:each="component : ${page.records}" class="hover:bg-gray-50">
                        <td class="px-6 py-4">
                            <div class="flex items-center">
                                <div class="w-10 h-10 bg-indigo-100 rounded-lg flex items-center justify-center mr-3">
                                    <i class="fas fa-puzzle-piece text-indigo-600"></i>
                                </div>
                                <div>
                                    <p class="font-medium text-gray-900" th:text="${component.displayName}">Button</p>
                                    <p class="text-sm text-gray-500" th:text="${component.name}">button</p>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 bg-gray-100 text-gray-700 text-xs rounded" th:text="${component.category}">基础组件</span>
                        </td>
                        <td class="px-6 py-4">
                            <span th:if="${component.framework.code == 'react'}" class="px-2 py-1 bg-blue-100 text-blue-700 text-xs rounded">
                                <i class="fab fa-react mr-1"></i>React
                            </span>
                            <span th:if="${component.framework.code == 'vue'}" class="px-2 py-1 bg-green-100 text-green-700 text-xs rounded">
                                <i class="fab fa-vuejs mr-1"></i>Vue
                            </span>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-900" th:text="${component.latestVersion ?: '-'}">v2.1.0</td>
                        <td class="px-6 py-4">
                            <div class="flex items-center">
                                <div class="w-6 h-6 bg-indigo-100 rounded-full flex items-center justify-center mr-2">
                                    <span class="text-xs text-indigo-600 font-medium"
                                          th:text="${component.maintainer?.nickname?.substring(0,1) ?: 'U'}">张</span>
                                </div>
                                <span class="text-sm text-gray-700" th:text="${component.maintainer?.nickname ?: '-'}">张三</span>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <span th:if="${component.published == 1}" class="px-2 py-1 bg-green-100 text-green-700 text-xs rounded">已发布</span>
                            <span th:if="${component.published == 0}" class="px-2 py-1 bg-gray-100 text-gray-700 text-xs rounded">草稿</span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex items-center justify-end space-x-2">
                                <a th:href="@{'/components/' + ${component.id}}"
                                   class="p-2 text-gray-400 hover:text-indigo-600" title="查看">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a th:href="@{'/components/' + ${component.id} + '/edit'}"
                                   class="p-2 text-gray-400 hover:text-indigo-600" title="编辑">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <button class="p-2 text-gray-400 hover:text-red-600" title="删除">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(page.records)}">
                        <td colspan="7" class="px-6 py-12 text-center text-gray-500">
                            <i class="fas fa-inbox text-4xl text-gray-300 mb-3"></i>
                            <p>暂无组件数据</p>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div th:if="${page.total > 10}" class="px-6 py-4 border-t border-gray-200 flex items-center justify-between">
                <p class="text-sm text-gray-500">
                    共 <span th:text="${page.total}">0</span> 条记录
                </p>
                <div class="flex items-center space-x-2">
                    <a th:href="@{'/components?pageNum=' + (page.current - 1)}"
                       th:class="${page.current == 1} ? 'opacity-50 cursor-not-allowed' : ''"
                       class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50">上一页</a>
                    <span class="px-3 py-1 text-sm text-gray-600">
                        <span th:text="${page.current}">1</span> / <span th:text="${page.pages}">1</span>
                    </span>
                    <a th:href="@{'/components?pageNum=' + (page.current + 1)}"
                       th:class="${page.current == page.pages} ? 'opacity-50 cursor-not-allowed' : ''"
                       class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50">下一页</a>
                </div>
            </div>
        </div>

    </div>
</main>

</body>
</html>
