<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('设计令牌')"></head>
<body class="bg-gray-50">

<div th:replace="fragments/layout :: sidebar"></div>
<div th:replace="fragments/layout :: header('设计令牌')"></div>

<main class="ml-64 pt-16 min-h-screen">
    <div class="p-6">

        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
            <div class="flex items-center gap-4 flex-1">
                <div class="relative flex-1 max-w-md">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text"
                           class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                           placeholder="搜索令牌名称...">
                </div>
                <select class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    <option value="">所有类型</option>
                    <option value="COLOR">颜色</option>
                    <option value="SPACING">间距</option>
                    <option value="FONT">字体</option>
                    <option value="BORDER_RADIUS">圆角</option>
                    <option value="BOX_SHADOW">阴影</option>
                </select>
                <select class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    <option value="">所有层级</option>
                    <option value="BASE">基础令牌</option>
                    <option value="SEMANTIC">语义令牌</option>
                    <option value="COMPONENT">组件令牌</option>
                </select>
            </div>
            <div class="flex items-center gap-3">
                <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 flex items-center">
                    <i class="fas fa-download mr-2"></i>导出
                </button>
                <a href="/tokens/new" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 flex items-center">
                    <i class="fas fa-plus mr-2"></i>新建令牌
                </a>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-1">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 sticky top-20">
                    <h3 class="font-semibold text-gray-900 mb-4">令牌层级</h3>
                    <nav class="space-y-1">
                        <a href="#" class="flex items-center justify-between p-3 bg-indigo-50 text-indigo-700 rounded-lg">
                            <div class="flex items-center">
                                <div class="w-8 h-8 bg-indigo-200 rounded-lg flex items-center justify-center mr-3">
                                    <i class="fas fa-palette text-indigo-600 text-sm"></i>
                                </div>
                                <div>
                                    <p class="font-medium">基础令牌</p>
                                    <p class="text-xs text-indigo-500">128 个</p>
                                </div>
                            </div>
                            <i class="fas fa-chevron-right text-sm"></i>
                        </a>
                        <a href="#" class="flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg">
                            <div class="flex items-center">
                                <div class="w-8 h-8 bg-purple-100 rounded-lg flex items-center justify-center mr-3">
                                    <i class="fas fa-layer-group text-purple-600 text-sm"></i>
                                </div>
                                <div>
                                    <p class="font-medium text-gray-900">语义令牌</p>
                                    <p class="text-xs text-gray-500">96 个</p>
                                </div>
                            </div>
                            <i class="fas fa-chevron-right text-sm text-gray-400"></i>
                        </a>
                        <a href="#" class="flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg">
                            <div class="flex items-center">
                                <div class="w-8 h-8 bg-green-100 rounded-lg flex items-center justify-center mr-3">
                                    <i class="fas fa-puzzle-piece text-green-600 text-sm"></i>
                                </div>
                                <div>
                                    <p class="font-medium text-gray-900">组件令牌</p>
                                    <p class="text-xs text-gray-500">100 个</p>
                                </div>
                            </div>
                            <i class="fas fa-chevron-right text-sm text-gray-400"></i>
                        </a>
                    </nav>

                    <div class="mt-6 pt-6 border-t border-gray-200">
                        <h4 class="font-medium text-gray-900 mb-3">分类</h4>
                        <div class="space-y-2">
                            <a href="#" class="flex items-center justify-between p-2 hover:bg-gray-50 rounded">
                                <span class="text-sm text-gray-700">颜色系统</span>
                                <span class="text-xs text-gray-500">48</span>
                            </a>
                            <a href="#" class="flex items-center justify-between p-2 hover:bg-gray-50 rounded">
                                <span class="text-sm text-gray-700">间距系统</span>
                                <span class="text-xs text-gray-500">24</span>
                            </a>
                            <a href="#" class="flex items-center justify-between p-2 hover:bg-gray-50 rounded">
                                <span class="text-sm text-gray-700">字体系统</span>
                                <span class="text-xs text-gray-500">32</span>
                            </a>
                            <a href="#" class="flex items-center justify-between p-2 hover:bg-gray-50 rounded">
                                <span class="text-sm text-gray-700">圆角系统</span>
                                <span class="text-xs text-gray-500">8</span>
                            </a>
                            <a href="#" class="flex items-center justify-between p-2 hover:bg-gray-50 rounded">
                                <span class="text-sm text-gray-700">阴影系统</span>
                                <span class="text-xs text-gray-500">16</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-3">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">令牌名称</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">类型</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">层级</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">值</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">继承自</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            <tr th:each="token : ${page.records}" class="hover:bg-gray-50">
                                <td class="px-6 py-4">
                                    <code class="text-sm text-indigo-600 font-mono" th:text="${token.name}">--color-primary</code>
                                </td>
                                <td class="px-6 py-4">
                                    <span th:if="${token.type.code == 'COLOR'}" class="px-2 py-1 bg-pink-100 text-pink-700 text-xs rounded">颜色</span>
                                    <span th:if="${token.type.code == 'SPACING'}" class="px-2 py-1 bg-blue-100 text-blue-700 text-xs rounded">间距</span>
                                    <span th:if="${token.type.code == 'FONT'}" class="px-2 py-1 bg-purple-100 text-purple-700 text-xs rounded">字体</span>
                                    <span th:if="${token.type.code == 'BORDER_RADIUS'}" class="px-2 py-1 bg-green-100 text-green-700 text-xs rounded">圆角</span>
                                    <span th:if="${token.type.code == 'BOX_SHADOW'}" class="px-2 py-1 bg-gray-100 text-gray-700 text-xs rounded">阴影</span>
                                </td>
                                <td class="px-6 py-4">
                                    <span th:if="${token.level.code == 'BASE'}" class="px-2 py-1 bg-indigo-100 text-indigo-700 text-xs rounded">基础</span>
                                    <span th:if="${token.level.code == 'SEMANTIC'}" class="px-2 py-1 bg-purple-100 text-purple-700 text-xs rounded">语义</span>
                                    <span th:if="${token.level.code == 'COMPONENT'}" class="px-2 py-1 bg-green-100 text-green-700 text-xs rounded">组件</span>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center">
                                        <div th:if="${token.type.code == 'COLOR'}"
                                             class="w-6 h-6 rounded-full mr-2 border border-gray-200"
                                             th:style="'background-color: ' + ${token.baseValue}"></div>
                                        <code class="text-sm text-gray-700 font-mono" th:text="${token.baseValue}">#6366f1</code>
                                    </div>
                                </td>
                                <td class="px-6 py-4 text-sm text-gray-500" th:text="${token.parent?.name ?: '-'}">-</td>
                                <td class="px-6 py-4 text-right">
                                    <a th:href="@{'/tokens/' + ${token.id}}"
                                       class="text-indigo-600 hover:text-indigo-700 text-sm mr-3">查看</a>
                                    <a th:href="@{'/tokens/' + ${token.id} + '/edit'}"
                                       class="text-gray-600 hover:text-gray-700 text-sm">编辑</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                        <div class="flex items-center justify-between mb-3">
                            <h4 class="font-medium text-gray-900">导出格式</h4>
                            <i class="fas fa-download text-gray-400"></i>
                        </div>
                        <div class="space-y-2">
                            <button class="w-full text-left px-3 py-2 bg-gray-50 hover:bg-gray-100 rounded-lg text-sm text-gray-700">
                                CSS Variables
                            </button>
                            <button class="w-full text-left px-3 py-2 bg-gray-50 hover:bg-gray-100 rounded-lg text-sm text-gray-700">
                                JavaScript Module
                            </button>
                            <button class="w-full text-left px-3 py-2 bg-gray-50 hover:bg-gray-100 rounded-lg text-sm text-gray-700">
                                JSON
                            </button>
                            <button class="w-full text-left px-3 py-2 bg-gray-50 hover:bg-gray-100 rounded-lg text-sm text-gray-700">
                                SCSS
                            </button>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                        <div class="flex items-center justify-between mb-3">
                            <h4 class="font-medium text-gray-900">快速操作</h4>
                            <i class="fas fa-bolt text-amber-400"></i>
                        </div>
                        <div class="space-y-2">
                            <button class="w-full text-left px-3 py-2 bg-gray-50 hover:bg-gray-100 rounded-lg text-sm text-gray-700">
                                查看变更历史
                            </button>
                            <button class="w-full text-left px-3 py-2 bg-gray-50 hover:bg-gray-100 rounded-lg text-sm text-gray-700">
                                影响分析报告
                            </button>
                            <button class="w-full text-left px-3 py-2 bg-gray-50 hover:bg-gray-100 rounded-lg text-sm text-gray-700">
                                迁移指南
                            </button>
                        </div>
                    </div>

                    <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl shadow-sm p-5 text-white">
                        <h4 class="font-medium mb-3">需要修改？</h4>
                        <p class="text-white/80 text-sm mb-4">设计令牌的修改需要设计负责人审批</p>
                        <button class="w-full px-4 py-2 bg-white/20 hover:bg-white/30 rounded-lg text-sm font-medium transition">
                            提交修改申请
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

</body>
</html>
