<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('变更日志')"></head>
<body class="bg-gray-50">

<div th:replace="fragments/layout :: sidebar"></div>
<div th:replace="fragments/layout :: header('变更日志')"></div>

<main class="ml-64 pt-16 min-h-screen">
    <div class="p-6">

        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
            <div class="flex items-center gap-4 flex-1">
                <div class="relative flex-1 max-w-md">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text"
                           class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                           placeholder="搜索变更内容...">
                </div>
                <select class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    <option value="">所有类型</option>
                    <option value="feat">新功能 (feat)</option>
                    <option value="fix">修复 (fix)</option>
                    <option value="refactor">重构 (refactor)</option>
                    <option value="docs">文档 (docs)</option>
                    <option value="BREAKING CHANGE">破坏性变更</option>
                </select>
                <select class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    <option value="">所有组件</option>
                    <option value="Button">Button</option>
                    <option value="Input">Input</option>
                    <option value="Table">Table</option>
                </select>
            </div>
            <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 flex items-center">
                <i class="fas fa-download mr-2"></i>导出 CHANGELOG
            </button>
        </div>

        <div class="space-y-8">
            <div th:each="changelog : ${page.records}">
                <div class="flex items-center mb-4">
                    <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold mr-4">
                        <span th:text="${#strings.substring(changelog.version, 0, 1)}">v</span>
                    </div>
                    <div>
                        <div class="flex items-center space-x-3">
                            <h2 class="text-xl font-bold text-gray-900" th:text="${changelog.version}">v2.1.0</h2>
                            <span th:if="${changelog.componentName != null}"
                                  class="px-2 py-1 bg-indigo-100 text-indigo-700 text-xs rounded"
                                  th:text="${changelog.componentName}">Button</span>
                            <span th:if="${changelog.commitType == 'BREAKING_CHANGE'}"
                                  class="px-2 py-1 bg-red-100 text-red-700 text-xs rounded">
                                <i class="fas fa-exclamation-triangle mr-1"></i>破坏性变更
                            </span>
                        </div>
                        <p class="text-sm text-gray-500 mt-1"
                           th:text="${#dates.format(changelog.createTime, 'yyyy-MM-dd HH:mm')} + ' · ' + ${changelog.commitHash}">
                            2024-01-15 10:30 · a1b2c3d
                        </p>
                    </div>
                </div>

                <div class="ml-8 pl-8 border-l-2 border-gray-200 space-y-4">
                    <div>
                        <p class="font-medium text-gray-900" th:text="${changelog.subject}">新增加载状态和禁用样式</p>
                        <p class="text-sm text-gray-600 mt-1" th:text="${changelog.body}">
                            新增 loading 属性控制按钮加载状态，新增 disabled 属性控制按钮禁用状态
                        </p>
                        <div class="flex flex-wrap gap-2 mt-2">
                            <span th:if="${changelog.commitType == 'feat'}"
                                  class="px-2 py-0.5 bg-green-100 text-green-700 text-xs rounded">feat</span>
                            <span th:if="${changelog.commitType == 'fix'}"
                                  class="px-2 py-0.5 bg-amber-100 text-amber-700 text-xs rounded">fix</span>
                            <span th:if="${changelog.commitType == 'refactor'}"
                                  class="px-2 py-0.5 bg-blue-100 text-blue-700 text-xs rounded">refactor</span>
                            <span th:if="${changelog.commitType == 'docs'}"
                                  class="px-2 py-0.5 bg-purple-100 text-purple-700 text-xs rounded">docs</span>
                        </div>
                        <div class="mt-3 p-3 bg-gray-50 rounded-lg">
                            <p class="text-xs text-gray-500 mb-1">关联提交</p>
                            <code class="text-sm text-gray-700 font-mono"
                                  th:text="'git show ' + ${changelog.commitHash}">git show a1b2c3d</code>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-8 flex justify-center">
            <div class="flex items-center space-x-2">
                <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button class="px-4 py-2 bg-indigo-600 text-white rounded-lg">1</button>
                <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">2</button>
                <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">3</button>
                <span class="px-2 text-gray-400">...</span>
                <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">20</button>
                <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <div class="mt-8 bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Conventional Commits 规范</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="p-4 bg-green-50 rounded-lg">
                    <div class="flex items-center mb-2">
                        <span class="px-2 py-1 bg-green-200 text-green-800 text-xs font-medium rounded mr-2">feat</span>
                        <span class="font-medium text-gray-900">新功能</span>
                    </div>
                    <p class="text-sm text-gray-600">引入新特性的变更，对应 minor 版本号</p>
                </div>
                <div class="p-4 bg-amber-50 rounded-lg">
                    <div class="flex items-center mb-2">
                        <span class="px-2 py-1 bg-amber-200 text-amber-800 text-xs font-medium rounded mr-2">fix</span>
                        <span class="font-medium text-gray-900">修复</span>
                    </div>
                    <p class="text-sm text-gray-600">修复 Bug 的变更，对应 patch 版本号</p>
                </div>
                <div class="p-4 bg-red-50 rounded-lg">
                    <div class="flex items-center mb-2">
                        <span class="px-2 py-1 bg-red-200 text-red-800 text-xs font-medium rounded mr-2">!</span>
                        <span class="font-medium text-gray-900">破坏性变更</span>
                    </div>
                    <p class="text-sm text-gray-600">Breaking Change，对应 major 版本号</p>
                </div>
            </div>
        </div>

    </div>
</main>

</body>
</html>
