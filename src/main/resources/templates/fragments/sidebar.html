<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<nav th:fragment="sidebar(currentPath)" class="flex flex-col h-full bg-gray-900 text-gray-300" x-data="{ collapsed: false }">
    <div class="flex items-center h-16 px-4 border-b border-gray-800">
        <div class="flex items-center space-x-2" x-show="!collapsed">
            <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            <span class="text-lg font-bold text-white">FlowPlatform</span>
        </div>
        <div class="flex items-center justify-center w-full" x-show="collapsed" x-cloak>
            <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
        </div>
    </div>

    <div class="flex-1 overflow-y-auto py-4 space-y-1 px-2">
        <a href="/dashboard" class="flex items-center px-3 py-2.5 rounded-lg transition-colors group"
           th:classappend="${currentPath == '/dashboard'} ? 'bg-indigo-600 text-white' : 'hover:bg-gray-800 hover:text-white'">
            <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/>
            </svg>
            <span class="ml-3 text-sm font-medium" x-show="!collapsed">工作台</span>
        </a>

        <a href="/form" class="flex items-center px-3 py-2.5 rounded-lg transition-colors group"
           th:classappend="${currentPath == '/form'} ? 'bg-indigo-600 text-white' : 'hover:bg-gray-800 hover:text-white'">
            <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            <span class="ml-3 text-sm font-medium" x-show="!collapsed">表单管理</span>
        </a>

        <a href="/process" class="flex items-center px-3 py-2.5 rounded-lg transition-colors group"
           th:classappend="${currentPath == '/process'} ? 'bg-indigo-600 text-white' : 'hover:bg-gray-800 hover:text-white'">
            <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm0 8a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zm10 0a1 1 0 011-1h4a1 1 0 011 1v6a1 1 0 01-1 1h-4a1 1 0 01-1-1v-6z"/>
            </svg>
            <span class="ml-3 text-sm font-medium" x-show="!collapsed">流程管理</span>
        </a>

        <a href="/approval" class="flex items-center px-3 py-2.5 rounded-lg transition-colors group"
           th:classappend="${currentPath == '/approval'} ? 'bg-indigo-600 text-white' : 'hover:bg-gray-800 hover:text-white'">
            <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span class="ml-3 text-sm font-medium" x-show="!collapsed">审批中心</span>
        </a>

        <a href="/report" class="flex items-center px-3 py-2.5 rounded-lg transition-colors group"
           th:classappend="${currentPath == '/report'} ? 'bg-indigo-600 text-white' : 'hover:bg-gray-800 hover:text-white'">
            <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
            <span class="ml-3 text-sm font-medium" x-show="!collapsed">数据报表</span>
        </a>

        <a href="/permission" class="flex items-center px-3 py-2.5 rounded-lg transition-colors group"
           th:classappend="${currentPath == '/permission'} ? 'bg-indigo-600 text-white' : 'hover:bg-gray-800 hover:text-white'">
            <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            <span class="ml-3 text-sm font-medium" x-show="!collapsed">权限管理</span>
        </a>

        <a href="/notification" class="flex items-center px-3 py-2.5 rounded-lg transition-colors group"
           th:classappend="${currentPath == '/notification'} ? 'bg-indigo-600 text-white' : 'hover:bg-gray-800 hover:text-white'">
            <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
            <span class="ml-3 text-sm font-medium" x-show="!collapsed">消息中心</span>
        </a>
    </div>

    <div class="border-t border-gray-800 p-2">
        <button @click="collapsed = !collapsed" class="flex items-center justify-center w-full px-3 py-2 rounded-lg hover:bg-gray-800 transition-colors">
            <svg class="w-5 h-5 transition-transform" :class="{ 'rotate-180': collapsed }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
            </svg>
            <span class="ml-3 text-sm" x-show="!collapsed">Collapse</span>
        </button>
    </div>
</nav>
</body>
</html>
