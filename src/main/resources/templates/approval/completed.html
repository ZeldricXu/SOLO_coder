<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>已办事项</title>
</head>
<body>
<div layout:fragment="content">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">审批中心</h1>
            <p class="text-gray-500 mt-1">查看已处理的审批记录</p>
        </div>
    </div>

    <div class="mb-6 border-b border-gray-200">
        <nav class="flex space-x-8" aria-label="Tabs">
            <a href="/approval/pending"
               class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                待办事项
            </a>
            <a href="/approval/completed"
               class="border-indigo-500 text-indigo-600 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                已办事项
            </a>
            <a href="/approval/initiated"
               class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                已发起
            </a>
        </nav>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                <tr class="bg-gray-50 border-b border-gray-200">
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">申请人</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">流程名称</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">审批节点</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">操作结果</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">审批意见</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">审批时间</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                <tr th:each="task : ${tasks}" class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">
                                <span class="text-xs font-medium text-gray-600" th:text="${#strings.substring(task.assigneeName ?: 'U', 0, 1)}">U</span>
                            </div>
                            <span class="text-sm font-medium text-gray-900" th:text="${task.assigneeName ?: '-'}">审批人</span>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <a th:href="@{/approval/detail/{id}(id=${task.instanceId})}" class="text-sm font-medium text-indigo-600 hover:text-indigo-800" th:text="${task.instanceTitle ?: '-'}">流程名称</a>
                    </td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-700" th:text="${task.nodeName}">审批节点</span>
                    </td>
                    <td class="px-6 py-4">
                        <span th:if="${task.action == 'APPROVE'}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                            同意
                        </span>
                        <span th:if="${task.action == 'REJECT'}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">
                            拒绝
                        </span>
                        <span th:if="${task.action == 'RETURN'}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800">
                            退回
                        </span>
                        <span th:if="${task.action != 'APPROVE' and task.action != 'REJECT' and task.action != 'RETURN'}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600" th:text="${task.action ?: '-'}">-</span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-600 max-w-xs truncate" th:text="${task.comment ?: '-'}">审批意见</td>
                    <td class="px-6 py-4 text-sm text-gray-500" th:text="${#temporals.format(task.completeTime, 'yyyy-MM-dd HH:mm')}">2025-01-01</td>
                </tr>
                <tr th:if="${tasks.isEmpty()}">
                    <td colspan="6" class="px-6 py-12 text-center">
                        <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                        </svg>
                        <p class="text-sm text-gray-400">暂无已办记录</p>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
