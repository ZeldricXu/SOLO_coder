<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('组件市场')"></head>
<body class="bg-gray-50">

<div th:replace="fragments/layout :: sidebar"></div>
<div th:replace="fragments/layout :: header('组件市场')"></div>

<main class="ml-64 pt-16 min-h-screen">
    <div class="p-6">

        <div class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl p-8 mb-8 text-white">
            <h1 class="text-3xl font-bold mb-2">组件市场</h1>
            <p class="text-white/80">发现并使用经过验证的高质量 UI 组件，加速您的开发流程</p>
        </div>

        <div class="mb-6">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="relative flex-1 max-w-xl">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text"
                           class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-base"
                           placeholder="搜索组件...">
                </div>
                <div class="flex gap-3">
                    <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 flex items-center">
                        <i class="fab fa-react mr-2"></i>React
                    </button>
                    <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 flex items-center">
                        <i class="fab fa-vuejs mr-2"></i>Vue
                    </button>
                </div>
            </div>

            <div class="flex flex-wrap gap-2 mt-4">
                <span class="px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-sm cursor-pointer hover:bg-indigo-200">
                    全部
                </span>
                <span class="px-3 py-1 bg-gray-100 text-gray-700 rounded-full text-sm cursor-pointer hover:bg-gray-200">
                    基础组件
                </span>
                <span class="px-3 py-1 bg-gray-100 text-gray-700 rounded-full text-sm cursor-pointer hover:bg-gray-200">
                    表单组件
                </span>
                <span class="px-3 py-1 bg-gray-100 text-gray-700 rounded-full text-sm cursor-pointer hover:bg-gray-200">
                    数据展示
                </span>
                <span class="px-3 py-1 bg-gray-100 text-gray-700 rounded-full text-sm cursor-pointer hover:bg-gray-200">
                    反馈组件
                </span>
                <span class="px-3 py-1 bg-gray-100 text-gray-700 rounded-full text-sm cursor-pointer hover:bg-gray-200">
                    导航组件
                </span>
                <span class="px-3 py-1 bg-gray-100 text-gray-700 rounded-full text-sm cursor-pointer hover:bg-gray-200">
                    布局组件
                </span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div th:each="component : ${page.records}"
                 class="bg-white rounded-xl shadow-sm border border-gray-100 hover:shadow-lg hover:border-indigo-200 transition-all duration-200 group cursor-pointer">
                <div class="p-5">
                    <div class="flex items-start justify-between mb-4">
                        <div class="w-12 h-12 bg-indigo-100 rounded-xl flex items-center justify-center group-hover:bg-indigo-200 transition">
                            <i class="fas fa-puzzle-piece text-indigo-600 text-xl"></i>
                        </div>
                        <span th:if="${component.framework.code == 'react'}" class="px-2 py-1 bg-blue-50 text-blue-600 text-xs rounded">
                            <i class="fab fa-react mr-1"></i>React
                        </span>
                        <span th:if="${component.framework.code == 'vue'}" class="px-2 py-1 bg-green-50 text-green-600 text-xs rounded">
                            <i class="fab fa-vuejs mr-1"></i>Vue
                        </span>
                    </div>
                    <h3 class="font-semibold text-gray-900 mb-1" th:text="${component.displayName}">Button</h3>
                    <p class="text-sm text-gray-500 mb-3 line-clamp-2" th:text="${component.description}">按钮组件</p>
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-gray-400" th:text="${component.latestVersion}">v2.1.0</span>
                        <div class="flex items-center text-sm text-gray-400">
                            <i class="fas fa-download mr-1"></i>
                            <span>1.2k</span>
                        </div>
                    </div>
                </div>
                <div class="px-5 py-3 bg-gray-50 border-t border-gray-100 rounded-b-xl flex items-center justify-between">
                    <div class="flex items-center">
                        <div class="w-6 h-6 bg-indigo-100 rounded-full flex items-center justify-center mr-2">
                            <span class="text-xs text-indigo-600 font-medium"
                                  th:text="${component.maintainer?.nickname?.substring(0,1)}">张</span>
                        </div>
                        <span class="text-xs text-gray-500" th:text="${component.maintainer?.nickname}">张三</span>
                    </div>
                    <a th:href="@{'/components/' + ${component.id}}"
                       class="text-sm text-indigo-600 hover:text-indigo-700 font-medium">
                        查看 <i class="fas fa-arrow-right ml-1"></i>
                    </a>
                </div>
            </div>
        </div>

        <div class="mt-8 flex justify-center">
            <div class="flex items-center space-x-2">
                <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50" disabled>
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button class="px-4 py-2 bg-indigo-600 text-white rounded-lg">1</button>
                <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">2</button>
                <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">3</button>
                <span class="px-2 text-gray-400">...</span>
                <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">10</button>
                <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>

    </div>
</main>

</body>
</html>
