<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 设计系统管理平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center p-4">
    <div x-data="{ loading: false }" class="max-w-md w-full">
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 rounded-2xl mb-4">
                    <i class="fas fa-palette text-3xl text-indigo-600"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">设计系统管理平台</h1>
                <p class="text-gray-500 mt-2">Design System Management Platform</p>
            </div>

            <form th:action="@{/login}" method="post" @submit="loading = true" class="space-y-6">
                <div th:if="${param.error}" class="p-4 bg-red-50 border border-red-200 rounded-lg">
                    <div class="flex items-center">
                        <i class="fas fa-exclamation-circle text-red-500 mr-2"></i>
                        <p class="text-sm text-red-600">用户名或密码错误</p>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">用户名</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" name="username" required
                               class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                               placeholder="请输入用户名">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="password" name="password" required
                               class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                               placeholder="请输入密码">
                    </div>
                </div>

                <button type="submit"
                        :disabled="loading"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed">
                    <i x-show="loading" class="fas fa-spinner fa-spin mr-2"></i>
                    <span x-text="loading ? '登录中...' : '登 录'">登 录</span>
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-500">
                <p>演示账号: admin / admin123</p>
                <p class="mt-1">开发者: developer / dev123</p>
                <p class="mt-1">设计师: designer / design123</p>
            </div>
        </div>

        <p class="text-center text-white/80 text-sm mt-6">
            © 2024 Design System Platform. All rights reserved.
        </p>
    </div>
</body>
</html>
