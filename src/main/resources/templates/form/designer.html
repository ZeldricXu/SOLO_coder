<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单设计器 - FlowPlatform</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="/js/form-designer.js"></script>
    <script src="/js/form-field-palette.js"></script>
    <script src="/js/form-canvas.js"></script>
    <script src="/js/form-property-panel.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .ghost-item { opacity: 0.4; background: #eef2ff; border: 2px dashed #6366f1; }
        .chosen-item { box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        .field-card { transition: all 0.15s ease; }
        .field-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); transform: translateY(-1px); }
        .canvas-field { transition: all 0.15s ease; }
        .canvas-field.selected { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.2); }
        .canvas-field:hover { border-color: #a5b4fc; }
    </style>
</head>
<body class="h-screen bg-gray-50 flex flex-col overflow-hidden" x-data x-init="$store.designer.init(formId, formNameInit, formDescInit, formKeyInit, formCategoryInit, formSchemaInit)">

    <div class="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-4 shrink-0">
        <div class="flex items-center space-x-4">
            <a href="/form" class="p-2 text-gray-400 hover:text-gray-600 rounded-lg hover:bg-gray-100 transition-colors" title="返回">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
            </a>
            <div class="h-6 w-px bg-gray-200"></div>
            <input type="text" x-model="$store.designer.formName" placeholder="请输入表单名称"
                   class="text-sm font-medium text-gray-800 border-0 border-b border-transparent focus:border-indigo-500 focus:ring-0 px-1 py-0.5 w-56 placeholder-gray-400 bg-transparent">
        </div>
        <div class="flex items-center space-x-2">
            <button @click="$store.designer.previewForm()" class="inline-flex items-center px-3 py-1.5 text-sm text-gray-600 hover:text-gray-800 bg-white hover:bg-gray-50 border border-gray-300 rounded-lg transition-colors">
                <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
                预览
            </button>
            <button @click="$store.designer.clearFields()" class="inline-flex items-center px-3 py-1.5 text-sm text-gray-600 hover:text-gray-800 bg-white hover:bg-gray-50 border border-gray-300 rounded-lg transition-colors">
                <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
                清空
            </button>
            <button @click="$store.designer.saveForm()" class="inline-flex items-center px-4 py-1.5 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm transition-colors">
                <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                保存
            </button>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden">

        <div class="w-64 bg-white border-r border-gray-200 flex flex-col shrink-0 overflow-hidden" x-data="fieldPalette()">
            <div class="px-4 py-3 border-b border-gray-100">
                <h3 class="text-sm font-semibold text-gray-700">字段组件</h3>
            </div>
            <div class="flex-1 overflow-y-auto p-3 space-y-4">

                <template x-for="group in fieldGroups" :key="group.name">
                    <div>
                        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-1" x-text="group.name"></p>
                        <div class="grid grid-cols-2 gap-1.5">
                            <template x-for="field in group.fields" :key="field.type">
                                <div class="field-card flex flex-col items-center justify-center px-2 py-2.5 bg-gray-50 hover:bg-indigo-50 border border-gray-200 hover:border-indigo-300 rounded-lg cursor-pointer select-none"
                                     @click="addField(field.type)"
                                     :title="field.label">
                                    <span class="text-lg mb-1" x-text="field.icon"></span>
                                    <span class="text-xs text-gray-600 leading-tight text-center" x-text="field.label"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

            </div>
        </div>

        <div class="flex-1 bg-gray-100 overflow-y-auto p-6" x-data="formCanvas()">
            <div class="max-w-3xl mx-auto">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-200 bg-gradient-to-r from-indigo-50 to-purple-50">
                        <input type="text" x-model="$store.designer.formDesc" placeholder="表单描述（选填）"
                               class="text-sm text-gray-500 border-0 bg-transparent focus:ring-0 w-full placeholder-gray-400 p-0">
                    </div>

                    <div id="form-canvas" class="min-h-[400px] p-6 space-y-3">
                        <template x-for="(field, index) in $store.designer.fields" :key="field.id">
                            <div class="canvas-field relative border rounded-lg p-4 bg-white cursor-pointer group"
                                 :class="isSelected(field.id) ? 'selected border-indigo-400' : 'border-gray-200'"
                                 @click="selectField(field.id)">

                                <div class="drag-handle absolute left-0 top-0 bottom-0 w-6 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                    <svg class="w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M8 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm0 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm0 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm8-16a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm0 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm0 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>
                                    </svg>
                                </div>

                                <div class="ml-5">
                                    <label class="flex items-center text-sm font-medium text-gray-700 mb-1.5">
                                        <span x-text="field.label"></span>
                                        <span x-show="field.required" class="text-red-500 ml-0.5">*</span>
                                    </label>

                                    <div x-show="field.type === 'textInput'">
                                        <input type="text" disabled :placeholder="field.placeholder || '请输入'"
                                               class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400">
                                    </div>
                                    <div x-show="field.type === 'textarea'">
                                        <textarea disabled :placeholder="field.placeholder || '请输入'" rows="2"
                                                  class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400"></textarea>
                                    </div>
                                    <div x-show="field.type === 'number'">
                                        <input type="number" disabled :placeholder="field.placeholder || '请输入数字'"
                                               class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400">
                                    </div>
                                    <div x-show="field.type === 'amount'">
                                        <div class="relative">
                                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-400">¥</span>
                                            <input type="text" disabled placeholder="0.00"
                                                   class="w-full pl-7 pr-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400">
                                        </div>
                                    </div>
                                    <div x-show="field.type === 'email'">
                                        <input type="email" disabled :placeholder="field.placeholder || '请输入邮箱'"
                                               class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400">
                                    </div>
                                    <div x-show="field.type === 'phone'">
                                        <input type="tel" disabled :placeholder="field.placeholder || '请输入手机号'"
                                               class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400">
                                    </div>
                                    <div x-show="field.type === 'select'">
                                        <select disabled class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400">
                                            <option x-text="field.placeholder || '请选择'"></option>
                                        </select>
                                    </div>
                                    <div x-show="field.type === 'radio'">
                                        <div class="flex items-center space-x-4">
                                            <template x-for="(opt, oi) in (field.options || [{label:'选项1'},{label:'选项2'}])" :key="oi">
                                                <label class="flex items-center space-x-1.5 text-sm text-gray-500">
                                                    <input type="radio" disabled class="text-indigo-600">
                                                    <span x-text="opt.label"></span>
                                                </label>
                                            </template>
                                        </div>
                                    </div>
                                    <div x-show="field.type === 'checkbox'">
                                        <div class="flex items-center space-x-4">
                                            <template x-for="(opt, oi) in (field.options || [{label:'选项1'},{label:'选项2'}])" :key="oi">
                                                <label class="flex items-center space-x-1.5 text-sm text-gray-500">
                                                    <input type="checkbox" disabled class="text-indigo-600 rounded">
                                                    <span x-text="opt.label"></span>
                                                </label>
                                            </template>
                                        </div>
                                    </div>
                                    <div x-show="field.type === 'cascader'">
                                        <select disabled class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400">
                                            <option>请选择（级联）</option>
                                        </select>
                                    </div>
                                    <div x-show="field.type === 'address'">
                                        <div class="flex space-x-2">
                                            <select disabled class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400"><option>省</option></select>
                                            <select disabled class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400"><option>市</option></select>
                                            <select disabled class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400"><option>区</option></select>
                                        </div>
                                    </div>
                                    <div x-show="field.type === 'date'">
                                        <input type="text" disabled placeholder="YYYY-MM-DD"
                                               class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400">
                                    </div>
                                    <div x-show="field.type === 'datetime'">
                                        <input type="text" disabled placeholder="YYYY-MM-DD HH:mm"
                                               class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400">
                                    </div>
                                    <div x-show="field.type === 'time'">
                                        <input type="text" disabled placeholder="HH:mm"
                                               class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400">
                                    </div>
                                    <div x-show="field.type === 'dateRange'">
                                        <div class="flex items-center space-x-2">
                                            <input type="text" disabled placeholder="开始日期" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400">
                                            <span class="text-gray-400 text-sm">~</span>
                                            <input type="text" disabled placeholder="结束日期" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400">
                                        </div>
                                    </div>
                                    <div x-show="field.type === 'fileUpload'">
                                        <div class="border-2 border-dashed border-gray-200 rounded-lg p-4 text-center">
                                            <svg class="w-6 h-6 mx-auto text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                                            <p class="text-xs text-gray-400 mt-1">点击上传文件</p>
                                        </div>
                                    </div>
                                    <div x-show="field.type === 'imageUpload'">
                                        <div class="border-2 border-dashed border-gray-200 rounded-lg p-4 text-center">
                                            <svg class="w-6 h-6 mx-auto text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                            <p class="text-xs text-gray-400 mt-1">点击上传图片</p>
                                        </div>
                                    </div>
                                    <div x-show="field.type === 'signature'">
                                        <div class="border border-gray-200 rounded-lg p-3 text-center">
                                            <p class="text-xs text-gray-400">点击签名区域</p>
                                        </div>
                                    </div>
                                    <div x-show="field.type === 'richText'">
                                        <div class="border border-gray-200 rounded-lg p-3 h-20 bg-gray-50">
                                            <p class="text-xs text-gray-400">富文本编辑区域</p>
                                        </div>
                                    </div>
                                    <div x-show="field.type === 'dataLink'">
                                        <select disabled class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400">
                                            <option>关联查询数据</option>
                                        </select>
                                    </div>
                                    <div x-show="field.type === 'groupTitle'">
                                        <div class="border-b-2 border-indigo-200 pb-2">
                                            <h4 class="text-base font-semibold text-gray-700" x-text="field.label"></h4>
                                        </div>
                                    </div>
                                    <div x-show="field.type === 'columns'">
                                        <div class="grid grid-cols-2 gap-4 border border-gray-100 rounded-lg p-3">
                                            <div class="border border-dashed border-gray-200 rounded p-2 text-center text-xs text-gray-400">列1</div>
                                            <div class="border border-dashed border-gray-200 rounded p-2 text-center text-xs text-gray-400">列2</div>
                                        </div>
                                    </div>
                                    <div x-show="field.type === 'subTable'">
                                        <div class="border border-gray-200 rounded-lg overflow-hidden">
                                            <div class="bg-gray-50 px-3 py-2 text-xs text-gray-500 font-medium">子表区域</div>
                                            <div class="p-3 text-center text-xs text-gray-400">点击配置子表字段</div>
                                        </div>
                                    </div>
                                    <div x-show="field.type === 'detailTable'">
                                        <div class="border border-gray-200 rounded-lg overflow-hidden">
                                            <div class="bg-gray-50 px-3 py-2 text-xs text-gray-500 font-medium flex justify-between items-center">
                                                <span>明细表</span>
                                                <span class="text-indigo-500">+ 添加行</span>
                                            </div>
                                            <div class="p-3 text-center text-xs text-gray-400">点击配置明细表字段</div>
                                        </div>
                                    </div>
                                    <div x-show="field.type === 'formula'">
                                        <input type="text" disabled :placeholder="field.formula || '计算公式'"
                                               class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400">
                                    </div>
                                    <div x-show="field.type === 'autoNumber'">
                                        <input type="text" disabled placeholder="自动生成编号"
                                               class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-400">
                                    </div>
                                </div>

                                <div class="absolute top-2 right-2 flex items-center space-x-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button @click.stop="duplicateField(field.id)" class="p-1 text-gray-400 hover:text-indigo-600 rounded transition-colors" title="复制">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                    </button>
                                    <button @click.stop="removeField(field.id)" class="p-1 text-gray-400 hover:text-red-600 rounded transition-colors" title="删除">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                    </button>
                                </div>
                            </div>
                        </template>

                        <div x-show="$store.designer.fields.length === 0"
                             class="border-2 border-dashed border-gray-300 rounded-xl p-12 text-center">
                            <svg class="w-12 h-12 mx-auto text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                            </svg>
                            <p class="text-sm text-gray-400">从左侧拖入或点击字段组件来设计表单</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-80 bg-white border-l border-gray-200 flex flex-col shrink-0 overflow-hidden"
             x-data="propertyPanel()" x-show="hasSelection" x-cloak>
            <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
                <h3 class="text-sm font-semibold text-gray-700">属性配置</h3>
                <button @click="$store.designer.selectedFieldId = null" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-5" x-show="hasSelection">

                <div>
                    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">基础属性</p>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">字段标识</label>
                            <input type="text" x-model="selectedField.key"
                                   class="w-full px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors font-mono">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">标题</label>
                            <input type="text" x-model="selectedField.label"
                                   class="w-full px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
                        </div>
                        <div x-show="!['groupTitle','columns','subTable','detailTable'].includes(selectedField?.type)">
                            <label class="block text-xs font-medium text-gray-600 mb-1">占位提示</label>
                            <input type="text" x-model="selectedField.placeholder"
                                   class="w-full px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
                        </div>
                        <div x-show="!['groupTitle','columns','subTable','detailTable'].includes(selectedField?.type)">
                            <label class="block text-xs font-medium text-gray-600 mb-1">默认值</label>
                            <input type="text" x-model="selectedField.defaultValue"
                                   class="w-full px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
                        </div>
                    </div>
                </div>

                <div x-show="!['groupTitle','columns','subTable','detailTable','autoNumber'].includes(selectedField?.type)">
                    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">校验规则</p>
                    <div class="space-y-3">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" x-model="selectedField.required"
                                   class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                            <span class="text-sm text-gray-700">必填</span>
                        </label>
                        <div x-show="['textInput','textarea','email','phone'].includes(selectedField?.type)">
                            <label class="block text-xs font-medium text-gray-600 mb-1">最小长度</label>
                            <input type="number" x-model.number="selectedField.minLength" min="0"
                                   class="w-full px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
                        </div>
                        <div x-show="['textInput','textarea','email','phone'].includes(selectedField?.type)">
                            <label class="block text-xs font-medium text-gray-600 mb-1">最大长度</label>
                            <input type="number" x-model.number="selectedField.maxLength" min="0"
                                   class="w-full px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
                        </div>
                        <div x-show="['textInput','textarea','email','phone'].includes(selectedField?.type)">
                            <label class="block text-xs font-medium text-gray-600 mb-1">正则校验</label>
                            <input type="text" x-model="selectedField.pattern"
                                   placeholder="例: ^[a-zA-Z]+$"
                                   class="w-full px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors font-mono">
                        </div>
                    </div>
                </div>

                <div x-show="isSelectType()">
                    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">选项列表</p>
                    <div class="space-y-2">
                        <template x-for="(opt, oi) in selectedField.options" :key="oi">
                            <div class="flex items-center space-x-2">
                                <input type="text" x-model="opt.label"
                                       class="flex-1 px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
                                       placeholder="选项名称">
                                <input type="text" x-model="opt.value"
                                       class="w-24 px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
                                       placeholder="值">
                                <button @click="removeOption(oi)" class="p-1 text-gray-400 hover:text-red-500 transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                </button>
                            </div>
                        </template>
                        <button @click="addOption()"
                                class="w-full py-1.5 text-sm text-indigo-600 hover:text-indigo-700 border border-dashed border-indigo-300 hover:border-indigo-400 rounded-lg transition-colors">
                            + 添加选项
                        </button>
                    </div>
                </div>

                <div x-show="!['groupTitle'].includes(selectedField?.type)">
                    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">布局</p>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">宽度 (span)</label>
                            <select x-model.number="selectedField.span"
                                    class="w-full px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors bg-white">
                                <option :value="24">整行 (24)</option>
                                <option :value="12">半行 (12)</option>
                                <option :value="8">1/3 (8)</option>
                                <option :value="6">1/4 (6)</option>
                            </select>
                        </div>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" x-model="selectedField.fullRow"
                                   class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                            <span class="text-sm text-gray-700">独占一行</span>
                        </label>
                    </div>
                </div>

                <div x-show="isFormulaType()">
                    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">计算公式</p>
                    <div class="space-y-2">
                        <textarea x-model="selectedField.formula" rows="3" placeholder="例: ${amount} * 0.1"
                                  class="w-full px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors font-mono"></textarea>
                        <p class="text-xs text-gray-400">使用 ${字段key} 引用其他字段值</p>
                    </div>
                </div>

                <div x-show="!['groupTitle'].includes(selectedField?.type)">
                    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">显示控制</p>
                    <div class="space-y-3">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" x-model="selectedField.visible"
                                   class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                            <span class="text-sm text-gray-700">是否显示</span>
                        </label>
                        <div x-show="selectedField.visible === true">
                            <label class="block text-xs font-medium text-gray-600 mb-1">显示条件</label>
                            <input type="text" x-model="selectedField.condition"
                                   placeholder="例: ${type} === '1'"
                                   class="w-full px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors font-mono">
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <form id="form-save" method="post" style="display:none;">
        <input type="hidden" name="id" id="form-id">
        <input type="hidden" name="formSchema" id="form-schema">
    </form>

    <script th:inline="javascript">
        var formId = /*[[${form?.id}]]*/ null;
        var formNameInit = /*[[${form?.formName}]]*/ '';
        var formDescInit = /*[[${form?.formDesc}]]*/ '';
        var formKeyInit = /*[[${form?.formKey}]]*/ '';
        var formCategoryInit = /*[[${form?.category}]]*/ '';
        var formSchemaInit = /*[[${form?.formSchema}]]*/ '';
    </script>

</body>
</html>
