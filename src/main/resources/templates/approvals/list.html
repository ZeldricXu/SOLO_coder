<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('审批中心')"></head>
<body class="bg-gray-50">

<div th:replace="fragments/layout :: sidebar"></div>
<div th:replace="fragments/layout :: header('审批中心')"></div>

<main class="ml-64 pt-16 min-h-screen">
    <div class="p-6">

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">待我审批</p>
                        <p class="text-2xl font-bold text-gray-900 mt-1" th:text="${#lists.size(pendingApprovals)}">5</p>
                    </div>
                    <div class="w-12 h-12 bg-amber-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-clock text-amber-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">我已批准</p>
                        <p class="text-2xl font-bold text-gray-900 mt-1">12</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-check text-green-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">我已拒绝</p>
                        <p class="text-2xl font-bold text-gray-900 mt-1">3</p>
                    </div>
                    <div class="w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-times text-red-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">我发起的</p>
                        <p class="text-2xl font-bold text-gray-900 mt-1">8</p>
                    </div>
                    <div class="w-12 h-12 bg-indigo-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-file-alt text-indigo-600 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <div class="flex space-x-2">
                        <button class="px-4 py-2 bg-indigo-50 text-indigo-700 rounded-lg text-sm font-medium">
                            待审批
                        </button>
                        <button class="px-4 py-2 text-gray-500 hover:bg-gray-50 rounded-lg text-sm font-medium">
                            已批准
                        </button>
                        <button class="px-4 py-2 text-gray-500 hover:bg-gray-50 rounded-lg text-sm font-medium">
                            已拒绝
                        </button>
                        <button class="px-4 py-2 text-gray-500 hover:bg-gray-50 rounded-lg text-sm font-medium">
                            全部
                        </button>
                    </div>
                    <select class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                        <option value="">所有类型</option>
                        <option value="COMPONENT_PUBLISH">组件发布</option>
                        <option value="TOKEN_CHANGE">令牌修改</option>
                        <option value="VERSION_ROLLBACK">版本回滚</option>
                    </select>
                </div>
            </div>

            <table class="w-full">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">申请</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">类型</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">申请人</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">申请时间</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr th:each="approval : ${approvals}" class="hover:bg-gray-50">
                        <td class="px-6 py-4">
                            <div class="flex items-center">
                                <div class="w-10 h-10 bg-indigo-100 rounded-lg flex items-center justify-center mr-3">
                                    <i class="fas fa-puzzle-piece text-indigo-600"></i>
                                </div>
                                <div>
                                    <p class="font-medium text-gray-900" th:text="${approval.title}">Button 组件发布 v2.1.0</p>
                                    <p class="text-sm text-gray-500" th:text="${approval.description}">新增加载状态和禁用样式</p>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <span th:if="${approval.type.code == 'COMPONENT_PUBLISH'}"
                                  class="px-2 py-1 bg-blue-100 text-blue-700 text-xs rounded">组件发布</span>
                            <span th:if="${approval.type.code == 'TOKEN_CHANGE'}"
                                  class="px-2 py-1 bg-purple-100 text-purple-700 text-xs rounded">令牌修改</span>
                            <span th:if="${approval.type.code == 'VERSION_ROLLBACK'}"
                                  class="px-2 py-1 bg-amber-100 text-amber-700 text-xs rounded">版本回滚</span>
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex items-center">
                                <div class="w-6 h-6 bg-indigo-100 rounded-full flex items-center justify-center mr-2">
                                    <span class="text-xs text-indigo-600 font-medium">张</span>
                                </div>
                                <span class="text-sm text-gray-700">张三</span>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <span th:if="${approval.status.code == 'PENDING'}"
                                  class="px-2 py-1 bg-amber-100 text-amber-700 text-xs rounded">待审批</span>
                            <span th:if="${approval.status.code == 'APPROVED'}"
                                  class="px-2 py-1 bg-green-100 text-green-700 text-xs rounded">已批准</span>
                            <span th:if="${approval.status.code == 'REJECTED'}"
                                  class="px-2 py-1 bg-red-100 text-red-700 text-xs rounded">已拒绝</span>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500"
                            th:text="${#dates.format(approval.createTime, 'yyyy-MM-dd HH:mm')}">2024-01-15 10:30</td>
                        <td class="px-6 py-4 text-right">
                            <a th:href="@{'/approvals/' + ${approval.id}}"
                               class="px-4 py-2 bg-indigo-600 text-white text-sm rounded-lg hover:bg-indigo-700">
                                处理
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(approvals)}">
                        <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                            <i class="fas fa-inbox text-4xl text-gray-300 mb-3"></i>
                            <p>暂无审批数据</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>

</body>
</html>
