<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('代码生成')"></head>
<body class="bg-gray-50">

<div th:replace="fragments/layout :: sidebar"></div>
<div th:replace="fragments/layout :: header('代码生成')"></div>

<main class="ml-64 pt-16 min-h-screen">
    <div class="p-6">

        <div class="max-w-6xl mx-auto">
            <div class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl p-8 mb-8 text-white">
                <h1 class="text-3xl font-bold mb-2">代码生成器</h1>
                <p class="text-white/80">根据设计令牌和组件选择，快速生成 React 或 Vue 脚手架代码</p>
            </div>

            <div x-data="{ step: 1, framework: 'react', theme: 'light' }">
                <div class="flex items-center justify-between mb-8">
                    <div class="flex items-center">
                        <div :class="step >= 1 ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-500'"
                             class="w-10 h-10 rounded-full flex items-center justify-center font-bold">1</div>
                        <span class="ml-3 font-medium" :class="step >= 1 ? 'text-gray-900' : 'text-gray-400'">选择框架</span>
                    </div>
                    <div class="flex-1 h-1 mx-4" :class="step >= 2 ? 'bg-indigo-600' : 'bg-gray-200'"></div>
                    <div class="flex items-center">
                        <div :class="step >= 2 ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-500'"
                             class="w-10 h-10 rounded-full flex items-center justify-center font-bold">2</div>
                        <span class="ml-3 font-medium" :class="step >= 2 ? 'text-gray-900' : 'text-gray-400'">选择组件</span>
                    </div>
                    <div class="flex-1 h-1 mx-4" :class="step >= 3 ? 'bg-indigo-600' : 'bg-gray-200'"></div>
                    <div class="flex items-center">
                        <div :class="step >= 3 ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-500'"
                             class="w-10 h-10 rounded-full flex items-center justify-center font-bold">3</div>
                        <span class="ml-3 font-medium" :class="step >= 3 ? 'text-gray-900' : 'text-gray-400'">配置与生成</span>
                    </div>
                </div>

                <div x-show="step === 1" x-transition>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8">
                        <h2 class="text-xl font-bold text-gray-900 mb-6">选择开发框架</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <label class="cursor-pointer">
                                <input type="radio" x-model="framework" value="react" class="sr-only">
                                <div :class="framework === 'react' ? 'border-indigo-500 ring-2 ring-indigo-100' : 'border-gray-200 hover:border-gray-300'"
                                     class="border-2 rounded-xl p-6 transition">
                                    <div class="flex items-center justify-between mb-4">
                                        <div class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center">
                                            <i class="fab fa-react text-4xl text-blue-600"></i>
                                        </div>
                                        <div x-show="framework === 'react'" class="w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center">
                                            <i class="fas fa-check text-white text-sm"></i>
                                        </div>
                                    </div>
                                    <h3 class="text-lg font-semibold text-gray-900 mb-2">React</h3>
                                    <p class="text-sm text-gray-500">生成 React 函数组件代码，使用 TypeScript 和 Hooks</p>
                                </div>
                            </label>

                            <label class="cursor-pointer">
                                <input type="radio" x-model="framework" value="vue" class="sr-only">
                                <div :class="framework === 'vue' ? 'border-indigo-500 ring-2 ring-indigo-100' : 'border-gray-200 hover:border-gray-300'"
                                     class="border-2 rounded-xl p-6 transition">
                                    <div class="flex items-center justify-between mb-4">
                                        <div class="w-16 h-16 bg-green-100 rounded-2xl flex items-center justify-center">
                                            <i class="fab fa-vuejs text-4xl text-green-600"></i>
                                        </div>
                                        <div x-show="framework === 'vue'" class="w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center">
                                            <i class="fas fa-check text-white text-sm"></i>
                                        </div>
                                    </div>
                                    <h3 class="text-lg font-semibold text-gray-900 mb-2">Vue 3</h3>
                                    <p class="text-sm text-gray-500">生成 Vue 3 组件代码，支持 Composition API</p>
                                </div>
                            </label>
                        </div>

                        <div class="mt-8 flex justify-end">
                            <button @click="step = 2" class="px-8 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">
                                下一步 <i class="fas fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div x-show="step === 2" x-transition class="hidden">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="text-xl font-bold text-gray-900">选择需要的组件</h2>
                            <button class="text-sm text-indigo-600 hover:text-indigo-700">全选</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4 max-h-96 overflow-y-auto p-1">
                            <label th:each="component : ${components}" class="cursor-pointer">
                                <input type="checkbox" class="sr-only peer">
                                <div class="border-2 border-gray-200 rounded-xl p-4 peer-checked:border-indigo-500 peer-checked:ring-2 peer-checked:ring-indigo-100 transition hover:border-gray-300">
                                    <div class="flex items-center justify-between mb-3">
                                        <div class="w-10 h-10 bg-indigo-100 rounded-lg flex items-center justify-center">
                                            <i class="fas fa-puzzle-piece text-indigo-600"></i>
                                        </div>
                                        <div class="w-5 h-5 rounded border-2 border-gray-300 peer-checked:bg-indigo-600 peer-checked:border-indigo-600 flex items-center justify-center transition">
                                            <i class="fas fa-check text-white text-xs hidden peer-checked:block"></i>
                                        </div>
                                    </div>
                                    <p class="font-medium text-gray-900 text-sm" th:text="${component.displayName}">Button</p>
                                    <p class="text-xs text-gray-500 mt-1" th:text="${component.latestVersion}">v2.1.0</p>
                                </div>
                            </label>
                        </div>

                        <div class="mt-8 flex justify-between">
                            <button @click="step = 1" class="px-8 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 font-medium">
                                <i class="fas fa-arrow-left mr-2"></i>上一步
                            </button>
                            <button @click="step = 3" class="px-8 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">
                                下一步 <i class="fas fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div x-show="step === 3" x-transition class="hidden">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8">
                        <h2 class="text-xl font-bold text-gray-900 mb-6">配置生成选项</h2>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">项目名称 *</label>
                                <input type="text" value="my-design-system-app"
                                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">输出目录</label>
                                <input type="text" value="./src/components"
                                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                            </div>
                        </div>

                        <div class="mb-8">
                            <label class="block text-sm font-medium text-gray-700 mb-3">主题选择</label>
                            <div class="flex gap-4">
                                <label class="cursor-pointer">
                                    <input type="radio" x-model="theme" value="light" class="sr-only">
                                    <div :class="theme === 'light' ? 'border-indigo-500 ring-2 ring-indigo-100' : 'border-gray-200'"
                                         class="flex items-center p-4 border-2 rounded-xl transition">
                                        <i class="fas fa-sun text-yellow-500 mr-3 text-xl"></i>
                                        <span class="font-medium text-gray-900">浅色主题</span>
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" x-model="theme" value="dark" class="sr-only">
                                    <div :class="theme === 'dark' ? 'border-indigo-500 ring-2 ring-indigo-100' : 'border-gray-200'"
                                         class="flex items-center p-4 border-2 rounded-xl transition">
                                        <i class="fas fa-moon text-indigo-600 mr-3 text-xl"></i>
                                        <span class="font-medium text-gray-900">深色主题</span>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <div class="mb-8 p-4 bg-gray-50 rounded-xl">
                            <h3 class="font-medium text-gray-900 mb-4">
                                <i class="fas fa-info-circle text-indigo-600 mr-2"></i>生成预览
                            </h3>
                            <div class="space-y-2 text-sm text-gray-600 font-mono">
                                <p>📁 my-design-system-app/</p>
                                <p class="pl-4">📁 src/</p>
                                <p class="pl-8">📁 components/</p>
                                <p class="pl-12">📄 Button.[jt]sx</p>
                                <p class="pl-12">📄 Input.[jt]sx</p>
                                <p class="pl-8">📁 styles/</p>
                                <p class="pl-12">📄 tokens.css</p>
                                <p class="pl-12">📄 theme.[jt]s</p>
                                <p class="pl-8">📄 App.[jt]sx</p>
                                <p>📄 package.json</p>
                            </div>
                        </div>

                        <div class="flex justify-between">
                            <button @click="step = 2" class="px-8 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 font-medium">
                                <i class="fas fa-arrow-left mr-2"></i>上一步
                            </button>
                            <div class="flex gap-3">
                                <button class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 font-medium">
                                    <i class="fab fa-git-alt mr-2"></i>推送到 Git
                                </button>
                                <button class="px-8 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 font-medium">
                                    <i class="fas fa-download mr-2"></i>下载 ZIP
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

</body>
</html>
