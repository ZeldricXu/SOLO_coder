<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>数据报表</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
<div layout:fragment="content" x-data="{
    startDate: '',
    endDate: '',
    totalInstances: 0,
    pendingCount: 0,
    approvedCount: 0,
    rejectedCount: 0,
    avgTime: '-',
    init() {
        this.loadStats();
        this.loadCharts();
    },
    loadStats() {
        fetch('/report/api/status-stats').then(r => r.json()).then(data => {
            let total = 0;
            data.forEach(item => {
                total += item.count || 0;
                if (item.status === 'PENDING' || item.status === 'RUNNING') this.pendingCount += item.count || 0;
                if (item.status === 'APPROVED' || item.status === 'COMPLETED') this.approvedCount += item.count || 0;
                if (item.status === 'REJECTED') this.rejectedCount += item.count || 0;
            });
            this.totalInstances = total;
        });
        fetch('/report/api/avg-time').then(r => r.json()).then(data => {
            this.avgTime = data.avgTime || '-';
        });
    },
    loadCharts() {
        this.loadPieChart();
        this.loadTrendChart();
        this.loadFormRankingChart();
        this.loadNodeTimeChart();
    },
    loadPieChart() {
        const chart = echarts.init(document.getElementById('pie-chart'));
        fetch('/report/api/status-stats').then(r => r.json()).then(data => {
            const statusMap = { PENDING: '审批中', RUNNING: '运行中', APPROVED: '已通过', COMPLETED: '已完成', REJECTED: '已拒绝', CANCELLED: '已取消' };
            const colorMap = { PENDING: '#f59e0b', RUNNING: '#3b82f6', APPROVED: '#10b981', COMPLETED: '#059669', REJECTED: '#ef4444', CANCELLED: '#6b7280' };
            chart.setOption({
                tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
                legend: { bottom: 0, type: 'scroll' },
                series: [{
                    type: 'pie', radius: ['40%', '65%'], center: ['50%', '45%'],
                    avoidLabelOverlap: true,
                    itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 2 },
                    label: { show: true, formatter: '{b}\n{d}%' },
                    data: data.map(item => ({
                        name: statusMap[item.status] || item.status,
                        value: item.count || 0,
                        itemStyle: { color: colorMap[item.status] || '#6366f1' }
                    }))
                }]
            });
        });
        window.addEventListener('resize', () => chart.resize());
    },
    loadTrendChart() {
        const chart = echarts.init(document.getElementById('trend-chart'));
        fetch('/report/api/date-trend').then(r => r.json()).then(data => {
            chart.setOption({
                tooltip: { trigger: 'axis' },
                grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                xAxis: { type: 'category', boundaryGap: false, data: data.map(d => d.date), axisLabel: { fontSize: 11 } },
                yAxis: { type: 'value', minInterval: 1 },
                series: [{
                    name: '提交数', type: 'line', smooth: true, symbol: 'circle', symbolSize: 6,
                    lineStyle: { width: 2, color: '#6366f1' },
                    itemStyle: { color: '#6366f1' },
                    areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: 'rgba(99,102,241,0.3)' },
                        { offset: 1, color: 'rgba(99,102,241,0.02)' }
                    ]) },
                    data: data.map(d => d.count || 0)
                }]
            });
        });
        window.addEventListener('resize', () => chart.resize());
    },
    loadFormRankingChart() {
        const chart = echarts.init(document.getElementById('form-ranking-chart'));
        fetch('/report/api/form-ranking').then(r => r.json()).then(data => {
            chart.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                grid: { left: '3%', right: '8%', bottom: '3%', containLabel: true },
                xAxis: { type: 'value', minInterval: 1 },
                yAxis: { type: 'category', data: data.map(d => d.formName || d.formId).reverse(), axisLabel: { fontSize: 11 } },
                series: [{
                    type: 'bar', barWidth: 16,
                    itemStyle: { borderRadius: [0, 4, 4, 0], color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                        { offset: 0, color: '#6366f1' }, { offset: 1, color: '#818cf8' }
                    ]) },
                    data: data.map(d => d.count || 0).reverse()
                }]
            });
        });
        window.addEventListener('resize', () => chart.resize());
    },
    loadNodeTimeChart() {
        const chart = echarts.init(document.getElementById('node-time-chart'));
        fetch('/report/api/node-time').then(r => r.json()).then(data => {
            chart.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: params => params[0].name + '<br/>' + params[0].value + ' 小时' },
                grid: { left: '3%', right: '8%', bottom: '3%', containLabel: true },
                xAxis: { type: 'value', axisLabel: { formatter: '{value}h' } },
                yAxis: { type: 'category', data: data.map(d => d.nodeName || d.nodeId).reverse(), axisLabel: { fontSize: 11 } },
                series: [{
                    type: 'bar', barWidth: 16,
                    itemStyle: { borderRadius: [0, 4, 4, 0], color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                        { offset: 0, color: '#f59e0b' }, { offset: 1, color: '#fbbf24' }
                    ]) },
                    data: data.map(d => d.avgHours || 0).reverse()
                }]
            });
        });
        window.addEventListener('resize', () => chart.resize());
    }
}">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">数据报表</h1>
            <p class="text-gray-500 mt-1">流程数据分析与统计</p>
        </div>
        <div class="flex items-center space-x-3">
            <input type="date" x-model="startDate"
                   class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <span class="text-gray-400">至</span>
            <input type="date" x-model="endDate"
                   class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <button @click="loadCharts()"
                    class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors">
                查询
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">流程总数</p>
                    <p class="text-3xl font-bold text-gray-900 mt-1" x-text="totalInstances">0</p>
                </div>
                <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm0 8a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6z"/>
                    </svg>
                </div>
            </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">审批中</p>
                    <p class="text-3xl font-bold text-gray-900 mt-1" x-text="pendingCount">0</p>
                </div>
                <div class="w-12 h-12 bg-amber-100 rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
            </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">已通过</p>
                    <p class="text-3xl font-bold text-gray-900 mt-1" x-text="approvedCount">0</p>
                </div>
                <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
            </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">已拒绝</p>
                    <p class="text-3xl font-bold text-gray-900 mt-1" x-text="rejectedCount">0</p>
                </div>
                <div class="w-12 h-12 bg-red-100 rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h3 class="text-base font-semibold text-gray-900 mb-4">状态分布</h3>
            <div id="pie-chart" style="height: 320px;"></div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h3 class="text-base font-semibold text-gray-900 mb-4">近30天提交趋势</h3>
            <div id="trend-chart" style="height: 320px;"></div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h3 class="text-base font-semibold text-gray-900 mb-4">表单提交排名</h3>
            <div id="form-ranking-chart" style="height: 320px;"></div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h3 class="text-base font-semibold text-gray-900 mb-4">审批节点耗时排名</h3>
            <div id="node-time-chart" style="height: 320px;"></div>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <div class="flex items-center justify-center py-4">
            <div class="text-center">
                <p class="text-sm font-medium text-gray-500 mb-2">平均审批时长</p>
                <p class="text-5xl font-bold text-indigo-600" x-text="avgTime">-</p>
                <p class="text-gray-400 text-sm mt-2">从提交到最终审批完成</p>
            </div>
        </div>
    </div>

    <div class="mt-8 bg-white rounded-xl shadow-sm border border-gray-200">
        <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
            <h3 class="text-base font-semibold text-gray-900">表单报表</h3>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                <tr class="bg-gray-50 border-b border-gray-200">
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">表单名称</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">表单KEY</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">分类</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">状态</th>
                    <th class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">操作</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                <tr th:each="form : ${forms}" class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4 text-sm font-medium text-gray-900" th:text="${form.formName}">-</td>
                    <td class="px-6 py-4 text-sm text-gray-500" th:text="${form.formKey}">-</td>
                    <td class="px-6 py-4 text-sm text-gray-500" th:text="${form.category ?: '-'}">-</td>
                    <td class="px-6 py-4">
                        <span th:if="${form.status == 1}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">已发布</span>
                        <span th:if="${form.status != 1}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800">未发布</span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <a th:href="@{/report/form/{id}(id=${form.id})}" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium">查看报表</a>
                    </td>
                </tr>
                <tr th:if="${forms.isEmpty()}">
                    <td colspan="5" class="px-6 py-12 text-center text-sm text-gray-400">暂无表单数据</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
