spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 1
      timeout: 5s
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chainetl_test}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false

server:
  port: ${SERVER_PORT:8080}
  netty:
    connection-timeout: 30s
    idle-timeout: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
        step: 1m

resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 10
        max-wait-duration: 5s

storage:
  ipfs:
    api-url: ${IPFS_API_URL:http://localhost:5001}
    gateway-url: ${IPFS_GATEWAY_URL:http://localhost:8080}
  arweave:
    gateway-url: ${ARWEAVE_GATEWAY_URL:https://arweave.net}

chain:
  default-chain-id: ${DEFAULT_CHAIN_ID:1}
  rpc-timeout: 30s
  health-check-interval: 30s

logging:
  level:
    root: INFO
    com.chainetl: INFO
    org.springframework.web: INFO
    com.baomidou.mybatisplus: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/chainetl-test.log
    max-size: 100MB
    max-history: 14

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
