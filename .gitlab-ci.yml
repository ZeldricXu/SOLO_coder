# ============================================================
# GitLab CI/CD Pipeline Configuration
# 项目：Inventory Management API
# 阶段：.pre -> lint -> test -> security -> deploy -> .post
# ============================================================

# ============================================================
# Stages Definition
# ============================================================
stages:
  - .pre
  - lint
  - test
  - security
  - deploy
  - .post

# ============================================================
# Global Defaults
# ============================================================
default:
  image: python:3.12-slim
  interruptible: true

# ============================================================
# Global Variables
# ============================================================
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/poetry"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  POSTGRES_DB: test_db
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password
  REDIS_PASSWORD: test_redis_password

# ============================================================
# Global Cache Configuration
# ============================================================
cache: &global_cache
  key:
    files:
      - pyproject.toml
      - poetry.lock
  paths:
    - .cache/pip
    - .cache/poetry
    - .venv
  policy: pull-push

# ============================================================
# YAML Anchors - Reusable Configuration Templates
# ============================================================

# Poetry 安装模板
.poetry_setup: &poetry_setup
  before_script:
    - pip install --upgrade pip
    - pip install poetry==1.7.1
    - poetry config virtualenvs.in-project true
    - poetry install --no-interaction --no-ansi

# 仅代码变更时运行模板
.code_changes_only: &code_changes_only
  only:
    changes:
      - app/**/*
      - tests/**/*
      - pyproject.toml
      - poetry.lock
      - .gitlab-ci.yml

# 工件配置模板
.artifacts_reports: &artifacts_reports
  artifacts:
    expire_in: 30 days
    paths:
      - coverage.xml
      - report.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: report.xml

# Docker DinD 模板
.dind_template: &dind_template
  image: docker:stable
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - docker info

# ============================================================
# .pre Stage - Pipeline Initialization
# ============================================================

prepare:
  stage: .pre
  image: python:3.12-slim
  script:
    - echo "Pipeline started at $(date)"
    - echo "Commit SHA: $CI_COMMIT_SHA"
    - echo "Branch: $CI_COMMIT_BRANCH"
    - echo "Project: $CI_PROJECT_NAME"
  cache:
    <<: *global_cache
    policy: pull

# ============================================================
# lint Stage - Code Quality Checks
# ============================================================

lint:
  stage: lint
  <<: *poetry_setup
  script:
    - echo "Running Ruff linting..."
    - poetry run ruff check app/
    - echo "Running MyPy type checking..."
    - poetry run mypy app/
  cache:
    <<: *global_cache
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//'
  allow_failure: false

# ============================================================
# test Stage - Unit & Integration Tests
# ============================================================

test:
  stage: test
  <<: *poetry_setup
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    DATABASE_URL: "postgresql+psycopg2://test_user:test_password@postgres:5432/test_db"
    CELERY_BROKER_URL: "redis://:test_redis_password@redis:6379/0"
    CELERY_RESULT_BACKEND: "redis://:test_redis_password@redis:6379/1"
    POSTGRES_HOST_AUTH_METHOD: trust
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
        libpq-dev
        gcc
        g++
    - pip install --upgrade pip
    - pip install poetry==1.7.1
    - poetry config virtualenvs.in-project true
    - poetry install --no-interaction --no-ansi
  script:
    - echo "Running pytest with coverage..."
    - poetry run pytest tests/ -v --tb=short
        --cov=app
        --cov-report=xml
        --cov-report=term
        --junitxml=report.xml
  cache:
    <<: *global_cache
  <<: *artifacts_reports
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//'
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)%/'

# ============================================================
# security Stage - Security Scans
# ============================================================

# --- Bandit: Python 代码安全扫描 ---
bandit:
  stage: security
  <<: *poetry_setup
  script:
    - echo "Running Bandit security scan..."
    - poetry run bandit -r app/
        -f json
        -o security-bandit-report.json
        -lll
  cache:
    <<: *global_cache
    policy: pull
  artifacts:
    name: "bandit-report-$CI_COMMIT_SHA"
    expire_in: 30 days
    paths:
      - security-bandit-report.json
    when: always
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# --- Trivy: Docker 镜像漏洞扫描 ---
trivy:
  stage: security
  <<: *dind_template
  variables:
    TRIVY_VERSION: "0.49.1"
    IMAGE_NAME: "inventory-api:${CI_COMMIT_SHA}"
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v${TRIVY_VERSION}
    - docker info
  script:
    - echo "Building Docker image for Trivy scan..."
    - docker build -t $IMAGE_NAME .
    - echo "Running Trivy vulnerability scan (JSON report)..."
    - trivy image
        --severity HIGH,CRITICAL
        --format json
        --output security-trivy-report.json
        $IMAGE_NAME
    - echo "Running Trivy vulnerability scan (console output)..."
    - trivy image
        --severity HIGH,CRITICAL
        --exit-code 0
        $IMAGE_NAME
  artifacts:
    name: "trivy-report-$CI_COMMIT_SHA"
    expire_in: 30 days
    paths:
      - security-trivy-report.json
    when: always
  allow_failure: true
  only:
    - tags
    - main

# ============================================================
# deploy Stage - Deployment
# ============================================================

deploy-staging:
  stage: deploy
  image: docker:stable
  services:
    - docker:dind
  variables:
    HARBOR_REGISTRY: "harbor.example.com"
    HARBOR_PROJECT: "inventory"
    IMAGE_NAME: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/inventory-api"
    K8S_NAMESPACE: "inventory-staging"
    K8S_DEPLOYMENT: "inventory-api"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - echo "Installing kubectl..."
    - apk add --no-cache curl ca-certificates
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/
    - echo "Logging in to Harbor registry..."
    - docker login $HARBOR_REGISTRY -u $HARBOR_USER -p $HARBOR_PASSWORD
    - echo "Configuring kubectl..."
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
    - kubectl cluster-info
  script:
    - echo "Building Docker image..."
    - docker build -t ${IMAGE_NAME}:${CI_COMMIT_SHA} .
    - docker tag ${IMAGE_NAME}:${CI_COMMIT_SHA} ${IMAGE_NAME}:latest
    - echo "Pushing Docker image to Harbor..."
    - docker push ${IMAGE_NAME}:${CI_COMMIT_SHA}
    - docker push ${IMAGE_NAME}:latest
    - echo "Deploying to Kubernetes staging..."
    - kubectl set image deployment/${K8S_DEPLOYMENT} api=${IMAGE_NAME}:${CI_COMMIT_SHA} -n ${K8S_NAMESPACE}
    - echo "Waiting for rollout to complete..."
    - kubectl rollout status deployment/${K8S_DEPLOYMENT} -n ${K8S_NAMESPACE} --timeout=300s
  after_script:
    - echo "Deployment finished at $(date)"
    - docker logout $HARBOR_REGISTRY || true
  environment:
    name: staging
    url: https://inventory-staging.example.com
  only:
    - main
  when: manual
  allow_failure: false

# ============================================================
# .post Stage - Pipeline Cleanup & Notifications
# ============================================================

pipeline-summary:
  stage: .post
  image: python:3.12-slim
  script:
    - echo "========================================"
    - echo "Pipeline Summary"
    - echo "========================================"
    - echo "Pipeline ID: $CI_PIPELINE_ID"
    - echo "Commit SHA: $CI_COMMIT_SHA"
    - echo "Branch: $CI_COMMIT_BRANCH"
    - echo "Status: $CI_JOB_STATUS"
    - echo "Completed at: $(date)"
    - echo "========================================"
  when: always
  cache:
    policy: pull
