stages:
  - lint
  - test
  - build_and_push

variables:
  PYTHON_VERSION: "3.12"
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "/certs/client"
  HARBOR_REGISTRY: "harbor.example.com"
  HARBOR_PROJECT: "ops-monitor"
  IMAGE_NAME: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/monitor-dashboard"

.default_image: &default_image
  image: python:${PYTHON_VERSION}-slim

.docker_image: &docker_image
  image: docker:24.0
  services:
    - docker:24.0-dind

before_script:
  - python -V
  - pip install --upgrade pip
  - pip install --no-cache-dir -r requirements.txt
  - pip install --no-cache-dir -r tests/requirements-test.txt

lint:
  stage: lint
  <<: *default_image
  script:
    - echo "Running ruff lint check..."
    - ruff check app/ tests/
    - echo "Running mypy type check..."
    - mypy app/ --ignore-missing-imports --no-error-summary
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'

test:
  stage: test
  <<: *default_image
  services:
    - name: prom/prometheus:v2.48.0
      alias: prometheus
    - name: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
      alias: elasticsearch
    - name: mysql:8.0
      alias: mysql
  variables:
    ENVIRONMENT: "test"
    PROMETHEUS_URL: "http://prometheus:9090"
    ELASTICSEARCH_URL: "http://elasticsearch:9200"
    DATABASE_URL: "mysql+pymysql://root:test123@mysql:3306/monitor_test"
    MYSQL_ROOT_PASSWORD: "test123"
    MYSQL_DATABASE: "monitor_test"
    MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    discovery.type: "single-node"
    ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    xpack.security.enabled: "false"
  script:
    - echo "Waiting for services to be ready..."
    - sleep 30
    - echo "Running tests with testcontainers..."
    - python -m pytest tests/ -v --cov=app --cov-report=xml --cov-report=term
  coverage: '/TOTAL.*\s+(\d+\%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: report.xml
    when: always
    paths:
      - coverage.xml
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'

build_and_push:
  stage: build_and_push
  <<: *docker_image
  variables:
    IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
    IMAGE_TAG_LATEST: "latest"
  before_script:
    - apk add --no-cache python3 py3-pip
    - docker info
  script:
    - echo "Building Docker image..."
    - docker build -t ${IMAGE_NAME}:${IMAGE_TAG} -t ${IMAGE_NAME}:${IMAGE_TAG_LATEST} .

    - echo "Logging in to Harbor registry..."
    - docker login ${HARBOR_REGISTRY} -u ${HARBOR_USERNAME} -p ${HARBOR_PASSWORD}

    - echo "Pushing image with tag ${IMAGE_TAG}..."
    - docker push ${IMAGE_NAME}:${IMAGE_TAG}

    - echo "Pushing image with tag latest..."
    - docker push ${IMAGE_NAME}:${IMAGE_TAG_LATEST}

    - echo "Cleaning up..."
    - docker logout ${HARBOR_REGISTRY}
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
