stages:
  - compile
  - test
  - sonar
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Xmx2g"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  DOCKER_IMAGE: $HARBOR_REGISTRY/battle-platform/battle-platform
  K8S_NAMESPACE: battle-platform
  K8S_DEPLOYMENT: battle-platform

cache:
  key: "$CI_COMMIT_REF_NAME"
  paths:
    - .m2/repository
    - target/

.compile_template: &compile_def
  stage: compile
  image: eclipse-temurin:21-jdk-jammy
  script:
    - chmod +x mvnw
    - ./mvnw clean compile -B
  artifacts:
    paths:
      - target/
    expire_in: 1 day

compile:
  <<: *compile_def
  tags:
    - java-runner

.test_template: &test_def
  stage: test
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_DRIVER: overlay2
  before_script:
    - docker info
  script:
    - docker run --rm
        -v "$CI_PROJECT_DIR":/app
        -v "$CI_PROJECT_DIR/.m2":/root/.m2
        -v /var/run/docker.sock:/var/run/docker.sock
        -w /app
        eclipse-temurin:21-jdk-jammy
        sh -c "chmod +x mvnw && ./mvnw verify -B -Dtest='!*IntegrationTest' -DfailIfNoTests=false"
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - target/site/jacoco/
    reports:
      junit: target/surefire-reports/TEST-*.xml

test:
  <<: *test_def
  tags:
    - dind-runner

test-integration:
  <<: *test_def
  stage: test
  script:
    - docker run --rm
        -v "$CI_PROJECT_DIR":/app
        -v "$CI_PROJECT_DIR/.m2":/root/.m2
        -v /var/run/docker.sock:/var/run/docker.sock
        -w /app
        eclipse-temurin:21-jdk-jammy
        sh -c "chmod +x mvnw && ./mvnw verify -B -DfailIfNoTests=false"
  needs: ["compile", "test"]
  allow_failure: true
  only:
    - develop
    - main
  tags:
    - dind-runner

sonar:
  stage: sonar
  image: eclipse-temurin:21-jdk-jammy
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - chmod +x mvnw
    - ./mvnw sonar:sonar -B
        -Dsonar.host.url=$SONAR_URL
        -Dsonar.login=$SONAR_TOKEN
        -Dsonar.projectKey=battle-platform
        -Dsonar.qualitygate.wait=true
        -Dsonar.qualitygate.timeout=300
  needs: ["test"]
  except:
    - tags
  tags:
    - java-runner

.deploy_template: &deploy_def
  stage: deploy
  image: docker:24.0
  services:
    - docker:24.0-dind
  before_script:
    - docker info
    - docker login -u $HARBOR_USER -p $HARBOR_PASS $HARBOR_REGISTRY
    - curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - echo "$KUBE_CONFIG" | base64 -d > /root/.kube/config
  script:
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA $DOCKER_IMAGE:latest
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_IMAGE:latest
    - kubectl set image deployment/$K8S_DEPLOYMENT
        battle-platform=$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
        -n $K8S_NAMESPACE
    - kubectl rollout status deployment/$K8S_DEPLOYMENT -n $K8S_NAMESPACE --timeout=300s

deploy-staging:
  <<: *deploy_def
  environment:
    name: staging
  variables:
    K8S_DEPLOYMENT: battle-platform-staging
    K8S_NAMESPACE: battle-platform-staging
  needs: ["sonar"]
  only:
    - develop
  tags:
    - dind-runner

deploy-prod:
  <<: *deploy_def
  environment:
    name: production
  variables:
    K8S_DEPLOYMENT: battle-platform-prod
    K8S_NAMESPACE: battle-platform-prod
  needs: ["sonar"]
  only:
    - main
    - tags
  when: manual
  allow_failure: false
  tags:
    - dind-runner
