sonar.projectKey=nft-indexer
sonar.organization=nftindexer
sonar.projectName=NFTIndexer
sonar.projectVersion=1.0.0

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/dependency/*.jar

sonar.java.source=17
sonar.java.target=17
sonar.sourceEncoding=UTF-8

sonar.dynamicAnalysis=reuseReports
sonar.junit.reportsPath=target/surefire-reports
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,target/site/jacoco-it/jacoco.xml
sonar.coverage.exclusions=**/entity/**,**/dto/**,**/mapper/**,**/config/**,**/exception/**

sonar.checkstyle.reportPaths=target/checkstyle-result.xml
sonar.pmd.reportPaths=target/pmd.xml
sonar.spotbugs.reportPaths=target/spotbugsXml.xml

sonar.cpd.exclusions=**/entity/**,**/dto/**,**/mapper/**
sonar.cpd.java.minimumTokens=100

sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S106
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*Test.java
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*Test.java
sonar.issue.ignore.multicriteria.e3.ruleKey=java:S1214
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*Constants.java

sonar.java.failsafe.reportsPath=target/failsafe-reports
sonar.java.surefire.reportPaths=target/surefire-reports

sonar.host.url=https://sonarcloud.io
sonar.login=${env.SONAR_TOKEN}
