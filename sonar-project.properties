sonar.projectKey=iot-platform
sonar.projectName=IoT Platform
sonar.projectVersion=1.0.0

sonar.sources=src/main/java
sonar.tests=src/test/java

sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/lib/*.jar

sonar.language=java
sonar.sourceEncoding=UTF-8
sonar.java.source=17
sonar.java.target=17

sonar.junit.reportPaths=target/surefire-reports
sonar.junit.surefire.reportPaths=target/failsafe-reports

sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,target/site/jacoco-it/jacoco.xml

sonar.checkstyle.reportPaths=target/checkstyle-result.xml
sonar.issues.jacoco.reportPaths=target/pmd.xml
sonar.spotbugs.reportPaths=target/spotbugsXml.xml

sonar.exclusions=**/generated/**,**/dto/**,**/entity/**,**/mapper/**,**/domain/**
sonar.coverage.exclusions=**/config/**,**/dto/**,**/entity/**,**/mapper/**,**/*Application.java,**/*Controller.java,**/*Config.java

sonar.cpd.exclusions=**/dto/**,**/entity/**,**/mapper/**

sonar.java.coveragePlugin=jacoco
sonar.jacoco.reportMissing.force.zero=true

sonar.issue.ignore.multicriteria=S106,S101,S117,S119,S125,S110

sonar.issue.ignore.multicriteria.S106.ruleKey=java:S106
sonar.issue.ignore.multicriteria.S106.resourceKey=**/*Controller.java

sonar.issue.ignore.multicriteria.S101.ruleKey=java:S101
sonar.issue.ignore.multicriteria.S101.resourceKey=**/entity/**

sonar.issue.ignore.multicriteria.S117.ruleKey=java:S117
sonar.issue.ignore.multicriteria.S117.resourceKey=**/dto/**

sonar.issue.ignore.multicriteria.S119.ruleKey=java:S119
sonar.issue.ignore.multicriteria.S119.resourceKey=**/config/**

sonar.issue.ignore.multicriteria.S125.ruleKey=java:S125
sonar.issue.ignore.multicriteria.S125.resourceKey=**/*Test.java

sonar.issue.ignore.multicriteria.S110.ruleKey=java:S110
sonar.issue.ignore.multicriteria.S110.resourceKey=**/exception/**

sonar.java.spotbugs.excludeFilter=spotbugs-exclude.xml
