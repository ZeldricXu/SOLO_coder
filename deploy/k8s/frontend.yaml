apiVersion: apps/v1
kind: Deployment
metadata:
  name: featureflag-frontend
  labels:
    app: featureflag
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: featureflag
      component: frontend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: featureflag
        component: frontend
    spec:
      containers:
        - name: frontend
          image: featureflag/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: featureflag-frontend
  labels:
    app: featureflag
    component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: featureflag
    component: frontend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: featureflag-config
  labels:
    app: featureflag
data:
  database_host: "postgres"
  database_port: "5432"
  database_dbname: "featureflag"
  redis_host: "redis"
  redis_port: "6379"
  kafka_brokers: "kafka:9092"
  config.yaml: |
    server:
      port: 8080
      mode: release
    database:
      host: postgres
      port: 5432
      user: postgres
      password: postgres
      dbname: featureflag
      sslmode: disable
      max_idle_conns: 10
      max_open_conns: 100
    redis:
      host: redis
      port: 6379
      password: ""
      db: 0
      pool_size: 100
    kafka:
      brokers:
        - kafka:9092
      topic: featureflag-events
      group_id: featureflag-server
    cache:
      type: memory
      ttl: 300
      max_size: 10000
    sdk:
      poll_interval: 30
      long_poll_timeout: 60
      circuit_breaker_threshold: 5
      circuit_breaker_timeout: 30
    auth:
      jwt_secret: featureflag-secret-key
      jwt_expire: 86400
    auto_rollback:
      enabled: true
      check_interval: 60
      window_minutes: 15
---
apiVersion: v1
kind: Secret
metadata:
  name: featureflag-secret
  labels:
    app: featureflag
type: Opaque
data:
  database_user: cG9zdGdyZXM=
  database_password: cG9zdGdyZXM=
  jwt_secret: ZmVhdHVyZWZsYWctc2VjcmV0LWtleQ==
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: featureflag-ingress
  labels:
    app: featureflag
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
spec:
  rules:
    - host: featureflag.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: featureflag-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: featureflag-backend
                port:
                  number: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: featureflag-frontend
  labels:
    app: featureflag
    component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: featureflag-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: featureflag-frontend
  labels:
    app: featureflag
    component: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: featureflag
      component: frontend
