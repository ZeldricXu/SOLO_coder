apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamsql
  namespace: streamsql
  labels:
    app: streamsql
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: streamsql
  template:
    metadata:
      labels:
        app: streamsql
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: streamsql
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - streamsql
              topologyKey: kubernetes.io/hostname
      containers:
        - name: streamsql
          image: ghcr.io/streamsql/streamsql:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: APP_ENV
              value: "production"
            - name: GIN_MODE
              value: "release"
            - name: LOG_LEVEL
              value: "info"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: streamsql-config
                  key: db.host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: streamsql-config
                  key: db.port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: streamsql-secrets
                  key: db.user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: streamsql-secrets
                  key: db.password
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: streamsql-config
                  key: db.name
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: streamsql-config
                  key: redis.addr
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: streamsql-secrets
                  key: jwt.secret
          resources:
            requests:
              cpu: "500m
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: config
          configMap:
            name: streamsql-config
        - name: data
          persistentVolumeClaim:
            claimName: streamsql-data
        - name: logs
          emptyDir: {}
      terminationGracePeriodSeconds: 60
