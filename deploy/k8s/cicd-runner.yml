apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cicd-runner
  namespace: cicd
  labels:
    app: cicd-runner
spec:
  selector:
    matchLabels:
      app: cicd-runner
  template:
    metadata:
      labels:
        app: cicd-runner
    spec:
      containers:
      - name: cicd-runner
        image: cicd-runner:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: RUNNER_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: RUNNER_TAGS
          value: "default,docker,k8s"
        - name: GRPC_SERVER_HOST
          value: "cicd-server"
        - name: GRPC_SERVER_PORT
          value: "9090"
        - name: RUNNER_WORK_DIR
          value: "/app/workspace"
        - name: RUNNER_CONCURRENT_JOBS
          value: "2"
        resources:
          requests:
            cpu: "1000m"
            memory: "1Gi"
          limits:
            cpu: "4000m"
            memory: "4Gi"
        volumeMounts:
        - name: workspace
          mountPath: /app/workspace
        - name: docker-sock
          mountPath: /var/run/docker.sock
        - name: kubeconfig
          mountPath: /root/.kube/config
          subPath: config
      volumes:
      - name: workspace
        emptyDir: {}
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: kubeconfig
        secret:
          secretName: runner-kubeconfig
          optional: true

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-runner-gpu
  namespace: cicd
  labels:
    app: cicd-runner-gpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-runner-gpu
  template:
    metadata:
      labels:
        app: cicd-runner-gpu
    spec:
      nodeSelector:
        gpu: "true"
      containers:
      - name: cicd-runner
        image: cicd-runner:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: RUNNER_NAME
          value: "gpu-runner-01"
        - name: RUNNER_TAGS
          value: "gpu,ml,training"
        - name: GRPC_SERVER_HOST
          value: "cicd-server"
        - name: GRPC_SERVER_PORT
          value: "9090"
        - name: RUNNER_WORK_DIR
          value: "/app/workspace"
        - name: RUNNER_CONCURRENT_JOBS
          value: "1"
        resources:
          requests:
            cpu: "4000m"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "8000m"
            memory: "16Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: workspace
          mountPath: /app/workspace
        - name: docker-sock
          mountPath: /var/run/docker.sock
      volumes:
      - name: workspace
        emptyDir: {}
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
