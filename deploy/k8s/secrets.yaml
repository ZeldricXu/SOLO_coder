apiVersion: v1
kind: Secret
metadata:
  name: streamsql-secrets
  namespace: streamsql
  labels:
    app: streamsql
type: Opaque
stringData:
  # 数据库凭证
  db.user: "streamsql"
  db.password: "REPLACE_WITH_DB_PASSWORD"

  # Redis凭证
  redis.password: "REPLACE_WITH_REDIS_PASSWORD"

  # JWT配置
  jwt.secret: "REPLACE_WITH_JWT_SECRET_KEY"

  # API Keys
  api.key.admin: "REPLACE_WITH_ADMIN_API_KEY"
