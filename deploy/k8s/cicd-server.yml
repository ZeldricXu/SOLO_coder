apiVersion: v1
kind: ConfigMap
metadata:
  name: flyway-migrations
  namespace: cicd
data:
  V1__create_job_events_table.sql: |
    CREATE TABLE IF NOT EXISTS job_events (
        id BIGSERIAL PRIMARY KEY,
        job_id BIGINT NOT NULL,
        job_token VARCHAR(64) NOT NULL,
        event_type VARCHAR(30) NOT NULL,
        step_index INT,
        step_name VARCHAR(200),
        step_status VARCHAR(20),
        runner_id BIGINT,
        log_increment TEXT,
        log_offset INT,
        exit_code INT,
        error_message TEXT,
        event_timestamp TIMESTAMP NOT NULL,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_job_events_job_id ON job_events(job_id, event_timestamp ASC);
    CREATE INDEX IF NOT EXISTS idx_job_events_token ON job_events(job_token);

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-server
  namespace: cicd
  labels:
    app: cicd-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cicd-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cicd-server
    spec:
      initContainers:
      - name: flyway-migrate
        image: flyway/flyway:10
        command: ["flyway", "migrate"]
        env:
        - name: FLYWAY_URL
          value: "jdbc:postgresql://postgres:5432/cicd"
        - name: FLYWAY_USER
          value: "cicd"
        - name: FLYWAY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cicd-secrets
              key: postgres-password
        - name: FLYWAY_LOCATIONS
          value: "filesystem:/flyway/sql"
        - name: FLYWAY_BASELINE_ON_MIGRATE
          value: "true"
        volumeMounts:
        - name: flyway-sql
          mountPath: /flyway/sql
      containers:
      - name: cicd-server
        image: cicd-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: grpc
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/cicd"
        - name: SPRING_DATASOURCE_USERNAME
          value: "cicd"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cicd-secrets
              key: postgres-password
        - name: SPRING_REDIS_HOST
          value: "redis"
        - name: SPRING_REDIS_PORT
          value: "6379"
        - name: SPRING_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cicd-secrets
              key: redis-password
        - name: INFLUXDB_URL
          value: "http://influxdb:8086"
        - name: INFLUXDB_TOKEN
          valueFrom:
            secretKeyRef:
              name: cicd-secrets
              key: influxdb-token
        - name: INFLUXDB_ORG
          value: "cicd"
        - name: INFLUXDB_BUCKET
          value: "cicd_metrics"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: cicd-secrets
              key: jwt-secret
        - name: GRPC_SERVER_PORT
          value: "9090"
        - name: RUNNER_REGISTRATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: cicd-secrets
              key: runner-registration-token
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: cicd-secrets
              key: github-token
        - name: GITLAB_TOKEN
          valueFrom:
            secretKeyRef:
              name: cicd-secrets
              key: gitlab-token
        - name: DINGTALK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: cicd-secrets
              key: dingtalk-webhook-url
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - cicd-server
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: cicd-server
      volumes:
      - name: logs
        emptyDir: {}
      - name: flyway-sql
        configMap:
          name: flyway-migrations

---

apiVersion: v1
kind: Service
metadata:
  name: cicd-server
  namespace: cicd
  labels:
    app: cicd-server
spec:
  selector:
    app: cicd-server
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  - port: 9090
    targetPort: 9090
    name: grpc
  type: ClusterIP

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cicd-server
  namespace: cicd
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "cicd-server"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-expose-headers: "Content-Length,Content-Range"
spec:
  ingressClassName: nginx
  rules:
  - host: cicd-api.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cicd-server
            port:
              number: 8080

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cicd-server-pdb
  namespace: cicd
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: cicd-server

