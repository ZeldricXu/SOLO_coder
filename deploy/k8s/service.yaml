apiVersion: v1
kind: Service
metadata:
  name: streamsql
  namespace: streamsql
  labels:
    app: streamsql
    service: streamsql
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app: streamsql
