apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-web
  namespace: cicd
  labels:
    app: cicd-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cicd-web
    spec:
      containers:
      - name: cicd-web
        image: cicd-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        env:
        - name: API_BASE_URL
          value: "https://cicd-api.example.com"
        - name: WS_BASE_URL
          value: "wss://cicd-api.example.com"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: cicd-web
  namespace: cicd
  labels:
    app: cicd-web
spec:
  selector:
    app: cicd-web
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cicd-web
  namespace: cicd
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: cicd.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cicd-web
            port:
              number: 80
