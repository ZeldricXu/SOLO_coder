apiVersion: v1
kind: Secret
metadata:
  name: runner-mtls-certs
  namespace: cicd
type: kubernetes.io/tls
data:
  tls.crt: BASE64_ENCODED_SERVER_CERT
  tls.key: BASE64_ENCODED_SERVER_KEY
  ca.crt: BASE64_ENCODED_CA_CERT
---
apiVersion: v1
kind: Secret
metadata:
  name: runner-client-certs
  namespace: cicd
type: Opaque
data:
  keystore.p12: BASE64_ENCODED_CLIENT_KEYSTORE
  keystore-password: BASE64_ENCODED_PASSWORD
  truststore.p12: BASE64_ENCODED_CLIENT_TRUSTSTORE
  truststore-password: BASE64_ENCODED_PASSWORD
