global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'log-pipeline'
    static_configs:
      - targets: ['host.docker.internal:9090']
    metrics_path: '/metrics'

  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:8123']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
