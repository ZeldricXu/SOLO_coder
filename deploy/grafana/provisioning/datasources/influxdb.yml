apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    secureJsonData:
      token: cicd-token-123456
    jsonData:
      version: Flux
      organization: cicd
      defaultBucket: cicd_metrics
      tlsSkipVerify: true
    isDefault: false
    editable: true
