replicaCount: 3

image:
  repository: registry.example.com/logrotate
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podLabels: {}

podSecurityContext:
  fsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  privileged: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: logrotate.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: logrotate-tls
      hosts:
        - logrotate.example.com

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2000m"
    memory: "2Gi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleUpStabilizationSeconds: 120
  scaleDownStabilizationSeconds: 300

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

config:
  env: production
  configFile: /app/configs/config.prod.yaml

env:
  - name: ENV
    value: "production"
  - name: CONFIG_FILE
    value: "/app/configs/config.prod.yaml"
  - name: LOG_PATH
    value: "/var/log/logrotate/app.log"
  - name: TZ
    value: "Asia/Shanghai"

envFrom:
  - secretRef:
      name: logrotate-secrets

configMap:
  enabled: true
  mountPath: /app/configs
  data:
    config.prod.yaml: |-
      server:
        host: "0.0.0.0"
        port: 8080
        mode: "release"

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 50Gi
  storageClassName: ""
  mountPath: /var/log/logrotate

volumes:
  - name: config
    configMap:
      name: logrotate-config
  - name: logs
    emptyDir: {}

volumeMounts:
  - name: config
    mountPath: /app/configs
    readOnly: true
  - name: logs
    mountPath: /var/log/logrotate


nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - logrotate
          topologyKey: kubernetes.io/hostname

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: logrotate

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

minReadySeconds: 30
revisionHistoryLimit: 10

postgresql:
  enabled: true
  auth:
    username: logrotate
    password: logrotate
    database: logrotate
  primary:
    persistence:
      size: 50Gi
  readReplicas:
    replicaCount: 2

redis:
  enabled: true
  architecture: replication
  auth:
    password: logrotate
  master:
    persistence:
      size: 20Gi
  replica:
    replicaCount: 2
    persistence:
      size: 20Gi

prometheus:
  enabled: true
  prometheus:
    prometheusSpec:
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: ""
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi

grafana:
  enabled: true
  adminPassword: admin
  persistence:
    enabled: true
    size: 10Gi

serviceMonitor:
  enabled: true
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
  targetLabels: []
  metricRelabelings: []
  relabelings: []

networkPolicy:
  enabled: true
  ingress:
    from: []
    ports: []
  egress:
    to: []
    ports: []

pdb:
  enabled: true
  minAvailable: 2
  maxUnavailable: 1

verticalPodAutoscaler:
  enabled: true
  updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: logrotate
        minAllowed:
          cpu: 100m
          memory: 256Mi
        maxAllowed:
          cpu: 4
          memory: 4Gi
        controlledResources: ["cpu", "memory"]
