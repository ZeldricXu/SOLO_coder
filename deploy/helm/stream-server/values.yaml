nameOverride: ""
fullnameOverride: ""

replicaCount: 3

image:
  repository: ghcr.io/your-org/log-pipeline-stream-server
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podSecurityContext: {}

securityContext: {}

resources:
  limits:
    cpu: 4000m
    memory: 8Gi
  requests:
    cpu: 500m
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 15
  periodSeconds: 5

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - stream-server
          topologyKey: kubernetes.io/hostname

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  metricsPort: 9090

ingress:
  enabled: false

serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: prometheus

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 100Gi
  mountPath: /data

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

sharding:
  strategy: kafka_partition
  partitionsPerReplica: 4

config:
  env: production
  server:
    host: "0.0.0.0"
    port: 8080
    channel_capacity: 10000
    compaction_enabled: true

  kafka:
    brokers:
      - "kafka-0.kafka.prod.svc.cluster.local:9092"
      - "kafka-1.kafka.prod.svc.cluster.local:9092"
      - "kafka-2.kafka.prod.svc.cluster.local:9092"
    topic: "logs-production"
    group_id: "log-pipeline-production"
    partitions: 12

  elasticsearch:
    urls:
      - "http://elasticsearch.prod.svc.cluster.local:9200"
    index_prefix: "logs-production"
    batch_size: 5000
    flush_interval_ms: 1000

  alerting:
    dedup_window_secs: 600

  alerting.llm_root_cause:
    api_url: "https://api.openai.com/v1/chat/completions"
    model: "gpt-4"
    timeout_secs: 30

  metrics:
    host: "0.0.0.0"
    port: 9090
    path: "/metrics"

secretEnv:
  - name: ELASTICSEARCH_USERNAME
    secretKeyRef:
      name: stream-server-secrets
      key: elasticsearch-username
  - name: ELASTICSEARCH_PASSWORD
    secretKeyRef:
      name: stream-server-secrets
      key: elasticsearch-password
  - name: OPENAI_API_KEY
    secretKeyRef:
      name: stream-server-secrets
      key: openai-api-key
  - name: ALERT_DINGTALK_WEBHOOK
    secretKeyRef:
      name: stream-server-secrets
      key: dingtalk-webhook
