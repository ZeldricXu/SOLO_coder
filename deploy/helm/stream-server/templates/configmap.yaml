apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stream-server.fullname" . }}-config
  labels:
    {{- include "stream-server.labels" . | nindent 4 }}
data:
  default.toml: |
    [server]
    host = {{ .Values.config.server.host | quote }}
    port = {{ .Values.config.server.port }}
    channel_capacity = {{ .Values.config.server.channel_capacity }}
    sqlite_path = "/data/pipeline.db"
    compaction_enabled = {{ .Values.config.server.compaction_enabled }}

    [server.kafka]
    brokers = [{{- range .Values.config.kafka.brokers }}{{ . | quote }},{{- end }}]
    topic = {{ .Values.config.kafka.topic | quote }}
    group_id = {{ .Values.config.kafka.group_id | quote }}
    partitions = {{ .Values.config.kafka.partitions }}

    [server.elasticsearch]
    urls = [{{- range .Values.config.elasticsearch.urls }}{{ . | quote }},{{- end }}]
    index_prefix = {{ .Values.config.elasticsearch.index_prefix | quote }}
    batch_size = {{ .Values.config.elasticsearch.batch_size }}
    flush_interval_ms = {{ .Values.config.elasticsearch.flush_interval_ms }}

    [server.alerting]
    dedup_window_secs = {{ .Values.config.alerting.dedup_window_secs }}

    [server.alerting.llm_root_cause]
    api_url = {{ .Values.config.alerting.llm_root_cause.api_url | quote }}
    model = {{ .Values.config.alerting.llm_root_cause.model | quote }}
    timeout_secs = {{ .Values.config.alerting.llm_root_cause.timeout_secs }}

    [server.metrics]
    host = {{ .Values.config.metrics.host | quote }}
    port = {{ .Values.config.metrics.port }}
    path = {{ .Values.config.metrics.path | quote }}

  {{ .Values.config.env }}.toml: |
    [server]
    host = {{ .Values.config.server.host | quote }}
    port = {{ .Values.config.server.port }}
    channel_capacity = {{ .Values.config.server.channel_capacity }}
    sqlite_path = "/data/pipeline.db"
    compaction_enabled = {{ .Values.config.server.compaction_enabled }}

    [server.kafka]
    brokers = [{{- range .Values.config.kafka.brokers }}{{ . | quote }},{{- end }}]
    topic = {{ .Values.config.kafka.topic | quote }}
    group_id = {{ .Values.config.kafka.group_id | quote }}
    partitions = {{ .Values.config.kafka.partitions }}

    [server.elasticsearch]
    urls = [{{- range .Values.config.elasticsearch.urls }}{{ . | quote }},{{- end }}]
    index_prefix = {{ .Values.config.elasticsearch.index_prefix | quote }}
    batch_size = {{ .Values.config.elasticsearch.batch_size }}
    flush_interval_ms = {{ .Values.config.elasticsearch.flush_interval_ms }}

    [server.alerting]
    dedup_window_secs = {{ .Values.config.alerting.dedup_window_secs }}

    [server.alerting.llm_root_cause]
    api_url = {{ .Values.config.alerting.llm_root_cause.api_url | quote }}
    model = {{ .Values.config.alerting.llm_root_cause.model | quote }}
    timeout_secs = {{ .Values.config.alerting.llm_root_cause.timeout_secs }}

    [server.metrics]
    host = {{ .Values.config.metrics.host | quote }}
    port = {{ .Values.config.metrics.port }}
    path = {{ .Values.config.metrics.path | quote }}
