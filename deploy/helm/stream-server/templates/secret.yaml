apiVersion: v1
kind: Secret
metadata:
  name: stream-server-secrets
  labels:
    {{- include "stream-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  elasticsearch-username: "{{ .Values.config.elasticsearch.username | default "elastic" }}"
  elasticsearch-password: "{{ .Values.config.elasticsearch.password | default "" }}"
  openai-api-key: "{{ .Values.config.alerting.llm_root_cause.api_key | default "" }}"
  dingtalk-webhook: "{{ .Values.config.alerting.dingtalk_webhook | default "" }}"
