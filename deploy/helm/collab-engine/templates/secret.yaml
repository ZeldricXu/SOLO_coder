{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "collab-engine.fullname" . }}
  labels:
    {{- include "collab-engine.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ .Values.secret.jwtSecret | b64enc | quote }}
  DATABASE_PASSWORD: {{ .Values.secret.databasePassword | b64enc | quote }}
  {{- if .Values.secret.databaseUrl }}
  DATABASE_URL: {{ .Values.secret.databaseUrl | b64enc | quote }}
  {{- end }}
  {{- if .Values.secret.redisUrl }}
  REDIS_URL: {{ .Values.secret.redisUrl | b64enc | quote }}
  {{- end }}
{{- end }}
