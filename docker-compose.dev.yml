services:
  mysql:
    image: mysql:8.0
    container_name: smartflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:root}
      MYSQL_DATABASE: smartflow_${ENV:dev}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:root}"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - smartflow-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smartflow-redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - smartflow-network
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:

networks:
  smartflow-network:
    driver: bridge
