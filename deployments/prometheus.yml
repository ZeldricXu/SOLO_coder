global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'scheduler'
    static_configs:
      - targets: ['scheduler:8080']
    metrics_path: '/metrics'

  - job_name: 'worker-1'
    static_configs:
      - targets: ['worker-1:8080']
    metrics_path: '/metrics'

  - job_name: 'worker-2'
    static_configs:
      - targets: ['worker-2:8080']
    metrics_path: '/metrics'

  - job_name: 'worker-3'
    static_configs:
      - targets: ['worker-3:8080']
    metrics_path: '/metrics'

  - job_name: 'api'
    static_configs:
      - targets: ['api:8080']
    metrics_path: '/metrics'
