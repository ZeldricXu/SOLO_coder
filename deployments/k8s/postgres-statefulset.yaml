apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: experiment
    component: database
spec:
  selector:
    app: experiment
    component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: experiment
    component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: experiment
      component: database
  template:
    metadata:
      labels:
        app: experiment
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: experiment-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: experiment-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: "experiment"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - experiment
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - experiment
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
        storageClassName: standard
---
apiVersion: v1
kind: Secret
metadata:
  name: experiment-secrets
type: Opaque
stringData:
  postgres-user: "experiment"
  postgres-password: "experiment"
