apiVersion: apps/v1
kind: Deployment
metadata:
  name: experiment-scheduler
  labels:
    app: experiment
    component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: experiment
      component: scheduler
  template:
    metadata:
      labels:
        app: experiment
        component: scheduler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: scheduler
          image: df1-96/scheduler:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: EXP_DATABASE_HOST
              value: "postgres"
            - name: EXP_DATABASE_PORT
              value: "5432"
            - name: EXP_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: experiment-secrets
                  key: postgres-user
            - name: EXP_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: experiment-secrets
                  key: postgres-password
            - name: EXP_DATABASE_DBNAME
              value: "experiment"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /app/configs
      volumes:
        - name: config
          configMap:
            name: experiment-config
---
apiVersion: v1
kind: Service
metadata:
  name: experiment-scheduler
  labels:
    app: experiment
    component: scheduler
spec:
  selector:
    app: experiment
    component: scheduler
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  type: ClusterIP
