version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: experiment
      POSTGRES_PASSWORD: experiment
      POSTGRES_DB: experiment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experiment"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ../dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus

  scheduler:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.scheduler
    ports:
      - "50051:50051"
      - "8080:8080"
    environment:
      EXP_DATABASE_HOST: postgres
      EXP_DATABASE_PORT: 5432
      EXP_DATABASE_USER: experiment
      EXP_DATABASE_PASSWORD: experiment
      EXP_DATABASE_DBNAME: experiment
    volumes:
      - ../configs:/app/configs
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config", "/app/configs/config.dev.yaml"]

  worker-1:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.worker
    environment:
      EXP_DATABASE_HOST: postgres
      EXP_DATABASE_PORT: 5432
      EXP_DATABASE_USER: experiment
      EXP_DATABASE_PASSWORD: experiment
      EXP_DATABASE_DBNAME: experiment
      EXP_WORKER_WORKER_ID: 1
    volumes:
      - ../configs:/app/configs
      - ../plugins:/app/plugins
    depends_on:
      - scheduler
    command: ["--config", "/app/configs/config.dev.yaml", "--scheduler", "scheduler:50051"]

  worker-2:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.worker
    environment:
      EXP_DATABASE_HOST: postgres
      EXP_DATABASE_PORT: 5432
      EXP_DATABASE_USER: experiment
      EXP_DATABASE_PASSWORD: experiment
      EXP_DATABASE_DBNAME: experiment
      EXP_WORKER_WORKER_ID: 2
    volumes:
      - ../configs:/app/configs
      - ../plugins:/app/plugins
    depends_on:
      - scheduler
    command: ["--config", "/app/configs/config.dev.yaml", "--scheduler", "scheduler:50051"]

  worker-3:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.worker
    environment:
      EXP_DATABASE_HOST: postgres
      EXP_DATABASE_PORT: 5432
      EXP_DATABASE_USER: experiment
      EXP_DATABASE_PASSWORD: experiment
      EXP_DATABASE_DBNAME: experiment
      EXP_WORKER_WORKER_ID: 3
    volumes:
      - ../configs:/app/configs
      - ../plugins:/app/plugins
    depends_on:
      - scheduler
    command: ["--config", "/app/configs/config.dev.yaml", "--scheduler", "scheduler:50051"]

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.api
    ports:
      - "8081:8080"
    environment:
      EXP_DATABASE_HOST: postgres
      EXP_DATABASE_PORT: 5432
      EXP_DATABASE_USER: experiment
      EXP_DATABASE_PASSWORD: experiment
      EXP_DATABASE_DBNAME: experiment
    volumes:
      - ../configs:/app/configs
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config", "/app/configs/config.dev.yaml"]

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
