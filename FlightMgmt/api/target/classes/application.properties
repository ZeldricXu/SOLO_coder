spring.application.name=FlightMgmt
server.port=8080

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:flightmgmt;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Redis Configuration for Notification Queue Persistence
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=30000
spring.redis.maxIdle=8
spring.redis.minIdle=2
spring.redis.maxActive=20
spring.redis.maxWait=30000

# Notification Queue Configuration
notification.queue.enabled=true
notification.queue.max-size=10000
notification.queue.worker-count=3
notification.queue.poll-interval=500
notification.retry.max-attempts=3
notification.retry.interval-minutes=5
notification.confirmation.timeout-seconds=30

# Payment Timeout Configuration
payment.timeout.domestic=15
payment.timeout.international=30

# Change Rules Configuration
change.rules.refund-fee.domestic=0.10
change.rules.refund-fee.international=0.20
change.rules.rebook-fee.domestic=0.05
change.rules.rebook-fee.international=0.10
change.rules.free-cancel-hours=72
change.rules.last-minute-hours=24
change.rules.last-minute-fee=0.50
change.rules.rebook-allowed=true
